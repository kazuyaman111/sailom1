<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>กระถางใจ — ตอบคำถาม เลี้ยงวิญญาณ</title>
<meta name="theme-color" content="#101b22">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Trirong:wght@400;600;700&family=IBM+Plex+Sans+Thai:wght@300;400;500;600&family=IBM+Plex+Mono:wght@300;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0d161c;
  --deep:#152430;
  --panel:#1b303c;
  --line:rgba(190,222,210,.14);
  --glaze:#7cae9b;
  --glaze-dk:#42705f;
  --glaze-lt:#a8d3c2;
  --gold:#d8b04a;
  --lacquer:#a03b45;
  --mist:#e6efe9;
  --dim:#8ba69c;
  --ok:#7cae9b;
  --warn:#d8b04a;
  --bad:#c26a6a;
  --r:14px;
  --tabh:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(120% 80% at 50% -10%, #1d3441 0%, transparent 60%),
    var(--ink);
  color:var(--mist);
  font-family:'IBM Plex Sans Thai',system-ui,sans-serif;
  font-weight:400;
  font-size:15px;
  line-height:1.55;
  min-height:100vh;
  overflow-x:hidden;
}
body.night{--glaze:#6f9db1;}
h1,h2,h3,.disp{font-family:'Trirong',serif;font-weight:600;letter-spacing:.01em;margin:0}
.mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
#app{max-width:900px;margin:0 auto;padding:0 14px calc(var(--tabh) + 26px);}
header.top{
  position:sticky;top:0;z-index:30;
  margin:0 -14px 12px;padding:10px 14px 10px;
  background:linear-gradient(180deg,rgba(13,22,28,.96) 70%,rgba(13,22,28,0));
  backdrop-filter:blur(8px);
  display:flex;align-items:center;gap:10px;
}
.brand{display:flex;align-items:baseline;gap:8px;flex:1;min-width:0}
.brand b{font-family:'Trirong',serif;font-size:20px;font-weight:700;letter-spacing:.02em}
.brand span{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.purse{display:flex;gap:6px;flex-shrink:0}
.coin{
  display:flex;align-items:center;gap:5px;
  background:rgba(255,255,255,.05);border:1px solid var(--line);
  border-radius:999px;padding:4px 10px;font-size:13px;
}
.coin i{width:9px;height:9px;border-radius:50%;display:block}
.coin.g i{background:var(--gold);box-shadow:0 0 8px rgba(216,176,74,.5)}
.coin.c i{background:var(--glaze-lt);box-shadow:0 0 8px rgba(168,211,194,.5)}

/* ---------- cards ---------- */
.card{
  background:linear-gradient(180deg,var(--panel),var(--deep));
  border:1px solid var(--line);border-radius:var(--r);
  padding:14px;margin-bottom:12px;
}
.card h2{font-size:17px;margin-bottom:2px}
.sub{font-size:12px;color:var(--dim)}
.eyebrow{
  font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--glaze);font-family:'IBM Plex Mono',monospace;margin-bottom:6px;
}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.spread{justify-content:space-between}
.grow{flex:1;min-width:0}

/* ---------- buttons ---------- */
button{font-family:inherit;font-size:14px;color:inherit;cursor:pointer;border:none;background:none}
.btn{
  background:rgba(255,255,255,.05);border:1px solid var(--line);
  border-radius:10px;padding:10px 14px;color:var(--mist);
  transition:background .15s,border-color .15s,transform .08s;
}
.btn:hover{background:rgba(255,255,255,.09)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.pri{background:var(--glaze-dk);border-color:var(--glaze);color:#f2fbf6;font-weight:500}
.btn.pri:hover{background:#4f8471}
.btn.gold{background:rgba(216,176,74,.16);border-color:rgba(216,176,74,.5);color:#f0dda6}
.btn.danger{border-color:rgba(194,106,106,.45);color:#e8b4b4}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:8px}
.btn.on{background:var(--glaze-dk);border-color:var(--glaze)}
.btn.block{width:100%;display:block}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* ---------- pot stage ---------- */
.stage{position:relative;display:flex;justify-content:center;padding:6px 0 0}
#pot{width:100%;max-width:420px;height:auto;display:block;touch-action:manipulation}
.stagelabel{
  position:absolute;left:50%;transform:translateX(-50%);bottom:-2px;
  font-size:11px;color:var(--dim);letter-spacing:.14em;font-family:'IBM Plex Mono',monospace;
}

/* ---------- meters ---------- */
.meters{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 14px;margin-top:12px}
.meter .lab{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim);margin-bottom:3px}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.07);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:3px;transition:width .4s ease}
.bar.hp>i{background:linear-gradient(90deg,#8fbfae,#c9e3d6)}
.bar.hu>i{background:linear-gradient(90deg,#c9a24a,#e6cf8b)}
.bar.mo>i{background:linear-gradient(90deg,#7fa8c9,#b4d4ea)}
.bar.af>i{background:linear-gradient(90deg,#a0555f,#d2909a)}
.bar.xp>i{background:linear-gradient(90deg,var(--glaze-dk),var(--glaze-lt))}

.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px;text-align:center}
.stat{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:9px;padding:6px 2px}
.stat b{display:block;font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:500}
.stat span{font-size:9.5px;color:var(--dim);letter-spacing:.1em}

/* ---------- focus ---------- */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;
  background:rgba(255,255,255,.03);transition:all .15s;
}
.chip.on{background:var(--glaze-dk);border-color:var(--glaze);color:#f2fbf6}
#clock{font-family:'IBM Plex Mono',monospace;font-size:52px;font-weight:300;letter-spacing:-.02em;line-height:1;text-align:center;margin:4px 0 2px}
#clocknote{text-align:center;font-size:12px;color:var(--dim);min-height:18px}
.drift{color:var(--warn)}
.focusing #tabs{opacity:.35;pointer-events:none}

/* ---------- ตอบคำถาม ---------- */
.qmeta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--dim);margin-bottom:8px}
.qtext{font-size:18px;line-height:1.6;font-family:'Trirong',serif;font-weight:600;margin:2px 0 14px}
.choices{display:flex;flex-direction:column;gap:8px}
.ch{
  display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;
  background:rgba(255,255,255,.04);border:1px solid var(--line);
  border-radius:11px;padding:12px 13px;font-size:15px;line-height:1.45;
  transition:background .15s,border-color .15s;
}
.ch:hover:not(:disabled){background:rgba(255,255,255,.08)}
.ch .k{
  flex:none;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;
  background:rgba(255,255,255,.07);border:1px solid var(--line);
  font-family:'IBM Plex Mono',monospace;font-size:12px;margin-top:1px;
}
.ch.right{background:rgba(124,174,155,.20);border-color:var(--glaze)}
.ch.right .k{background:var(--glaze-dk);border-color:var(--glaze)}
.ch.wrong{background:rgba(194,106,106,.16);border-color:var(--bad)}
.ch.wrong .k{background:rgba(194,106,106,.35);border-color:var(--bad)}
.ch:disabled{opacity:.55}
.ch.right:disabled,.ch.wrong:disabled{opacity:1}
.expl{
  margin-top:12px;padding:11px 13px;border-radius:10px;font-size:13.5px;line-height:1.6;
  background:rgba(255,255,255,.04);border-left:3px solid var(--glaze);
}
#qclock{font-family:'IBM Plex Mono',monospace;font-size:15px}
#qclock.low{color:var(--bad)}
.combo{font-family:'IBM Plex Mono',monospace;color:var(--gold);font-size:13px}
.dots{display:flex;gap:4px}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.14);display:block}
.dots i.ok{background:var(--glaze)}
.dots i.no{background:var(--bad)}
.dots i.now{background:var(--gold);transform:scale(1.35)}
.eggbar{height:9px;border-radius:5px;background:rgba(255,255,255,.07);overflow:hidden}
.eggbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--glaze-dk),var(--gold));transition:width .5s}
.odds{display:flex;flex-direction:column;gap:5px;margin-top:8px}
.odd{display:flex;align-items:center;gap:8px;font-size:12px}
.odd .nm{width:74px;flex:none;color:var(--dim)}
.odd .tr{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.06);overflow:hidden}
.odd .tr>i{display:block;height:100%;border-radius:3px}
.odd .pc{width:44px;text-align:right;font-family:'IBM Plex Mono',monospace}
.fld{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);
  background:rgba(255,255,255,.05);color:var(--mist);font-family:inherit;font-size:15px;margin-bottom:8px}
textarea.fld{min-height:76px;resize:vertical;line-height:1.5}
select.fld{appearance:none}

/* ---------- สรุปผลสัมฤทธิ์ ---------- */
.prow{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:none}
.prow .lab{flex:1;min-width:0}
.prow .lab b{display:block;font-size:13.5px;font-weight:500}
.prow .lab .tiny{font-size:11px}
.prow .num{font-family:'IBM Plex Mono',monospace;font-size:12.5px;text-align:right;width:78px;flex:none}
.pbar{height:7px;border-radius:4px;background:rgba(255,255,255,.07);overflow:hidden;margin-top:5px}
.pbar>i{display:block;height:100%;border-radius:4px}
.trend{font-size:11px;font-family:'IBM Plex Mono',monospace;width:56px;flex:none;text-align:right}
.trend.up{color:var(--ok)} .trend.down{color:var(--bad)} .trend.flat{color:var(--dim)}
.bigstat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.bigstat div{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;padding:9px 4px}
.bigstat b{display:block;font-family:'IBM Plex Mono',monospace;font-size:19px;font-weight:500}
.bigstat span{font-size:10.5px;color:var(--dim)}

/* ---------- lists ---------- */
.list{display:flex;flex-direction:column;gap:8px}
.item{
  display:flex;gap:10px;align-items:center;
  background:rgba(255,255,255,.04);border:1px solid var(--line);
  border-radius:11px;padding:10px 12px;
}
.item .ic{
  width:38px;height:38px;flex:none;border-radius:9px;
  background:rgba(255,255,255,.05);border:1px solid var(--line);
  display:grid;place-items:center;font-size:19px;
}
.item b{display:block;font-size:14px;font-weight:500}
.item .sub{font-size:11.5px}
.qty{font-family:'IBM Plex Mono',monospace;color:var(--glaze-lt);font-size:13px}

/* ---------- room ---------- */
#room{
  position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);
  background:linear-gradient(180deg,#20323d 0%,#20323d 58%,#2b3a3a 58%,#243231 100%);
  aspect-ratio:16/10;
}
#room.lit{background:linear-gradient(180deg,#31485a 0%,#31485a 58%,#3d5350 58%,#334744 100%)}
.slots{position:absolute;inset:8%;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr);gap:4px}
.slot{
  border:1px dashed rgba(190,222,210,.16);border-radius:8px;
  display:grid;place-items:center;font-size:26px;line-height:1;
  transition:background .15s;
}
.slot:hover{background:rgba(255,255,255,.05)}
.slot.filled{border-style:solid;border-color:rgba(190,222,210,.22)}

/* ---------- book ---------- */
.book{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.bcard{
  border:1px solid var(--line);border-radius:11px;padding:8px 6px;text-align:center;
  background:rgba(255,255,255,.04);font-size:11px;
}
.bcard.locked{opacity:.32}
.bcard .nm{font-size:11.5px;font-weight:500;margin-top:4px;line-height:1.3}
.bcard .st{font-size:9.5px;color:var(--dim);font-family:'IBM Plex Mono',monospace}
.sigil{margin:0 auto;display:block;border-radius:5px;background:rgba(0,0,0,.25)}

/* ---------- tabs ---------- */
#tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:40;height:var(--tabh);
  padding-bottom:env(safe-area-inset-bottom);
  background:rgba(13,22,28,.94);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);
  display:flex;transition:opacity .2s;
}
#tabs button{
  flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:9.5px;color:var(--dim);letter-spacing:0;white-space:nowrap;
}
#tabs button .g{font-size:19px;line-height:1;filter:grayscale(1) opacity(.7)}
#tabs button.on{color:var(--glaze-lt)}
#tabs button.on .g{filter:none}
#tabs button .dot{position:absolute;margin:-14px 0 0 20px;width:6px;height:6px;border-radius:50%;background:var(--gold)}

/* ---------- modal / toast ---------- */
#veil{position:fixed;inset:0;z-index:60;background:rgba(5,10,13,.72);backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center}
#veil.show{display:flex}
#sheet{
  width:100%;max-width:520px;max-height:86vh;overflow-y:auto;
  background:linear-gradient(180deg,#1f3543,#152430);
  border:1px solid var(--line);border-bottom:none;
  border-radius:18px 18px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));
  animation:rise .22s ease;
}
@keyframes rise{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
#toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + 16px);
  z-index:70;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:92%;max-width:420px;
}
.tst{
  background:rgba(21,36,48,.97);border:1px solid var(--glaze-dk);
  border-radius:999px;padding:8px 16px;font-size:13px;
  animation:pop .2s ease;box-shadow:0 6px 20px rgba(0,0,0,.4);
}
.tst.gold{border-color:var(--gold);color:#f0dda6}
.tst.bad{border-color:var(--bad);color:#e8b4b4}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}

.hide{display:none !important}
.tiny{font-size:11.5px;color:var(--dim)}
.gap{height:8px}
hr.sep{border:none;border-top:1px solid var(--line);margin:12px 0}
.pill{font-size:10.5px;font-family:'IBM Plex Mono',monospace;letter-spacing:.1em;border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--dim)}

@media(min-width:760px){
  #app{padding-bottom:24px}
  #tabs{position:sticky;bottom:0;border-radius:14px;margin-bottom:14px;border:1px solid var(--line)}
  .meters{grid-template-columns:repeat(4,1fr)}
}
@media(prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>

<div id="app">
  <header class="top">
    <div class="brand">
      <b>กระถางใจ</b>
      <span id="petline">— กำลังเปิดกระถาง…</span>
    </div>
    <div class="purse">
      <div class="coin g"><i></i><span class="mono" id="coins">0</span></div>
      <div class="coin c"><i></i><span class="mono" id="crys">0</span></div>
    </div>
  </header>

  <main id="view"></main>
</div>

<nav id="tabs">
  <button data-tab="pot" class="on"><span class="g">🪴</span>กระถาง</button>
  <button data-tab="quiz"><span class="g">❓</span>ตอบคำถาม</button>
  <button data-tab="explore"><span class="g">🧭</span>สำรวจ</button>
  <button data-tab="bag"><span class="g">🎒</span>กระเป๋า</button>
  <button data-tab="home"><span class="g">🏠</span>บ้าน</button>
  <button data-tab="book"><span class="g">📖</span>สมุด</button>
  <button data-tab="sum"><span class="g">📊</span>สรุปผล</button>
</nav>

<div id="veil"><div id="sheet"></div></div>
<div id="toast"></div>

<script>
/* ===========================================================
   กระถางใจ (Krathang Jai) — v2.0
   เกมเลี้ยงวิญญาณที่เติบโตจากคำถามที่คุณตอบได้
   =========================================================== */

const VERSION = '2.0';
const SAVEKEY = 'krathangjai:save:v1';

/* ===================== ธาตุ ===================== */
const ELEMENTS = {
  wood:  {n:'ไม้',     g:'🌿', main:'VIT', h:152, s:30, l:56},
  water: {n:'น้ำ',     g:'💧', main:'INT', h:205, s:38, l:60},
  fire:  {n:'ไฟ',      g:'🔥', main:'STR', h:14,  s:52, l:60},
  wind:  {n:'ลม',      g:'🌬️', main:'AGI', h:96,  s:12, l:70},
  earth: {n:'ดิน',     g:'⛰️', main:'VIT', h:28,  s:26, l:50},
  bolt:  {n:'สายฟ้า',  g:'⚡', main:'AGI', h:268, s:34, l:62},
  light: {n:'แสง',     g:'✨', main:'LUK', h:46,  s:56, l:64},
  shade: {n:'เงา',     g:'🌑', main:'INT', h:232, s:22, l:44},
};
const EL_KEYS = Object.keys(ELEMENTS);

/* ===================== ระดับความหายาก ===================== */
const RARITY = [
  null,
  {n:'ธรรมดา',    star:'★',    statMul:1.00, hungerMul:1.00, c:'#9fb6ac'},
  {n:'ไม่ธรรมดา', star:'★★',   statMul:1.09, hungerMul:1.06, c:'#7fb6c9'},
  {n:'หายาก',     star:'★★★',  statMul:1.20, hungerMul:1.16, c:'#c9a24a'},
  {n:'ในตำนาน',   star:'★★★★', statMul:1.34, hungerMul:1.28, c:'#c98ad4'},
];

/* ===================== รายชื่อสายพันธุ์ 32 ชนิด ===================== */
// [id, ชื่อ, ธาตุ, ความหายาก, ค่าสถานะรอง, คำบรรยาย]
const SP_RAW = [
  ['rukkha',   'รุกขา',       'wood',  1, 'STR', 'วิญญาณรากไม้ธรรมดา อดทนและซื่อ'],
  ['praiwan',  'ไพรวัลย์',    'wood',  1, 'AGI', 'เถาวัลย์เลื้อยเร็ว ชอบปีนป่ายทุกอย่าง'],
  ['phakamas', 'ผกามาศ',      'wood',  2, 'LUK', 'ดอกไม้ที่บานเฉพาะตอนเจ้าของตั้งใจจริง'],
  ['takian',   'ตะเคียนเฒ่า', 'wood',  3, 'INT', 'อยู่มาก่อนเมืองนี้ พูดน้อยแต่ไม่เคยล้ม'],

  ['waree',    'วารี',        'water', 1, 'AGI', 'หยดน้ำใสที่จำทุกอย่างที่ไหลผ่าน'],
  ['chonlatan','ชลธาร',       'water', 2, 'VIT', 'สายธารเย็น ยิ่งไหลนานยิ่งลึก'],
  ['mukda',    'มุกดา',       'water', 2, 'LUK', 'ไข่มุกน้ำจืด เปล่งแสงตอนอารมณ์ดี'],
  ['nakhin',   'นาคินทร์',    'water', 4, 'STR', 'พญานาคน้อยจากใต้คลอง เกล็ดสะท้อนฟ้า'],

  ['akkhi',    'อัคคี',       'fire',  1, 'AGI', 'เปลวไฟดวงเล็กที่ไม่ยอมดับ'],
  ['thanthao', 'ถ่านเถ้า',    'fire',  1, 'VIT', 'ถ่านที่ยังอุ่น ค่อยๆ ให้ความร้อนไปทั้งคืน'],

const BODY_SHAPES = ['round','tall','tear','chunky'];
const HORNS  = ['none','pair','single','curved','antler'];
const EARS   = ['none','leaf','long','fin'];
const TAILS  = ['none','wisp','plume','curl'];
const MARKS  = ['none','spots','stripes','veins'];

function clampN(v,a,b){ return Math.max(a, Math.min(b, v)); }
function _hsl(h, s, l){ return `hsl(${((Math.round(h)%360)+360)%360}, ${clampN(Math.round(s),6,92)}%, ${clampN(Math.round(l),8,94)}%)`; }
function _hsla(h, s, l, a){ return `hsla(${((Math.round(h)%360)+360)%360}, ${clampN(Math.round(s),6,92)}%, ${clampN(Math.round(l),8,94)}%, ${a})`; }

const SPECIES = {};
const SP_KEYS = [];
SP_RAW.forEach(row => {
  const [id, name, elk, rar, sub, desc] = row;
  const E = ELEMENTS[elk];
  const idxInEl = SP_RAW.filter(r => r[2] === elk).findIndex(r => r[0] === id);
  const r = rngFrom(hashStr('sp:' + id));

  const h = E.h + [-16, 0, 14, 30][idxInEl] + Math.round((r() - .5) * 10);
  const s = E.s + Math.round((r() - .3) * 14) + (rar - 1) * 5;
  const l = E.l + Math.round((r() - .5) * 12) - (rar === 4 ? 4 : 0);

  SPECIES[id] = {
    id, name, elk, el: E.n, g: E.g,
    main: E.main, sub, rarity: rar, desc,
    hue: h, sat: s, lum: l,
    c1:     _hsl(h, s, l),
    c2:     _hsl(h + 6, s + 8, l - 20),
    accent: _hsl(h - 6, s - 6, l + 22),
    dim:    _hsla(h, s, l, .30),
    a: al => _hsla(h - 6, s - 6, l + 22, al),
    traits: {
      body: BODY_SHAPES[Math.floor(r() * BODY_SHAPES.length)],
      horn: rar >= 3 ? HORNS[1 + Math.floor(r() * (HORNS.length - 1))] : HORNS[Math.floor(r() * HORNS.length)],
      ear:  EARS[Math.floor(r() * EARS.length)],
      tail: rar >= 2 ? TAILS[1 + Math.floor(r() * (TAILS.length - 1))] : TAILS[Math.floor(r() * TAILS.length)],
      mark: MARKS[Math.floor(r() * MARKS.length)],
      halo: rar >= 4,
    }
  };
  SP_KEYS.push(id);
});

const SP_BY_RARITY = r => SP_KEYS.filter(k => SPECIES[k].rarity === r);
const SP_BY_EL = e => SP_KEYS.filter(k => SPECIES[k].elk === e);

const BRANCHES = { body:'กายา', mind:'ฌาน', play:'ระบำ' };
const STAGE_NAMES = ['เมล็ด','หน่อ','ผลิใบ','','',''];
const STAGE_LV    = [1, 5, 12, 22, 35, 50];

const STAGE4_NAME = { body:'ผู้พิทักษ์', mind:'ผู้ตื่นรู้', play:'ผู้ร่ายรำ' };
const STAGE5_NAME = 'ร่างโบราณ';

function formId(sp, stage, branch){
  return stage <= 2 ? `${sp}:${stage}` : `${sp}:${stage}:${branch}`;
}
function formName(sp, stage, branch){
  const b = SPECIES[sp].name;
  if (stage <= 2) return `${b} ${STAGE_NAMES[stage]}`;
  if (stage === 3) return `${b} ${STAGE3_NAME[branch]}`;
  if (stage === 4) return `${b} ${STAGE4_NAME[branch]}`;
  return `${b} ${STAGE5_NAME}`;
}
// ร่างทั้งหมด: 32 สายพันธุ์ × 10 ร่าง = 320
const ALL_FORMS = (() => {
  const out = [];
  for (const sp of SP_KEYS){
    out.push({id:formId(sp,0), sp, stage:0, branch:null});
    out.push({id:formId(sp,1), sp, stage:1, branch:null});
    out.push({id:formId(sp,2), sp, stage:2, branch:null});
    for (const br of Object.keys(BRANCHES)){
      out.push({id:formId(sp,3,br), sp, stage:3, branch:br});
      out.push({id:formId(sp,4,br), sp, stage:4, branch:br});
    }
    out.push({id:formId(sp,5,'anc'), sp, stage:5, branch:'anc'});
  }
  return out;
})();
const FORMS_BY_SP = {};
for (const f of ALL_FORMS){ (FORMS_BY_SP[f.sp] = FORMS_BY_SP[f.sp] || []).push(f); }

/* ===========================================================
   ประกอบคลังคำถามทั้งหมด
   เพิ่มชุดใหม่: ประกาศตัวแปร Q_XXX_YY แล้วมาลงทะเบียนใน BANK_SETS
   =========================================================== */
const BANK_SETS = [
  { subj:'hist', grade:'p5', rows: Q_HIST_P5 },
  { subj:'hist', grade:'p6', rows: Q_HIST_P6 },
];

const QBANK_BUILTIN = [];
for (const set of BANK_SETS){
  set.rows.forEach((row, i) => {
    const [unit, diff, q, ch, ans, exp] = row;
    QBANK_BUILTIN.push({
      id: `${set.subj}_${set.grade}_${i}`,
      subj: set.subj, grade: set.grade, unit,
      diff, q, ch: ch.slice(), ans, exp: exp || '', built: true
    });
  });
}

/* จำนวนข้อที่มีอยู่จริง แยกตามวิชาและระดับชั้น */
function bankCount(subj, grade){
  return QBANK_BUILTIN.filter(q => q.subj === subj && q.grade === grade).length;
}

const MEM = {};
const Store = {
  async get(k){
    if (typeof window !== 'undefined' && window.storage && window.storage.get){
      try { const r = await window.storage.get(k); return r ? r.value : null; }
      catch(e){ return null; }
    }
    try { return localStorage.getItem(k); } catch(e){ return MEM[k] ?? null; }
  },
  async set(k, v){
    if (typeof window !== 'undefined' && window.storage && window.storage.set){
      try { await window.storage.set(k, v); return; } catch(e){}
    }
    try { localStorage.setItem(k, v); } catch(e){ MEM[k] = v; }
  }
};

let S = null;

function newPet(sp, name){
  const s = SPECIES[sp];
  const mul = RARITY[s.rarity].statMul;
  const base = {STR:5, VIT:5, AGI:5, INT:5, LUK:5};
  base[s.main] += 3;
  base[s.sub]  += 2;
  for (const k in base) base[k] = Math.round(base[k] * mul);
  return {
    sp, name: name || s.name,
    stage:0, branch:null,
    lv:1, xp:0,
    stats: base,
    hunger:70, mood:70, hp:100, aff:5,
    care:{body:0, mind:0, play:0},
    born: Date.now(),
    sick:false,
  };
}

function makeUid(){

/* ===================== ตัวช่วย ===================== */
const clamp = (v,a,b)=>Math.max(a, Math.min(b, v));
const todayKey = ()=>{ const d=new Date(); return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`; };
const pick = a => a[Math.floor(Math.random()*a.length)];

function hashStr(str){
  let h = 2166136261;
  for (let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function rngFrom(seed){
  let s = seed >>> 0;
  return function(){ s ^= s<<13; s>>>=0; s ^= s>>17; s ^= s<<5; s>>>=0; return s/4294967296; };
}
// รหัสสะสม 13 หลัก ผูกกับบัญชี+ร่าง
function collectCode(formIdStr){
  const c = 'ABCDEFGHJKLMNPQRSTUVWXYZ0123456789';
  const r = rngFrom(hashStr(S.uid + '|' + formIdStr + '|' + S.created));
  let out = '';
  for (let i=0;i<13;i++){
    if (i===4 || i===9) { out += '-'; continue; }
    out += c[Math.floor(r()*c.length)];
  }
  return out;
}

function fmtTime(sec){
  sec = Math.max(0, Math.round(sec));
  const m = Math.floor(sec/60), s = sec%60;
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
function fmtLeft(ms){
  const m = Math.ceil(ms/60000);
  if (m >= 60) return `${Math.floor(m/60)} ชม. ${m%60} นาที`;
  return `${m} นาที`;
}
function fmtDate(ts){
  const d = new Date(ts);
  return `${d.getDate()}/${d.getMonth()+1}/${(d.getFullYear()+543)%100}`;
}

function roomBonus(){
  const b = {moodSlow:0, hungerSlow:0, focusXp:0, exploreLuck:0, aff:0, coin:0, light:0};
  for (const k of S.room){
    if (!k || !FURN[k]) continue;
    for (const [ek, ev] of Object.entries(FURN[k].eff)) b[ek] = (b[ek]||0) + ev;
  }
  return b;
}

/* ===================== ค่าประสบการณ์ / เลเวล ===================== */
function xpNeed(lv){ return Math.round(20 + 5.3 * Math.pow(lv, 1.35)); }

function gainXp(n){
  const p = S.pet; if (!p) return {levels:0};
  n = Math.round(n);
  p.xp += n;
  let levels = 0;
  while (p.xp >= xpNeed(p.lv) && p.lv < 99){
    p.xp -= xpNeed(p.lv);
    p.lv++; levels++;
    const sp = SPECIES[p.sp];
    for (const k of ['STR','VIT','AGI','INT','LUK']){
      p.stats[k] += (k === sp.main) ? 2 : (k === sp.sub ? 1 : (Math.random() < .5 ? 1 : 0));
    }
    // โบนัสตามความหายาก
    const extra = (RARITY[sp.rarity].statMul - 1) * 3;
    if (Math.random() < extra) p.stats[sp.main] += 1;
    if (Math.random() < extra - 1) p.stats[sp.sub] += 1;
  }
  return {levels, xp:n};
}

/* ===================== วิวัฒนาการ ===================== */
function dominantBranch(){
  const c = S.pet.care;
  let best = 'body', bv = -1;
  for (const k of ['body','mind','play']) if (c[k] > bv){ bv = c[k]; best = k; }
  return best;
}
function evoCheck(){
  const p = S.pet; if (!p) return null;
  const next = p.stage + 1;
  if (next > 5) return null;
  const needLv = STAGE_LV[next];
  const needAff = [0, 10, 25, 45, 65, 85][next];
  const br = p.stage >= 3 ? p.branch : dominantBranch();
  const stoneKey = {body:'stone_b', mind:'stone_m', play:'stone_p'}[br];
  const needStone = next === 5;
  const ok = p.lv >= needLv && p.aff >= needAff && (!needStone || (S.bag[stoneKey]||0) > 0);
  return { next, needLv, needAff, needStone, stoneKey, br, ok };
}
function doEvolve(){
  const e = evoCheck();
  if (!e || !e.ok) return null;
  const p = S.pet;
  if (e.needStone){ S.bag[e.stoneKey]--; if (!S.bag[e.stoneKey]) delete S.bag[e.stoneKey]; }
  p.stage = e.next;
  p.branch = e.next >= 5 ? 'anc' : (e.next >= 3 ? e.br : null);
  for (const k of ['STR','VIT','AGI','INT','LUK']) p.stats[k] += 3;
  p.mood = clamp(p.mood + 20, 0, 100);
  p.hp = 100;
  unlockForm();
  return formName(p.sp, p.stage, p.branch);
}
function currentFormId(){
  const p = S.pet;
  return p.stage <= 2 ? formId(p.sp, p.stage) : formId(p.sp, p.stage, p.branch);
}
function unlockForm(){
  const id = currentFormId();
  if (!S.book[id]) S.book[id] = Date.now();
  if (!S.seen) S.seen = {};
  if (!S.seen[S.pet.sp]) S.seen[S.pet.sp] = Date.now();
}

/* ===================== สวน: เก็บวิญญาณหลายตัว ===================== */
function gardenCount(){ return (S.garden || []).length; }
function stashActive(){
  if (!S.pet) return;
  S.garden = S.garden || [];
  S.garden.push(S.pet);
  S.pet = null;
}
function swapWith(i){
  S.garden = S.garden || [];
  const other = S.garden[i];
  if (!other) return false;
  S.garden[i] = S.pet;
  S.pet = other;
  return true;
}
function releasePet(i){
  S.garden = S.garden || [];
  return S.garden.splice(i, 1)[0];
}

/* ===================== สุ่มสายพันธุ์จากเมล็ด ===================== */
function rollSpecies(tier, n = 3){
  const odds = SEED_ODDS[tier] || SEED_ODDS[1];
  const out = [];
  let guard = 0;
  while (out.length < n && guard++ < 400){
    let total = 0;
    for (const r in odds) total += odds[r];
    let roll = Math.random() * total, rar = 1;
    for (const r in odds){ roll -= odds[r]; if (roll <= 0){ rar = +r; break; } }
    const pool = SP_BY_RARITY(rar).filter(k => !out.includes(k));
    if (!pool.length) continue;
    out.push(pick(pool));
  }
  return out;
}

/* ===================== เวลาเดินจริง ===================== */
function tickOffline(){
  const now = Date.now();
  const hrs = (now - S.lastTick) / 3600000;
  S.lastTick = now;
  if (hrs <= 0) return;
  const t0 = todayKey();
  if (S.daily.day !== t0){ S.daily.day = t0; S.daily.plays = 0; }
  if (!S.pet) return;
  const b = roomBonus();
  const p = S.pet;
  const hMul = RARITY[SPECIES[p.sp].rarity].hungerMul;
  p.hunger = clamp(p.hunger - hrs * 4.2 * hMul * (1 - Math.min(.5, b.hungerSlow)), 0, 100);
  p.mood   = clamp(p.mood   - hrs * 3.0 * (1 - Math.min(.5, b.moodSlow)), 0, 100);
  if (b.light && isNight()) p.mood = clamp(p.mood + hrs * 2, 0, 100);
  if (p.hunger <= 0) p.hp = clamp(p.hp - hrs * 5, 1, 100);
  else if (p.hunger > 50 && p.mood > 40) p.hp = clamp(p.hp + hrs * 3, 0, 100);
  if (p.hp < 30) p.sick = true;
  if (p.hp >= 60) p.sick = false;

  // รีเซ็ตรายวัน
  const t = todayKey();
  if (S.daily.day !== t){ S.daily.day = t; S.daily.plays = 0; }
}

/* ===================== การกระทำกับสัตว์เลี้ยง ===================== */
function useItem(key){
  const it = ITEMS[key]; const p = S.pet;
  if (!it || !p || !(S.bag[key] > 0)) return null;
  const b = roomBonus();
  let msg = '';
  if (it.t === 'food'){
    if (p.hunger >= 99) return {err:'อิ่มจนกินไม่ลงแล้ว'};
    p.hunger = clamp(p.hunger + it.hunger, 0, 100);
    p.mood = clamp(p.mood + (it.mood||0), 0, 100);
    p.aff = clamp(p.aff + (it.aff||0) * (1 + b.aff), 0, 100);
    p.care.body += 1;
    gainXp(6);
    msg = `ให้${it.n}แล้ว ความอิ่ม +${it.hunger}`;
  } else if (it.t === 'heal'){
    if (p.hp >= 100) return {err:'สุขภาพเต็มอยู่แล้ว'};
    p.hp = clamp(p.hp + it.heal, 0, 100);
    p.mood = clamp(p.mood + (it.mood||0), 0, 100);
    p.care.body += 2;
    if (p.hp >= 60) p.sick = false;
    msg = `ใช้${it.n} สุขภาพ +${it.heal}`;
  } else if (it.t === 'egg'){
    return {egg:true};
  } else {
    return {err:'ไอเทมนี้ใช้กับวิญญาณไม่ได้'};
  }
  S.bag[key]--; if (!S.bag[key]) delete S.bag[key];
  return {msg};
}

function addItem(key, n=1){
  S.bag[key] = (S.bag[key]||0) + n;
}
function bagCount(){ return Object.values(S.bag).reduce((a,b)=>a+b, 0); }
function petPower(p){ p = p || S.pet; return ['STR','VIT','AGI','INT','LUK'].reduce((a,k)=>a+p.stats[k], 0); }


/* ===================== คลังคำถาม ===================== */
function allQuestions(){
  const off = S.qoff || {};
  const built = QBANK_BUILTIN.filter(q => !off[q.id]);
  return built.concat(S.qcustom || []);
}
function questionsBy(subj, grade){
  let all = allQuestions();
  if (grade) all = all.filter(q => q.grade === grade);
  return subj === 'mix' ? all : all.filter(q => q.subj === subj);
}
/* วิชาที่มีคำถามพร้อมใช้ในระดับชั้นนั้น */
function subjectsReady(grade){
  return SUBJ_KEYS.filter(k => questionsBy(k, grade).length > 0);
}
function gradesReady(){
  return GRADE_KEYS.filter(g => questionsBy('mix', g).length > 0);
}
function qstate(id){
  S.qstate = S.qstate || {};
  if (!S.qstate[id]) S.qstate[id] = {box:1, seen:0, right:0, wrong:0, at:-999, lastDay:''};
  return S.qstate[id];
}

/* เลือกคำถามถัดไป: ข้อที่ถึงกำหนดทวนก่อน กล่องต่ำมาก่อน */
function pickQuestion(subj, grade, exclude){
  const pool = questionsBy(subj, grade).filter(q => !exclude.includes(q.id));
  if (!pool.length) return null;
  const now = S.qcount || 0;
  const scored = pool.map(q => {
    const st = qstate(q.id);
    const gap = LEITNER_GAP[Math.min(5, st.box)] || 0;
    const overdue = (now - st.at) - gap;        // > 0 คือถึงกำหนดแล้ว
    const fresh = st.seen === 0 ? 40 : 0;       // ข้อที่ยังไม่เคยเจอมาก่อน
    const weight = fresh + Math.max(0, overdue) * 2 + (6 - st.box) * 6 + Math.random() * 18;
    return {q, weight, ready: st.seen === 0 || overdue >= 0};
  });
  const ready = scored.filter(x => x.ready);
  const use = ready.length ? ready : scored;
  use.sort((a, b) => b.weight - a.weight);
  return use[0].q;
}

/* ===================== ให้คะแนนคำตอบ ===================== */
function scoreAnswer(q, correct, msLeft, msTotal, streak){
  const base = DIFF[q.diff].pt;
  if (!correct) return {pts:0, speed:0, mult:0, base};
  const speed = msTotal > 0 ? clamp(msLeft / msTotal, 0, 1) * SPEED_BONUS_MAX : 0;
  const mult = 1 + Math.min(STREAK_CAP, streak) * (1 / STREAK_CAP);   // 1.0 → 2.0
  const st = qstate(q.id);
  const repeat = (st.lastDay === todayKey() && st.seen > 0) ? REPEAT_PENALTY : 1;
  return {
    pts: Math.max(1, Math.round(base * (1 + speed) * mult * repeat)),
    speed, mult, base, repeat
  };
}

/* บันทึกผลสัมฤทธิ์แยกตามวิชา ระดับชั้น และหน่วยการเรียนรู้ */
function progKey(q){ return `${q.subj}|${q.grade}|${q.unit}`; }
function progOf(key){
  S.prog = S.prog || {};
  if (!S.prog[key]) S.prog[key] = {r:0, w:0, recent:[]};
  return S.prog[key];
}
function recordProgress(q, correct){
  const p = progOf(progKey(q));
  if (correct) p.r++; else p.w++;
  p.recent.push(correct ? 1 : 0);
  if (p.recent.length > 40) p.recent.shift();
}
/* แนวโน้ม: เทียบครึ่งหลังกับครึ่งแรกของผลล่าสุด */
function trendOf(p){
  const n = p.recent.length;
  if (n < 10) return null;
  const half = Math.floor(n/2);
  const a = p.recent.slice(0, half), b = p.recent.slice(half);
  const av = a.reduce((x,y)=>x+y,0)/a.length, bv = b.reduce((x,y)=>x+y,0)/b.length;
  return { diff: bv - av, before: av, after: bv };
}

/* บันทึกผลลงกล่องทวนซ้ำ */
function recordAnswer(q, correct){
  const st = qstate(q.id);
  st.seen++;
  st.at = S.qcount || 0;
  st.lastDay = todayKey();
  if (correct){ st.right++; st.box = Math.min(5, st.box + 1); }
  else { st.wrong++; st.box = 1; }
  S.qcount = (S.qcount || 0) + 1;
  recordProgress(q, correct);
}

/* ---- สุ่มผังธาตุประจำไข่แต่ละใบ ----
   หน่วยการเรียนรู้เดิมจะให้ธาตุไม่เหมือนกันในไข่คนละใบ
   ทำให้ฟาร์มหน่วยเดิมซ้ำๆ ไม่ได้สายพันธุ์เดิมเสมอไป */
function rollEggMap(){
  const units = Object.keys(UNITS);
  const pool = [];
  while (pool.length < units.length){
    pool.push(...EL_KEYS.slice().sort(() => Math.random() - .5));
  }
  const order = units.slice().sort(() => Math.random() - .5);
  const map = {};
  order.forEach((u, i) => { map[u] = pool[i]; });
  return map;
}
function eggMap(){
  if (!S.egg) return null;
  if (!S.egg.map) S.egg.map = rollEggMap();
  return S.egg.map;
}
function unitEl(u){
  const m = eggMap();
  return (m && m[u]) || (UNITS[u] ? UNITS[u].el : 'wood');
}

function startEgg(tier){
  const key = {1:'seed_r', 2:'seed_g', 3:'seed_m'}[tier];
  S.egg = { tier, pts:0, need: ITEMS[key].need, el:{}, unit:{}, map: rollEggMap() };
}
/* ไข่รับคะแนนพร้อมหน่วยการเรียนรู้ ธาตุของหน่วยเป็นตัวกำหนดสายพันธุ์ */
function eggAddPoints(pts, unitCounts){
  if (!S.egg) return false;
  S.egg.pts += pts;
  S.egg.el = S.egg.el || {}; S.egg.unit = S.egg.unit || {};
  const m = eggMap();
  for (const u in unitCounts){
    if (!UNITS[u]) continue;
    const el = m[u] || UNITS[u].el;
    S.egg.unit[u] = (S.egg.unit[u] || 0) + unitCounts[u];
    S.egg.el[el] = (S.egg.el[el] || 0) + unitCounts[u];
  }
  return S.egg.pts >= S.egg.need;
}
/* สัดส่วนธาตุที่สะสมในไข่ */
function eggElShare(){
  const e = S.egg; if (!e || !e.el) return {};
  let tot = 0;
  for (const k in e.el) tot += e.el[k];
  const out = {};
  if (tot <= 0) return out;
  for (const k in e.el) out[k] = e.el[k] / tot;
  return out;
}
/* หน่วยการเรียนรู้ที่สะสมมากที่สุดในไข่ */
function eggTopUnit(){
  const e = S.egg; if (!e || !e.unit) return null;
  let best = null, bv = -1;
  for (const k in e.unit) if (e.unit[k] > bv){ bv = e.unit[k]; best = k; }
  return best;
}
/* น้ำหนักของแต่ละสายพันธุ์ตอนฟัก
   ขั้นที่ 1 สุ่มความหายากจากชั้นของไข่  ขั้นที่ 2 สุ่มสายพันธุ์ในระดับนั้น
   โดยถ่วงน้ำหนักด้วยสัดส่วนวิชาที่ตอบระหว่างฟัก */
const AFFINITY_K = 10;
const CHAOS_CHANCE = 0.15;   // โอกาสที่ไข่จะสุ่มธาตุเองโดยไม่สนหน่วยที่ตอบ

function hatchWeights(ignoreAffinity){
  const e = S.egg;
  const odds = SEED_ODDS[e ? e.tier : 1] || SEED_ODDS[1];
  const share = ignoreAffinity ? {} : eggElShare();
  const w = {}; for (const k of SP_KEYS) w[k] = 0;
  let tot = 0; for (const r in odds) tot += odds[r];
  for (const r in odds){
    const p = odds[r] / tot;
    if (p <= 0) continue;
    const pool = SP_BY_RARITY(+r);
    if (!pool.length) continue;
    const ws = {}; let sum = 0;
    for (const k of pool){
      const a = 1 + AFFINITY_K * (share[SPECIES[k].elk] || 0);
      ws[k] = a; sum += a;
    }
    for (const k of pool) w[k] += p * ws[k] / sum;
  }
  return w;   // รวมกันได้ 1
}
/* โอกาสเป็นเปอร์เซ็นต์ รวมตามธาตุ */
function hatchOddsByEl(ignoreAffinity){
  const w = hatchWeights(ignoreAffinity);
  const out = {};
  for (const k in w){
    const e = SPECIES[k].elk;
    out[e] = (out[e] || 0) + w[k];
  }
  return out;
}
function hatchRoll(ignoreAffinity){
  const w = hatchWeights(ignoreAffinity);
  let tot = 0; for (const k in w) tot += w[k];
  let r = Math.random() * tot;
  for (const k in w){ r -= w[k]; if (r <= 0) return k; }
  return SP_KEYS[0];
}

/* ===================== แคนวาส: กระถาง + รอยราน + วิญญาณ ===================== */
const CW = 420, CH = 340;
let canvas, ctx, rafId = null, t0 = performance.now();
let crackle = null, crackleSeed = 0;

function initCanvas(el){
  canvas = el; ctx = el.getContext && el.getContext('2d');
  if (!ctx) return;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = CW * dpr; canvas.height = CH * dpr;
  canvas.style.aspectRatio = `${CW}/${CH}`;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (!crackle) buildCrackle(hashStr(S.uid || 'pot'));
  if (rafId) cancelAnimationFrame(rafId);
  loop();
}

/* ---- สร้างเส้นรอยรานแบบสุ่มคงที่ ---- */
function buildCrackle(seed){
  crackleSeed = seed;
  const r = rngFrom(seed || 12345);
  const lines = [];
  for (let i=0;i<26;i++){
    const x = 90 + r()*240, y = 200 + r()*100;
    const pts = [[x,y]];
    let ang = r()*Math.PI*2;
    const n = 3 + Math.floor(r()*4);
    for (let j=0;j<n;j++){
      ang += (r()-.5)*1.5;
      const len = 8 + r()*22;
      const p = pts[pts.length-1];
      pts.push([p[0] + Math.cos(ang)*len, p[1] + Math.sin(ang)*len*.6]);
    }
    lines.push(pts);
  }
  crackle = lines;
}

/* ---- สถานะที่ใช้วาด ---- */
const View = { progress:0, focusing:false, drift:false, mood:70, bounce:0 };

function loop(){
  const t = (performance.now() - t0) / 1000;
  draw(t);
  rafId = requestAnimationFrame(loop);
}

function draw(t){
  if (!ctx || !S) return;
  if (!S.pet && !S.egg) return;
  ctx.clearRect(0,0,CW,CH);
  const p = S.pet, sp = p ? SPECIES[p.sp] : null;
  const night = isNight();
  const lit = roomBonus().light > 0;

  /* พื้นหลังวงกลมนุ่ม */
  const g = ctx.createRadialGradient(CW/2, 150, 20, CW/2, 160, 200);
  const warm = (!night || lit);
  g.addColorStop(0, warm ? 'rgba(124,174,155,.20)' : 'rgba(90,130,170,.16)');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0,0,CW,CH);

  /* วงแหวนโฟกัส */
  drawRing(t);

  /* วิญญาณ หรือไข่ */
  if (p) drawSpirit(t, p, sp);
  if (S.egg) drawEgg(t, !p);

  /* กระถาง */
  drawPot(t);
}

/* ---- วงแหวนรอบกระถาง แสดงความคืบหน้าโฟกัส ---- */
function drawRing(t){
  const cx = CW/2, cy = 172, R = 128;
  ctx.save();
  ctx.lineWidth = 2;
  ctx.strokeStyle = 'rgba(190,222,210,.10)';
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI*2); ctx.stroke();
  if (View.focusing || View.progress > 0){
    ctx.lineWidth = 3.5;
    ctx.lineCap = 'round';
    ctx.strokeStyle = View.drift ? '#d8b04a' : '#a8d3c2';
    ctx.shadowColor = View.drift ? 'rgba(216,176,74,.6)' : 'rgba(168,211,194,.55)';
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.arc(cx, cy, R, -Math.PI/2, -Math.PI/2 + Math.PI*2*clamp(View.progress,0,1));
    ctx.stroke();
    ctx.shadowBlur = 0;
    // จุดหัวเส้น
    const a = -Math.PI/2 + Math.PI*2*clamp(View.progress,0,1);
    ctx.fillStyle = View.drift ? '#e8cf8a' : '#dff0e7';
    ctx.beginPath(); ctx.arc(cx + Math.cos(a)*R, cy + Math.sin(a)*R, 4.5, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

/* ---- กระถางสังคโลก ---- */
function drawPot(t){
  const cx = CW/2;
  const topY = 214, botY = 316, topR = 84, botR = 58;

  ctx.save();
  // เงา
  ctx.fillStyle = 'rgba(0,0,0,.28)';
  ctx.beginPath(); ctx.ellipse(cx, botY+6, botR+14, 10, 0, 0, Math.PI*2); ctx.fill();

  // ตัวกระถาง
  const body = new Path2D();
  body.moveTo(cx-topR, topY);
  body.bezierCurveTo(cx-topR-6, topY+42, cx-botR-8, botY-34, cx-botR, botY);
  body.lineTo(cx+botR, botY);
  body.bezierCurveTo(cx+botR+8, botY-34, cx+topR+6, topY+42, cx+topR, topY);
  body.closePath();

  const pg = ctx.createLinearGradient(cx-topR, topY, cx+topR, botY);
  pg.addColorStop(0, '#8fbba9');
  pg.addColorStop(.45, '#6d9d8b');
  pg.addColorStop(1, '#3f6455');
  ctx.fillStyle = pg; ctx.fill(body);

  // เคลือบสะท้อนแสง
  ctx.save(); ctx.clip(body);
  const sh = ctx.createLinearGradient(cx-70, topY, cx-10, botY);
  sh.addColorStop(0, 'rgba(255,255,255,.22)');
  sh.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = sh; ctx.fillRect(cx-topR, topY, topR, botY-topY);

  // รอยรานตามความคืบหน้า
  const prog = clamp(View.progress, 0, 1);
  const show = Math.floor(crackle.length * prog);
  ctx.lineWidth = 1;
  for (let i=0;i<crackle.length;i++){
    const full = i < show;
    const partial = (i === show) ? (crackle.length*prog - show) : 0;
    if (!full && partial <= 0) continue;
    const pts = crackle[i];
    const lim = full ? pts.length : Math.max(2, Math.ceil(pts.length * partial));
    ctx.strokeStyle = View.drift ? 'rgba(216,176,74,.5)' : 'rgba(233,247,240,.42)';
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let j=1;j<lim;j++) ctx.lineTo(pts[j][0], pts[j][1]);
    ctx.stroke();
  }
  ctx.restore();

  // ขอบปากกระถาง
  ctx.strokeStyle = 'rgba(220,240,232,.35)'; ctx.lineWidth = 1.5; ctx.stroke(body);
  ctx.fillStyle = '#a9cfbe';
  ctx.beginPath(); ctx.ellipse(cx, topY, topR, 15, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#2c4a3f';
  ctx.beginPath(); ctx.ellipse(cx, topY+3, topR-9, 11, 0, 0, Math.PI*2); ctx.fill();
  // ดิน
  ctx.fillStyle = '#3a3026';
  ctx.beginPath(); ctx.ellipse(cx, topY+4, topR-13, 9, 0, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

/* ---- ตัววิญญาณ ---- */
function bodyPath(shape, R){
  const P = new Path2D();
  if (shape === 'tall'){
    P.moveTo(0, -R*1.16);
    P.bezierCurveTo(R*0.80, -R*1.05, R*0.86, R*0.62, 0, R*0.98);
    P.bezierCurveTo(-R*0.86, R*0.62, -R*0.80, -R*1.05, 0, -R*1.16);
  } else if (shape === 'tear'){
    P.moveTo(0, -R*1.24);
    P.bezierCurveTo(R*0.62, -R*0.72, R*1.02, R*0.42, 0, R*0.96);
    P.bezierCurveTo(-R*1.02, R*0.42, -R*0.62, -R*0.72, 0, -R*1.24);
  } else if (shape === 'chunky'){
    P.moveTo(0, -R*0.88);
    P.bezierCurveTo(R*1.18, -R*0.86, R*1.24, R*0.58, 0, R*0.88);
    P.bezierCurveTo(-R*1.24, R*0.58, -R*1.18, -R*0.86, 0, -R*0.88);
  } else {
    P.moveTo(0, -R);
    P.bezierCurveTo(R*0.95, -R*0.95, R*1.05, R*0.6, 0, R*0.92);
    P.bezierCurveTo(-R*1.05, R*0.6, -R*0.95, -R*0.95, 0, -R);
  }
  P.closePath();
  return P;
}
const BODY_TOP = { round:1.0, tall:1.16, tear:1.24, chunky:0.88 };
const BODY_SIDE = { round:1.0, tall:0.84, tear:0.86, chunky:1.18 };

function drawTail(kind, R, sp, t){
  if (kind === 'none') return;
  ctx.save();
  ctx.strokeStyle = sp.a(.75); ctx.lineWidth = Math.max(2, R*0.10); ctx.lineCap = 'round';
  const sway = Math.sin(t*1.8)*R*0.16;
  if (kind === 'wisp'){
    ctx.beginPath();
    ctx.moveTo(R*0.5, R*0.5);
    ctx.quadraticCurveTo(R*1.3, R*0.7 + sway, R*1.5, R*0.05 + sway);
    ctx.stroke();
  } else if (kind === 'plume'){
    ctx.fillStyle = sp.a(.55);
    for (let i=0;i<3;i++){
      ctx.beginPath();
      ctx.moveTo(R*0.45, R*0.55);
      ctx.quadraticCurveTo(R*(1.1+i*0.12), R*(0.5-i*0.35) + sway, R*(1.35+i*0.1), R*(0.1-i*0.42) + sway);
      ctx.quadraticCurveTo(R*(0.95+i*0.1), R*(0.35-i*0.2) + sway, R*0.45, R*0.55);
      ctx.fill();
    }
  } else if (kind === 'curl'){
    ctx.beginPath();
    ctx.moveTo(R*0.5, R*0.45);
    ctx.bezierCurveTo(R*1.35, R*0.55 + sway, R*1.45, -R*0.35 + sway, R*0.85, -R*0.15 + sway);
    ctx.stroke();
  }
  ctx.restore();
}

function drawEars(kind, R, sp, t){
  if (kind === 'none') return;
  ctx.save();
  ctx.fillStyle = sp.c2;
  const wob = Math.sin(t*1.5)*0.08;
  for (const d of [-1, 1]){
    ctx.save(); ctx.translate(d*R*0.62, -R*0.62); ctx.rotate(d*(0.35 + wob));
    ctx.beginPath();
    if (kind === 'leaf'){
      ctx.moveTo(0,0); ctx.quadraticCurveTo(d*R*0.42, -R*0.30, d*R*0.12, -R*0.60);
      ctx.quadraticCurveTo(-d*R*0.06, -R*0.28, 0, 0);
    } else if (kind === 'long'){
      ctx.moveTo(0,0); ctx.quadraticCurveTo(d*R*0.24, -R*0.75, d*R*0.06, -R*1.05);
      ctx.quadraticCurveTo(-d*R*0.16, -R*0.62, 0, 0);
    } else { // fin
      ctx.moveTo(0,0); ctx.lineTo(d*R*0.52, -R*0.22); ctx.lineTo(d*R*0.30, -R*0.52);
      ctx.closePath();
    }
    ctx.fill(); ctx.restore();
  }
  ctx.restore();
}

function drawHorn(kind, R, sp, top){
  if (kind === 'none') return;
  ctx.save();
  ctx.fillStyle = sp.accent; ctx.strokeStyle = sp.accent;
  ctx.lineWidth = Math.max(2, R*0.09); ctx.lineCap = 'round';
  const y = -R*top;
  if (kind === 'single'){
    ctx.beginPath(); ctx.moveTo(-R*0.10, y+R*0.10); ctx.lineTo(0, y-R*0.45); ctx.lineTo(R*0.10, y+R*0.10); ctx.fill();
  } else if (kind === 'pair'){
    for (const d of [-1,1]){
      ctx.beginPath();
      ctx.moveTo(d*R*0.24, y+R*0.16); ctx.lineTo(d*R*0.36, y-R*0.34); ctx.lineTo(d*R*0.44, y+R*0.10);
      ctx.fill();
    }
  } else if (kind === 'curved'){
    for (const d of [-1,1]){
      ctx.beginPath();
      ctx.moveTo(d*R*0.28, y+R*0.16);
      ctx.quadraticCurveTo(d*R*0.72, y-R*0.30, d*R*0.34, y-R*0.52);
      ctx.stroke();
    }
  } else if (kind === 'antler'){
    for (const d of [-1,1]){
      ctx.beginPath();
      ctx.moveTo(d*R*0.22, y+R*0.14); ctx.lineTo(d*R*0.40, y-R*0.48);
      ctx.moveTo(d*R*0.32, y-R*0.18); ctx.lineTo(d*R*0.62, y-R*0.30);
      ctx.moveTo(d*R*0.37, y-R*0.34); ctx.lineTo(d*R*0.20, y-R*0.62);
      ctx.stroke();
    }
  }
  ctx.restore();
}

function drawMarks(kind, R, sp, seed){
  if (kind === 'none') return;
  const r = rngFrom(seed);
  ctx.save();
  if (kind === 'spots'){
    ctx.fillStyle = sp.a(.42);
    for (let i=0;i<6;i++){
      const a = r()*Math.PI*2, d = r()*R*0.8;
      ctx.beginPath(); ctx.arc(Math.cos(a)*d, Math.sin(a)*d*0.9, R*(0.07+r()*0.07), 0, Math.PI*2); ctx.fill();
    }
  } else if (kind === 'stripes'){
    ctx.strokeStyle = sp.a(.38); ctx.lineWidth = R*0.11; ctx.lineCap='round';
    for (let i=0;i<3;i++){
      const y = -R*0.35 + i*R*0.42;
      ctx.beginPath(); ctx.moveTo(-R*1.1, y); ctx.quadraticCurveTo(0, y+R*0.16, R*1.1, y); ctx.stroke();
    }
  } else if (kind === 'veins'){
    ctx.strokeStyle = sp.a(.5); ctx.lineWidth = R*0.05; ctx.lineCap='round';
    for (let i=0;i<5;i++){
      const a = -Math.PI/2 + (i-2)*0.42;
      ctx.beginPath(); ctx.moveTo(0, R*0.55);
      ctx.quadraticCurveTo(Math.cos(a)*R*0.4, R*0.05, Math.cos(a)*R*0.92, Math.sin(a)*R*0.9);
      ctx.stroke();
    }
  }
  ctx.restore();
}

function drawSpirit(t, p, sp){
  const T = sp.traits;
  const cx = CW/2;
  const scale = [0.55, 0.68, 0.82, 1.0, 1.16, 1.3][p.stage];
  const breathe = Math.sin(t*1.6) * 3;
  const happy = p.mood > 60 && p.hp > 40;
  const hop = happy ? Math.abs(Math.sin(t*2.2)) * 5 : 0;
  const cy = 168 - hop + breathe*0.4 + View.bounce;
  const R = 42 * scale;

  ctx.save();
  ctx.translate(cx, cy);

  // แสงเรืองตามความหายาก
  if (sp.rarity >= 3){ ctx.shadowColor = sp.a(.85); ctx.shadowBlur = sp.rarity === 4 ? 26 : 15; }

  // ออร่าร่างโบราณ / วงในตำนาน
  if (p.stage === 5 || T.halo){
    const n = p.stage === 5 ? 7 : 5;
    for (let i=0;i<n;i++){
      const a = t*0.6 + i*Math.PI*2/n;
      const rr = R*1.7 + Math.sin(t*2+i)*6;
      ctx.fillStyle = sp.a(.7);
      ctx.beginPath(); ctx.arc(Math.cos(a)*rr, Math.sin(a)*rr*.5, 3, 0, Math.PI*2); ctx.fill();
    }
  }

  if (p.stage === 0){ drawSeed(R, sp, t); ctx.restore(); return; }

  const top = BODY_TOP[T.body] || 1, side = BODY_SIDE[T.body] || 1;

  // หาง หู เขา อยู่หลังตัว
  drawTail(T.tail, R, sp, t);
  drawEars(T.ear, R, sp, t);
  drawHorn(T.horn, R, sp, top);

  // ปีก / ริ้ว สายระบำ
  if (p.stage >= 3 && p.branch === 'play'){
    ctx.save();
    ctx.strokeStyle = sp.a(.7); ctx.lineWidth = 3; ctx.lineCap = 'round';
    for (const dir of [-1, 1]){
      ctx.beginPath();
      ctx.moveTo(dir*R*0.7, 4);
      ctx.quadraticCurveTo(dir*R*1.8, -14 + Math.sin(t*3)*8, dir*R*2.1, 18 + Math.cos(t*2.4)*8);
      ctx.stroke();
    }
    ctx.restore();
  }
  // เกราะเปลือก สายกายา
  if (p.stage >= 3 && p.branch === 'body'){
    ctx.fillStyle = sp.c2;
    ctx.beginPath(); ctx.ellipse(0, R*0.15, R*side*1.05, R*0.85, 0, Math.PI*0.05, Math.PI*0.95); ctx.fill();
  }
  // วงแหวนฌาน
  if (p.stage >= 3 && p.branch === 'mind'){
    ctx.save();
    ctx.strokeStyle = sp.a(.85); ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.ellipse(0, -R*(top+0.18), R*0.72, R*0.20 + Math.sin(t*1.5)*2, 0, 0, Math.PI*2); ctx.stroke();
    ctx.restore();
  }

  // ตัว
  const P = bodyPath(T.body, R);
  const bg = ctx.createRadialGradient(-R*.3, -R*.35, R*.2, 0, 0, R*1.15);
  bg.addColorStop(0, sp.accent);
  bg.addColorStop(.55, sp.c1);
  bg.addColorStop(1, sp.c2);
  ctx.fillStyle = bg;
  ctx.fill(P);
  ctx.shadowBlur = 0;

  // ลายบนตัว
  ctx.save(); ctx.clip(P);
  drawMarks(T.mark, R, sp, hashStr('mk:' + sp.id));
  ctx.restore();

  // ใบบนหัวสำหรับสายไม้
  if (sp.elk === 'wood'){
    ctx.fillStyle = sp.c2;
    ctx.save(); ctx.translate(0, -R*(top-0.02)); ctx.rotate(Math.sin(t*1.2)*0.12);
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.quadraticCurveTo(R*0.42, -R*0.32, R*0.10, -R*0.72);
    ctx.quadraticCurveTo(-R*0.06, -R*0.36, 0, 0);
    ctx.fill();
    ctx.restore();
  }

  // แก้ม
  if (happy){
    ctx.fillStyle = 'rgba(220,120,120,.28)';
    ctx.beginPath(); ctx.ellipse(-R*side*0.48, R*0.16, R*0.15, R*0.10, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse( R*side*0.48, R*0.16, R*0.15, R*0.10, 0, 0, Math.PI*2); ctx.fill();
  }

  // ตา
  const blink = (Math.sin(t*0.9) > 0.985) ? 0.12 : 1;
  const sleepy = p.hp < 35 || p.mood < 20;
  ctx.fillStyle = '#15242c';
  for (const dx of [-R*0.27*side, R*0.27*side]){
    if (sleepy || View.focusing){
      ctx.strokeStyle = '#15242c'; ctx.lineWidth = 2.6; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(dx - R*0.11, -R*0.06); ctx.quadraticCurveTo(dx, R*0.04, dx + R*0.11, -R*0.06); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.ellipse(dx, -R*0.06, R*0.085, R*0.115*blink, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.85)';
      ctx.beginPath(); ctx.arc(dx + R*0.03, -R*0.11, R*0.03, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#15242c';
    }
  }

  // ปาก
  ctx.strokeStyle = '#15242c'; ctx.lineWidth = 2; ctx.lineCap = 'round';
  ctx.beginPath();
  if (p.mood > 55){ ctx.moveTo(-R*0.12, R*0.24); ctx.quadraticCurveTo(0, R*0.38, R*0.12, R*0.24); }
  else if (p.mood > 25){ ctx.moveTo(-R*0.10, R*0.28); ctx.lineTo(R*0.10, R*0.28); }
  else { ctx.moveTo(-R*0.12, R*0.32); ctx.quadraticCurveTo(0, R*0.18, R*0.12, R*0.32); }
  ctx.stroke();

  if (p.sick){
    ctx.font = '18px serif'; ctx.textAlign='center';
    ctx.fillText('\u{1FA79}', R*0.75, -R*0.75);
  }
  ctx.restore();
}

function drawSeed(R, sp, t){
  ctx.fillStyle = '#6b5540';
  ctx.beginPath(); ctx.ellipse(0, R*0.2, R*0.62, R*0.78, 0, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#48382a'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-R*0.2, -R*0.3); ctx.quadraticCurveTo(0, R*0.2, -R*0.1, R*0.7); ctx.stroke();
  ctx.fillStyle = sp.c1;
  ctx.save(); ctx.translate(0, -R*0.5); ctx.rotate(Math.sin(t*1.4)*0.15);
  ctx.beginPath();
  ctx.moveTo(0,0); ctx.quadraticCurveTo(R*0.5, -R*0.25, R*0.14, -R*0.62);
  ctx.quadraticCurveTo(0, -R*0.3, 0, 0); ctx.fill();
  ctx.restore();
}

/* ---- ไข่ ---- */
function eggTint(){
  const odds = hatchOddsByEl();
  let best = null, bv = -1;
  for (const k in odds) if (odds[k] > bv){ bv = odds[k]; best = k; }
  const E = ELEMENTS[best] || ELEMENTS.wood;
  // ยิ่งธาตุนำมาก สียิ่งชัด
  const lean = clamp((bv - 0.125) / 0.5, 0, 1);
  return { h: E.h, s: 10 + 42 * lean, l: 62 - 6 * lean, lean, el: best };
}

function drawEgg(t, big){
  const e = S.egg; if (!e) return;
  const prog = clamp(e.pts / e.need, 0, 1);
  const tint = eggTint();
  const R = big ? 52 : 22;
  const cx = big ? CW/2 : CW/2 + 96;
  const cy = big ? (168 + Math.sin(t*1.4)*3) : 214;

  ctx.save();
  ctx.translate(cx, cy);

  // ตัวไข่
  const g = ctx.createRadialGradient(-R*0.3, -R*0.45, R*0.2, 0, 0, R*1.3);
  g.addColorStop(0, _hsl(tint.h, tint.s, tint.l + 18));
  g.addColorStop(.6, _hsl(tint.h, tint.s, tint.l));
  g.addColorStop(1, _hsl(tint.h + 6, tint.s + 8, tint.l - 20));
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(0, -R*1.26);
  ctx.bezierCurveTo(R*0.86, -R*0.92, R*0.98, R*0.55, 0, R*1.02);
  ctx.bezierCurveTo(-R*0.98, R*0.55, -R*0.86, -R*0.92, 0, -R*1.26);
  ctx.closePath();
  ctx.fill();

  // ลายจุดตามธาตุ
  const rr = rngFrom(hashStr('egg' + tint.el));
  ctx.fillStyle = _hsla(tint.h, tint.s + 14, tint.l - 26, .45);
  for (let i=0;i<7;i++){
    const a = rr()*Math.PI*2, d = rr()*R*0.72;
    ctx.beginPath(); ctx.arc(Math.cos(a)*d, Math.sin(a)*d*1.05, R*(0.06+rr()*0.06), 0, Math.PI*2); ctx.fill();
  }

  // รอยร้าวตามความคืบหน้าการฟัก
  if (prog > 0.05){
    const n = Math.floor(prog * 7);
    ctx.strokeStyle = 'rgba(20,32,40,.55)'; ctx.lineWidth = Math.max(1, R*0.045);
    const cr = rngFrom(hashStr('crack' + e.tier));
    for (let i=0;i<n;i++){
      let x = (cr()-.5)*R*1.2, y = (cr()-.5)*R*1.6;
      ctx.beginPath(); ctx.moveTo(x, y);
      for (let j=0;j<3;j++){
        x += (cr()-.5)*R*0.5; y += (cr()-.5)*R*0.5;
        ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
  }
  // แสงตอนใกล้ฟัก
  if (prog > 0.85){
    ctx.shadowColor = _hsla(tint.h, 70, 70, .9);
    ctx.shadowBlur = 18 + Math.sin(t*4)*8;
    ctx.strokeStyle = _hsla(tint.h, 60, 78, .5); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(0, -R*0.1, R*0.9, R*1.12, 0, 0, Math.PI*2); ctx.stroke();
    ctx.shadowBlur = 0;
  }
  ctx.restore();
}

/* ---- ตราสัญลักษณ์การ์ด (พิกเซล 7x7) ---- */
function sigilSVG(seedStr, color, size=44){
  const r = rngFrom(hashStr(seedStr));
  const n = 7, cell = size/n;
  let rects = '';
  for (let y=0;y<n;y++){
    for (let x=0;x<Math.ceil(n/2);x++){
      if (r() > .48){
        const o = 0.5 + r()*0.5;
        rects += `<rect x="${x*cell}" y="${y*cell}" width="${cell}" height="${cell}" fill="${color}" opacity="${o.toFixed(2)}"/>`;
        const mx = n-1-x;
        if (mx !== x) rects += `<rect x="${mx*cell}" y="${y*cell}" width="${cell}" height="${cell}" fill="${color}" opacity="${o.toFixed(2)}"/>`;
      }
    }
  }
  return `<svg class="sigil" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${rects}</svg>`;
}

function sheet(html){
  $('#sheet').innerHTML = html;

}
function closeSheet(){ $('#veil').classList.remove('show'); }
$('#veil').addEventListener('click', e => { if (e.target.id === 'veil') closeSheet(); });

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ===================== แถบบน ===================== */
function paintTop(){
  $('#coins').textContent = Math.floor(S.coins).toLocaleString('th-TH');
  $('#crys').textContent  = Math.floor(S.crystals).toLocaleString('th-TH');
  const p = S.pet;
  $('#petline').textContent = p ? `— ${p.name} · Lv.${p.lv} · ${formName(p.sp,p.stage,p.branch)}` : '';
  document.body.classList.toggle('night', isNight() && !roomBonus().light);
  // จุดแจ้งเตือนสำรวจเสร็จ
  const eb = document.querySelector('#tabs button[data-tab="explore"]');
  const old = eb.querySelector('.dot'); if (old) old.remove();

}

/* ===================== แท็บ ===================== */
document.querySelectorAll('#tabs button').forEach(b => {
  b.addEventListener('click', () => {
    if (QUIZ.running && !QUIZ.locked) return;
    TAB = b.dataset.tab;
    document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x === b));
    render();
  });
});

function render(){
  tickOffline();
  paintTop();
  const v = view();
  if (TAB === 'pot')      v.innerHTML = viewPot();
  else if (TAB === 'quiz')    v.innerHTML = viewQuiz();
  else if (TAB === 'explore') v.innerHTML = viewExplore();
  else if (TAB === 'bag')     v.innerHTML = viewBag();
  else if (TAB === 'home')    v.innerHTML = viewHome();
  else if (TAB === 'book')    v.innerHTML = viewBook();
  else if (TAB === 'sum')     v.innerHTML = viewSummary();

  save();
}

function eggBlock(){

    `<div class="odd">
      <span class="nm">${ELEMENTS[el].g} ${ELEMENTS[el].n}</span>
      <span class="tr"><i style="width:${(v*100).toFixed(1)}%;background:hsl(${ELEMENTS[el].h},52%,58%)"></i></span>

    <div class="odds">${rows}</div>
    <div class="tiny" style="margin-top:6px">ไข่โตจากคะแนนฐานของข้อที่ตอบถูก ไม่รวมโบนัสความเร็วและตัวคูณต่อเนื่อง · ไข่ใบนี้สุ่มผังธาตุมาเองแล้ว ${Math.round(CHAOS_CHANCE*100)}% ที่ตอนฟักจะแปรปรวนไม่สนผัง</div>
    <div class="gap" style="height:6px"></div>

    ${e.pts >= e.need ? `<div class="gap"></div><button class="btn pri block" data-act="hatch">ฟักไข่</button>` : ''}

}

function stageBlock(){
  const p = S.pet;
  if (!p) return `<div class="card">
    <div class="stage"><canvas id="pot" width="420" height="340" aria-label="ไข่ในกระถาง"></canvas></div>

/* ===================== หน้า: สรุปผลสัมฤทธิ์ ===================== */
function accColor(pct){
  if (pct >= 80) return '#7cae9b';
  if (pct >= 60) return '#a8c98a';
  if (pct >= 40) return '#d8b04a';
  return '#c26a6a';
}
function accBar(r, w){
  const t = r + w;
  const pct = t ? Math.round(r / t * 100) : 0;
  return {pct, t, html:`<div class="pbar"><i style="width:${pct}%;background:${accColor(pct)}"></i></div>`};
}
function trendTag(p){
  const tr = trendOf(p);
  if (!tr) return `<span class="trend flat">—</span>`;
  const d = Math.round(tr.diff * 100);
  if (d >= 8)  return `<span class="trend up">▲ ${d}%</span>`;
  if (d <= -8) return `<span class="trend down">▼ ${Math.abs(d)}%</span>`;
  return `<span class="trend flat">คงที่</span>`;
}

function viewSummary(){
  const st = S.stats;
  const acc = st.answered ? Math.round(st.correct / st.answered * 100) : 0;

  // รวมตามวิชา+ระดับชั้น และตามหน่วย
  const bySG = {}, byUnit = {};
  for (const key in (S.prog || {})){
    const [subj, grade, unit] = key.split('|');
    const p = S.prog[key];
    const sg = subj + '|' + grade;
    if (!bySG[sg]) bySG[sg] = {r:0, w:0, subj, grade};
    bySG[sg].r += p.r; bySG[sg].w += p.w;
    byUnit[key] = {subj, grade, unit, p};
  }

  const petCard = S.pet ? (() => {
    const p = S.pet, sp = SPECIES[p.sp];
    return `<div class="card">
      <div class="stage"><canvas id="pot" width="420" height="340" aria-label="วิญญาณปัจจุบัน"></canvas></div>
      <div style="text-align:center;margin-top:4px">
        <h2>${esc(p.name)}</h2>
        <div class="sub">${formName(p.sp,p.stage,p.branch)} · Lv.${p.lv}</div>
        <div class="gap" style="height:6px"></div>
        <span class="pill" style="color:${RARITY[sp.rarity].c};border-color:${RARITY[sp.rarity].c}55">${RARITY[sp.rarity].star} ${RARITY[sp.rarity].n}</span>
        <span class="pill">ธาตุ${sp.el}</span>
        <span class="pill">พลังรวม ${petPower(p)}</span>
      </div>
    </div>` ;
  })() : `<div class="card"><div class="eyebrow">ยังไม่มีวิญญาณ</div>
      <div class="stage"><canvas id="pot" width="420" height="340"></canvas></div>
      <div class="sub" style="text-align:center">ตอบคำถามให้ไข่ฟักก่อน</div></div>`;

  const sgRows = Object.values(bySG)
    .sort((a,b) => (GRADES[a.grade].ord - GRADES[b.grade].ord) || a.subj.localeCompare(b.subj))
    .map(x => {
      const b = accBar(x.r, x.w);
      const code = SUBJECTS[x.subj].code[x.grade];
      return `<div class="prow">
        <div class="lab">
          <b>${SUBJECTS[x.subj].g} ${SUBJECTS[x.subj].short} · ${GRADES[x.grade].n}</b>
          <div class="tiny">${code || ''} · ถูก ${x.r} ผิด ${x.w} จาก ${b.t} ข้อ</div>
          ${b.html}
        </div>
        <div class="num" style="color:${accColor(b.pct)}">${b.pct}%</div>
      </div>`;
    }).join('');

  const unitRows = Object.values(byUnit)
    .sort((a,b) => (b.p.r + b.p.w) - (a.p.r + a.p.w))
    .map(x => {
      const b = accBar(x.p.r, x.p.w);
      const el = ELEMENTS[UNITS[x.unit].el];
      return `<div class="prow">
        <div class="lab">
          <b>${UNITS[x.unit].n}</b>
          <div class="tiny">${SUBJECTS[x.subj].short} ${GRADES[x.grade].n} · ธาตุ${el.n} ${el.g} · ถูก ${x.p.r} ผิด ${x.p.w}</div>
          ${b.html}
        </div>
        <div class="num" style="color:${accColor(b.pct)}">${b.pct}%</div>
        ${trendTag(x.p)}
      </div>`;
    }).join('');

  // หน่วยที่ควรทบทวน
  const weak = Object.values(byUnit)
    .filter(x => (x.p.r + x.p.w) >= 5)
    .map(x => ({...x, pct: x.p.r / (x.p.r + x.p.w) * 100}))
    .filter(x => x.pct < 70)
    .sort((a,b) => a.pct - b.pct).slice(0, 3);

  return `
  ${petCard}
  <div class="card">
    <div class="eyebrow">ภาพรวม</div>
    <div class="bigstat">
      <div><b>${st.answered}</b><span>ตอบทั้งหมด</span></div>
      <div><b style="color:${accColor(acc)}">${acc}%</b><span>ความแม่นยำ</span></div>
      <div><b>${st.rounds}</b><span>รอบที่ทำ</span></div>
    </div>
    <div class="gap"></div>
    <div class="bigstat">
      <div><b style="color:var(--ok)">${st.correct}</b><span>ตอบถูก</span></div>
      <div><b style="color:var(--bad)">${st.answered - st.correct}</b><span>ตอบผิด</span></div>
      <div><b>${st.points.toLocaleString('th-TH')}</b><span>คะแนนสะสม</span></div>
    </div>

const QUIZ = {
  running:false, subj:'mix', grade:null, idx:0, used:[], cur:null, units:{},
  streak:0, pts:0, eggPts:0, correct:0, marks:[], len:ROUND_LEN,
  startAt:0, limitMs:0, locked:false, chosen:-1, gained:null, tickId:null
};

function viewQuiz(){
  if (QUIZ.running) return quizQuestionHtml();

  const grade = QUIZ.grade || S.grade;
  const ready = gradesReady();
  const counts = {};
  for (const k of SUBJ_KEYS) counts[k] = questionsBy(k, grade).length;
  const total = questionsBy('mix', grade).length;
  const avail = QUIZ.subj === 'mix' ? total : counts[QUIZ.subj];

  const gradeChips = GRADE_KEYS.map(g => {
    const n = questionsBy('mix', g).length;
    return `<button class="chip ${g===grade?'on':''}" data-grade="${g}" ${n?'':'disabled'}>
      ${GRADES[g].n} <span class="mono" style="font-size:11px;opacity:.7">${n}</span></button>`;
  }).join('');

  const subjChips = [`<button class="chip ${QUIZ.subj==='mix'?'on':''}" data-subj="mix" ${total?'':'disabled'}>
      🎲 ผสมทุกวิชา <span class="mono" style="font-size:11px;opacity:.7">${total}</span></button>`]
    .concat(SUBJ_KEYS.map(k => {
      const code = SUBJECTS[k].code[grade];
      return `<button class="chip ${QUIZ.subj===k?'on':''}" data-subj="${k}" ${counts[k]?'':'disabled'}>
        ${SUBJECTS[k].g} ${SUBJECTS[k].short}${code?` <span class="tiny">${code}</span>`:''}
        <span class="mono" style="font-size:11px;opacity:.7">${counts[k]}</span></button>`;
    })).join('');

  // หน่วยการเรียนรู้ที่มีในชุดนี้

  const unitLine = Object.keys(unitSet).length
    ? `<div class="tiny" style="margin-top:8px">หน่วยที่จะสุ่มมา — ${Object.keys(unitSet)
        .map(u => `${UNITS[u].n} (${unitSet[u]})`).join(' · ')}</div>` : '';

  <div class="card">

  </div>
  <div class="card">
    <div class="eyebrow">เลือกวิชา</div>
    <h2>จะตอบเรื่องอะไรดี</h2>
    <div class="sub">หน่วยการเรียนรู้ที่ตอบจะกำหนดธาตุของไข่ที่กำลังฟักอยู่</div>
    <div class="gap"></div>
    <div class="chips">${subjChips}</div>
    ${unitLine}
    <div class="gap"></div>
    <button class="btn pri block" data-act="startQuiz" ${avail?'':'disabled'}>
      ${avail ? `เริ่มรอบ ${Math.min(ROUND_LEN, avail)} ข้อ` : 'ยังไม่มีคำถามในชุดนี้'}</button>
    <div class="tiny" style="margin-top:8px">
      ตอบถูกได้คะแนนเต็มเสมอ ตอบเร็วได้โบนัสเพิ่มสูงสุด 50% และตอบถูกติดกันจะได้ตัวคูณสูงสุด ×2
    </div>
  </div>
  <div class="card">
    <div class="eyebrow">คลังคำถาม</div>
    <div class="row spread">
      <div class="grow"><b>${allQuestions().length} ข้อทั้งหมด</b>
        <div class="sub">เพิ่มคำถามเอง หรือนำเข้าจาก Google Sheets ได้</div></div>
      <button class="btn" data-act="qbank">จัดการ</button>

function quizQuestionHtml(){
  const q = QUIZ.cur;
  const d = DIFF[q.diff];
  const dots = Array.from({length:QUIZ.len}, (_,i) => {
    const m = QUIZ.marks[i];
    return `<i class="${i===QUIZ.idx?'now':(m===1?'ok':(m===0?'no':''))}"></i>`;
  }).join('');

  const choices = q.ch.map((c, i) => {
    let cls = '';
    if (QUIZ.locked){
      if (i === q.ans) cls = 'right';
      else if (i === QUIZ.chosen) cls = 'wrong';
    }
    return `<button class="ch ${cls}" data-ans="${i}" ${QUIZ.locked?'disabled':''}>
      <span class="k">${'กขคง'[i]}</span><span>${esc(c)}</span></button>`;
  }).join('');

  let after = '';
  if (QUIZ.locked){
    const ok = QUIZ.chosen === q.ans;
    const g = QUIZ.gained;
    after = `<div class="expl" style="border-left-color:${ok?'var(--glaze)':'var(--bad)'}">
      <b>${ok ? `ถูกต้อง +${g.pts} คะแนน` : 'ยังไม่ใช่ คำตอบคือ ' + 'กขคง'[q.ans]}</b>
      ${ok && (g.speed > 0.02 || g.mult > 1) ? `<div class="tiny" style="margin-top:2px">ฐาน ${g.base} · เร็ว +${Math.round(g.speed*100)}% · ต่อเนื่อง ×${g.mult.toFixed(1)}${g.repeat<1?' · ข้อซ้ำวันนี้ ×'+g.repeat:''}</div>` : ''}
      ${q.exp ? `<div style="margin-top:6px">${esc(q.exp)}</div>` : ''}
      ${!ok ? `<div class="tiny" style="margin-top:6px;color:var(--glaze-lt)">อ่านคำอธิบายแล้วได้ประสบการณ์เล็กน้อย ข้อนี้จะกลับมาถามอีกเร็วๆ นี้</div>` : ''}
    </div>
    <div class="gap"></div>
    <button class="btn pri block" data-act="nextQ">${QUIZ.idx + 1 >= QUIZ.len ? 'จบรอบ' : 'ข้อถัดไป'}</button>`;
  }

  return `
  ${stageBlock()}
  <div class="card">
    <div class="qmeta">
      <span>ข้อ ${QUIZ.idx+1}/${QUIZ.len} · ${SUBJECTS[q.subj].g} ${GRADES[q.grade].n}
        · ${UNITS[q.unit].n} · <span style="color:${d.c}">${d.n}</span></span>
      <span>${S.settings.timed && !QUIZ.locked ? `<span id="qclock">${Math.ceil(Math.max(0,QUIZ.limitMs-(Date.now()-QUIZ.startAt))/1000)} วิ</span>` : ''}
        ${QUIZ.streak > 1 ? `<span class="combo">🔥 ${QUIZ.streak}</span>` : ''}</span>
    </div>
    <div class="dots" style="margin-bottom:10px">${dots}</div>
    <div class="qtext">${esc(q.q)}</div>
    <div class="choices">${choices}</div>
    ${after}
  </div>
  <div class="card">
    <div class="row spread">
      <span class="sub">คะแนนรอบนี้</span><b class="mono" style="font-size:19px">${QUIZ.pts}</b>
    </div>
    ${QUIZ.locked ? '' : '<div class="gap"></div><button class="btn sm danger block" data-act="quitQuiz">ออกจากรอบนี้</button>'}
  </div>`;
}

function startQuiz(){
  QUIZ.grade = QUIZ.grade || S.grade;
  const avail = questionsBy(QUIZ.subj, QUIZ.grade).length;
  if (!avail) return toast('วิชานี้ยังไม่มีคำถามในคลัง', 'bad');
  QUIZ.running = true; QUIZ.idx = 0; QUIZ.used = []; QUIZ.streak = 0;
  QUIZ.pts = 0; QUIZ.eggPts = 0; QUIZ.correct = 0; QUIZ.marks = []; QUIZ.units = {};
  QUIZ.len = Math.min(ROUND_LEN, avail);
  nextQuestion();
}

function nextQuestion(){
  const q = pickQuestion(QUIZ.subj, QUIZ.grade, QUIZ.used);
  if (!q){ return finishQuiz(); }
  QUIZ.used.push(q.id);
  // สลับตัวเลือกไม่ให้จำตำแหน่ง
  let cur = q;
  if (S.settings.shuffle){
    const order = q.ch.map((c,i) => i).sort(() => Math.random() - .5);
    cur = Object.assign({}, q, {
      ch: order.map(i => q.ch[i]),
      ans: order.indexOf(q.ans)
    });
  }
  QUIZ.cur = cur;
  QUIZ.locked = false; QUIZ.chosen = -1; QUIZ.gained = null;
  QUIZ.limitMs = S.settings.timed ? DIFF[cur.diff].sec * 1000 : 0;
  QUIZ.startAt = Date.now();
  View.focusing = true; View.progress = 0; View.drift = false;
  clearInterval(QUIZ.tickId);
  if (QUIZ.limitMs) QUIZ.tickId = setInterval(quizTick, 120);
  render();
}

function quizTick(){
  if (!QUIZ.running || QUIZ.locked || !QUIZ.limitMs) return;
  const left = QUIZ.limitMs - (Date.now() - QUIZ.startAt);
  View.progress = clamp(1 - left / QUIZ.limitMs, 0, 1);
  View.drift = left < QUIZ.limitMs * 0.25;
  const c = document.getElementById('qclock');
  if (c){
    c.textContent = Math.max(0, Math.ceil(left/1000)) + ' วิ';
    c.classList.toggle('low', left < QUIZ.limitMs * 0.25);
  }
  if (left <= 0) answerQuestion(-1);
}

function answerQuestion(i){
  if (QUIZ.locked) return;
  clearInterval(QUIZ.tickId);
  const q = QUIZ.cur;
  const correct = i === q.ans;
  const left = QUIZ.limitMs ? Math.max(0, QUIZ.limitMs - (Date.now() - QUIZ.startAt)) : 0;

  QUIZ.chosen = i;
  QUIZ.locked = true;
  QUIZ.gained = scoreAnswer(q, correct, left, QUIZ.limitMs, QUIZ.streak);
  QUIZ.marks[QUIZ.idx] = correct ? 1 : 0;

  if (correct){
    QUIZ.pts += QUIZ.gained.pts;
    QUIZ.eggPts += QUIZ.gained.base;      // ไข่โตจากคะแนนฐานอย่างเดียว
    QUIZ.units[q.unit] = (QUIZ.units[q.unit] || 0) + QUIZ.gained.base;
    QUIZ.correct++;
    QUIZ.streak++;
    S.stats.bestStreak = Math.max(S.stats.bestStreak, QUIZ.streak);
    if (S.pet){
      const p = S.pet;
      if (q.diff >= 3) p.care.mind += 2;
      else if (QUIZ.gained.speed > 0.3) p.care.play += 1;
      else p.care.mind += 1;
    }
  } else {
    QUIZ.streak = 0;
    if (S.pet) S.pet.mood = clamp(S.pet.mood - 2, 0, 100);
  }
  recordAnswer(q, correct);
  S.stats.answered++;
  if (correct) S.stats.correct++;
  View.drift = false;
  View.progress = correct ? 1 : View.progress;
  save(); render();
}

function advanceQuiz(){
  if (!QUIZ.locked) return;
  if (!QUIZ.marks[QUIZ.idx] && S.pet) gainXp(3);   // อ่านคำอธิบายหลังตอบผิด
  QUIZ.idx++;
  if (QUIZ.idx >= QUIZ.len) return finishQuiz();
  nextQuestion();
}

function finishQuiz(){
  clearInterval(QUIZ.tickId);
  QUIZ.running = false;
  View.focusing = false; View.drift = false; View.progress = 0;

  const b = roomBonus();
  const pts = QUIZ.pts;
  const answered = QUIZ.marks.length;
  const acc = answered ? QUIZ.correct / answered : 0;
  const perfect = answered > 0 && QUIZ.correct === answered && answered === QUIZ.len;

  const xp = Math.round(pts * 0.6 * (1 + b.focusXp));
  const coin = Math.round(pts * 0.35 * (1 + b.coin));
  const aff = Math.round(pts / 40 * (1 + b.aff));
  let lv = 0;

  if (S.pet){
    lv = gainXp(xp).levels;
    S.pet.aff = clamp(S.pet.aff + aff, 0, 100);
    S.pet.mood = clamp(S.pet.mood + (acc >= .7 ? 6 : 2), 0, 100);
    S.pet.hunger = clamp(S.pet.hunger - 2, 0, 100);
  }
  S.coins += coin;
  S.stats.points += pts;
  S.stats.rounds++;
  S.stats.best = Math.max(S.stats.best, pts);

  // ต่อเนื่องรายวัน
  const t = todayKey();
  if (S.stats.lastDay !== t){
    const y = new Date(Date.now() - 86400000);
    const yk = `${y.getFullYear()}-${y.getMonth()+1}-${y.getDate()}`;
    S.stats.streak = (S.stats.lastDay === yk) ? S.stats.streak + 1 : 1;
    S.stats.lastDay = t;
  }

  // ผลึกสมาธิ
  const cr = Math.floor(QUIZ.correct / 4) + (perfect ? 2 : 0);
  if (cr > 0) S.crystals += cr;

  // ของติดมือ
  const got = [];
  const pool = ['leaf','leaf','berry','clay','bamboo','ricecake','shard'];
  for (let i=0;i<QUIZ.correct;i++){
    if (Math.random() < .30 + b.exploreLuck){ const k = pick(pool); addItem(k); got.push(ITEMS[k].n); }
  }
  if (perfect && Math.random() < .25 + b.exploreLuck){
    const k = pick(['stone_b','stone_m','stone_p']); addItem(k); got.push(ITEMS[k].n);
  }

  // ป้อนคะแนนให้ไข่
  let hatchReady = false;
  if (S.egg && QUIZ.eggPts > 0) hatchReady = eggAddPoints(QUIZ.eggPts, QUIZ.units);

  save(); render();
  sheet(quizResultSheet(pts, acc, perfect, xp, coin, aff, cr, got, lv, hatchReady));
}

function quizResultSheet(pts, acc, perfect, xp, coin, aff, cr, got, lv, hatchReady){
  const line = (g, t, s2) => `<div class="item"><div class="ic">${g}</div><div class="grow"><b>${t}</b>${s2?`<div class="sub">${s2}</div>`:''}</div></div>`;
  return `<div class="eyebrow">จบรอบ</div>
  <h2>${perfect ? 'ถูกหมดทั้งรอบ' : `ตอบถูก ${QUIZ.correct} จาก ${QUIZ.marks.length} ข้อ`}</h2>
  <div class="sub">ความแม่นยำ ${Math.round(acc*100)}% · คะแนนรวม ${pts}${pts > S.stats.best - pts ? '' : ''}</div>
  <div class="gap"></div>
  <div class="list">
    ${S.pet ? line('⭐', `ประสบการณ์ +${xp}`, lv ? `เลื่อนขึ้น ${lv} เลเวล เป็น Lv.${S.pet.lv}` : '') : ''}
    ${line('🪙', `เหรียญ +${coin}`)}
    ${cr ? line('💠', `ผลึกสมาธิ +${cr}`, perfect ? 'โบนัสตอบถูกหมดทั้งรอบ' : '') : ''}
    ${S.pet ? line('💞', `ความสนิท +${aff}`) : ''}
    ${got.length ? line('🎁', 'ได้รับ', got.join(' · ')) : ''}
    ${S.egg ? line('🥚', `ไข่ได้รับ +${QUIZ.eggPts} คะแนนฐาน`, `${Math.min(S.egg.pts,S.egg.need)}/${S.egg.need}`) : ''}
    ${S.stats.streak > 1 ? line('🔥', `ตอบต่อเนื่อง ${S.stats.streak} วัน`) : ''}
  </div>
  <div class="gap"></div>
  ${hatchReady ? `<button class="btn gold block" data-act="hatch">ไข่พร้อมฟักแล้ว</button><div class="gap"></div>` : ''}
  <button class="btn pri block" data-act="closeSheet">ปิด</button>`;
}

/* ===================== ไข่ ===================== */
function openEgg(key){
  if (S.egg) return toast('มีไข่ที่กำลังฟักอยู่แล้ว ต้องฟักใบนี้ให้เสร็จก่อน', 'bad');
  if (!(S.bag[key] > 0)) return toast('ไม่มีไข่ใบนี้', 'bad');
  S.bag[key]--; if (!S.bag[key]) delete S.bag[key];
  startEgg(ITEMS[key].tier);
  save(); render();
  toast(`เริ่มฟัก${ITEMS[key].n}แล้ว ตอบคำถามเพื่อสะสมคะแนน`, 'gold');
}

function doHatch(){
  if (!S.egg || S.egg.pts < S.egg.need) return toast('คะแนนยังไม่ถึง', 'bad');
  if (S.pet && gardenCount() + 1 >= GARDEN_MAX)
    return toast(`สวนเต็ม ${GARDEN_MAX} ตัวแล้ว ปล่อยตัวใดตัวหนึ่งก่อน`, 'bad');

  const chaos = Math.random() < CHAOS_CHANCE;
  const sp = hatchRoll(chaos);
  const topUnit = eggTopUnit();
  S.egg = null;
  const first = !S.pet;
  if (!first) stashActive();
  S.pet = newPet(sp);
  unlockForm();
  save(); render();

  const R = RARITY[SPECIES[sp].rarity];
  sheet(`<div class="eyebrow">ไข่ฟักแล้ว</div>
    <h2 style="color:${SPECIES[sp].accent}">${SPECIES[sp].name} ${R.star}</h2>
    <div class="sub">${SPECIES[sp].desc}</div>
    <div class="gap"></div>
    <div class="list">
      <div class="item"><div class="ic" style="background:${SPECIES[sp].dim};border-color:${SPECIES[sp].a(.4)}">${SPECIES[sp].g}</div>
        <div class="grow"><b>ธาตุ${SPECIES[sp].el} · ${R.n}</b>
          <div class="sub">เด่น ${SPECIES[sp].main} · รอง ${SPECIES[sp].sub}</div>
          ${chaos
            ? `<div class="tiny" style="color:var(--gold)">ธาตุแปรปรวน — ไข่ใบนี้เลือกธาตุเองโดยไม่สนหน่วยที่ตอบ</div>`
            : (topUnit ? `<div class="tiny">ธาตุนี้มาจากการตอบหน่วย "${UNITS[topUnit].n}" เป็นหลัก</div>` : '')}
        </div></div>
    </div>
    <div class="gap"></div>
    <input id="nameIn" maxlength="14" value="${esc(S.pet.name)}" class="fld" placeholder="ตั้งชื่อ">
    <button class="btn pri block" data-act="saveName">เริ่มเลี้ยง</button>`);
}

/* ===================== คลังคำถาม ===================== */
function qbankSheet(){
  const custom = S.qcustom || [];
  const off = Object.keys(S.qoff || {}).length;
  const rows = [];
  for (const k of SUBJ_KEYS){
    for (const g of gradesOf(k)){
      const n = questionsBy(k, g).length;
      const mine = custom.filter(q => q.subj === k && q.grade === g).length;
      rows.push(`<div class="item">
        <div class="ic">${SUBJECTS[k].g}</div>
        <div class="grow"><b>${SUBJECTS[k].short} ${GRADES[g].n}</b>
          <div class="sub">${SUBJECTS[k].code[g]} · ${n} ข้อ${mine?` · เพิ่มเอง ${mine}`:''}${n?'':' · ยังไม่มีคำถาม'}</div></div>
        ${n ? `<button class="btn sm" data-qlist="${k}:${g}">ดู</button>` : '<span class="pill">ว่าง</span>'}
      </div>`);
    }
  }
  sheet(`<div class="eyebrow">คลังคำถาม · ${allQuestions().length} ข้อ</div>
    <h2>จัดการคำถาม</h2>
    <div class="sub">คำถามที่เพิ่มเองบันทึกไว้ในเครื่องพร้อมกับเซฟเกม${off?` · ปิดใช้อยู่ ${off} ข้อ`:''}</div>
    <div class="gap"></div>
    <div class="list">${rows.join('')}</div>
    <div class="gap"></div>
    <button class="btn pri block" data-act="qadd">เพิ่มคำถามใหม่</button>
    <div class="gap"></div>

/* ---- CSV ---- */
function csvEscape(v){
  v = String(v == null ? '' : v);
  return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
}
function parseCSV(text){
  const rows = []; let row = [], cell = '', q = false;
  for (let i=0;i<text.length;i++){
    const c = text[i];
    if (q){
      if (c === '"'){ if (text[i+1] === '"'){ cell += '"'; i++; } else q = false; }
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === ',' || c === '\t'){ row.push(cell); cell = ''; }
    else if (c === '\n'){ row.push(cell); cell = ''; if (row.some(x => x.trim() !== '')) rows.push(row); row = []; }
    else if (c !== '\r') cell += c;
  }
  row.push(cell);
  if (row.some(x => x.trim() !== '')) rows.push(row);
  return rows;
}
const SUBJ_BY_NAME = {};
for (const k of SUBJ_KEYS){
  SUBJ_BY_NAME[SUBJECTS[k].n] = k; SUBJ_BY_NAME[SUBJECTS[k].short] = k; SUBJ_BY_NAME[k] = k;
  for (const g in SUBJECTS[k].code) SUBJ_BY_NAME[SUBJECTS[k].code[g]] = k;
}
const GRADE_BY_NAME = {};
for (const g of GRADE_KEYS){ GRADE_BY_NAME[GRADES[g].n] = g; GRADE_BY_NAME[g] = g; GRADE_BY_NAME[GRADES[g].n.replace('.','')] = g; }
const UNIT_BY_NAME = {};

const DIFF_BY_NAME = {'ง่าย':1,'ปานกลาง':2,'กลาง':2,'ยาก':3,'ท้าทาย':4,'1':1,'2':2,'3':3,'4':4};

function qdoimport(){
  const txt = document.getElementById('csvIn').value;
  if (!txt.trim()) return toast('ยังไม่ได้วางข้อมูล', 'bad');
  const rows = parseCSV(txt);
  let added = 0, skipped = 0;
  S.qcustom = S.qcustom || [];
  for (const r of rows){
    if (r.length < 10){ skipped++; continue; }
    const subj = SUBJ_BY_NAME[(r[0]||'').trim()];
    const grade = GRADE_BY_NAME[(r[1]||'').trim()];
    let unit = UNIT_BY_NAME[(r[2]||'').trim()];
    const diff = DIFF_BY_NAME[(r[3]||'').trim()];
    const q = (r[4]||'').trim();
    const ch = [r[5],r[6],r[7],r[8]].map(x => (x||'').trim());
    const ans = parseInt((r[9]||'').trim(), 10) - 1;
    if (!subj || !grade || !diff || !q || ch.some(c => !c) || !(ans >= 0 && ans <= 3)){ skipped++; continue; }
    if (!unit || UNITS[unit].subj !== subj) unit = unitsOf(subj)[0];
    if (!SUBJECTS[subj].code[grade]){ skipped++; continue; }
    S.qcustom.push({ id:'c' + Date.now().toString(36) + added, subj, grade, unit, diff, q, ch, ans, exp:(r[10]||'').trim() });
    added++;
  }
  save();
  if (!added) return toast(`นำเข้าไม่สำเร็จ ตรวจลำดับคอลัมน์อีกครั้ง (ข้าม ${skipped} แถว)`, 'bad');
  render();
  toast(`นำเข้า ${added} ข้อ${skipped?` · ข้าม ${skipped} แถว`:''}`, 'gold');
  qbankSheet();
}

function qexport(){
  const head = ['วิชา','ระดับชั้น','หน่วยการเรียนรู้','ความยาก','โจทย์','ก','ข','ค','ง','เฉลย','คำอธิบาย'];
  const lines = [head.join(',')];
  for (const q of allQuestions()){
    lines.push([SUBJECTS[q.subj].n, GRADES[q.grade].n, UNITS[q.unit].n, DIFF[q.diff].n,
      q.q, q.ch[0], q.ch[1], q.ch[2], q.ch[3], q.ans+1, q.exp].map(csvEscape).join(','));
  }
  const blob = new Blob(['\ufeff' + lines.join('\n')], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `คลังคำถาม-${allQuestions().length}ข้อ.csv`; a.click();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
  toast('ส่งออกไฟล์ CSV แล้ว');
}
