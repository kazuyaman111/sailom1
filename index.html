['h_world',2,'ผลสำคัญของการปฏิวัติอุตสาหกรรมต่อสังคมยุโรปคือข้อใด',['เกิดชนชั้นกลางและชนชั้นกรรมกร พร้อมการขยายตัวของเมืองอย่างรวดเร็ว','จำนวนประชากรในทวีปยุโรปลดลงอย่างมากจากการอพยพออกนอกทวีป','ผู้คนพากันย้ายกลับไปตั้งถิ่นฐานในชนบทเพื่อทำการเกษตรเช่นเดิม','ระบบทาสกลับมาแพร่หลายอีกครั้งเพื่อรองรับแรงงานในโรงงาน'],0,'โรงงานดึงแรงงานเข้าเมือง ทำให้เกิดโครงสร้างชนชั้นและปัญหาสังคมแบบใหม่'],
['h_world',2,'การปฏิวัติอุตสาหกรรมเกี่ยวข้องกับลัทธิจักรวรรดินิยมอย่างไร',['ชาติอุตสาหกรรมต้องการวัตถุดิบและตลาดระบายสินค้า จึงออกไปแสวงหาอาณานิคม','ทำให้ชาติตะวันตกยุติการล่าอาณานิคมเพราะมีรายได้จากโรงงานเพียงพอแล้ว','ทั้งสองเรื่องเกิดขึ้นในคนละช่วงเวลาจึงไม่มีความเกี่ยวข้องเชื่อมโยงกัน','ทำให้ดินแดนอาณานิคมมีความมั่งคั่งทางเศรษฐกิจมากกว่าเจ้าอาณานิคม'],0,'ความต้องการวัตถุดิบและตลาดเป็นแรงผลักสำคัญของการล่าอาณานิคม'],
['h_world',2,'ประธานาธิบดีสหรัฐอเมริกาที่มีบทบาทในการเลิกทาสคือผู้ใด',['อับราฮัม ลินคอล์น','จอร์จ วอชิงตัน','แฟรงกลิน รูสเวลต์','จอห์น เอฟ. เคนเนดี'],0,'ลินคอล์นประกาศเลิกทาสในช่วงสงครามกลางเมืองอเมริกา'],
['h_world',2,'นโยบายแบ่งแยกสีผิวในสาธารณรัฐแอฟริกาใต้เรียกว่าอะไร',['แอปาร์ตไฮด์','อพาร์ตเมนต์','แอนติเซมิติซึม','แมคคาร์ธีอิซึม'],0,'แอปาร์ตไฮด์คือระบบแบ่งแยกและกีดกันคนผิวสีทางกฎหมาย'],
['h_world',2,'ผู้นำคนใดมีบทบาทสำคัญในการยุตินโยบายแบ่งแยกสีผิวในแอฟริกาใต้',['เนลสัน แมนเดลา','มหาตมะ คานธี','มาร์ติน ลูเทอร์ คิง จูเนียร์','โฮจิมินห์'],0,'เนลสัน แมนเดลาต่อสู้จนได้เป็นประธานาธิบดีผิวสีคนแรกของแอฟริกาใต้'],
['h_world',2,'สงครามโลกครั้งที่ 1 เกิดขึ้นในช่วงปีใด',['ค.ศ. 1914-1918','ค.ศ. 1939-1945','ค.ศ. 1904-1905','ค.ศ. 1950-1953'],0,'สงครามโลกครั้งที่ 1 กินเวลาสี่ปีเศษระหว่าง ค.ศ. 1914 ถึง 1918'],
['h_world',2,'องค์การระหว่างประเทศที่ตั้งขึ้นหลังสงครามโลกครั้งที่ 1 เพื่อรักษาสันติภาพคือองค์การใด',['สันนิบาตชาติ','สหประชาชาติ','องค์การนาโต','องค์การการค้าโลก'],0,'สันนิบาตชาติตั้งขึ้นตามสนธิสัญญาแวร์ซาย แต่ไม่สามารถป้องกันสงครามครั้งที่ 2 ได้'],
['h_world',2,'เหตุการณ์ใดถือเป็นจุดเริ่มต้นของสงครามโลกครั้งที่ 2 ในทวีปยุโรป',['เยอรมนีบุกโปแลนด์','ญี่ปุ่นโจมตีเพิร์ลฮาร์เบอร์','การลอบปลงพระชนม์อาร์ชดยุก','การล่มสลายของกำแพงเบอร์ลิน'],0,'เยอรมนีบุกโปแลนด์เมื่อ ค.ศ. 1939 ทำให้อังกฤษและฝรั่งเศสประกาศสงคราม'],
['h_world',2,'องค์การสหประชาชาติก่อตั้งขึ้นในปีใด',['ค.ศ. 1945','ค.ศ. 1919','ค.ศ. 1949','ค.ศ. 1967'],0,'ก่อตั้งเมื่อสิ้นสุดสงครามโลกครั้งที่ 2 ในปี ค.ศ. 1945'],
['h_world',3,'ข้อใดคือความล้มเหลวสำคัญของสันนิบาตชาติที่สหประชาชาติพยายามแก้ไข',['ขาดกลไกบังคับใช้และมหาอำนาจสำคัญบางประเทศไม่เข้าร่วม','มีประเทศสมาชิกเข้าร่วมมากเกินไปจนหาข้อตกลงร่วมกันไม่ได้','ตั้งสำนักงานใหญ่อยู่ในทวีปที่ห่างไกลจากพื้นที่ที่เกิดสงคราม','กำหนดให้ใช้ภาษาราชการหลายภาษาจนการประชุมล่าช้ามาก'],0,'สหประชาชาติจึงตั้งคณะมนตรีความมั่นคงและกลไกรักษาสันติภาพขึ้นมาแทน'],
['h_world',3,'สงครามเย็นเป็นความขัดแย้งระหว่างสองขั้วอำนาจใด',['สหรัฐอเมริกากับสหภาพโซเวียต','สหราชอาณาจักรกับฝรั่งเศส','สาธารณรัฐประชาชนจีนกับญี่ปุ่น','เยอรมนีตะวันตกกับอิตาลี'],0,'เป็นการเผชิญหน้าทางอุดมการณ์ระหว่างเสรีประชาธิปไตยกับคอมมิวนิสต์'],
['h_world',3,'เหตุใดจึงเรียกว่า "สงครามเย็น"',['เพราะสองขั้วอำนาจไม่ได้ปะทะกันโดยตรง แต่แข่งขันกันทางอุดมการณ์ อาวุธ และสงครามตัวแทน','เพราะการเผชิญหน้าส่วนใหญ่เกิดขึ้นในบริเวณเขตขั้วโลกที่มีอากาศหนาวเย็น','เพราะทั้งสองฝ่ายตกลงกันว่าจะสู้รบเฉพาะในช่วงฤดูหนาวของแต่ละปีเท่านั้น','เพราะมีการพัฒนาอาวุธชนิดใหม่ที่ทำให้เกิดความเย็นจัดในพื้นที่เป้าหมาย'],0,'ไม่มีการทำสงครามเต็มรูปแบบระหว่างกัน แต่ขัดแย้งกันผ่านตัวแทนและการแข่งขันสะสมอาวุธ'],
['h_world',3,'การล่มสลายของกำแพงเบอร์ลินใน ค.ศ. 1989 มีความหมายอย่างไร',['เป็นสัญญาณของการสิ้นสุดสงครามเย็นและนำไปสู่การรวมเยอรมนี','เป็นจุดเริ่มต้นของสงครามโลกครั้งที่ 2 ที่ขยายไปทั่วทวีปยุโรป','ทำให้ประเทศเยอรมนีถูกแบ่งแยกออกเป็นสองประเทศอย่างถาวร','ทำให้สหภาพโซเวียตขยายอิทธิพลเข้าไปในยุโรปตะวันตกได้มากขึ้น'],0,'กำแพงเบอร์ลินเป็นสัญลักษณ์ของการแบ่งแยก การพังทลายจึงหมายถึงการสิ้นสุดยุคนั้น'],
['h_world',3,'ปฏิญญาสากลว่าด้วยสิทธิมนุษยชนประกาศใช้โดยองค์การใด',['สหประชาชาติ','องค์การนาโต','สหภาพยุโรป','องค์การการค้าโลก'],0,'สหประชาชาติประกาศใช้เมื่อ ค.ศ. 1948 หลังบทเรียนจากสงครามโลกครั้งที่ 2'],
['h_world',3,'ข้อใดเป็นความพยายามขจัดความขัดแย้งด้วยความร่วมมือทางเศรษฐกิจ',['การรวมกลุ่มเป็นสหภาพยุโรปเพื่อสร้างผลประโยชน์ร่วมกันจนไม่คุ้มที่จะทำสงคราม','การเร่งแข่งขันสะสมอาวุธนิวเคลียร์เพื่อสร้างความหวาดกลัวให้อีกฝ่าย','การตั้งกำแพงภาษีสินค้านำเข้าให้สูงที่สุดเพื่อปกป้องผู้ผลิตในประเทศ','การปิดพรมแดนไม่ให้ประชาชนของแต่ละประเทศติดต่อไปมาหาสู่กัน'],0,'แนวคิดคือเมื่อเศรษฐกิจพึ่งพากันแล้ว ต้นทุนของสงครามจะสูงเกินกว่าจะทำ'],
['h_world',3,'ผลกระทบสำคัญของสงครามโลกครั้งที่ 2 ต่อดินแดนอาณานิคมคือข้อใด',['เจ้าอาณานิคมอ่อนแอลง ทำให้เกิดกระแสเรียกร้องเอกราชและได้รับเอกราชจำนวนมาก','ดินแดนอาณานิคมถูกปกครองต่อไปอีกยาวนานกว่าเดิมหลายสิบปี','ดินแดนอาณานิคมทั้งหมดถูกโอนไปอยู่ในความดูแลของสหรัฐอเมริกา','ดินแดนอาณานิคมไม่ได้รับผลกระทบใดเพราะอยู่ห่างจากสมรภูมิรบ'],0,'ยุโรปบอบช้ำจากสงครามจนไม่สามารถรักษาอาณานิคมไว้ได้'],
['h_world',3,'การใช้ระเบิดปรมาณูที่เมืองฮิโรชิมาและนางาซากิส่งผลอย่างไร',['ทำให้ญี่ปุ่นยอมแพ้และสงครามโลกครั้งที่ 2 ยุติ พร้อมเปิดยุคของอาวุธนิวเคลียร์','ทำให้สงครามในภูมิภาคเอเชียแปซิฟิกยืดเยื้อออกไปอีกหลายปีกว่าจะจบ','ทำให้ประเทศเยอรมนีตัดสินใจยอมแพ้ต่อฝ่ายสัมพันธมิตรในเวลาต่อมา','ไม่มีผลต่อการยุติสงครามเพราะญี่ปุ่นเตรียมยอมแพ้อยู่แล้วก่อนหน้านั้น'],0,'เป็นจุดสิ้นสุดของสงครามและเป็นจุดเริ่มต้นของความหวาดกลัวสงครามนิวเคลียร์'],
['h_world',3,'ข้อใดเป็นสาเหตุสำคัญของความขัดแย้งในโลกปัจจุบัน',['ความแตกต่างทางเชื้อชาติ ศาสนา การแย่งชิงทรัพยากร และความเหลื่อมล้ำทางเศรษฐกิจ','การมีองค์การระหว่างประเทศจำนวนมากเกินไปจนการตัดสินใจเกิดความซ้ำซ้อน','การเดินทางระหว่างประเทศที่สะดวกขึ้นทำให้ผู้คนย้ายถิ่นฐานกันมากขึ้น','การใช้ภาษาอังกฤษเป็นภาษากลางทำให้ภาษาประจำชาติถูกลดความสำคัญ'],0,'ความขัดแย้งสมัยใหม่มักมีรากจากอัตลักษณ์ ทรัพยากร และความเหลื่อมล้ำ'],
['h_world',4,'ข้อใดอธิบายบทเรียนสำคัญที่สุดจากสงครามโลกทั้งสองครั้ง',['ลัทธิชาตินิยมสุดโต่งและการแข่งขันสะสมอาวุธนำไปสู่หายนะ จึงต้องมีกลไกความร่วมมือระหว่างประเทศ','ประเทศที่สะสมกำลังอาวุธไว้มากที่สุดย่อมเป็นฝ่ายได้รับชัยชนะในสงครามเสมอ','การทำสงครามเป็นวิธีการยุติความขัดแย้งระหว่างประเทศที่ได้ผลเร็วที่สุด','การเจรจาต่อรองระหว่างประเทศไม่เกิดประโยชน์เพราะไม่มีผลผูกพันทางกฎหมาย'],0,'บทเรียนนี้นำไปสู่การตั้งสหประชาชาติและระบบความร่วมมือระหว่างประเทศ'],
['h_world',4,'การรวมกลุ่มระหว่างประเทศในปัจจุบันมีข้อจำกัดอย่างไร',['สมาชิกแต่ละประเทศยังคำนึงถึงผลประโยชน์ของชาติตนก่อน ทำให้การตัดสินใจร่วมกันทำได้ยาก','การรวมกลุ่มระหว่างประเทศในปัจจุบันดำเนินไปได้ราบรื่นโดยไม่มีข้อจำกัดใดเลย','ประเทศที่เข้าร่วมกลุ่มจะสูญเสียเอกราชและอำนาจอธิปไตยของตนไปทันที','การรวมกลุ่มมักนำไปสู่การเกิดสงครามระหว่างประเทศสมาชิกด้วยกันเอง'],0,'อธิปไตยของรัฐกับเป้าหมายร่วมของกลุ่มมักขัดกันในทางปฏิบัติ'],
['h_world',4,'ข้อใดคือลักษณะร่วมของการเปลี่ยนแปลงในคริสต์ศตวรรษที่ 20',['โลกเชื่อมโยงกันมากขึ้นทั้งด้านเศรษฐกิจและเทคโนโลยี พร้อมกับเกิดความขัดแย้งในระดับที่รุนแรงกว่าเดิม','ประเทศต่างๆ แยกตัวออกจากกันมากขึ้นเรื่อยๆ จนแทบไม่มีการติดต่อค้าขายระหว่างกัน','ไม่ปรากฏการเปลี่ยนแปลงทางเทคโนโลยีที่สำคัญเลยตลอดช่วงเวลาหนึ่งร้อยปี','ทุกประเทศทั่วโลกหันมาปกครองด้วยระบอบเดียวกันจนไม่มีความขัดแย้งอีก'],0,'ศตวรรษที่ 20 เป็นทั้งยุคของความเชื่อมโยงและยุคของสงครามที่รุนแรงที่สุด'],
['h_world',3,'องค์การนาโตก่อตั้งขึ้นด้วยวัตถุประสงค์ใดในช่วงสงครามเย็น',['เป็นพันธมิตรทางทหารของชาติตะวันตกเพื่อถ่วงดุลอำนาจฝ่ายคอมมิวนิสต์','เพื่อส่งเสริมการค้าเสรีระหว่างประเทศสมาชิกและลดกำแพงภาษีระหว่างกัน','เพื่อทำหน้าที่ดูแลและตรวจสอบสถานการณ์สิทธิมนุษยชนทั่วโลกอย่างเป็นกลาง','เพื่อจัดการแข่งขันกีฬาระหว่างประเทศสมาชิกและสร้างมิตรภาพระหว่างชาติ'],0,'นาโตเป็นองค์การความมั่นคงร่วมของชาติตะวันตกที่ตั้งขึ้นใน ค.ศ. 1949'],

/* ---------- พัฒนาการไทยสมัยรัตนโกสินทร์ · ส 4.3 ม.3/1-2, ม.3/4 (26 ข้อ) ---------- */
['h_kingdom',2,'เหตุผลสำคัญที่รัชกาลที่ 1 ทรงย้ายราชธานีมาฝั่งตะวันออกของแม่น้ำเจ้าพระยาคือข้อใด',['มีพื้นที่ขยายเมืองได้กว้างกว่า และมีแม่น้ำเป็นแนวป้องกันด้านที่ข้าศึกมักยกมา','เพราะบริเวณฝั่งธนบุรีขาดแคลนแหล่งน้ำจืดสำหรับใช้อุปโภคบริโภค','เพราะฝั่งตะวันออกมีเทือกเขาล้อมรอบจึงใช้เป็นปราการธรรมชาติได้','เพราะต้องการย้ายราชธานีให้อยู่ใกล้ชายแดนพม่าเพื่อสะดวกในการรบ'],0,'ฝั่งตะวันออกเป็นแผ่นดินกว้างและมีแม่น้ำคั่นด้านตะวันตกซึ่งเป็นทิศที่พม่ายกทัพเข้ามา'],
['h_kingdom',2,'กฎหมายตราสามดวงชำระขึ้นด้วยวัตถุประสงค์ใด',['รวบรวมและชำระกฎหมายเก่าที่คลาดเคลื่อนให้เป็นระบบและยุติธรรมยิ่งขึ้น','ยกเลิกกฎหมายไทยที่ใช้มาแต่เดิมทั้งหมดแล้วนำกฎหมายอังกฤษมาใช้แทน','จัดทำกฎหมายฉบับใหม่สำหรับใช้บังคับกับชาวต่างชาติในราชอาณาจักร','กำหนดอัตราภาษีสินค้าออกและสินค้าเข้าให้เป็นมาตรฐานเดียวกัน'],0,'รัชกาลที่ 1 โปรดให้ชำระกฎหมายเก่าที่ตัดสินคดีไม่เป็นธรรมให้ถูกต้องแล้วประทับตราสามดวง'],
['h_kingdom',2,'สนธิสัญญาเบาว์ริงมีผลต่อระบบเศรษฐกิจไทยอย่างไร',['ยกเลิกการผูกขาดของพระคลังสินค้า เปิดการค้าเสรี และจำกัดภาษีขาเข้าไว้ในอัตราต่ำ','ทำให้ไทยยุติการค้าขายกับต่างประเทศแล้วหันมาพึ่งพาตนเองเป็นหลัก','ทำให้ไทยกลายเป็นผู้ผูกขาดการค้าข้าวรายใหญ่ที่สุดของตลาดโลก','ทำให้ไทยต้องเปลี่ยนไปใช้เงินปอนด์สเตอร์ลิงแทนเงินบาทในการค้า'],0,'การค้าเสรีทำให้ข้าวกลายเป็นสินค้าออกหลัก แต่รัฐก็สูญเสียรายได้จากการผูกขาด'],
['h_kingdom',3,'"สิทธิสภาพนอกอาณาเขต" ในสนธิสัญญาที่ไทยทำกับชาติตะวันตกหมายถึงอะไร',['คนในบังคับของชาติตะวันตกไม่ต้องขึ้นศาลไทย แต่ขึ้นศาลกงสุลของชาติตน','ชาติตะวันตกมีสิทธิเข้ายึดครองและปกครองดินแดนบางส่วนของไทยได้','ไทยมีสิทธิจัดเก็บภาษีจากพ่อค้าชาติตะวันตกได้เต็มที่ตามที่ต้องการ','ไทยสามารถส่งข้าราชการไปปกครองดินแดนของชาติตะวันตกบางแห่งได้'],0,'เป็นข้อเสียเปรียบที่กระทบอำนาจอธิปไตยทางศาล และไทยใช้เวลาหลายสิบปีกว่าจะแก้ไขได้'],
['h_kingdom',3,'การปฏิรูปการปกครอง พ.ศ. 2435 ในรัชกาลที่ 5 มีสาระสำคัญคือข้อใด',['ยกเลิกจตุสดมภ์แบบเดิมแล้วจัดตั้งกระทรวงตามหน้าที่ พร้อมรวมหัวเมืองเป็นมณฑลเทศาภิบาล','ยกเลิกระบอบสมบูรณาญาสิทธิราชย์แล้วเปลี่ยนมาใช้ระบอบประชาธิปไตยแบบรัฐสภา','จัดให้มีการเลือกตั้งผู้แทนราษฎรทั่วประเทศเป็นครั้งแรกในประวัติศาสตร์สยาม','ย้ายเมืองหลวงจากกรุงเทพมหานครขึ้นไปยังเมืองเชียงใหม่ทางภาคเหนือของประเทศ'],0,'เป็นการเปลี่ยนจากการปกครองแบบจารีตมาเป็นระบบราชการสมัยใหม่ที่รวมศูนย์'],
['h_kingdom',3,'ระบบมณฑลเทศาภิบาลส่งผลต่อความมั่นคงของไทยอย่างไร',['ทำให้ส่วนกลางควบคุมหัวเมืองได้โดยตรง ลดโอกาสที่ชาติตะวันตกจะอ้างเหตุแทรกแซงหัวเมืองชายแดน','ทำให้หัวเมืองต่างๆ มีอิสระในการปกครองตนเองมากขึ้นจนแทบไม่ขึ้นกับส่วนกลาง','ทำให้เกิดการเคลื่อนไหวแยกดินแดนออกจากราชอาณาจักรไทยในหลายพื้นที่','ทำให้ไทยต้องยกดินแดนหัวเมืองชายแดนทั้งหมดให้แก่ฝรั่งเศสในเวลาต่อมา'],0,'การรวมศูนย์ทำให้รัฐไทยมีลักษณะเป็นรัฐชาติสมัยใหม่และลดช่องว่างให้มหาอำนาจแทรกแซง'],
['h_kingdom',3,'การเลิกทาสในรัชกาลที่ 5 ใช้วิธีการใดจึงสำเร็จโดยไม่เกิดความรุนแรง',['ทยอยลดค่าตัวทาสลงตามอายุอย่างค่อยเป็นค่อยไปจนหมดไปในที่สุด','ประกาศยกเลิกระบบทาสทั้งหมดให้มีผลบังคับทันทีภายในวันเดียว','ส่งกำลังทหารเข้าบังคับให้เจ้าของทาสปล่อยทาสในความครอบครอง','ใช้เงินหลวงซื้อทาสทั้งหมดคืนจากเจ้าของทาสในคราวเดียวพร้อมกัน'],0,'ทรงใช้วิธีค่อยเป็นค่อยไปกว่า 30 ปี จึงไม่กระทบเจ้าของทาสจนเกิดความวุ่นวาย'],
['h_kingdom',3,'การเลิกไพร่และเลิกทาสส่งผลทางเศรษฐกิจอย่างไร',['เกิดแรงงานเสรีที่เคลื่อนย้ายไปทำงานได้ตามความต้องการของตลาด','ทำให้ขาดแคลนแรงงานจนไม่มีผู้ทำงานในภาคการผลิตของประเทศ','ทำให้รัฐสูญเสียรายได้จากการจัดเก็บภาษีทุกประเภทไปทั้งหมด','ทำให้ต้องนำเข้าแรงงานจากทวีปยุโรปมาทดแทนแรงงานที่หายไป'],0,'แรงงานเสรีเป็นเงื่อนไขสำคัญของเศรษฐกิจแบบตลาดที่ขยายตัวหลังสนธิสัญญาเบาว์ริง'],
['h_kingdom',3,'วิกฤตการณ์ ร.ศ. 112 เกิดขึ้นกับชาติใด และส่งผลอย่างไร',['ฝรั่งเศส ทำให้ไทยต้องยกดินแดนฝั่งซ้ายแม่น้ำโขงและเสียค่าปรับ','อังกฤษ ทำให้ไทยต้องยกหัวเมืองมลายูทางภาคใต้ให้ไปในที่สุด','ฮอลันดา ทำให้ไทยต้องเสียเมืองท่าสำคัญทางภาคใต้ไปหลายเมือง','โปรตุเกส ทำให้ไทยต้องเสียเมืองชายฝั่งทะเลตะวันออกไปทั้งหมด'],0,'ฝรั่งเศสส่งเรือรบเข้ามาปิดปากแม่น้ำเจ้าพระยาใน พ.ศ. 2436'],
['h_kingdom',3,'ปัจจัยใดที่ทำให้ไทยรักษาเอกราชไว้ได้ในยุคจักรวรรดินิยม',['การปฏิรูปประเทศให้ทันสมัย การทูตที่ยืดหยุ่น และการเป็นรัฐกันชนระหว่างอังกฤษกับฝรั่งเศส','การมีกองทัพที่มีกำลังพลและอาวุธเข้มแข็งที่สุดในภูมิภาคเอเชียในเวลานั้น','การปิดประเทศไม่ยอมติดต่อค้าขายหรือทำสนธิสัญญากับชาติตะวันตกใดเลย','การที่ดินแดนไทยไม่มีทรัพยากรธรรมชาติที่ชาติตะวันตกต้องการแม้แต่อย่างเดียว'],0,'ทั้งการปรับตัวภายในและตำแหน่งที่เป็นรัฐกันชนล้วนมีส่วนรักษาเอกราชไว้'],
['h_kingdom',3,'นโยบายชาตินิยมในรัชกาลที่ 6 ปรากฏชัดเจนในเรื่องใด',['การใช้ธงไตรรงค์ การตั้งนามสกุล และการปลูกฝังแนวคิดชาติ ศาสนา พระมหากษัตริย์','การยกเลิกระบอบสมบูรณาญาสิทธิราชย์แล้วประกาศใช้รัฐธรรมนูญฉบับแรก','การประกาศเลิกทาสและเลิกระบบไพร่เพื่อให้ราษฎรมีสิทธิเสมอภาคกัน','การลงนามในสนธิสัญญาเบาว์ริงเพื่อเปิดการค้าเสรีกับชาติตะวันตก'],0,'พระองค์ทรงสร้างสำนึกความเป็นชาติผ่านสัญลักษณ์และสถาบันทางสังคมแบบใหม่'],
['h_kingdom',3,'การที่ไทยเข้าร่วมสงครามโลกครั้งที่ 1 กับฝ่ายสัมพันธมิตรส่งผลดีอย่างไร',['ทำให้ไทยมีสถานะเป็นผู้ชนะและใช้โอกาสนั้นเจรจาแก้ไขสนธิสัญญาที่ไม่เป็นธรรม','ทำให้ไทยได้รับดินแดนบางส่วนในทวีปยุโรปเป็นค่าปฏิกรรมสงคราม','ทำให้ไทยก้าวขึ้นเป็นชาติมหาอำนาจที่มีอิทธิพลในเวทีโลกทันที','ทำให้ไทยได้รับการยกเว้นไม่ต้องเสียภาษีการค้าให้ชาติใดอีกต่อไป'],0,'สถานะผู้ชนะเปิดทางให้ไทยทยอยยกเลิกสิทธิสภาพนอกอาณาเขตได้ในเวลาต่อมา'],
['h_kingdom',2,'การเปลี่ยนแปลงการปกครองของไทยเกิดขึ้นเมื่อวันที่เท่าใด',['24 มิถุนายน พ.ศ. 2475','10 ธันวาคม พ.ศ. 2475','5 ธันวาคม พ.ศ. 2475','14 ตุลาคม พ.ศ. 2516'],0,'คณะราษฎรเปลี่ยนแปลงการปกครองเมื่อ 24 มิถุนายน 2475 ส่วน 10 ธันวาคมคือวันประกาศใช้รัฐธรรมนูญ'],
['h_kingdom',3,'ปัจจัยใดที่นำไปสู่การเปลี่ยนแปลงการปกครอง พ.ศ. 2475',['ภาวะเศรษฐกิจตกต่ำ ความไม่พอใจของข้าราชการ และการรับแนวคิดประชาธิปไตยจากผู้ที่ไปศึกษาต่างประเทศ','การรุกรานของชาติตะวันตกที่เข้ามากดดันให้สยามต้องเปลี่ยนรูปแบบการปกครองโดยเร็ว','ภัยธรรมชาติครั้งใหญ่ที่สร้างความเสียหายจนราษฎรลุกขึ้นเรียกร้องการเปลี่ยนแปลง','การขาดแคลนอาหารทั่วประเทศจนประชาชนอดอยากและก่อการจลาจลขึ้นในหลายพื้นที่'],0,'ปัจจัยทางเศรษฐกิจ สังคม และความคิดประกอบกันนำไปสู่การเปลี่ยนแปลง'],
['h_kingdom',3,'หลักหกประการของคณะราษฎรไม่รวมข้อใด',['การคืนอำนาจให้พระมหากษัตริย์ปกครองโดยสมบูรณ์','การรักษาเอกราชของชาติในทุกทางให้มั่นคง','การรักษาความปลอดภัยในประเทศให้แก่ราษฎร','การให้การศึกษาอย่างเต็มที่แก่ราษฎรทุกคน'],0,'หลักหกประการเน้นเอกราช ความปลอดภัย เศรษฐกิจ ความเสมอภาค เสรีภาพ และการศึกษา'],
['h_kingdom',3,'ประเทศไทยเปลี่ยนชื่อจาก "สยาม" มาเป็น "ไทย" ในปีใด',['พ.ศ. 2482','พ.ศ. 2475','พ.ศ. 2500','พ.ศ. 2516'],0,'เปลี่ยนชื่อประเทศเมื่อ พ.ศ. 2482 ในสมัยรัฐบาลจอมพล ป. พิบูลสงคราม'],
['h_kingdom',3,'ขบวนการเสรีไทยมีบทบาทอย่างไรในช่วงสงครามโลกครั้งที่ 2',['ต่อต้านญี่ปุ่นอย่างลับๆ และช่วยให้ไทยไม่ตกเป็นประเทศผู้แพ้สงคราม','ให้การสนับสนุนกองทัพญี่ปุ่นอย่างเปิดเผยตลอดช่วงสงคราม','เจรจาเพื่อให้ไทยเข้าร่วมเป็นสมาชิกของฝ่ายอักษะอย่างเป็นทางการ','จัดตั้งรัฐบาลพลัดถิ่นในต่างประเทศเพื่อกลับมายึดอำนาจในภายหลัง'],0,'บทบาทของเสรีไทยทำให้ฝ่ายสัมพันธมิตรยอมรับว่าไทยไม่ใช่ประเทศผู้แพ้'],
['h_kingdom',3,'ประเทศไทยเข้าเป็นสมาชิกองค์การสหประชาชาติในปีใด',['พ.ศ. 2489','พ.ศ. 2475','พ.ศ. 2510','พ.ศ. 2540'],0,'ไทยเข้าเป็นสมาชิกสหประชาชาติเมื่อ พ.ศ. 2489 หลังสงครามโลกครั้งที่ 2'],
['h_kingdom',3,'แผนพัฒนาเศรษฐกิจแห่งชาติฉบับที่ 1 ของไทยเริ่มใช้ในปีใด',['พ.ศ. 2504','พ.ศ. 2475','พ.ศ. 2540','พ.ศ. 2520'],0,'เริ่มใช้เมื่อ พ.ศ. 2504 โดยเน้นการสร้างโครงสร้างพื้นฐานและการเติบโตทางเศรษฐกิจ'],
['h_kingdom',3,'วิกฤตเศรษฐกิจ พ.ศ. 2540 ของไทยมีสาเหตุสำคัญจากข้อใด',['การก่อหนี้ต่างประเทศจำนวนมาก การเก็งกำไร และการตรึงค่าเงินบาทไว้กับดอลลาร์จนไม่สอดคล้องกับความเป็นจริง','ภัยธรรมชาติครั้งใหญ่ที่สร้างความเสียหายแก่ภาคเกษตรและอุตสาหกรรมทั่วประเทศติดต่อกันหลายปี','การเกิดสงครามกับประเทศเพื่อนบ้านจนต้องใช้งบประมาณด้านการทหารเป็นจำนวนมหาศาล','การขาดแคลนแรงงานอย่างรุนแรงจนโรงงานอุตสาหกรรมต้องปิดกิจการลงเป็นจำนวนมาก'],0,'เมื่อประกาศลอยตัวค่าเงินบาท ภาระหนี้ต่างประเทศจึงพุ่งสูงจนเกิดวิกฤต'],
['h_kingdom',3,'บทบาทของไทยในเวทีระหว่างประเทศที่สำคัญที่สุดในภูมิภาคคือข้อใด',['เป็นหนึ่งในห้าประเทศผู้ร่วมก่อตั้งอาเซียนเมื่อ พ.ศ. 2510','เป็นสมาชิกถาวรของคณะมนตรีความมั่นคงแห่งสหประชาชาติ','เป็นผู้ก่อตั้งองค์การนาโต','เป็นสมาชิกสหภาพยุโรป'],0,'ปฏิญญากรุงเทพลงนามที่ประเทศไทย และไทยเป็นหนึ่งในห้าผู้ก่อตั้ง'],
['h_kingdom',3,'หลักปรัชญาของเศรษฐกิจพอเพียงเน้นแนวคิดใด',['ความพอประมาณ ความมีเหตุผล และการมีภูมิคุ้มกันที่ดีในตัว','การเร่งผลิตสินค้าเพื่อการส่งออกให้ได้มากที่สุดเท่าที่จะทำได้','การประหยัดอย่างเคร่งครัดโดยไม่ใช้จ่ายเงินในเรื่องใดเลย','การพึ่งพาเงินกู้จากต่างประเทศมาลงทุนเพื่อเร่งการเติบโต'],0,'สามห่วงคือพอประมาณ มีเหตุผล มีภูมิคุ้มกัน ภายใต้เงื่อนไขความรู้และคุณธรรม'],
['h_kingdom',4,'ข้อใดวิเคราะห์พัฒนาการของไทยสมัยรัตนโกสินทร์ได้ครอบคลุมที่สุด',['ไทยเปลี่ยนจากรัฐจารีตที่ฟื้นฟูแบบอยุธยา สู่การปฏิรูปให้เป็นรัฐสมัยใหม่เพื่อรับมือจักรวรรดินิยม แล้วเข้าสู่ระบอบประชาธิปไตยและเศรษฐกิจแบบเปิด','ไทยคงรูปแบบการปกครอง โครงสร้างสังคม และระบบเศรษฐกิจแบบเดิมไว้โดยไม่มีการเปลี่ยนแปลงที่สำคัญเลยตลอดระยะเวลากว่าสองร้อยปีของสมัยรัตนโกสินทร์','ไทยตกเป็นอาณานิคมของชาติตะวันตกอยู่ระยะหนึ่งในช่วงกลางสมัย แล้วจึงรวมกำลังต่อสู้เรียกร้องจนได้รับเอกราชคืนมาอีกครั้งในเวลาต่อมา','ไทยมีการย้ายราชธานีหลายครั้งตลอดสมัยรัตนโกสินทร์ตามสถานการณ์สงครามและภัยคุกคามจากภายนอกที่ผลัดเปลี่ยนกันเข้ามาในแต่ละรัชกาล'],0,'เส้นทางหลักคือฟื้นฟู ปรับตัว ปฏิรูป และเปลี่ยนผ่านสู่ประชาธิปไตยกับเศรษฐกิจสมัยใหม่'],
['h_kingdom',4,'การปฏิรูปในรัชกาลที่ 5 มีทั้งผลดีและผลที่ตามมาอย่างไร',['สร้างรัฐสมัยใหม่ที่มั่นคง แต่การรวมศูนย์ก็ลดอำนาจท้องถิ่นและสร้างข้าราชการกลุ่มใหม่ที่ต่อมามีบทบาททางการเมือง','การปฏิรูปครั้งนั้นเป็นเพียงการเปลี่ยนชื่อหน่วยงานจึงไม่มีผลใดต่อโครงสร้างสังคมและการเมืองไทย','การปฏิรูปทำให้ชาติตะวันตกไม่พอใจจนกดดันหนักขึ้นและไทยต้องเสียเอกราชในที่สุด','การปฏิรูปทำให้ต้องใช้งบประมาณมหาศาลจนเศรษฐกิจของประเทศถดถอยลงอย่างรุนแรง'],0,'ข้าราชการและทหารที่เกิดจากการปฏิรูปคือกลุ่มที่ก่อการเปลี่ยนแปลงการปกครองใน พ.ศ. 2475'],
['h_kingdom',4,'ปัจจัยใดที่ส่งผลต่อความมั่นคงของไทยในสมัยรัตนโกสินทร์มากที่สุด',['ความสามารถในการปรับตัวต่อแรงกดดันจากภายนอกควบคู่กับการรักษาเอกภาพภายใน','การมีทรัพยากรธรรมชาติอุดมสมบูรณ์มากที่สุดในภูมิภาคเอเชียตะวันออกเฉียงใต้','การมีจำนวนประชากรมากที่สุดในทวีปเอเชียจนมีกำลังคนเหนือกว่าชาติอื่น','การดำเนินนโยบายไม่ติดต่อสัมพันธ์กับต่างประเทศใดเลยเพื่อหลีกเลี่ยงความขัดแย้ง'],0,'จุดร่วมของทุกรัชกาลที่ผ่านวิกฤตมาได้คือการปรับตัวและรักษาเอกภาพภายใน'],
['h_kingdom',4,'ข้อใดคือความท้าทายของสังคมไทยในระบอบประชาธิปไตยตั้งแต่ พ.ศ. 2475 เป็นต้นมา',['ความไม่ต่อเนื่องของระบอบและการแสวงหาดุลยภาพระหว่างสถาบันทางการเมืองต่างๆ','การขาดแคลนประชากรวัยทำงานจนไม่มีผู้เข้ามารับผิดชอบงานบริหารบ้านเมือง','การที่ประเทศไม่เคยมีรัฐธรรมนูญใช้บังคับเลยตลอดช่วงเวลาที่ผ่านมา','การที่ประเทศไม่เคยจัดให้มีการเลือกตั้งผู้แทนราษฎรขึ้นเลยแม้แต่ครั้งเดียว'],0,'ไทยมีรัฐธรรมนูญหลายฉบับและมีการเปลี่ยนแปลงทางการเมืองหลายครั้ง สะท้อนการแสวงหาดุลยภาพที่ยังดำเนินอยู่'],

['h_person',2,'พระมหากษัตริย์พระองค์ใดทรงได้รับการยกย่องเป็นพระบิดาแห่งวิทยาศาสตร์ไทย และเพราะเหตุใด',['รัชกาลที่ 4 เพราะทรงคำนวณการเกิดสุริยุปราคาที่ตำบลหว้ากอได้อย่างแม่นยำ','รัชกาลที่ 5 เพราะทรงตั้งโรงเรียนแพทย์แห่งแรกและโรงพยาบาลสมัยใหม่','รัชกาลที่ 6 เพราะทรงตั้งมหาวิทยาลัยแห่งแรกที่มีการสอนวิชาวิทยาศาสตร์','รัชกาลที่ 9 เพราะทรงคิดค้นโครงการฝนหลวงเพื่อแก้ปัญหาภัยแล้งให้เกษตรกร'],0,'ทรงคำนวณล่วงหน้าได้แม่นยำกว่านักดาราศาสตร์ตะวันตกที่มาร่วมสังเกตการณ์'],
['h_person',2,'พระราชกรณียกิจใดของรัชกาลที่ 3 ที่ช่วยประเทศในยามวิกฤตในเวลาต่อมา',['การเก็บรายได้จากการค้าสำเภาไว้เป็นเงินถุงแดง','การส่งคณะราชทูตไปเจริญสัมพันธไมตรีกับฝรั่งเศส','การประกาศเลิกทาสให้ราษฎรเป็นอิสระอย่างค่อยเป็นค่อยไป','การจัดตั้งกรมไปรษณีย์โทรเลขเพื่อพัฒนาการสื่อสารของประเทศ'],0,'เงินถุงแดงถูกนำมาใช้ในการชดใช้ค่าเสียหายช่วงวิกฤต ร.ศ. 112'],
['h_person',2,'สมเด็จฯ กรมพระยาดำรงราชานุภาพทรงมีบทบาทสำคัญด้านใด',['การวางรากฐานการปกครองแบบมณฑลเทศาภิบาลและการศึกษาประวัติศาสตร์ไทย','การปฏิรูปกองทัพเรือให้ทันสมัยตามแบบอย่างของชาติตะวันตก','การก่อตั้งธนาคารพาณิชย์แห่งแรกของประเทศไทยและระบบการเงิน','การประดิษฐ์รูปแบบตัวอักษรไทยแบบใหม่ที่ใช้ในการพิมพ์หนังสือ'],0,'ทรงเป็นเสนาบดีกระทรวงมหาดไทยและได้รับยกย่องเป็นพระบิดาแห่งประวัติศาสตร์ไทย'],
['h_person',2,'สมเด็จฯ เจ้าฟ้ากรมพระยานริศรานุวัดติวงศ์ทรงได้รับการยกย่องในฐานะใด',['นายช่างใหญ่แห่งกรุงสยาม','พระบิดาแห่งการแพทย์แผนปัจจุบัน','พระบิดาแห่งกฎหมายไทย','พระบิดาแห่งการสหกรณ์'],0,'ทรงออกแบบงานสถาปัตยกรรมและศิลปกรรมสำคัญ เช่น พระอุโบสถวัดเบญจมบพิตร'],
['h_person',2,'พระเจ้าบรมวงศ์เธอ กรมหลวงราชบุรีดิเรกฤทธิ์ ทรงได้รับการยกย่องเป็นพระบิดาแห่งวงการใด',['กฎหมายไทย','การแพทย์ไทย','การศึกษาไทย','การสหกรณ์ไทย'],0,'ทรงวางรากฐานระบบกฎหมายและการศาลสมัยใหม่ของไทย'],
['h_person',2,'สมเด็จพระมหิตลาธิเบศร อดุลยเดชวิกรม พระบรมราชชนก ทรงวางรากฐานด้านใด',['การแพทย์และการสาธารณสุขสมัยใหม่ของไทย','การเกษตรแผนใหม่และการชลประทานทั่วประเทศ','การทหารเรือและการป้องกันน่านน้ำของราชอาณาจักร','การไปรษณีย์โทรเลขและระบบสื่อสารระหว่างหัวเมือง'],0,'ทรงได้รับการถวายพระสมัญญาว่าพระบิดาแห่งการแพทย์แผนปัจจุบันของไทย'],
['h_person',3,'สมเด็จพระศรีนครินทราบรมราชชนนีทรงมีพระราชกรณียกิจโดดเด่นด้านใด',['การจัดตั้งหน่วยแพทย์อาสาเพื่อรักษาประชาชนในถิ่นทุรกันดาร','การปฏิรูประบบการจัดเก็บภาษีอากรให้เป็นธรรมแก่ราษฎร','การเจรจาข้อตกลงทางการค้าระหว่างประเทศกับชาติมหาอำนาจ','การก่อตั้งกองทัพอากาศและพัฒนากิจการการบินของประเทศ'],0,'ทรงก่อตั้งหน่วยแพทย์อาสาสมเด็จพระศรีนครินทราบรมราชชนนี หรือ พอ.สว.'],
['h_person',3,'สุนทรภู่ได้รับการยกย่องจากยูเนสโกในฐานะใด',['บุคคลสำคัญของโลกด้านวรรณกรรม','นักวิทยาศาสตร์ดีเด่นของโลก','นักการทูตดีเด่น','ศิลปินด้านดนตรีของโลก'],0,'ยูเนสโกยกย่องสุนทรภู่เป็นบุคคลสำคัญของโลกด้านวรรณกรรมเมื่อ พ.ศ. 2529'],
['h_person',3,'ศาสตราจารย์ศิลป์ พีระศรี มีบทบาทสำคัญต่อวงการศิลปะไทยอย่างไร',['วางรากฐานศิลปะสมัยใหม่และก่อตั้งมหาวิทยาลัยศิลปากร','เขียนภาพจิตรกรรมฝาผนังในวัดสำคัญหลายแห่งทั่วประเทศ','ออกแบบธงไตรรงค์ที่ใช้เป็นธงชาติไทยมาจนถึงปัจจุบัน','ประพันธ์ทำนองเพลงชาติไทยที่ใช้บรรเลงอยู่ในทุกวันนี้'],0,'ท่านเป็นประติมากรชาวอิตาลีที่วางรากฐานการศึกษาศิลปะสมัยใหม่ของไทย'],
['h_person',3,'พระยารัษฎานุประดิษฐมหิศรภักดีมีผลงานสำคัญด้านใด',['การส่งเสริมการปลูกยางพาราและพัฒนาหัวเมืองภาคใต้','การปฏิรูปการศึกษาและจัดตั้งโรงเรียนหลวงในหัวเมือง','การจัดตั้งกรมรถไฟหลวงและวางเส้นทางรถไฟสายแรก','การเจรจาและลงนามในสนธิสัญญาเบาว์ริงกับอังกฤษ'],0,'ท่านนำยางพาราเข้ามาส่งเสริมในภาคใต้จนกลายเป็นพืชเศรษฐกิจสำคัญ'],
['h_person',3,'พระราชกรณียกิจของรัชกาลที่ 9 ในโครงการแกล้งดินมีเป้าหมายใด',['แก้ปัญหาดินเปรี้ยวจัดในพื้นที่พรุให้กลับมาเพาะปลูกได้','ป้องกันปัญหาน้ำท่วมขังในเขตเมืองช่วงฤดูฝนที่ผ่านมา','แก้ปัญหาน้ำเน่าเสียในคูคลองของกรุงเทพมหานคร','เพิ่มปริมาณน้ำฝนในพื้นที่เกษตรกรรมช่วงฤดูแล้ง'],0,'เป็นวิธีเร่งให้ดินเปรี้ยวถึงที่สุดแล้วปรับสภาพด้วยปูน ทำให้ปลูกพืชได้อีกครั้ง'],
['h_person',3,'"กังหันน้ำชัยพัฒนา" เป็นสิ่งประดิษฐ์ตามแนวพระราชดำริเพื่อแก้ปัญหาใด',['น้ำเสียโดยการเติมออกซิเจนลงในน้ำ','ภัยแล้งโดยการทำฝนเทียมในพื้นที่เกษตร','ดินเค็มในพื้นที่ชายทะเลที่เพาะปลูกไม่ได้','การกัดเซาะชายฝั่งทะเลที่รุนแรงขึ้นทุกปี'],0,'กังหันตีน้ำช่วยเพิ่มออกซิเจนให้จุลินทรีย์ย่อยสลายของเสียได้ดีขึ้น'],
['h_person',3,'ทฤษฎีใหม่ตามแนวพระราชดำริมีสาระสำคัญคือข้อใด',['การจัดสรรพื้นที่ทำกินเป็นสัดส่วนสำหรับแหล่งน้ำ นาข้าว พืชไร่พืชสวน และที่อยู่อาศัย','การส่งเสริมให้เกษตรกรปลูกพืชเชิงเดี่ยวชนิดเดียวกันทั้งหมู่บ้านเพื่อการส่งออก','การเลิกทำเกษตรกรรมแล้วเปลี่ยนไปประกอบอาชีพในภาคอุตสาหกรรมแทน','การขายที่ดินทำกินบางส่วนเพื่อนำเงินไปลงทุนในกิจการที่ให้ผลตอบแทนสูง'],0,'เป็นแนวทางให้เกษตรกรรายย่อยพึ่งตนเองได้และมีน้ำใช้ตลอดปี'],
['h_person',3,'ปรีดี พนมยงค์ มีบทบาทสำคัญในเหตุการณ์ใด',['เป็นผู้นำสายพลเรือนของคณะราษฎรและเป็นหัวหน้าขบวนการเสรีไทย','เป็นผู้นำในการสถาปนากรุงรัตนโกสินทร์เป็นราชธานีแห่งใหม่','เป็นหัวหน้าคณะราชทูตที่เดินทางไปฝรั่งเศสในสมัยอยุธยา','เป็นผู้ออกแบบและเสนอให้ใช้ธงไตรรงค์เป็นธงชาติของสยาม'],0,'ท่านมีบทบาททั้งในการเปลี่ยนแปลงการปกครองและการนำขบวนการเสรีไทย'],
['h_person',4,'ข้อใดคือลักษณะร่วมของบุคคลสำคัญสมัยรัตนโกสินทร์ที่ควรนำมาเป็นแบบอย่าง',['การมองเห็นปัญหาของยุคสมัยแล้วลงมือวางรากฐานแก้ไขอย่างเป็นระบบเพื่อส่วนรวม','การสะสมทรัพย์สินและไต่เต้าขึ้นสู่ตำแหน่งที่สูงขึ้นให้ได้มากที่สุดในชีวิต','การยึดถือแบบแผนเดิมที่บรรพบุรุษวางไว้โดยไม่เปลี่ยนแปลงสิ่งใดเลย','การเลือกรับเฉพาะงานที่ทำได้ง่ายและหลีกเลี่ยงงานที่ยากลำบาก'],0,'ผลงานของท่านเหล่านั้นล้วนเป็นการวางรากฐานระยะยาวเพื่อประโยชน์ส่วนรวม'],
['h_person',4,'เหตุใดการศึกษาผลงานของบุคคลสำคัญจึงต้องพิจารณาบริบทของยุคสมัยด้วย',['เพราะข้อจำกัดและทางเลือกของแต่ละยุคต่างกัน การประเมินโดยไม่ดูบริบทอาจไม่เป็นธรรม','เพราะการอธิบายบริบทประกอบจะทำให้ผลงานของบุคคลนั้นดูโดดเด่นขึ้นเสมอ','เพราะบริบทของยุคสมัยไม่มีผลต่อการตัดสินใจของบุคคลในประวัติศาสตร์','เพราะหลักสูตรกำหนดให้ต้องอธิบายบริบทประกอบทุกครั้งที่ศึกษาบุคคล'],0,'การตัดสินคนในอดีตต้องคำนึงถึงความรู้และเงื่อนไขที่เขามีในเวลานั้น'],

/* ---------- ภูมิปัญญาและวัฒนธรรม · ส 4.3 ม.3/3 (18 ข้อ) ---------- */
['h_culture',2,'วรรณคดีเรื่องใดเป็นพระราชนิพนธ์ในรัชกาลที่ 2 ที่ใช้เป็นบทละครใน',['อิเหนา','พระอภัยมณี','สามก๊ก','ลิลิตตะเลงพ่าย'],0,'บทละครเรื่องอิเหนาเป็นพระราชนิพนธ์ในรัชกาลที่ 2 ที่ได้รับการยกย่องด้านวรรณศิลป์'],
['h_culture',2,'ลิลิตตะเลงพ่ายเป็นผลงานของผู้ใด',['สมเด็จพระมหาสมณเจ้า กรมพระปรมานุชิตชิโนรส','พระสุนทรโวหาร หรือที่รู้จักกันในนามสุนทรภู่','เจ้าพระยาพระคลัง (หน) ผู้อำนวยการแปลสามก๊ก','พระโหราธิบดี ผู้แต่งแบบเรียนจินดามณี'],0,'ทรงนิพนธ์ลิลิตตะเลงพ่ายซึ่งกล่าวถึงสงครามยุทธหัตถีของสมเด็จพระนเรศวรมหาราช'],
['h_culture',2,'เหตุใดวัดพระเชตุพนวิมลมังคลารามจึงได้ชื่อว่าเป็นมหาวิทยาลัยแห่งแรกของไทย',['เพราะรัชกาลที่ 3 โปรดให้จารึกตำราความรู้แขนงต่างๆ ไว้ให้ประชาชนศึกษาได้โดยไม่จำกัดชนชั้น','เพราะเป็นสถานที่ตั้งของโรงเรียนหลวงแห่งแรกที่เปิดสอนให้แก่บุตรหลานข้าราชการ','เพราะเป็นวัดแห่งแรกที่มีการจัดการเรียนการสอนวิชาภาษาอังกฤษให้แก่คนไทย','เพราะเป็นที่ตั้งของหอสมุดที่รวบรวมหนังสือไว้มากที่สุดในสมัยรัตนโกสินทร์'],0,'ตำราการแพทย์ วรรณคดี โหราศาสตร์ และท่าฤๅษีดัดตน ถูกจารึกไว้ตามศาลารายและผนัง'],
['h_culture',2,'ศิลปะการแสดงใดของไทยที่ยูเนสโกขึ้นทะเบียนเป็นมรดกภูมิปัญญาทางวัฒนธรรมเมื่อ พ.ศ. 2561',['โขน','โนรา','ลิเก','ลำตัด'],0,'โขนได้รับการขึ้นทะเบียนเป็นรายการแรกของไทยในบัญชีนี้'],
['h_culture',2,'การแสดงพื้นบ้านของภาคใต้ที่ยูเนสโกขึ้นทะเบียนเป็นมรดกภูมิปัญญาทางวัฒนธรรมคือข้อใด',['โนรา','เซิ้งบั้งไฟ','ฟ้อนเล็บ','ระบำชาวเขา'],0,'โนราของภาคใต้ได้รับการขึ้นทะเบียนเมื่อ พ.ศ. 2564'],
['h_culture',2,'นวดไทยได้รับการขึ้นทะเบียนจากยูเนสโกในฐานะใด',['มรดกภูมิปัญญาทางวัฒนธรรมที่จับต้องไม่ได้','มรดกโลกทางวัฒนธรรมประเภทแหล่งอารยธรรม','มรดกความทรงจำแห่งโลกประเภทเอกสารโบราณ','มรดกโลกทางธรรมชาติประเภทภูมิปัญญาท้องถิ่น'],0,'นวดไทยขึ้นทะเบียนเมื่อ พ.ศ. 2562 ในบัญชีมรดกภูมิปัญญาทางวัฒนธรรม'],
['h_culture',2,'สถาปัตยกรรมใดในรัชกาลที่ 5 ที่สะท้อนการรับอิทธิพลตะวันตกอย่างชัดเจน',['พระที่นั่งอนันตสมาคม','พระปรางค์วัดอรุณ','พระที่นั่งดุสิตมหาปราสาท','เจดีย์ภูเขาทอง'],0,'พระที่นั่งอนันตสมาคมสร้างด้วยหินอ่อนตามแบบสถาปัตยกรรมเรอเนซองส์ของยุโรป'],
['h_culture',3,'จิตรกรรมของขรัวอินโข่งมีความสำคัญอย่างไรต่อศิลปะไทย',['เป็นจิตรกรไทยคนแรกที่นำหลักทัศนียภาพและการใช้แสงเงาแบบตะวันตกมาใช้','เป็นผู้เขียนภาพจิตรกรรมฝาผนังเรื่องรามเกียรติ์ที่วัดพระแก้วทั้งหมด','เป็นผู้ริเริ่มเทคนิคการหล่อและปั้นพระพุทธรูปสำริดแบบใหม่ของไทย','เป็นผู้ออกแบบธงชาติไทยและตราสัญลักษณ์ของทางราชการหลายแห่ง'],0,'ผลงานของท่านในสมัยรัชกาลที่ 4 เป็นจุดเปลี่ยนของจิตรกรรมไทยสู่แบบสมัยใหม่'],
['h_culture',3,'ผ้าไหมไทยกลายเป็นสินค้าที่มีชื่อเสียงระดับโลกด้วยปัจจัยใด',['การฟื้นฟูภูมิปัญญาการทอผ้าพื้นบ้านควบคู่กับการส่งเสริมด้านการตลาดและการออกแบบ','การนำเข้าเส้นไหมคุณภาพสูงจากต่างประเทศมาทอแทนเส้นไหมที่ผลิตในประเทศ','การเปลี่ยนมาใช้เครื่องจักรทอผ้าแทนการทอด้วยมือทั้งหมดเพื่อเพิ่มกำลังผลิต','การลดต้นทุนและคุณภาพของผ้าลงเพื่อให้ขายได้ในราคาที่ถูกกว่าคู่แข่ง'],0,'การผสมภูมิปัญญาดั้งเดิมกับการออกแบบและการตลาดสมัยใหม่ทำให้ผ้าไหมไทยเป็นที่รู้จักไปทั่วโลก'],
['h_culture',3,'ภูมิปัญญาไทยด้านการจัดการน้ำที่ถูกนำมาประยุกต์ใช้ในโครงการพระราชดำริคือข้อใด',['แก้มลิงซึ่งใช้พื้นที่รับน้ำชั่วคราวเพื่อชะลอน้ำก่อนระบายออก','การสร้างเขื่อนคอนกรีตขนาดใหญ่กั้นลำน้ำสายหลักเพียงอย่างเดียว','การสูบน้ำบาดาลจากใต้ดินขึ้นมาใช้ทดแทนน้ำผิวดินทั้งหมด','การขุดคลองลัดให้ตรงทุกสายเพื่อเร่งการระบายน้ำลงสู่ทะเล'],0,'แนวคิดแก้มลิงมาจากการสังเกตธรรมชาติและภูมิปัญญาการจัดการน้ำแบบดั้งเดิม'],
['h_culture',3,'อิทธิพลของภูมิปัญญาไทยต่อการพัฒนาชาติในปัจจุบันปรากฏชัดในเรื่องใด',['การนำสมุนไพร อาหารไทย และงานหัตถกรรมมาสร้างมูลค่าทางเศรษฐกิจและการท่องเที่ยว','การยกเลิกการใช้ภูมิปัญญาดั้งเดิมทั้งหมดแล้วหันไปใช้เทคโนโลยีสมัยใหม่แทน','การนำเข้าวัฒนธรรมจากต่างชาติเข้ามาแทนที่วัฒนธรรมไทยที่มีอยู่เดิม','การออกกฎหมายห้ามเผยแพร่ภูมิปัญญาไทยออกไปสู่ต่างประเทศทุกรูปแบบ'],0,'ภูมิปัญญาถูกต่อยอดเป็นสินค้าและบริการที่สร้างรายได้ให้ประเทศ'],
['h_culture',3,'การอนุรักษ์ภูมิปัญญาไทยที่ยั่งยืนที่สุดควรทำอย่างไร',['ถ่ายทอดให้คนรุ่นใหม่ได้เรียนรู้และนำไปปรับใช้ในชีวิตจริง','เก็บรักษาไว้ในพิพิธภัณฑ์โดยไม่อนุญาตให้ผู้ใดนำไปใช้งาน','ออกกฎห้ามเปลี่ยนแปลงรูปแบบดั้งเดิมแม้แต่น้อยไม่ว่ากรณีใด','ขายลิขสิทธิ์ให้ต่างชาติเป็นผู้ดูแลรักษาและเผยแพร่แทนคนไทย'],0,'ภูมิปัญญาจะอยู่รอดได้เมื่อยังถูกใช้และปรับให้เข้ากับยุคสมัย'],
['h_culture',3,'ปัญหาสำคัญของการอนุรักษ์ภูมิปัญญาไทยในปัจจุบันคือข้อใด',['คนรุ่นใหม่สนใจน้อยลงและผู้ถ่ายทอดมีอายุมากขึ้นจนความรู้อาจสูญหาย','มีผู้สนใจเรียนรู้มากเกินไปจนหน่วยงานที่ดูแลไม่สามารถรองรับได้ทัน','ภูมิปัญญาไทยที่หลงเหลืออยู่มีจำนวนน้อยเกินกว่าจะคุ้มค่าแก่การอนุรักษ์','ไม่มีหน่วยงานภาครัฐหรือเอกชนแห่งใดให้ความสนใจเรื่องนี้เลยแม้แต่แห่งเดียว'],0,'การขาดช่วงของการถ่ายทอดระหว่างรุ่นคือความเสี่ยงที่ใหญ่ที่สุด'],
['h_culture',3,'เหตุใดวัฒนธรรมไทยจึงสามารถดำรงอยู่ได้แม้รับอิทธิพลตะวันตกอย่างมากในสมัยรัตนโกสินทร์',['เพราะสังคมไทยเลือกรับสิ่งที่เป็นประโยชน์แล้วปรับให้เข้ากับรากเดิมของตน','เพราะมีการปิดกั้นไม่ให้วัฒนธรรมตะวันตกเข้ามาเผยแพร่ในประเทศเลย','เพราะรัฐบาลออกกฎหมายห้ามประชาชนใช้สิ่งของจากต่างชาติทุกชนิด','เพราะชาติตะวันตกไม่ได้สนใจเผยแพร่วัฒนธรรมของตนมายังดินแดนไทย'],0,'การเลือกรับและปรับใช้เป็นลักษณะเด่นที่ทำให้วัฒนธรรมไทยยืดหยุ่นและอยู่รอด'],
['h_culture',3,'ข้อใดคือผลของการปฏิรูปการศึกษาในสมัยรัชกาลที่ 5 ต่อสังคมไทย',['ความรู้กระจายออกจากวัดและวังไปสู่โรงเรียนที่ประชาชนทั่วไปเข้าถึงได้','การศึกษาถูกจำกัดให้อยู่เฉพาะในหมู่ชนชั้นสูงมากยิ่งขึ้นกว่าแต่ก่อน','วัดถูกยกเลิกบทบาทด้านการศึกษาทั้งหมดทันทีนับตั้งแต่มีการปฏิรูป','คนไทยเลิกเรียนภาษาไทยแล้วหันไปเรียนภาษาต่างประเทศแทนทั้งหมด'],0,'การตั้งโรงเรียนหลวงและกระทรวงธรรมการทำให้การศึกษาขยายสู่สามัญชน'],
['h_culture',4,'ข้อใดวิเคราะห์บทบาทของภูมิปัญญาไทยต่อการพัฒนาชาติได้ถูกต้องที่สุด',['ภูมิปัญญาเป็นทั้งรากฐานทางวัฒนธรรมที่สร้างอัตลักษณ์ และเป็นทุนที่ต่อยอดเป็นมูลค่าทางเศรษฐกิจได้','ภูมิปัญญาเป็นเพียงเรื่องราวของอดีตที่ควรเก็บไว้ศึกษาแต่ไม่เกี่ยวข้องกับการพัฒนาประเทศในปัจจุบัน','ภูมิปัญญาดั้งเดิมเป็นอุปสรรคที่ขัดขวางความเจริญก้าวหน้าทางเทคโนโลยีของประเทศ','ภูมิปัญญามีคุณค่าเฉพาะเมื่อนำไปจัดแสดงในพิพิธภัณฑ์ให้ผู้คนเข้าชมเท่านั้น'],0,'ภูมิปัญญาทำหน้าที่ทั้งด้านอัตลักษณ์และด้านเศรษฐกิจสร้างสรรค์'],
['h_culture',4,'การนำภูมิปัญญาไทยไปใช้ในเชิงพาณิชย์ควรคำนึงถึงสิ่งใดมากที่สุด',['การให้เกียรติเจ้าของภูมิปัญญาและชุมชนต้นทาง พร้อมแบ่งปันผลประโยชน์อย่างเป็นธรรม','การแสวงหากำไรให้ได้มากที่สุดโดยไม่จำเป็นต้องระบุแหล่งที่มาของภูมิปัญญานั้น','การดัดแปลงรูปแบบให้ทันสมัยจนไม่เหลือเค้าโครงเดิมเพื่อให้ขายได้ง่ายขึ้น','การรีบจดทะเบียนทรัพย์สินทางปัญญาให้เป็นกรรมสิทธิ์ของบุคคลเพียงคนเดียว'],0,'การใช้ประโยชน์อย่างเป็นธรรมทำให้ชุมชนเจ้าของภูมิปัญญายังมีแรงจูงใจสืบทอดต่อไป'],
['h_culture',4,'ข้อใดคือความสัมพันธ์ระหว่างภูมิปัญญาไทยกับหลักปรัชญาของเศรษฐกิจพอเพียง',['ทั้งสองอย่างเน้นการใช้ทรัพยากรอย่างรู้คุณค่า พึ่งตนเองได้ และสอดคล้องกับสภาพแวดล้อม','ทั้งสองอย่างเกิดขึ้นคนละยุคสมัยจึงไม่มีความเกี่ยวข้องเชื่อมโยงกันแต่อย่างใด','ภูมิปัญญาไทยดั้งเดิมมีแนวคิดที่ขัดแย้งกับหลักปรัชญาของเศรษฐกิจพอเพียง','หลักเศรษฐกิจพอเพียงถูกนำมาใช้แทนที่ภูมิปัญญาไทยที่ล้าสมัยไปแล้ว'],0,'ภูมิปัญญาไทยดั้งเดิมตั้งอยู่บนฐานของการพึ่งตนเองและอยู่ร่วมกับธรรมชาติเช่นเดียวกัน'],
];

['a_sep',2,'เมื่อได้รับมอบหมายให้ดูแลอุปกรณ์กีฬาของห้อง ควรทำอย่างไร',['จัดเก็บให้ครบและให้ทุกคนได้ใช้อย่างเท่าเทียม','เก็บอุปกรณ์ชิ้นที่ดีที่สุดแยกไว้ใช้เองคนเดียว','อนุญาตให้เฉพาะเพื่อนสนิทของตนเท่านั้นยืมได้','เก็บซ่อนไว้ไม่ให้ผู้ใดนำไปใช้เพื่อกันของหาย'],0,'ผู้ดูแลของส่วนรวมต้องให้ทุกคนได้ใช้อย่างเป็นธรรม'],
['a_sep',2,'ข้อใดคือผลเสียเมื่อคนในสังคมแยกแยะผลประโยชน์ไม่ได้',['เกิดความไม่เป็นธรรมและเกิดการทุจริตตามมา','ผู้คนในสังคมจะมีความสุขมากขึ้นกว่าเดิม','ทรัพย์สินของส่วนรวมจะเพิ่มพูนมากขึ้น','ผู้คนจะรักใคร่กลมเกลียวกันมากขึ้นกว่าเดิม'],0,'เมื่อผลประโยชน์ปนกัน การตัดสินใจจะเอนเอียงจนเกิดการทุจริต'],
['a_sep',2,'เวรทำความสะอาดห้องเรียนเป็นหน้าที่ของใคร',['ทุกคนในห้องตามที่แบ่งเวรกันไว้','เฉพาะนักเรียนที่เรียนอ่อน','เฉพาะภารโรง','เฉพาะหัวหน้าห้อง'],0,'ห้องเรียนเป็นของส่วนรวม ทุกคนจึงต้องช่วยกันดูแล'],
['a_sep',2,'นักเรียนเห็นเพื่อนนำน้ำดื่มของโรงเรียนไปหลายขวดเพื่อเอากลับบ้าน ควรทำอย่างไร',['ตักเตือนเพื่อนว่าเป็นของส่วนรวมที่ต้องแบ่งกันใช้','ขอให้เพื่อนแบ่งน้ำดื่มมาให้เราบ้างสักสองสามขวด','เก็บเรื่องนี้ไว้เงียบๆ ไม่บอกให้ครูหรือใครทราบ','นำน้ำดื่มกลับบ้านให้มากกว่าจำนวนที่เพื่อนนำไป'],0,'การตักเตือนอย่างสุภาพช่วยรักษาของส่วนรวมไว้ให้ทุกคน'],
['a_sep',3,'ข้อใดเป็นตัวอย่างของการใช้เวลาราชการหรือเวลาเรียนไปทำเรื่องส่วนตัว',['แอบเล่นเกมในโทรศัพท์ระหว่างครูสอน','ตั้งใจฟังครูอธิบายบทเรียนอย่างสม่ำเสมอ','ช่วยเพื่อนทำความสะอาดห้องเรียนตามเวร','ทำแบบฝึกหัดที่ครูสั่งให้เสร็จภายในคาบเรียน'],0,'เวลาเรียนเป็นของส่วนรวม ต้องใช้เพื่อการเรียน'],
['a_sep',3,'ครูให้นักเรียนช่วยจัดของในห้องพัสดุ นักเรียนเห็นสมุดใหม่จำนวนมาก ควรทำอย่างไร',['จัดเก็บให้เรียบร้อยและไม่หยิบไปเป็นของตนเอง','หยิบมาสักหนึ่งเล่มเพราะเห็นว่ามีจำนวนมากอยู่แล้ว','ชวนเพื่อนคนอื่นให้มาช่วยกันหยิบไปคนละหนึ่งเล่ม','แอบซ่อนไว้ในมุมหนึ่งเพื่อกลับมาเอาในภายหลัง'],0,'แม้ของจะมีมาก ก็ยังเป็นของส่วนรวมที่หยิบไปไม่ได้'],
['a_sep',3,'เหตุใดผู้ที่มีหน้าที่ดูแลเงินหรือของส่วนรวมจึงต้องทำบัญชีให้ชัดเจน',['เพื่อให้ตรวจสอบได้และป้องกันการปะปนกับของส่วนตัว','เพื่อให้ผู้อื่นเห็นว่าตนเป็นคนเก่งและมีความสามารถ','เพื่อให้ครูประจำชั้นชมเชยว่าเป็นผู้ที่ทำงานละเอียด','เพื่อให้การทำงานช้าลงจะได้ไม่ต้องรับงานเพิ่มอีก'],0,'บัญชีที่ชัดเจนทำให้ทุกคนตรวจสอบได้และไม่เกิดข้อสงสัย'],
['a_sep',3,'ข้อใดแสดงว่านักเรียนแยกแยะผลประโยชน์ส่วนตนกับส่วนรวมได้ดีที่สุด',['เป็นหัวหน้ากลุ่มแล้วแบ่งงานให้ทุกคนเท่าเทียมกันแม้บางคนจะไม่ใช่เพื่อนสนิท','เป็นหัวหน้ากลุ่มแล้วเลือกให้เพื่อนสนิทของตนได้ทำงานส่วนที่ง่ายที่สุด','เป็นหัวหน้ากลุ่มแล้วลงมือทำงานทั้งหมดด้วยตนเองเพื่อจะได้คะแนนคนเดียว','เป็นหัวหน้ากลุ่มแล้วมอบงานที่หนักที่สุดให้คนที่ตนไม่ค่อยชอบหน้า'],0,'การแบ่งงานอย่างเป็นธรรมกับทุกคนคือการยึดประโยชน์ส่วนรวม'],
['a_sep',3,'เงินค่าอาหารกลางวันของโรงเรียนเป็นเงินประเภทใด',['เงินส่วนรวมที่ต้องใช้เพื่อนักเรียนทุกคน','เงินส่วนตัวของครูที่นำมาช่วยเหลือนักเรียน','เงินส่วนตัวของแม่ครัวที่ทำอาหารให้เด็ก','เงินกลางที่ผู้ใดขอใช้ก่อนก็มีสิทธิได้ก่อน'],0,'เป็นงบประมาณของส่วนรวมที่ต้องใช้ให้เกิดประโยชน์กับนักเรียนทุกคน'],
['a_sep',3,'ถ้านักเรียนได้รับเงินทอนเกินจากร้านค้าในโรงเรียน ควรทำอย่างไร',['คืนเงินส่วนเกินให้แม่ค้าทันที','เก็บไว้เพราะแม่ค้าทอนเอง','แบ่งให้เพื่อนคนละครึ่ง','นำไปซื้อของเพิ่ม'],0,'เงินที่ไม่ใช่ของเราต้องคืนเจ้าของ แม้จะได้มาโดยไม่ได้ตั้งใจ'],
['a_sep',3,'ข้อใดคือความหมายของคำว่า "ทุจริต"',['การประพฤติไม่ซื่อสัตย์เพื่อให้ตนเองหรือพวกพ้องได้ประโยชน์','การทำงานหนักเกินกำลังจนร่างกายเจ็บป่วยไม่สบาย','การพูดคุยเสียงดังรบกวนผู้อื่นในเวลาที่ไม่สมควร','การเดินทางมาถึงโรงเรียนช้ากว่าเวลาที่กำหนดไว้'],0,'ทุจริตคือการประพฤติชั่ว ไม่ซื่อตรง เพื่อประโยชน์ที่ไม่ควรได้'],
['a_sep',4,'ข้อใดอธิบายได้ดีที่สุดว่าเหตุใดจึงต้องแยกผลประโยชน์ส่วนตนออกจากส่วนรวม',['เพราะเมื่อสองอย่างปนกัน ผู้มีหน้าที่จะตัดสินใจเข้าข้างตนเองจนคนอื่นเสียประโยชน์','เพราะเป็นกฎระเบียบที่โรงเรียนกำหนดไว้ให้นักเรียนทุกคนต้องปฏิบัติตาม','เพราะจะทำให้ผู้อื่นมองว่าเราเป็นคนดีและได้รับคำชมเชยจากครูอาจารย์','เพราะจะได้ไม่ต้องรับผิดชอบงานส่วนรวมที่มีความยุ่งยากมากเกินไป'],0,'การปนกันของผลประโยชน์คือต้นทางของความไม่เป็นธรรมและการทุจริต'],
['a_sep',2,'การเข้าแถวรอซื้ออาหารตามลำดับก่อนหลังเป็นการเคารพสิ่งใด',['สิทธิของผู้อื่นและกติกาของส่วนรวม','ความต้องการและความสะดวกของตนเอง','คำสั่งของเพื่อนที่ยืนอยู่ในแถวเดียวกัน','ความรวดเร็วในการซื้ออาหารของตนเอง'],0,'การเข้าแถวคือการยอมรับกติกาที่ทำให้ทุกคนได้รับความเป็นธรรม'],

/* ---------- หน่วยที่ 2 ความละอายและความไม่ทนต่อการทุจริต (26 ข้อ) ---------- */
['a_shame',1,'"ความละอาย" ในเรื่องการทุจริตหมายถึงข้อใด',['ความรู้สึกอายที่จะทำสิ่งที่ไม่ถูกต้อง','ความอายเมื่อต้องพูดหน้าชั้น','ความอายเมื่อแต่งตัวไม่เรียบร้อย','ความอายเมื่อสอบได้คะแนนน้อย'],0,'ความละอายคือความรู้สึกภายในที่ทำให้เราไม่กล้าทำผิด'],
['a_shame',1,'"ความไม่ทนต่อการทุจริต" หมายถึงข้อใด',['การไม่ยอมปล่อยผ่านเมื่อเห็นการกระทำที่ไม่ซื่อสัตย์','การไม่สามารถอดทนต่อสภาพอากาศที่ร้อนอบอ้าวได้','การไม่ยอมยืนรอคิวเมื่อต้องซื้อของที่มีคนต่อแถวยาว','การไม่ยอมทำการบ้านที่ครูสั่งให้ทำเป็นประจำทุกวัน'],0,'ความไม่ทนคือการกล้าตักเตือนหรือแจ้งเมื่อเห็นสิ่งไม่ถูกต้อง'],
['a_shame',1,'การลอกการบ้านเพื่อนถือเป็นการกระทำแบบใด',['ไม่ซื่อสัตย์ต่อตนเองและครู','ช่วยเหลือกันระหว่างเพื่อน','ประหยัดเวลาในการเรียน','เป็นการฝึกความจำ'],0,'การลอกทำให้เราไม่ได้เรียนรู้จริงและเป็นการหลอกครู'],
['a_shame',1,'ขณะสอบ นักเรียนควรปฏิบัติอย่างไร',['ทำข้อสอบด้วยความรู้ของตนเองโดยไม่ลอกใคร','แอบชะเง้อดูคำตอบจากกระดาษของเพื่อนที่นั่งข้างๆ','เขียนคำตอบย่อไว้ที่ฝ่ามือก่อนเข้าห้องสอบ','กระซิบถามคำตอบจากเพื่อนเบาๆ ตอนครูไม่มอง'],0,'การสอบวัดความรู้ของเราเอง การลอกจึงเป็นการโกง'],
['a_shame',1,'ถ้าเก็บกระเป๋าเงินได้ในโรงเรียน ควรทำอย่างไร',['นำไปส่งคืนครูหรือเจ้าของ','เก็บเงินไว้แล้วทิ้งกระเป๋า','แบ่งเงินให้เพื่อน','เก็บไว้เงียบๆ'],0,'ของที่ไม่ใช่ของเราต้องคืนเจ้าของเสมอ'],
['a_shame',1,'ข้อใดเป็นการทุจริตในการเข้าแถวหน้าเสาธง',['แอบไปยืนแถวหน้าโดยไม่ต่อคิวตามลำดับ','ยืนตรงเคารพธงชาติด้วยความสำรวมทุกเช้า','ร้องเพลงชาติพร้อมเพื่อนด้วยความตั้งใจ','ช่วยจัดแถวของเพื่อนให้เป็นระเบียบเรียบร้อย'],0,'การแซงคิวคือการเอาเปรียบผู้อื่นที่รอตามกติกา'],
['a_shame',1,'การมาโรงเรียนสายแล้วบอกครูว่ารถติดทั้งที่ตื่นสาย เป็นการกระทำแบบใด',['การพูดไม่จริงเพื่อให้ตนเองไม่ถูกลงโทษ','การอธิบายเหตุผลที่มาสายอย่างถูกต้อง','การรักษามารยาทที่ดีในการชี้แจงต่อครู','การช่วยให้ครูไม่ต้องกังวลใจกับเรื่องนี้'],0,'การอ้างเหตุผลเท็จคือความไม่ซื่อสัตย์'],
['a_shame',2,'ความละอายระดับสูงหมายถึงข้อใด',['ไม่ทำสิ่งที่ผิดแม้ไม่มีใครเห็นและไม่มีใครรู้','ไม่ทำสิ่งที่ผิดเพราะกลัวว่าจะถูกจับได้ในภายหลัง','ไม่ทำสิ่งที่ผิดเพราะกลัวว่าจะถูกทำโทษอย่างหนัก','ไม่ทำสิ่งที่ผิดเพราะเพื่อนคนอื่นก็ไม่ได้ทำเช่นกัน'],0,'ความละอายระดับสูงเกิดจากจิตสำนึกของตนเอง ไม่ใช่เพราะกลัวถูกจับ'],
['a_shame',2,'นักเรียนเห็นเพื่อนแอบเอาเงินในกระเป๋าของเพื่อนอีกคน ควรทำอย่างไร',['บอกครูเพื่อให้แก้ไขปัญหาอย่างถูกต้อง','เงียบไว้เพราะกลัวเพื่อนโกรธ','ขอส่วนแบ่ง','นำไปเล่าให้เพื่อนคนอื่นฟังอย่างสนุกสนาน'],0,'การแจ้งครูคือการไม่ทนต่อการทุจริตและช่วยแก้ปัญหาอย่างถูกวิธี'],
['a_shame',2,'เมื่อทำของส่วนรวมเสียหาย นักเรียนควรทำอย่างไร',['ยอมรับความจริงและแจ้งครูเพื่อหาทางแก้ไข','แอบนำของที่เสียหายไปเก็บซ่อนไว้ที่อื่น','บอกครูว่าเป็นความผิดของเพื่อนคนอื่นแทน','ทำเป็นไม่รู้ไม่เห็นแล้วเดินหนีออกจากที่นั่น'],0,'การยอมรับผิดคือจุดเริ่มต้นของความรับผิดชอบ'],
['a_shame',2,'ข้อใดเป็นการทุจริตในการแข่งขันกีฬาสี',['ให้นักกีฬาที่ไม่ได้อยู่ในทีมลงแข่งแทนโดยไม่บอกกรรมการ','ฝึกซ้อมอย่างหนักร่วมกับเพื่อนในทีมก่อนถึงวันแข่ง','คอยส่งเสียงให้กำลังใจเพื่อนร่วมทีมตลอดการแข่งขัน','ยอมรับผลการแข่งขันที่ออกมาไม่ว่าจะแพ้หรือชนะ'],0,'การใช้ผู้เล่นผิดกติกาคือการโกงเพื่อให้ทีมตนได้เปรียบ'],
['a_shame',2,'เพื่อนชวนให้ช่วยเซ็นชื่อเข้าเรียนแทนเพราะเพื่อนไม่มา ควรทำอย่างไร',['ปฏิเสธและอธิบายว่าเป็นการทำผิด','เซ็นให้เพราะเป็นเพื่อนกัน','เซ็นให้แล้วขอค่าตอบแทน','เซ็นให้แต่บอกเพื่อนคนอื่นด้วย'],0,'การเซ็นชื่อแทนคือการทำหลักฐานเท็จ'],
['a_shame',2,'การรายงานผลการทำเวรว่าทำแล้วทั้งที่ยังไม่ได้ทำ เป็นการกระทำแบบใด',['การรายงานเท็จซึ่งเป็นความไม่ซื่อสัตย์','การประหยัดเวลาเพื่อนำไปทำงานอื่นที่สำคัญกว่า','การช่วยให้ครูตรวจงานได้เร็วขึ้นกว่าเดิม','การแบ่งเบาภาระของเพื่อนที่อยู่เวรด้วยกัน'],0,'การรายงานสิ่งที่ไม่เป็นจริงคือการหลอกลวง'],
['a_shame',2,'ข้อใดคือผลเสียของการโกงข้อสอบต่อตัวนักเรียนเอง',['ไม่ได้ความรู้จริงและเสียความน่าเชื่อถือ','ได้คะแนนดีขึ้นอย่างถาวรในทุกวิชาที่เรียน','ทำให้มีความรู้และเรียนเก่งขึ้นกว่าเดิมมาก','ทำให้เพื่อนในห้องนับถือและยกย่องมากขึ้น'],0,'คะแนนที่ได้จากการโกงไม่ได้แปลว่ามีความรู้จริง'],
['a_shame',2,'เมื่อนักเรียนทำผิดแล้วมีคนตักเตือน ควรปฏิบัติอย่างไร',['รับฟังด้วยใจเปิดกว้างและแก้ไขตนเอง','แสดงความโกรธและโต้เถียงกลับไปทันที','เลิกคบหากับคนที่มาตักเตือนเราคนนั้น','ทำเป็นไม่ได้ยินแล้วเดินหนีไปที่อื่น'],0,'การรับฟังคำเตือนช่วยให้เราแก้ไขและเติบโตขึ้น'],
['a_shame',2,'ข้อใดเป็นการทุจริตในการเลือกตั้งประธานนักเรียน',['แจกขนมเพื่อแลกกับคะแนนเสียง','แนะนำตัวและบอกนโยบายของตน','ติดโปสเตอร์ตามที่โรงเรียนอนุญาต','ตอบคำถามของเพื่อนอย่างตรงไปตรงมา'],0,'การให้สิ่งของแลกคะแนนเสียงทำให้การเลือกตั้งไม่บริสุทธิ์'],
['a_shame',3,'เหตุใดความละอายจึงสำคัญกว่าการกลัวถูกลงโทษ',['เพราะความละอายทำให้เราไม่ทำผิดแม้ไม่มีใครเห็น ส่วนความกลัวจะหมดไปเมื่อไม่มีคนดู','เพราะความละอายช่วยให้เราทำงานที่ได้รับมอบหมายเสร็จเร็วขึ้นกว่าการถูกบังคับด้วยบทลงโทษ','เพราะการลงโทษนักเรียนที่ทำผิดไม่ได้มีอยู่จริงทั้งในโรงเรียนและในสังคมทั่วไปในปัจจุบัน','เพราะครูส่วนใหญ่ไม่ชอบลงโทษนักเรียนที่ทำความผิดจึงต้องอาศัยความละอายแทนการลงโทษ'],0,'จิตสำนึกภายในควบคุมพฤติกรรมได้ตลอดเวลา ต่างจากความกลัวที่ต้องมีผู้คอยจับผิด'],
['a_shame',3,'นักเรียนได้คะแนนเต็มเพราะครูตรวจผิด ควรทำอย่างไร',['แจ้งครูเพื่อให้แก้ไขคะแนนให้ถูกต้อง','เก็บเงียบไว้เพราะเป็นความผิดของครู','บอกเพื่อนให้ทำแบบเดียวกัน','ดีใจและไม่บอกใคร'],0,'การรับสิ่งที่ไม่ควรได้แม้เกิดจากความผิดพลาดของผู้อื่นก็ยังไม่ถูกต้อง'],
['a_shame',3,'ถ้าเพื่อนสนิทโกงแล้วขอร้องไม่ให้บอกใคร นักเรียนควรทำอย่างไร',['ตักเตือนเพื่อนให้ยอมรับผิดด้วยตนเอง และถ้าไม่แก้ไขจึงแจ้งครู','ช่วยปกปิดความผิดนั้นไว้เพราะเป็นเพื่อนสนิทกันมานาน','นำเรื่องไปบอกทุกคนในโรงเรียนให้รับรู้ทันทีที่ทราบ','ทำเป็นไม่รับรู้เรื่องนี้แล้วเลิกคบหากับเพื่อนคนนั้น'],0,'การให้โอกาสแก้ไขก่อนควบคู่กับการไม่ปล่อยผ่านคือทางที่เหมาะสม'],
['a_shame',3,'ข้อใดเป็นผลกระทบของการทุจริตต่อส่วนรวม',['ทำให้คนที่ทำถูกต้องเสียเปรียบและสังคมขาดความเป็นธรรม','ทำให้ทุกคนในสังคมได้รับประโยชน์อย่างเท่าเทียมกัน','ทำให้เศรษฐกิจของชุมชนดีขึ้นเพราะเงินหมุนเวียนมาก','ทำให้ผู้คนในสังคมรักใคร่และช่วยเหลือกันมากขึ้น'],0,'เมื่อคนโกงได้ประโยชน์ คนที่ซื่อสัตย์จะเสียเปรียบและหมดกำลังใจ'],
['a_shame',3,'ข้อใดแสดงความไม่ทนต่อการทุจริตได้เหมาะสมที่สุดสำหรับนักเรียน ป.4',['แจ้งครูหรือผู้ใหญ่ที่ไว้ใจได้เมื่อพบเห็นสิ่งไม่ถูกต้อง','ลงมือทำโทษเพื่อนที่ทำผิดด้วยตนเองทันทีที่พบเห็น','ถ่ายภาพแล้วโพสต์ประจานเพื่อนบนสื่อสังคมออนไลน์','ตะโกนด่าว่าเพื่อนที่ทำผิดกลางสนามหน้าโรงเรียน'],0,'นักเรียนควรแจ้งผู้ใหญ่ ไม่ใช่จัดการเองซึ่งอาจเกิดปัญหาตามมา'],
['a_shame',3,'เหตุใดจึงต้องปลูกฝังความซื่อสัตย์ตั้งแต่ยังเป็นเด็ก',['เพราะนิสัยที่ฝึกตั้งแต่เล็กจะติดตัวไปจนโต','เพราะเด็กไม่มีโอกาสทำผิด','เพราะผู้ใหญ่ไม่จำเป็นต้องซื่อสัตย์','เพราะเป็นข้อบังคับของกฎหมาย'],0,'พฤติกรรมที่ทำซ้ำจนเป็นนิสัยตั้งแต่เด็กจะกลายเป็นบุคลิกเมื่อโตขึ้น'],
['a_shame',3,'การที่นักเรียนคืนของที่เก็บได้แม้ไม่มีใครเห็น แสดงถึงสิ่งใด',['ความละอายและความซื่อสัตย์ที่เกิดจากจิตใจของตนเอง','ความกลัวว่าจะถูกลงโทษหากมีผู้พบเห็นในภายหลัง','ความต้องการได้รับรางวัลตอบแทนจากเจ้าของสิ่งของ','ความต้องการให้ครูชมเชยต่อหน้าเพื่อนทั้งห้องเรียน'],0,'การทำถูกต้องแม้ไม่มีใครเห็นคือความซื่อสัตย์ที่แท้จริง'],
['a_shame',4,'ข้อใดอธิบายความสัมพันธ์ระหว่างความละอายกับความไม่ทนต่อการทุจริตได้ถูกต้อง',['ความละอายทำให้เราไม่ทำผิดเอง ส่วนความไม่ทนทำให้เราไม่ปล่อยผ่านเมื่อคนอื่นทำผิด','ทั้งสองอย่างมีความหมายเหมือนกันทุกประการเพียงแต่ใช้คำเรียกต่างกัน','ความละอายเป็นเรื่องของผู้ใหญ่ ส่วนความไม่ทนเป็นเรื่องของเด็กนักเรียน','ความไม่ทนต่อการทุจริตหมายถึงการเป็นคนใจร้อนและโกรธง่ายกับทุกเรื่อง'],0,'อย่างหนึ่งควบคุมตนเอง อีกอย่างหนึ่งดูแลส่วนรวม'],
['a_shame',2,'การนำผลงานของเพื่อนมาส่งครูโดยบอกว่าเป็นผลงานของตน เรียกว่าอะไร',['การขโมยผลงานผู้อื่น','การทำงานร่วมกัน','การแบ่งปันความรู้','การช่วยเหลือเพื่อน'],0,'การอ้างผลงานผู้อื่นว่าเป็นของตนคือความไม่ซื่อสัตย์'],
['a_shame',2,'เมื่อนักเรียนสัญญากับเพื่อนว่าจะช่วยทำงานกลุ่ม แต่กลับไม่ทำ เป็นการขาดสิ่งใด',['ความรับผิดชอบและความซื่อสัตย์ต่อคำพูดของตน','ความสามารถในการเรียนรู้เนื้อหาวิชาที่ยากขึ้น','ความกล้าหาญในการแสดงความเห็นต่อหน้าเพื่อน','ความอดทนต่องานที่ต้องใช้เวลาทำนานหลายวัน'],0,'การรักษาคำพูดคือพื้นฐานของความซื่อสัตย์'],

['a_strong',2,'การไม่ยอมแพ้และตั้งใจทำสิ่งที่ถูกต้องต่อไปแม้จะยาก ตรงกับหลักใด',['การมุ่งไปข้างหน้า','ความพอเพียง','ความโปร่งใส','ความรู้'],0,'O คือ Onward การมุ่งมั่นเดินหน้าทำสิ่งที่ถูกต้อง'],
['a_strong',2,'ข้อใดเป็นการใช้ชีวิตอย่างพอเพียงของนักเรียน',['ใช้สมุดให้หมดทุกหน้าก่อนซื้อเล่มใหม่','ทิ้งสมุดที่เขียนไปแค่ครึ่งเล่ม','ซื้ออุปกรณ์ใหม่ทุกเดือนตามแฟชั่น','ขอให้พ่อแม่ซื้อของแพงที่สุด'],0,'การใช้ของให้คุ้มค่าคือการปฏิบัติตามหลักความพอเพียง'],
['a_strong',3,'เหตุใดความพอเพียงจึงช่วยป้องกันการทุจริตได้',['เพราะเมื่อรู้จักพอ เราจะไม่โลภอยากได้สิ่งที่ไม่ใช่ของตน','เพราะการใช้จ่ายอย่างพอเพียงทำให้เรามีเงินเก็บมากขึ้น','เพราะความพอเพียงทำให้เราไม่ต้องทำงานหนักเหมือนคนอื่น','เพราะคนที่ใช้ชีวิตพอเพียงมักได้รับความเกรงใจจากผู้อื่น'],0,'ความโลภคือรากของการทุจริต การรู้จักพอจึงตัดรากนั้นได้'],
['a_strong',3,'เหตุใดความรู้จึงเป็นส่วนหนึ่งของ STRONG',['เพราะความรู้ทำให้เรารู้ว่าอะไรถูกอะไรผิดและไม่ถูกหลอกได้ง่าย','เพราะความรู้ช่วยให้เราสอบได้คะแนนดีในทุกวิชาที่เรียน','เพราะความรู้ทำให้เรามีเพื่อนฝูงมากขึ้นและเป็นที่ยอมรับ','เพราะความรู้เรื่องสุขภาพช่วยให้ร่างกายแข็งแรงสมบูรณ์'],0,'คนที่มีความรู้จะรู้เท่าทันและไม่ตกเป็นเครื่องมือของการทุจริต'],
['a_strong',3,'ข้อใดแสดงความเอื้ออาทรที่ช่วยป้องกันการทุจริตได้',['ช่วยเหลือเพื่อนที่ขาดแคลนเพื่อไม่ให้ต้องไปหยิบของผู้อื่น','ให้เงินเพื่อนเป็นค่าตอบแทนเพื่อแลกกับการทำการบ้านให้','ช่วยเพื่อนโดยการบอกคำตอบข้อสอบให้ในเวลาที่ครูไม่มอง','นำของขวัญไปมอบให้ครูเพื่อขอให้เพิ่มคะแนนสอบให้เรา'],0,'ความเอื้ออาทรที่ถูกต้องคือการช่วยเหลือโดยไม่หวังผลตอบแทนที่ไม่ควรได้'],
['a_strong',3,'ถ้าห้องเรียนมีการเก็บเงินค่ากิจกรรม การปฏิบัติตามหลัก STRONG ที่ดีที่สุดคือข้อใด',['ทำบัญชีรับจ่ายอย่างชัดเจนและแจ้งให้ทุกคนทราบ','ให้หัวหน้าห้องเก็บไว้คนเดียวโดยไม่ต้องจดบันทึก','ใช้เงินก่อนแล้วค่อยบอกทีหลัง','เก็บเงินมากกว่าที่กำหนดเผื่อไว้'],0,'ความโปร่งใสด้วยบัญชีที่ตรวจสอบได้เป็นหลักสำคัญของ STRONG'],
['a_strong',3,'ข้อใดคือเป้าหมายสำคัญที่สุดของแนวคิด STRONG',['สร้างคนที่มีจิตใจพอเพียงและไม่ยอมให้เกิดการทุจริต','สร้างคนที่มีร่างกายแข็งแรงและเล่นกีฬาได้เก่งกาจ','สร้างคนที่มีฐานะร่ำรวยและมีทรัพย์สินเงินทองมาก','สร้างคนที่เรียนเก่งที่สุดและสอบได้ที่หนึ่งของโรงเรียน'],0,'STRONG มุ่งสร้างจิตสำนึกที่ต้านทานการทุจริตได้จากภายใน'],
['a_strong',3,'การที่นักเรียนรู้ว่าการรับของขวัญเพื่อแลกกับคะแนนเป็นสิ่งผิด แสดงถึงหลักใดของ STRONG',['ความตื่นรู้และความรู้','ความพอเพียงเพียงอย่างเดียว','ความเอื้ออาทรเพียงอย่างเดียว','การมุ่งไปข้างหน้าเพียงอย่างเดียว'],0,'การรู้เท่าทันว่าอะไรคือการทุจริตมาจากทั้งความรู้และความตื่นรู้'],
['a_strong',4,'ข้อใดอธิบายแนวคิด STRONG ได้ครอบคลุมที่สุด',['เป็นการรวมคุณลักษณะหลายด้านทั้งความพอเพียง โปร่งใส ตื่นรู้ มุ่งไปข้างหน้า มีความรู้ และเอื้ออาทร เพื่อสร้างภูมิคุ้มกันการทุจริต','เป็นชุดท่าออกกำลังกายที่ออกแบบมาสำหรับนักเรียนระดับประถมศึกษาเพื่อให้มีร่างกายแข็งแรงและมีสุขภาพดีอยู่เสมอตลอดปีการศึกษา','เป็นชื่อโครงการมอบทุนการศึกษาให้แก่นักเรียนที่ขาดแคลนทุนทรัพย์ในโรงเรียนทั่วประเทศโดยพิจารณาจากผลการเรียนและความประพฤติ','เป็นเทคนิควิธีการทำข้อสอบให้ได้คะแนนสูงโดยการจดจำเนื้อหาสำคัญของแต่ละบทเรียนย่อลงเป็นตัวอักษรภาษาอังกฤษให้จำง่าย'],0,'ทั้งหกองค์ประกอบทำงานร่วมกันเป็นภูมิคุ้มกันจากภายในตัวบุคคล'],
['a_strong',2,'การใช้น้ำและไฟฟ้าในโรงเรียนอย่างประหยัดเป็นการปฏิบัติตามหลักใด',['ความพอเพียงและการรักษาประโยชน์ส่วนรวม','ความโปร่งใสในการเปิดเผยข้อมูลค่าใช้จ่าย','ความตื่นรู้ในการติดตามข่าวสารรอบตัวเรา','การมุ่งไปข้างหน้าอย่างไม่ย่อท้อต่ออุปสรรค'],0,'การใช้ทรัพยากรส่วนรวมอย่างประหยัดคือความพอเพียงที่ทำได้ทันที'],

/* ---------- หน่วยที่ 4 พลเมืองกับความรับผิดชอบต่อสังคม (24 ข้อ) ---------- */
['a_citizen',1,'"พลเมืองดี" หมายถึงข้อใด',['ผู้ที่ปฏิบัติตามกฎ มีความรับผิดชอบ และทำประโยชน์ต่อส่วนรวม','ผู้ที่มีฐานะร่ำรวยและมีทรัพย์สินมากที่สุดในชุมชนของตน','ผู้ที่เรียนเก่งที่สุดและสอบได้คะแนนสูงที่สุดในโรงเรียน','ผู้ที่มีอายุมากที่สุดและได้รับความเคารพจากคนในชุมชน'],0,'พลเมืองดีวัดจากการปฏิบัติตนต่อส่วนรวม ไม่ใช่ฐานะหรือความเก่ง'],
['a_citizen',1,'ข้อใดเป็นหน้าที่ของนักเรียนในฐานะสมาชิกของโรงเรียน',['ปฏิบัติตามกฎระเบียบและช่วยดูแลความสะอาด','ใช้สิ่งของส่วนรวมได้ตามใจชอบโดยไม่ต้องขออนุญาต','มาโรงเรียนเฉพาะวันที่ตนเองอยากมาเรียนเท่านั้น','ทิ้งขยะที่ใดก็ได้ในบริเวณโรงเรียนตามความสะดวก'],0,'สมาชิกที่ดีต้องเคารพกติกาและช่วยดูแลส่วนรวม'],
['a_citizen',1,'การทิ้งขยะลงถังแสดงถึงสิ่งใด',['ความรับผิดชอบต่อส่วนรวม','ความขยันในการเรียน','ความกล้าหาญ','ความประหยัด'],0,'การไม่สร้างภาระให้ผู้อื่นคือความรับผิดชอบต่อส่วนรวม'],
['a_citizen',1,'ข้อใดเป็นการเคารพสิทธิของผู้อื่น',['ไม่หยิบของของเพื่อนโดยไม่ขออนุญาต','หยิบของเพื่อนใช้ได้เลยเพราะสนิทกัน','อ่านสมุดบันทึกส่วนตัวของเพื่อน','แกล้งเพื่อนให้ขำ'],0,'การขออนุญาตก่อนคือการเคารพสิทธิในทรัพย์สินของผู้อื่น'],
['a_citizen',1,'เมื่อโรงเรียนจัดกิจกรรมทำความสะอาดชุมชน นักเรียนควรทำอย่างไร',['เข้าร่วมและช่วยเหลือตามกำลังของตน','ปฏิเสธการเข้าร่วมเพราะไม่ใช่หน้าที่ของตน','ไปร่วมกิจกรรมแต่ยืนเฉยๆ ไม่ลงมือช่วยอะไร','บอกให้เพื่อนไปทำงานแทนตนเองในวันนั้น'],0,'การมีส่วนร่วมในกิจกรรมส่วนรวมคือหน้าที่ของพลเมืองดี'],
['a_citizen',1,'การข้ามถนนบนทางม้าลายแสดงถึงสิ่งใด',['การเคารพกฎจราจรเพื่อความปลอดภัยของทุกคน','ความรีบร้อนที่ต้องการข้ามถนนให้เร็วที่สุด','ความกล้าหาญที่กล้าเดินข้ามถนนสายใหญ่','ความมีน้ำใจที่ยอมให้รถคันอื่นผ่านไปก่อน'],0,'กฎจราจรมีไว้เพื่อความปลอดภัยของทุกคนบนถนน'],
['a_citizen',2,'เหตุใดสังคมจึงต้องมีกฎระเบียบ',['เพื่อให้ทุกคนอยู่ร่วมกันได้อย่างเป็นระเบียบและเป็นธรรม','เพื่อให้ผู้ใหญ่มีเครื่องมือควบคุมความประพฤติของเด็ก','เพื่อให้มีคนกระทำผิดและถูกลงโทษอยู่เป็นประจำ','เพื่อให้การใช้ชีวิตประจำวันมีขั้นตอนยุ่งยากขึ้น'],0,'กฎช่วยให้คนจำนวนมากอยู่ร่วมกันโดยไม่เบียดเบียนกัน'],
['a_citizen',2,'ข้อใดเป็นการมีส่วนร่วมในการดูแลโรงเรียน',['ช่วยกันปลูกต้นไม้และดูแลความสะอาดบริเวณโรงเรียน','รอให้ภารโรงเป็นผู้ทำความสะอาดเพียงคนเดียว','ปล่อยให้ครูเป็นผู้จัดการดูแลทุกอย่างในโรงเรียน','บ่นว่าโรงเรียนสกปรกโดยที่ตนเองไม่ลงมือทำอะไร'],0,'การลงมือช่วยกันคือการมีส่วนร่วมที่แท้จริง'],
['a_citizen',2,'การเลือกประธานนักเรียนควรใช้เกณฑ์ใด',['ความสามารถและความรับผิดชอบของผู้สมัคร','ความสนิทสนมส่วนตัวที่มีกับผู้สมัครคนนั้น','สิ่งของหรือขนมที่ผู้สมัครนำมาแจกให้เพื่อน','รูปร่างหน้าตาที่ดีของผู้สมัครแต่ละคน'],0,'การเลือกผู้นำต้องดูที่ความสามารถและความรับผิดชอบต่อส่วนรวม'],
['a_citizen',2,'เมื่อความคิดเห็นของเราต่างจากเพื่อนในการทำงานกลุ่ม ควรทำอย่างไร',['รับฟังเหตุผลของกันและกันแล้วหาข้อสรุปร่วมกัน','ยืนยันความคิดของตนเองอย่างเดียวจนกว่าเพื่อนจะยอม','ขอออกจากกลุ่มทันทีแล้วไปทำงานคนเดียวแทน','เงียบไว้ไม่ต้องแสดงความคิดเห็นใดๆ ต่อกลุ่ม'],0,'การรับฟังและหาข้อสรุปร่วมกันคือทักษะของพลเมืองในสังคมประชาธิปไตย'],
['a_citizen',2,'ข้อใดเป็นความรับผิดชอบต่อตนเอง',['ทำการบ้านและเตรียมอุปกรณ์การเรียนให้พร้อมทุกวัน','ให้พ่อแม่เป็นผู้จัดกระเป๋าและอุปกรณ์การเรียนให้ทุกวัน','ลอกการบ้านจากเพื่อนในตอนเช้าก่อนครูเข้าห้องเรียน','ลืมนำอุปกรณ์มาแล้วขอยืมของเพื่อนใช้อยู่เป็นประจำ'],0,'การดูแลหน้าที่ของตนเองให้เรียบร้อยคือความรับผิดชอบพื้นฐาน'],
['a_citizen',2,'ข้อใดเป็นความรับผิดชอบต่อครอบครัว',['ช่วยงานบ้านตามที่ตนเองทำได้','ปล่อยให้พ่อแม่ทำงานบ้านคนเดียว','ใช้เงินของครอบครัวอย่างฟุ่มเฟือย','เถียงพ่อแม่ทุกครั้ง'],0,'การแบ่งเบาภาระในบ้านคือความรับผิดชอบต่อครอบครัว'],
['a_citizen',2,'การเข้าร่วมกิจกรรมวันสำคัญของชุมชน เช่น การทำความสะอาดวัด แสดงถึงสิ่งใด',['ความรับผิดชอบและการมีส่วนร่วมในชุมชน','ความต้องการมีชื่อเสียงและเป็นที่รู้จักในชุมชน','การหาโอกาสหลีกเลี่ยงการเรียนในวันธรรมดา','การทำตามคำสั่งของผู้ใหญ่โดยไม่เต็มใจทำ'],0,'การร่วมกิจกรรมของชุมชนคือบทบาทของสมาชิกที่ดี'],
['a_citizen',2,'ถ้าเห็นก๊อกน้ำในโรงเรียนเปิดทิ้งไว้ นักเรียนควรทำอย่างไร',['ปิดก๊อกน้ำทันที','เดินผ่านไปเพราะไม่ใช่หน้าที่','รอให้ครูมาปิด','เปิดให้แรงขึ้นเพื่อความสนุก'],0,'การดูแลทรัพยากรส่วนรวมเป็นหน้าที่ของทุกคน'],
['a_citizen',2,'ข้อใดเป็นการใช้สิทธิของตนเองโดยไม่ละเมิดผู้อื่น',['เปิดเพลงฟังด้วยหูฟังในเวลาพัก','เปิดเพลงเสียงดังในห้องเรียน','พูดคุยเสียงดังขณะครูสอน','วิ่งเล่นในห้องสมุด'],0,'เรามีสิทธิของเราแต่ต้องไม่รบกวนสิทธิของผู้อื่น'],
