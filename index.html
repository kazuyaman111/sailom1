['a_sep',2,'หัวหน้าห้องเก็บเงินค่ากิจกรรมแล้วนำไปฝากไว้กับครูพร้อมทำบัญชี แสดงถึงสิ่งใด',['การแยกเงินส่วนรวมออกจากเงินส่วนตัวอย่างชัดเจน','การแสดงออกว่าไม่ไว้วางใจเพื่อนร่วมห้องของตนเอง','การทำงานที่ยุ่งยากเกินความจำเป็นสำหรับเงินจำนวนน้อย','การเอาใจครูประจำชั้นเพื่อให้ได้รับความไว้วางใจ'],0,'การฝากและทำบัญชีทำให้เงินส่วนรวมตรวจสอบได้'],
['a_sep',2,'ข้อใดเป็นการใช้เวลาราชการไปทำเรื่องส่วนตัว',['เจ้าหน้าที่ใช้เวลาทำงานไปขายสินค้าออนไลน์ของตนเอง','เจ้าหน้าที่พักกลางวันตามเวลาที่กำหนด','เจ้าหน้าที่ลาป่วยตามระเบียบ','เจ้าหน้าที่ทำงานล่วงเวลาเพื่อให้งานเสร็จ'],0,'เวลาราชการเป็นของส่วนรวม ต้องใช้เพื่องานของส่วนรวม'],
['a_sep',2,'ข้อใดเป็นการใช้ข้อมูลภายในเพื่อประโยชน์ส่วนตน',['ผู้ที่รู้ล่วงหน้าว่าจะมีการสร้างถนน จึงรีบไปซื้อที่ดินบริเวณนั้นไว้ก่อน','ผู้ที่อ่านประกาศของทางราชการที่ติดไว้หน้าที่ว่าการอำเภอ','ผู้ที่สอบถามข้อมูลจากเจ้าหน้าที่ตามช่องทางปกติ','ผู้ที่เข้าร่วมประชุมประชาคมหมู่บ้าน'],0,'การใช้ข้อมูลที่คนอื่นยังไม่รู้เพื่อประโยชน์ตนเองคือการเอาเปรียบส่วนรวม'],
['a_sep',2,'เมื่อได้รับมอบหมายให้เป็นกรรมการนักเรียน สิ่งใดสำคัญที่สุด',['ทำหน้าที่เพื่อประโยชน์ของนักเรียนทุกคนอย่างเป็นธรรม','ใช้ตำแหน่งที่ได้รับให้เพื่อนในโรงเรียนเกรงใจมากขึ้น','ได้รับสิทธิพิเศษบางอย่างมากกว่านักเรียนคนอื่นทั่วไป','ได้รับการยกเว้นไม่ต้องปฏิบัติตามกฎบางข้อของโรงเรียน'],0,'ตำแหน่งคือหน้าที่ที่ต้องทำเพื่อส่วนรวม ไม่ใช่สิทธิพิเศษ'],
['a_sep',3,'เพราะเหตุใดการรับของขวัญจากผู้มาติดต่อราชการจึงเป็นเรื่องที่ต้องระวัง',['เพราะอาจทำให้เจ้าหน้าที่รู้สึกเกรงใจและตัดสินใจเข้าข้างผู้ให้','เพราะของขวัญที่ให้กันมักมีราคาแพงเกินกำลังของผู้ให้','เพราะเจ้าหน้าที่ส่วนใหญ่ไม่ชอบรับของขวัญจากคนแปลกหน้า','เพราะการรับของขวัญทำให้เสียเวลาในการทำงานราชการ'],0,'ความเกรงใจที่เกิดขึ้นทำให้การตัดสินใจไม่เป็นกลางอีกต่อไป'],
['a_sep',3,'ข้อใดคือความแตกต่างระหว่าง "การให้ด้วยน้ำใจ" กับ "การให้เพื่อหวังผล"',['การให้ด้วยน้ำใจไม่ต้องการสิ่งตอบแทน ส่วนการให้เพื่อหวังผลต้องการให้ผู้รับทำอะไรบางอย่างให้','การให้ด้วยน้ำใจให้กับคนที่รู้จัก ส่วนการให้เพื่อหวังผลให้กับคนแปลกหน้าที่ไม่เคยพบกัน','การให้ด้วยน้ำใจต้องมีมูลค่าสูงกว่า ส่วนการให้เพื่อหวังผลมักเป็นของเล็กน้อยราคาถูก','การให้ด้วยน้ำใจทำอย่างเงียบๆ ส่วนการให้เพื่อหวังผลต้องให้ต่อหน้าคนจำนวนมาก'],0,'เจตนาของผู้ให้และเงื่อนไขที่แฝงมาคือจุดแยกที่สำคัญ'],
['a_sep',3,'โรงเรียนได้รับบริจาคคอมพิวเตอร์ 10 เครื่อง แต่ครูคนหนึ่งนำกลับบ้าน 1 เครื่อง เป็นการกระทำแบบใด',['นำทรัพย์สินของส่วนรวมไปเป็นของส่วนตัวซึ่งเป็นการทุจริต','เป็นสิทธิของครูผู้ที่รับผิดชอบดูแลเครื่องเหล่านั้นอยู่แล้ว','ช่วยลดภาระการดูแลรักษาและประหยัดพื้นที่เก็บของโรงเรียน','ไม่ถือว่าผิดเพราะเป็นของที่ได้รับบริจาคมาโดยไม่เสียเงิน'],0,'ของบริจาคที่มอบให้โรงเรียนถือเป็นทรัพย์สินของโรงเรียน'],
['a_sep',3,'ข้อใดแสดงว่าผู้นำชุมชนแยกแยะผลประโยชน์ได้ถูกต้อง',['จัดสรรงบพัฒนาหมู่บ้านตามความจำเป็นของทุกคุ้ม ไม่ใช่เฉพาะคุ้มที่ตนอาศัยอยู่','นำงบประมาณไปพัฒนาถนนบริเวณหน้าบ้านตนเองก่อนเพราะสัญจรมากที่สุด','ให้ญาติของตนเป็นผู้รับเหมาทุกโครงการเพราะทำงานเร็วและไว้ใจได้','ใช้งบประมาณซื้อของแจกเฉพาะกลุ่มที่เคยลงคะแนนสนับสนุนตนเอง'],0,'การจัดสรรตามความจำเป็นของส่วนรวมคือการยึดประโยชน์ส่วนรวม'],
['a_sep',3,'เหตุใดจึงต้องเปิดเผยข้อมูลการใช้งบประมาณของหน่วยงานให้ประชาชนทราบ',['เพราะเป็นเงินภาษีของประชาชน จึงต้องให้เจ้าของเงินตรวจสอบได้','เพราะมีกฎหมายบังคับไว้แม้จะไม่เกิดประโยชน์ต่อผู้ใดก็ตาม','เพราะช่วยให้หน่วยงานดูน่าเชื่อถือในสายตาของผู้บังคับบัญชา','เพราะต้องการให้ประชาชนเห็นใจแล้วบริจาคเงินเพิ่มให้หน่วยงาน'],0,'ประชาชนเป็นเจ้าของภาษีจึงมีสิทธิรู้ว่าเงินถูกใช้ไปอย่างไร'],
['a_sep',3,'ข้อใดเป็นการปฏิบัติที่ถูกต้องเมื่อกรรมการคนหนึ่งมีส่วนได้เสียกับเรื่องที่กำลังพิจารณา',['ถอนตัวจากการพิจารณาเรื่องนั้นเพื่อความเป็นกลาง','ร่วมพิจารณาต่อไปได้แต่งดออกความเห็นในที่ประชุม','ร่วมพิจารณาและออกเสียงตามปกติเพราะเป็นสิทธิของตน','มอบให้กรรมการคนอื่นออกเสียงแทนตนตามที่ตกลงกันไว้'],0,'การถอนตัวเมื่อมีส่วนได้เสียคือหลักปฏิบัติสากลในการป้องกันประโยชน์ทับซ้อน'],
['a_sep',3,'ผลกระทบระยะยาวของการที่ผู้มีอำนาจแยกแยะผลประโยชน์ไม่ได้คือข้อใด',['ทรัพยากรของส่วนรวมถูกใช้ไม่คุ้มค่าและประชาชนขาดความไว้วางใจ','ประชาชนมีรายได้เพิ่มขึ้นเพราะเงินหมุนเวียนในชุมชนมากขึ้น','การพัฒนาชุมชนดำเนินไปรวดเร็วขึ้นเพราะลดขั้นตอนที่ยุ่งยาก','ทุกคนได้รับความเป็นธรรมมากขึ้นเพราะมีผู้ดูแลอย่างใกล้ชิด'],0,'เงินส่วนรวมรั่วไหลและความเชื่อมั่นในระบบก็ลดลงตามไปด้วย'],
['a_sep',3,'ข้อใดเป็นการใช้ตำแหน่งหน้าที่โดยมิชอบ',['ครูเวรใช้อำนาจยกเว้นโทษให้เฉพาะนักเรียนที่นำของมาให้','ครูเวรบันทึกชื่อผู้มาสายตามความเป็นจริง','ครูเวรตักเตือนนักเรียนทุกคนที่ทำผิดเหมือนกัน','ครูเวรรายงานผลการอยู่เวรต่อผู้บริหาร'],0,'การเลือกปฏิบัติเพื่อแลกกับสิ่งของคือการใช้อำนาจโดยมิชอบ'],
['a_sep',4,'ข้อใดวิเคราะห์ได้ถูกต้องที่สุดเกี่ยวกับการแยกแยะผลประโยชน์',['ผู้ที่มีหน้าที่ต้องถามตนเองเสมอว่าการตัดสินใจนี้ทำเพื่อส่วนรวมหรือเพื่อตนเองและพวกพ้อง','ถ้าการตัดสินใจนั้นไม่ได้ทำให้ผู้ใดเดือดร้อนเสียหายก็ถือว่าไม่เป็นความผิดแต่อย่างใด','ถ้าเป็นการกระทำที่ทำเป็นครั้งคราวไม่ได้ทำประจำก็ยังพอยอมรับได้ตามสมควร','ถ้าผู้อื่นในหน่วยงานเดียวกันก็ปฏิบัติเช่นเดียวกันก็ไม่ถือว่าเป็นเรื่องผิด'],0,'คำถามที่ต้องถามตัวเองเสมอคือการตัดสินใจนี้ยึดประโยชน์ของใครเป็นหลัก'],
['a_sep',2,'การจับสลากเพื่อแบ่งหน้าที่ในกิจกรรมของห้อง แสดงถึงสิ่งใด',['ความเป็นธรรมและการไม่เลือกที่รักมักที่ชัง','ความไม่กล้าตัดสินใจของผู้ที่ได้รับมอบหมาย','การหลีกเลี่ยงความรับผิดชอบในการแบ่งงาน','การนำการเสี่ยงโชคมาใช้กับเรื่องของส่วนรวม'],0,'การจับสลากทำให้ทุกคนมีโอกาสเท่ากันโดยไม่มีอคติ'],
['a_sep',2,'ข้อใดเป็นทรัพยากรส่วนรวมที่คนในชุมชนใช้ร่วมกัน',['แหล่งน้ำสาธารณะและป่าชุมชน','สวนหลังบ้านของเพื่อนบ้าน','บ่อน้ำในบ้านตนเอง','รถจักรยานยนต์ของพี่ชาย'],0,'แหล่งน้ำสาธารณะและป่าชุมชนเป็นทรัพยากรที่ทุกคนใช้ร่วมกัน'],
['a_sep',3,'การจับปลาในแหล่งน้ำสาธารณะด้วยวิธีที่ทำลายลูกปลาทั้งหมด ส่งผลอย่างไร',['ได้ประโยชน์ส่วนตนระยะสั้น แต่ทำให้ส่วนรวมเสียประโยชน์ในระยะยาว','ทำให้ปลาในแหล่งน้ำเพิ่มจำนวนขึ้นเพราะลดการแย่งอาหารกัน','เป็นการช่วยรักษาสมดุลของระบบนิเวศในแหล่งน้ำให้คงอยู่','ไม่ส่งผลกระทบต่อผู้อื่นเพราะเป็นแหล่งน้ำที่ใช้ร่วมกันอยู่แล้ว'],0,'การเอาประโยชน์ส่วนตนจนทรัพยากรส่วนรวมเสียหายคือการเบียดเบียนคนทั้งชุมชน'],
['a_sep',2,'ข้อใดคือความหมายของคำว่า "คอร์รัปชัน"',['การใช้อำนาจหน้าที่โดยมิชอบเพื่อให้ได้ประโยชน์ส่วนตน','การปฏิบัติงานผิดพลาดโดยไม่ได้มีเจตนาให้เกิดความเสียหาย','การทำงานล่าช้ากว่ากำหนดจนประชาชนได้รับความเดือดร้อน','การลาหยุดงานบ่อยครั้งจนงานในความรับผิดชอบคั่งค้าง'],0,'คอร์รัปชันคือการใช้อำนาจในทางมิชอบเพื่อประโยชน์ที่ไม่ควรได้'],

/* ---------- หน่วยที่ 2 ความละอายและความไม่ทนต่อการทุจริต (26 ข้อ) ---------- */
['a_shame',1,'ความละอายต่อการทุจริตเกิดจากสิ่งใดเป็นสำคัญ',['จิตสำนึกและการรู้ผิดชอบชั่วดีของตนเอง','การเคยถูกครูลงโทษมาแล้วหลายครั้งจนเข็ดหลาบ','การได้เห็นเพื่อนถูกจับได้แล้วรู้สึกกลัวไปด้วย','การที่โรงเรียนติดกล้องวงจรปิดไว้ทั่วบริเวณ'],0,'ความละอายที่แท้จริงมาจากภายในตัวเรา ไม่ใช่จากการถูกบังคับ'],
['a_shame',1,'ข้อใดเป็นการทุจริตในการทำกิจกรรมของโรงเรียน',['รายงานจำนวนผู้เข้าร่วมกิจกรรมมากกว่าความเป็นจริงเพื่อให้ได้งบเพิ่ม','นับจำนวนผู้เข้าร่วมกิจกรรมตามความเป็นจริงแล้วรายงานให้ครูทราบ','เชิญชวนเพื่อนต่างห้องให้มาร่วมกิจกรรมเพื่อให้มีผู้เข้าร่วมมากขึ้น','สรุปผลกิจกรรมอย่างตรงไปตรงมาทั้งข้อดีและสิ่งที่ควรปรับปรุง'],0,'การรายงานตัวเลขเท็จเพื่อให้ได้ประโยชน์คือการทุจริต'],
['a_shame',1,'การซื้อของแล้วได้รับเงินทอนเกิน แต่เก็บไว้เงียบๆ แสดงถึงการขาดสิ่งใด',['ความซื่อสัตย์และความละอายต่อการเอาสิ่งที่ไม่ใช่ของตน','ความกล้าหาญในการทักท้วงผู้ใหญ่ที่ทำงานผิดพลาด','ความอดทนต่อการรอคอยคิวซื้อของที่ยาวนาน','ความขยันในการตรวจนับเงินทอนให้ครบทุกครั้ง'],0,'การรับสิ่งที่ไม่ใช่ของเราแม้ผู้อื่นผิดพลาดเองก็ยังไม่ถูกต้อง'],
['a_shame',2,'ความละอาย 2 ระดับต่างกันอย่างไร',['ระดับต้นคือไม่ทำผิดเพราะกลัวคนอื่นรู้ ส่วนระดับสูงคือไม่ทำผิดแม้ไม่มีใครเห็น','ระดับต้นใช้กับเด็กที่ยังไม่รู้เดียงสา ส่วนระดับสูงใช้กับผู้ใหญ่ที่ทำงานแล้ว','ระดับต้นเกิดขึ้นเฉพาะภายในบ้าน ส่วนระดับสูงเกิดขึ้นเมื่ออยู่ในโรงเรียน','ระดับต้นเป็นเรื่องเล็กน้อยที่ยอมกันได้ ส่วนระดับสูงเป็นความผิดร้ายแรง'],0,'ระดับสูงมาจากจิตสำนึกภายในซึ่งควบคุมตนเองได้ตลอดเวลา'],
['a_shame',2,'ข้อใดเป็นการแสดงความไม่ทนต่อการทุจริตอย่างเหมาะสม',['แจ้งครูหรือผู้ใหญ่ที่รับผิดชอบพร้อมข้อมูลตามความจริง','ตัดสินและลงโทษผู้ที่ทำผิดด้วยตนเองทันทีที่พบเห็น','นำเรื่องที่พบไปเล่าต่อให้ผู้อื่นฟังอย่างสนุกสนาน','ถ่ายภาพแล้วโพสต์ประจานลงบนสื่อสังคมออนไลน์'],0,'การแจ้งผู้รับผิดชอบตามช่องทางที่ถูกต้องคือวิธีที่เหมาะสมและปลอดภัย'],
['a_shame',2,'นักเรียนพบว่าเพื่อนนำเงินค่าอาหารกลางวันของห้องไปใช้ส่วนตัว ควรทำอย่างไร',['แจ้งครูประจำชั้นเพื่อตรวจสอบและแก้ไข','เรียกร้องส่วนแบ่งจากเพื่อน','เงียบไว้เพราะเป็นเรื่องของเพื่อน','บอกให้เพื่อนคนอื่นทำตาม'],0,'เงินส่วนรวมที่หายไปต้องแจ้งผู้รับผิดชอบเพื่อแก้ไข'],
['a_shame',2,'ข้อใดเป็นการทุจริตที่พบได้ในชุมชน',['การแอบต่อสายไฟจากเสาไฟสาธารณะมาใช้ที่บ้านตนเอง','การชำระค่าไฟฟ้าตามจำนวนหน่วยที่มิเตอร์แสดงจริง','การรวมกลุ่มกันดูแลไฟส่องสว่างตามทางในหมู่บ้าน','การแจ้งเจ้าหน้าที่ให้มาซ่อมไฟทางที่ชำรุดเสียหาย'],0,'การลักลอบใช้ไฟฟ้าสาธารณะคือการเอาของส่วนรวมมาใช้เพื่อประโยชน์ส่วนตัว'],
['a_shame',2,'การนำขยะจากบ้านตนเองไปทิ้งในที่สาธารณะของหมู่บ้าน แสดงถึงการขาดสิ่งใด',['ความรับผิดชอบและความละอายต่อการสร้างภาระให้ส่วนรวม','ความรู้เรื่องวิธีการคัดแยกขยะแต่ละประเภทอย่างถูกต้อง','ความสามารถในการจัดการงานบ้านให้เรียบร้อยด้วยตนเอง','ความรวดเร็วในการจัดการปัญหาขยะล้นภายในบ้านของตน'],0,'การผลักภาระของตนไปให้ส่วนรวมคือการขาดความรับผิดชอบ'],
['a_shame',2,'ในการแข่งขันตอบปัญหา ถ้ารู้คำถามล่วงหน้าจากคนใน ควรทำอย่างไร',['แจ้งกรรมการทันทีและไม่ใช้ข้อมูลนั้น','จดจำไว้แล้วนำไปใช้ตอบในการแข่งขันจริง','บอกต่อเฉพาะเพื่อนร่วมทีมของตนเท่านั้น','เก็บเรื่องนี้ไว้เงียบๆ ไม่บอกให้ผู้ใดทราบ'],0,'การใช้ข้อมูลที่ได้เปรียบอย่างไม่เป็นธรรมคือการโกง'],
['a_shame',2,'ข้อใดคือผลเสียของการที่คนในสังคมทนต่อการทุจริต',['การทุจริตจะขยายตัวมากขึ้นเพราะไม่มีใครคัดค้าน','สังคมจะสงบสุขมากขึ้นเพราะไม่มีความขัดแย้งกัน','ผู้ที่ทุจริตจะรู้สึกสำนึกผิดและเลิกทำไปเองในที่สุด','ปัญหาจะค่อยๆ คลี่คลายและหายไปเองตามกาลเวลา'],0,'ความเงียบของคนส่วนใหญ่ทำให้ผู้ทุจริตกล้าทำมากขึ้น'],
['a_shame',2,'การที่นักเรียนไม่ลอกการบ้านแม้จะทำไม่ทันแสดงถึงสิ่งใด',['ความซื่อสัตย์และความรับผิดชอบต่อการเรียนของตนเอง','การไม่มีเพื่อนสนิทที่จะขอความช่วยเหลือในยามจำเป็น','ความขี้เกียจที่ไม่ยอมหาวิธีทำงานให้เสร็จทันกำหนด','ความกลัวว่าครูจะจับได้แล้วถูกลงโทษหน้าชั้นเรียน'],0,'การยอมรับผลของการทำไม่ทันดีกว่าการได้คะแนนจากงานที่ไม่ใช่ของตน'],
['a_shame',2,'ข้อใดเป็นการทุจริตในการรับสมัครเข้าร่วมกิจกรรม',['รับเฉพาะญาติและคนรู้จักแม้ผู้อื่นสมัครก่อน','ประกาศรับสมัครให้นักเรียนทุกคนได้รับทราบทั่วกัน','คัดเลือกผู้สมัครตามเกณฑ์ที่ได้ประกาศไว้ล่วงหน้า','ประกาศผลการคัดเลือกอย่างเปิดเผยให้ตรวจสอบได้'],0,'การเลือกปฏิบัติโดยไม่ใช้เกณฑ์คือความไม่เป็นธรรม'],
['a_shame',2,'นักเรียนได้รับมอบหมายให้ซื้อของแล้วนำใบเสร็จมาเบิก แต่กรอกราคาสูงกว่าจริง เป็นการกระทำแบบใด',['การทำเอกสารเท็จเพื่อเอาเงินส่วนต่าง ซึ่งเป็นการทุจริต','การเผื่อค่าเดินทางที่ออกเงินไปก่อนโดยไม่ได้เบิกแยก','การคิดค่าตอบแทนแรงงานของตนเองที่เสียเวลาไปซื้อของ','การกรอกตัวเลขกลมๆ เพื่อความสะดวกในการทำบัญชี'],0,'การกรอกตัวเลขไม่ตรงความจริงเพื่อเอาเงินคือการทุจริตอย่างชัดเจน'],
['a_shame',3,'เหตุใดการทุจริตเล็กน้อยจึงเป็นเรื่องที่ต้องระวัง',['เพราะเมื่อทำบ่อยจนเคยชิน จะกลายเป็นการทุจริตที่ใหญ่ขึ้นในอนาคต','เพราะการทุจริตเล็กน้อยมีบทลงโทษที่หนักกว่าการทุจริตขนาดใหญ่','เพราะคนรอบข้างมักสังเกตเห็นได้ง่ายกว่าการทุจริตเรื่องใหญ่','เพราะทำให้ต้องเสียเวลาไปกับการปกปิดมากกว่าเรื่องใหญ่'],0,'ความเคยชินกับสิ่งเล็กน้อยจะทำให้จิตสำนึกด้านลบค่อยๆ อ่อนลง'],
['a_shame',3,'ถ้านักเรียนถูกกดดันจากกลุ่มเพื่อนให้ร่วมโกง ควรทำอย่างไร',['ปฏิเสธอย่างหนักแน่นและปรึกษาครูหรือผู้ปกครอง','ทำตามเพื่อนไปก่อนเพราะกลัวว่าจะถูกกีดกันออกจากกลุ่ม','ยอมทำเพียงครั้งเดียวแล้วหาทางเลิกในโอกาสต่อไป','ทำตามที่เพื่อนขอแต่ไม่บอกให้ผู้ใดทราบเรื่องนี้'],0,'การปฏิเสธและขอความช่วยเหลือจากผู้ใหญ่คือทางออกที่ปลอดภัยที่สุด'],
['a_shame',3,'ข้อใดคือความกล้าหาญทางจริยธรรม',['กล้าพูดความจริงและทำสิ่งที่ถูกต้องแม้จะขัดกับคนส่วนใหญ่','กล้าท้าทายให้ผู้อื่นลองทำสิ่งที่ผิดกฎเพื่อพิสูจน์ความกล้า','กล้าโต้เถียงกับเพื่อนร่วมชั้นเมื่อมีความเห็นไม่ตรงกัน','กล้าทำสิ่งที่เสี่ยงอันตรายซึ่งคนอื่นไม่กล้าลองทำ'],0,'ความกล้าหาญทางจริยธรรมคือการยืนหยัดในสิ่งที่ถูกแม้ต้องอยู่ฝ่ายข้างน้อย'],
['a_shame',3,'ข้อใดคือเหตุผลที่คนบางคนยอมทนต่อการทุจริต',['กลัวได้รับผลกระทบต่อตนเองหรือคิดว่าแจ้งไปก็ไม่มีอะไรเปลี่ยนแปลง','รู้สึกยินดีที่ได้เห็นคนรอบข้างได้รับประโยชน์จากเรื่องนั้น','ไม่เคยได้รับความรู้เรื่องการทุจริตมาก่อนจึงแยกแยะไม่ออก','ต้องการให้สังคมพัฒนาไปข้างหน้าอย่างรวดเร็วโดยไม่ติดขัด'],0,'ความกลัวและความรู้สึกว่าทำอะไรไม่ได้คืออุปสรรคสำคัญของการแจ้งเบาะแส'],
['a_shame',3,'การที่โรงเรียนติดกล่องรับเรื่องร้องเรียนมีประโยชน์อย่างไร',['เปิดช่องทางให้ผู้พบเห็นแจ้งเรื่องได้โดยไม่ต้องเปิดเผยตัว','ทำให้นักเรียนเกิดความเกรงกลัวและอยู่ในระเบียบมากขึ้น','ทำให้ครูมีภาระงานเพิ่มขึ้นจากการตรวจกล่องทุกวัน','ใช้เป็นที่เก็บของที่นักเรียนเก็บได้ภายในบริเวณโรงเรียน'],0,'ช่องทางที่ปลอดภัยช่วยให้คนกล้าแจ้งเบาะแสมากขึ้น'],
['a_shame',3,'ข้อใดแสดงว่านักเรียนมีความละอายในระดับสูง',['ไม่หยิบของที่ไม่ใช่ของตนแม้อยู่คนเดียวและไม่มีกล้องวงจรปิด','ไม่หยิบของที่ไม่ใช่ของตนเพราะกลัวว่าจะมีคนเดินมาเห็นพอดี','ไม่หยิบของที่ไม่ใช่ของตนเพราะกลัวถูกทำโทษหากถูกจับได้','ไม่หยิบของที่ไม่ใช่ของตนเพราะเพื่อนคอยห้ามปรามเอาไว้'],0,'ความละอายระดับสูงไม่ขึ้นกับว่ามีใครเห็นหรือไม่'],
['a_shame',3,'นักเรียนเห็นผู้ใหญ่ในชุมชนทำสิ่งไม่ถูกต้อง ควรปฏิบัติอย่างไรจึงเหมาะสม',['เล่าให้ผู้ปกครองหรือครูฟังเพื่อให้ผู้ใหญ่ช่วยดำเนินการต่อ','เข้าไปตักเตือนผู้ใหญ่คนนั้นด้วยตนเองทันทีที่พบเห็น','ปฏิบัติตามอย่างที่เห็นเพราะคิดว่าผู้ใหญ่ย่อมทำถูกเสมอ','ถ่ายคลิปเก็บไว้แล้วนำไปเผยแพร่ต่อในสื่อสังคมออนไลน์'],0,'เด็กควรแจ้งผู้ใหญ่ที่ไว้ใจได้ ไม่ควรเผชิญหน้าเองซึ่งอาจไม่ปลอดภัย'],
['a_shame',3,'เหตุใดการปลูกฝังความไม่ทนต่อการทุจริตจึงสำคัญต่อสังคม',['เพราะเมื่อคนส่วนใหญ่ไม่ยอมรับการทุจริต ผู้ทุจริตจะทำได้ยากขึ้น','เพราะทำให้คนในสังคมเกิดความขัดแย้งและทะเลาะกันมากขึ้น','เพราะจะทำให้ไม่จำเป็นต้องมีกฎหมายควบคุมอีกต่อไปในอนาคต','เพราะช่วยลดภาระงานของเจ้าหน้าที่ตำรวจลงได้อย่างมาก'],0,'บรรทัดฐานของสังคมคือเครื่องมือป้องกันการทุจริตที่ทรงพลังที่สุด'],
['a_shame',4,'ข้อใดเป็นการวิเคราะห์ที่ถูกต้องเกี่ยวกับคำพูดที่ว่า "โกงได้บ้างถ้าทำให้ส่วนรวมได้ประโยชน์"',['เป็นความคิดที่ผิด เพราะการทุจริตทำลายความเป็นธรรมและความไว้วางใจของสังคม','เป็นความคิดที่ถูกต้อง เพราะสิ่งสำคัญคือผลลัพธ์ที่ส่วนรวมได้รับในที่สุด','เป็นความคิดที่ยอมรับได้ในบางกรณีที่มีความจำเป็นเร่งด่วนจริงๆ','เป็นความคิดที่ควรนำมาใช้ เพราะช่วยให้งานส่วนรวมเสร็จเร็วขึ้น'],0,'ผลลัพธ์ที่ดีไม่อาจใช้เป็นข้ออ้างให้วิธีการที่ทุจริตได้'],
['a_shame',2,'การส่งงานที่คัดลอกมาจากอินเทอร์เน็ตทั้งหมดโดยไม่อ้างอิง เป็นการกระทำแบบใด',['การนำผลงานผู้อื่นมาเป็นของตนซึ่งเป็นความไม่ซื่อสัตย์','การค้นคว้าข้อมูลอย่างถูกวิธีตามที่ครูได้แนะนำไว้','การประหยัดเวลาทำงานเพื่อนำไปทบทวนวิชาอื่นต่อ','การใช้เทคโนโลยีอย่างชาญฉลาดให้เกิดประโยชน์สูงสุด'],0,'การใช้ข้อมูลผู้อื่นต้องอ้างอิงและเรียบเรียงด้วยความเข้าใจของตนเอง'],
['a_shame',2,'ข้อใดคือการปฏิบัติที่ถูกต้องเมื่อทำผิดกฎของโรงเรียน',['ยอมรับผิดและยินดีรับผลของการกระทำนั้น','หาข้ออ้างที่ฟังขึ้นเพื่อไม่ให้ถูกลงโทษ','โยนความผิดให้เพื่อนที่อยู่ในเหตุการณ์','ปฏิเสธว่าไม่ได้ทำจนกว่าจะมีหลักฐาน'],0,'การยอมรับผิดคือจุดเริ่มต้นของการแก้ไขและการเติบโต'],
['a_shame',3,'ข้อใดคือความแตกต่างระหว่างการแจ้งเบาะแสกับการฟ้องเพื่อกลั่นแกล้ง',['การแจ้งเบาะแสมีข้อเท็จจริงและมุ่งแก้ปัญหา ส่วนการกลั่นแกล้งมุ่งทำร้ายผู้อื่นโดยไม่มีมูล','การแจ้งเบาะแสใช้กับเรื่องใหญ่ที่เสียหายมาก ส่วนการกลั่นแกล้งใช้กับเรื่องเล็กน้อยทั่วไป','การแจ้งเบาะแสต้องทำต่อหน้าคนจำนวนมาก ส่วนการกลั่นแกล้งทำอย่างลับๆ เพียงลำพัง','การกลั่นแกล้งถือว่าทำได้หากผู้ถูกกล่าวหาเคยกระทำความผิดมาก่อนแล้วจริง'],0,'เจตนาและความจริงของข้อมูลคือจุดแยกที่สำคัญ'],
['a_shame',2,'"สุจริต" มีความหมายตรงกันข้ามกับคำใด',['ทุจริต','ขยัน','ประหยัด','อดทน'],0,'สุจริตคือความประพฤติชอบ ตรงข้ามกับทุจริตซึ่งคือความประพฤติชั่ว'],

/* ---------- หน่วยที่ 3 STRONG จิตพอเพียงต้านทุจริต (24 ข้อ) ---------- */
['a_strong',1,'องค์ประกอบของ STRONG มีทั้งหมดกี่ด้าน',['6 ด้าน','4 ด้าน','5 ด้าน','8 ด้าน'],0,'STRONG ประกอบด้วย S T R O N G รวม 6 ด้าน'],
['a_strong',1,'ข้อใดคือความหมายของ "ความพอเพียง" ตามหลัก STRONG',['การรู้จักประมาณตน ใช้จ่ายอย่างมีเหตุผล และไม่โลภในสิ่งที่ไม่ใช่ของตน','การไม่ใช้จ่ายเงินเลยแม้จะเป็นสิ่งที่จำเป็นต่อการดำรงชีวิตประจำวัน','การเก็บเงินสะสมไว้ทั้งหมดโดยไม่นำออกมาใช้จนกว่าจะจำเป็นจริงๆ','การวางแผนใช้เงินที่มีอยู่ให้หมดพอดีในแต่ละเดือนโดยไม่เหลือเก็บ'],0,'ความพอเพียงคือความพอประมาณและมีเหตุผล ไม่ใช่การไม่ใช้จ่ายเลย'],
['a_strong',2,'"ความโปร่งใส" ในการบริหารเงินของโรงเรียนหมายถึงข้อใด',['เปิดเผยที่มาและการใช้จ่ายเงินให้ผู้เกี่ยวข้องตรวจสอบได้','เก็บข้อมูลการเงินไว้เป็นความลับเพื่อความปลอดภัยของโรงเรียน','ให้เฉพาะผู้บริหารระดับสูงเท่านั้นที่รับรู้ข้อมูลทั้งหมด','ชี้แจงข้อมูลการใช้เงินเฉพาะเมื่อมีผู้มาสอบถามเท่านั้น'],0,'ความโปร่งใสหมายถึงการเปิดเผยเชิงรุกและตรวจสอบได้'],
['a_strong',2,'"ความตื่นรู้" ตามหลัก STRONG หมายถึงข้อใด',['การรู้เท่าทันสถานการณ์และตระหนักถึงปัญหาการทุจริตรอบตัว','การตื่นนอนแต่เช้าตรู่เพื่อเตรียมตัวไปโรงเรียนให้ทันเวลา','การติดตามข่าวสารบันเทิงและเรื่องราวในสังคมทุกวันอย่างสม่ำเสมอ','การนอนหลับพักผ่อนให้เพียงพอเพื่อให้สมองตื่นตัวพร้อมเรียนรู้'],0,'R มาจาก Realise คือการตระหนักรู้และรู้เท่าทันปัญหา'],
['a_strong',2,'"การมุ่งไปข้างหน้า" ตามหลัก STRONG หมายถึงข้อใด',['การมุ่งมั่นทำสิ่งที่ถูกต้องต่อไปโดยไม่ย่อท้อต่ออุปสรรค','การเดินทางไปข้างหน้าเสมอโดยไม่หันกลับมามองสิ่งที่ผ่านมา','การไม่สนใจเรื่องราวในอดีตทั้งหมดเพื่อไม่ให้เป็นภาระทางใจ','การเร่งทำงานที่ได้รับมอบหมายให้เสร็จเร็วที่สุดเท่าที่ทำได้'],0,'O มาจาก Onward คือการเดินหน้าอย่างมีเป้าหมายและไม่ท้อถอย'],
['a_strong',2,'"ความเอื้ออาทร" ตามหลัก STRONG หมายถึงข้อใด',['การมีน้ำใจ ช่วยเหลือ และคำนึงถึงผู้อื่นในสังคม','การมอบเงินให้แก่ผู้ที่มาร้องขอความช่วยเหลือทุกครั้ง','การยอมทำตามคำขอร้องของผู้อื่นทุกอย่างโดยไม่ปฏิเสธ','การช่วยเพื่อนปกปิดความผิดเพื่อไม่ให้ถูกลงโทษ'],0,'G มาจาก Generosity คือความมีน้ำใจต่อผู้อื่นและส่วนรวม'],
['a_strong',2,'ข้อใดเป็นการนำหลักความพอเพียงมาใช้ในชุมชน',['ใช้ทรัพยากรของชุมชนอย่างประหยัดและคำนึงถึงคนรุ่นต่อไป','เร่งใช้ทรัพยากรที่มีให้หมดโดยเร็วก่อนที่ผู้อื่นจะมาใช้','เก็บรักษาทรัพยากรไว้โดยไม่อนุญาตให้ผู้ใดนำไปใช้เลย','ขายทรัพยากรของชุมชนทั้งหมดให้นายทุนจากภายนอก'],0,'ความพอเพียงคือการใช้อย่างพอดีและรักษาไว้ให้คนรุ่นหลัง'],
['a_strong',2,'การจัดทำป้ายแสดงรายรับรายจ่ายของกองทุนหมู่บ้าน ตรงกับหลักใดของ STRONG',['ความโปร่งใส','ความพอเพียง','ความเอื้ออาทร','การมุ่งไปข้างหน้า'],0,'การเปิดเผยข้อมูลให้ทุกคนตรวจสอบได้คือความโปร่งใส'],
['a_strong',2,'การที่นักเรียนศึกษาข่าวสารเรื่องการทุจริตเพื่อให้รู้เท่าทัน ตรงกับหลักใด',['ความรู้และความตื่นรู้','ความพอเพียง','ความเอื้ออาทร','การมุ่งไปข้างหน้า'],0,'การหาความรู้ควบคู่กับการตระหนักรู้ทำให้เรารู้เท่าทันการทุจริต'],
['a_strong',2,'การช่วยเหลือเพื่อนบ้านที่ประสบภัยน้ำท่วมโดยไม่หวังสิ่งตอบแทน ตรงกับหลักใด',['ความเอื้ออาทร','ความโปร่งใส','ความพอเพียง','ความตื่นรู้'],0,'การมีน้ำใจต่อผู้อื่นในยามลำบากคือความเอื้ออาทร'],
['a_strong',2,'ข้อใดไม่ใช่การปฏิบัติตามหลักความพอเพียง',['กู้เงินมาซื้อโทรศัพท์รุ่นใหม่ตามเพื่อน','จดบันทึกรายรับรายจ่ายของตนเองทุกวัน','แบ่งเงินออมไว้ส่วนหนึ่งก่อนนำไปใช้จ่าย','ซื้อของใช้เท่าที่จำเป็นต่อการเรียนจริง'],0,'การก่อหนี้เพื่อสิ่งที่ไม่จำเป็นขัดกับหลักความพอประมาณ'],
['a_strong',2,'การทำบัญชีรายรับรายจ่ายส่วนตัวช่วยเรื่องใดมากที่สุด',['ทำให้รู้ว่าใช้จ่ายเกินตัวหรือไม่และวางแผนการใช้เงินได้','ทำให้มีเงินเก็บเพิ่มขึ้นทันทีโดยไม่ต้องลดการใช้จ่าย','ทำให้ไม่จำเป็นต้องออมเงินอีกต่อไปเพราะควบคุมได้แล้ว','ทำให้สามารถซื้อของที่อยากได้มากขึ้นกว่าเดิมในแต่ละเดือน'],0,'บัญชีทำให้เห็นพฤติกรรมการใช้จ่ายของตนเองอย่างชัดเจน'],
['a_strong',3,'เหตุใดหลัก STRONG จึงเริ่มต้นที่ความพอเพียง',['เพราะความโลภที่เกินพอดีคือต้นเหตุสำคัญของการทุจริต','เพราะความพอเพียงเป็นสิ่งที่ปฏิบัติได้ง่ายที่สุดในหกด้าน','เพราะเป็นตัวอักษรตัวแรกที่เรียงอยู่หน้าสุดของคำนี้พอดี','เพราะความพอเพียงเกี่ยวข้องกับเรื่องการใช้เงินเพียงอย่างเดียว'],0,'เมื่อรู้จักพอ ความอยากได้สิ่งที่ไม่ใช่ของตนก็ลดลง'],
['a_strong',3,'ข้อใดแสดงถึงความโปร่งใสในการทำงานกลุ่มของนักเรียน',['บันทึกว่าใครทำอะไรและเปิดให้สมาชิกทุกคนดูได้','ให้หัวหน้ากลุ่มเป็นผู้รับรู้ข้อมูลทั้งหมดเพียงคนเดียว','ไม่ต้องบันทึกอะไรเพราะสมาชิกทุกคนจำกันได้อยู่แล้ว','รายงานครูเฉพาะส่วนของงานที่ทำได้ดีเท่านั้น'],0,'การบันทึกและเปิดเผยทำให้ทุกคนตรวจสอบความเป็นธรรมได้'],
['a_strong',3,'ข้อใดคือความสัมพันธ์ระหว่างความรู้กับการป้องกันการทุจริต',['ผู้ที่มีความรู้จะรู้ว่าอะไรผิดกฎหมายและไม่ตกเป็นเครื่องมือของผู้อื่น','ผู้ที่มีความรู้มากจะยิ่งหาช่องทางหลบเลี่ยงกฎหมายได้เก่งขึ้น','ความรู้เป็นเรื่องของการเรียนซึ่งไม่เกี่ยวข้องกับการทุจริตเลย','ความรู้ที่มากเกินไปทำให้คนกลัวความรับผิดชอบในการทำงาน'],0,'ความรู้ทำให้รู้เท่าทันและปฏิเสธการมีส่วนร่วมในสิ่งที่ผิดได้'],
['a_strong',3,'การที่ชุมชนร่วมกันตั้งกฎกติกาในการใช้ป่าชุมชน สะท้อนหลักใดของ STRONG มากที่สุด',['ความพอเพียงและความเอื้ออาทรต่อคนรุ่นต่อไป','ความรู้เพียงอย่างเดียว','การมุ่งไปข้างหน้าเพียงอย่างเดียว','ความโปร่งใสเพียงอย่างเดียว'],0,'การใช้อย่างพอดีและคำนึงถึงผู้อื่นคือหัวใจของกติกาชุมชน'],
['a_strong',3,'ข้อใดคือการนำหลัก STRONG ไปใช้ในระดับโรงเรียน',['จัดตั้งชมรมนักเรียนโปร่งใสที่ช่วยกันตรวจสอบและรณรงค์ความซื่อสัตย์','จัดการแข่งขันกีฬาสีให้บ่อยขึ้นเพื่อสร้างความสามัคคีในโรงเรียน','เพิ่มชั่วโมงเรียนวิชาคณิตศาสตร์เพื่อฝึกการคิดอย่างเป็นระบบ','กำหนดให้นักเรียนงดพูดคุยกันในเวลาเรียนเพื่อสร้างวินัย'],0,'การรวมกลุ่มเพื่อสร้างบรรยากาศของความโปร่งใสคือการใช้ STRONG ในทางปฏิบัติ'],
['a_strong',3,'เหตุใดความตื่นรู้จึงจำเป็นแม้เราไม่ได้เป็นผู้มีอำนาจ',['เพราะประชาชนที่ตื่นรู้จะช่วยกันสังเกตและแจ้งเบาะแสได้','เพราะผู้ที่แจ้งเบาะแสจะได้รับเงินรางวัลตอบแทนจากทางราชการ','เพราะผู้ที่ตื่นรู้เรื่องบ้านเมืองมักได้รับเลือกเป็นผู้นำชุมชน','เพราะผู้ที่ติดตามข่าวสารสม่ำเสมอจะได้รับการยกเว้นภาษี'],0,'พลังของประชาชนที่คอยสังเกตคือกลไกตรวจสอบที่กว้างขวางที่สุด'],
['a_strong',3,'ข้อใดเป็นการปฏิบัติตามหลักความเอื้ออาทรที่ถูกต้อง',['แบ่งปันอุปกรณ์การเรียนให้เพื่อนที่ขาดแคลน','ให้เพื่อนลอกการบ้านเพราะสงสาร','ช่วยเพื่อนปิดบังความผิด','ให้เงินเพื่อนเพื่อให้เลือกตนเป็นหัวหน้าห้อง'],0,'ความเอื้ออาทรต้องอยู่บนพื้นฐานของความถูกต้อง ไม่ใช่การช่วยให้ทำผิด'],
['a_strong',4,'ข้อใดวิเคราะห์ได้ถูกต้องว่าเหตุใด STRONG จึงต้องมีครบทั้ง 6 ด้าน',['เพราะแต่ละด้านเสริมกัน หากขาดด้านใดด้านหนึ่งภูมิคุ้มกันการทุจริตก็จะไม่สมบูรณ์','เพราะการรวมเป็นคำภาษาอังกฤษหกตัวอักษรทำให้จดจำได้ง่ายกว่าแบบอื่น','เพราะต้องมีจำนวนด้านให้เท่ากับจำนวนวันทำการในหนึ่งสัปดาห์พอดี','เพราะหน่วยงานที่รับผิดชอบเป็นผู้กำหนดจำนวนนี้มาตั้งแต่ต้น'],0,'ความพอเพียงโดยไม่มีความรู้หรือความโปร่งใสก็ยังป้องกันการทุจริตได้ไม่เต็มที่'],
['a_strong',3,'นักเรียนคนหนึ่งได้รับเงินรางวัลจากการแข่งขัน ควรใช้เงินอย่างไรจึงตรงกับหลักความพอเพียง',['แบ่งส่วนหนึ่งเก็บออม ส่วนหนึ่งใช้ตามความจำเป็น','นำไปใช้จ่ายให้หมดภายในวันเดียวเพื่อฉลองความสำเร็จ','แบ่งให้เพื่อนร่วมชั้นทั้งหมดเพื่อให้ได้รับคำชื่นชม','เลือกซื้อของที่ราคาแพงที่สุดเท่าที่เงินรางวัลจะซื้อได้'],0,'การแบ่งสัดส่วนระหว่างการออมกับการใช้จ่ายคือความพอประมาณและมีเหตุผล'],
['a_strong',2,'ข้อใดเป็นตัวอย่างของการมุ่งไปข้างหน้าในการต่อต้านการทุจริต',['แม้เคยแจ้งเรื่องแล้วยังไม่มีการแก้ไข ก็ยังคงทำสิ่งที่ถูกต้องต่อไป','เลิกให้ความสนใจกับปัญหานั้นเพราะเห็นว่าแก้ไขอะไรไม่ได้แล้ว','รอให้ผู้อื่นที่มีอำนาจมากกว่าเข้ามาจัดการแก้ปัญหาแทนตน','ย้ายไปอยู่ที่อื่นเพื่อหลีกหนีจากปัญหาที่เกิดขึ้นในพื้นที่เดิม'],0,'การไม่ย่อท้อต่ออุปสรรคคือความหมายของ Onward'],
['a_strong',3,'ข้อใดคือประโยชน์ของการมีจิตพอเพียงต่อชุมชน',['ผู้คนไม่เบียดเบียนทรัพยากรส่วนรวมและอยู่ร่วมกันได้อย่างยั่งยืน','ชุมชนจะมีรายได้เพิ่มขึ้นและร่ำรวยกว่าชุมชนอื่นในระยะเวลาอันสั้น','ไม่จำเป็นต้องมีกฎระเบียบใดๆ มาควบคุมความประพฤติของคนอีกต่อไป','ทุกคนในชุมชนจะมีรายได้และทรัพย์สินเท่าเทียมกันทุกครัวเรือน'],0,'เมื่อทุกคนรู้จักพอ ทรัพยากรส่วนรวมก็เพียงพอสำหรับทุกคน'],
['a_strong',2,'ข้อใดคือความหมายของคำว่า "ภูมิคุ้มกัน" ตามหลักเศรษฐกิจพอเพียง',['การเตรียมพร้อมรับผลกระทบและความเปลี่ยนแปลงที่อาจเกิดขึ้น','การดูแลสุขภาพร่างกายให้แข็งแรงและฉีดวัคซีนป้องกันโรคครบถ้วน','การหลีกเลี่ยงความเปลี่ยนแปลงทุกชนิดเพื่อรักษาสภาพเดิมเอาไว้','การเก็บออมเงินไว้ทั้งหมดโดยไม่นำออกมาใช้จ่ายไม่ว่ากรณีใด'],0,'ภูมิคุ้มกันที่ดีคือการเตรียมตัวรับความไม่แน่นอนล่วงหน้า'],

/* ---------- หน่วยที่ 4 พลเมืองกับความรับผิดชอบต่อสังคม (24 ข้อ) ---------- */
['a_citizen',1,'ข้อใดคือลักษณะของพลเมืองในระบอบประชาธิปไตย',['เคารพกติกา รับฟังความเห็นต่าง และมีส่วนร่วมในกิจกรรมส่วนรวม','ปฏิบัติตามคำสั่งของผู้มีอำนาจทุกอย่างโดยไม่ตั้งคำถามใดๆ','ให้ความสนใจเฉพาะเรื่องของตนเองและครอบครัวเป็นหลัก','หลีกเลี่ยงการเข้าร่วมกิจกรรมส่วนรวมเพื่อไม่ให้เสียเวลา'],0,'พลเมืองในระบอบประชาธิปไตยต้องทั้งเคารพกติกาและมีส่วนร่วม'],
['a_citizen',1,'การเสียภาษีของประชาชนมีความสำคัญอย่างไร',['เป็นรายได้ที่รัฐนำไปพัฒนาประเทศและบริการสาธารณะ','เป็นมาตรการลงโทษผู้ที่มีรายได้สูงกว่าคนทั่วไปในสังคม','เป็นเงินที่เจ้าหน้าที่ของรัฐนำไปใช้เป็นรายได้ส่วนตัว','เป็นค่าใช้จ่ายที่ไม่จำเป็นและควรยกเลิกไปในอนาคต'],0,'ภาษีคือเงินส่วนรวมที่ใช้สร้างถนน โรงเรียน โรงพยาบาล และบริการอื่นๆ'],
['a_citizen',1,'ข้อใดเป็นการมีส่วนร่วมของประชาชนในการดูแลชุมชน',['เข้าร่วมประชุมประชาคมหมู่บ้านและแสดงความคิดเห็น','วิจารณ์ปัญหาของหมู่บ้านแต่ไม่เคยเข้าร่วมประชุมเลย','ปล่อยให้ผู้ใหญ่บ้านเป็นผู้ตัดสินใจทุกเรื่องเพียงผู้เดียว','ย้ายออกจากหมู่บ้านทันทีเมื่อเกิดปัญหาที่แก้ไขได้ยาก'],0,'การเข้าร่วมและแสดงความเห็นคือการมีส่วนร่วมที่แท้จริง'],
['a_citizen',2,'เหตุใดพลเมืองจึงต้องช่วยกันตรวจสอบการใช้งบประมาณของหน่วยงานในท้องถิ่น',['เพราะเป็นเงินภาษีของประชาชนที่ต้องใช้ให้เกิดประโยชน์ต่อส่วนรวม','เพราะต้องการจับผิดเจ้าหน้าที่ที่ปฏิบัติงานอยู่ในหน่วยงานนั้น','เพราะเป็นกิจกรรมยามว่างที่น่าสนใจและได้ความรู้เพิ่มเติม','เพราะผู้ที่ร่วมตรวจสอบจะได้รับส่วนแบ่งจากงบประมาณด้วย'],0,'ประชาชนเป็นเจ้าของภาษีจึงมีสิทธิและหน้าที่ในการตรวจสอบ'],
['a_citizen',2,'ข้อใดเป็นการใช้สิทธิเลือกตั้งอย่างมีคุณภาพ',['ศึกษาประวัติและนโยบายของผู้สมัครก่อนตัดสินใจ','เลือกผู้สมัครที่ให้เงินหรือสิ่งของตอบแทนมากที่สุด','ลงคะแนนตามที่คนในครอบครัวหรือเพื่อนบ้านบอกมา','ไม่ไปใช้สิทธิเพราะคิดว่าเสียงของตนไม่มีความหมาย'],0,'การเลือกอย่างมีข้อมูลคือหัวใจของการเลือกตั้งที่มีคุณภาพ'],
['a_citizen',2,'การซื้อสิทธิขายเสียงส่งผลเสียอย่างไร',['ทำให้ได้ผู้แทนที่ไม่ได้มาจากความสามารถและอาจทุจริตเพื่อถอนทุน','ทำให้ประชาชนในพื้นที่มีรายได้เพิ่มขึ้นอย่างต่อเนื่องและยั่งยืน','ทำให้กระบวนการเลือกตั้งเสร็จสิ้นได้รวดเร็วกว่าปกติมาก','ทำให้ทุกคนในชุมชนได้รับประโยชน์อย่างเท่าเทียมกันทุกครัวเรือน'],0,'ผู้ที่ใช้เงินซื้อเสียงมักหาทางถอนทุนคืนด้วยการทุจริต'],
['a_citizen',2,'ข้อใดคือหน้าที่ของพลเมืองตามกฎหมาย',['ปฏิบัติตามกฎหมายและเสียภาษีตามที่กำหนด','เลือกทำตามกฎหมายเฉพาะข้อที่ชอบ','ปฏิบัติตามกฎหมายเมื่อมีเจ้าหน้าที่อยู่','ไม่ต้องทำอะไรเลย'],0,'การปฏิบัติตามกฎหมายเป็นหน้าที่ที่ต้องทำเสมอไม่ว่าจะมีใครเห็นหรือไม่'],
['a_citizen',2,'การทิ้งขยะลงแม่น้ำลำคลองส่งผลอย่างไรต่อส่วนรวม',['ทำให้น้ำเน่าเสียและคนทั้งชุมชนได้รับผลกระทบ','ทำให้แหล่งน้ำมีสารอาหารเพิ่มขึ้นจนปลาเติบโตดี','ทำให้สัตว์น้ำมีที่หลบซ่อนตัวจากศัตรูมากขึ้นกว่าเดิม','ไม่ส่งผลกระทบใดเพราะน้ำจะพัดพาขยะออกไปเอง'],0,'การผลักภาระของตนสู่แหล่งน้ำสาธารณะกระทบทุกคนที่ใช้น้ำ'],
['a_citizen',2,'ข้อใดเป็นการรับผิดชอบต่อส่วนรวมของนักเรียน',['ช่วยกันดูแลทรัพย์สินของโรงเรียนและแจ้งเมื่อพบสิ่งชำรุด','ใช้ของส่วนรวมจนชำรุดเสียหายแล้วไม่แจ้งให้ผู้ใดทราบ','ถือว่าการดูแลทรัพย์สินเป็นหน้าที่ของครูและภารโรงเท่านั้น','รื้อของเล่นในสนามออกมาดัดแปลงเพื่อความสนุกสนาน'],0,'การแจ้งซ่อมและช่วยดูแลคือความรับผิดชอบต่อทรัพย์สินส่วนรวม'],
['a_citizen',2,'"จิตสาธารณะ" หมายถึงข้อใด',['ความสำนึกที่จะทำประโยชน์เพื่อส่วนรวมโดยไม่หวังผลตอบแทน','ความต้องการมีชื่อเสียงและได้รับการยอมรับจากคนในสังคม','ความสามารถในการพูดต่อหน้าสาธารณชนได้อย่างมั่นใจ','ความรู้จักใช้บริการสาธารณะที่รัฐจัดให้อย่างคุ้มค่าที่สุด'],0,'จิตสาธารณะคือการคิดถึงส่วนรวมและลงมือทำโดยไม่หวังผลตอบแทน'],
['a_citizen',2,'ข้อใดเป็นการเคารพกฎกติกาของชุมชน',['ปฏิบัติตามข้อตกลงร่วมของหมู่บ้าน เช่น การจัดเวรทำความสะอาด','ปฏิบัติตามข้อตกลงของหมู่บ้านเฉพาะเมื่อมีผู้อื่นคอยสังเกตอยู่','คัดค้านทุกข้อตกลงที่ไม่ตรงกับความต้องการของตนเองเสมอ','ไม่เข้าร่วมกิจกรรมใดของหมู่บ้านเพราะถือว่าไม่ใช่หน้าที่'],0,'ข้อตกลงร่วมของชุมชนต้องได้รับความร่วมมือจากทุกคนจึงจะได้ผล'],
['a_citizen',2,'ข้อใดเป็นการแสดงความคิดเห็นอย่างเป็นพลเมืองที่ดี',['เสนอความเห็นด้วยเหตุผลและรับฟังความเห็นของผู้อื่น','ใช้เสียงดังข่มผู้ที่มีความคิดเห็นแตกต่างจากตนเอง','เลือกใช้ถ้อยคำรุนแรงเพื่อให้ผู้อื่นหันมาสนใจข้อเสนอ','พูดต่อเนื่องจนจบโดยไม่เปิดโอกาสให้ผู้อื่นได้แสดงความเห็น'],0,'การใช้เหตุผลและรับฟังกันคือพื้นฐานของสังคมประชาธิปไตย'],
['a_citizen',3,'เหตุใดการมีส่วนร่วมของประชาชนจึงช่วยลดการทุจริตได้',['เพราะเมื่อมีคนจำนวนมากคอยติดตาม ผู้ที่คิดทุจริตจะทำได้ยากขึ้น','เพราะประชาชนมีอำนาจเข้าจับกุมผู้ที่ทุจริตได้ด้วยตนเองทันที','เพราะช่วยแบ่งเบาภาระจนเจ้าหน้าที่ไม่ต้องทำงานตรวจสอบอีก','เพราะเมื่อประชาชนดูแลกันเองแล้วก็ไม่จำเป็นต้องมีกฎหมาย'],0,'สายตาของประชาชนคือกลไกตรวจสอบที่ครอบคลุมที่สุด'],
['a_citizen',3,'ข้อใดคือความรับผิดชอบของผู้นำชุมชนที่ดี',['ใช้งบประมาณอย่างโปร่งใสและรายงานให้ลูกบ้านทราบ','ตัดสินใจทุกเรื่องด้วยตนเองโดยไม่ต้องปรึกษาผู้ใดเพื่อความรวดเร็ว','จัดสรรประโยชน์ให้เฉพาะกลุ่มที่เคยให้การสนับสนุนตนเองมาก่อน','เก็บข้อมูลการใช้จ่ายเงินไว้เป็นความลับเพื่อป้องกันความวุ่นวาย'],0,'ผู้นำที่ดีต้องพร้อมให้ตรวจสอบและรายงานต่อผู้ที่มอบอำนาจให้'],
['a_citizen',3,'นักเรียนสามารถมีส่วนร่วมในการป้องกันการทุจริตในโรงเรียนได้อย่างไร',['ร่วมกิจกรรมรณรงค์ ปฏิบัติตนซื่อสัตย์ และแจ้งครูเมื่อพบสิ่งไม่ถูกต้อง','รอให้ครูและผู้บริหารเป็นผู้จัดการแก้ไขปัญหาทุกเรื่องด้วยตนเอง','ถือว่าเรื่องการทุจริตเป็นเรื่องของผู้ใหญ่ที่เด็กไม่ควรเข้าไปยุ่ง','หลีกเลี่ยงการเข้าไปเกี่ยวข้องกับปัญหาเพื่อไม่ให้เกิดความขัดแย้ง'],0,'การเริ่มจากตนเองและใช้ช่องทางที่เหมาะสมคือบทบาทที่นักเรียนทำได้'],
['a_citizen',3,'ข้อใดเป็นผลของการที่ประชาชนไม่สนใจตรวจสอบผู้มีอำนาจ',['ผู้มีอำนาจอาจใช้อำนาจโดยมิชอบได้ง่ายขึ้น','บ้านเมืองจะสงบสุขมากขึ้น','งบประมาณจะถูกใช้อย่างคุ้มค่าขึ้น','การพัฒนาจะเร็วขึ้น'],0,'การขาดการตรวจสอบเปิดช่องให้เกิดการใช้อำนาจในทางที่ผิด'],
['a_citizen',3,'ข้อใดคือความสัมพันธ์ระหว่างสิทธิกับหน้าที่',['เมื่อเรามีสิทธิ เราก็มีหน้าที่ต้องเคารพสิทธิของผู้อื่นด้วย','สิทธิของแต่ละคนย่อมสำคัญกว่าหน้าที่ที่ต้องปฏิบัติเสมอ','หน้าที่เป็นเรื่องของผู้ที่ยังไม่ได้รับสิทธิอย่างเต็มที่เท่านั้น','สิทธิและหน้าที่เป็นคนละเรื่องที่ไม่เกี่ยวข้องกันเลยแม้แต่น้อย'],0,'สิทธิและหน้าที่เป็นสองด้านของเหรียญเดียวกันในสังคม'],
['a_citizen',3,'การอาสาช่วยงานส่วนรวมของหมู่บ้านโดยไม่รับค่าตอบแทน แสดงถึงสิ่งใด',['จิตสาธารณะและความรับผิดชอบต่อชุมชน','ความต้องการก้าวขึ้นเป็นผู้นำของหมู่บ้าน','การไม่มีงานประจำทำจึงมีเวลาว่างมาก','การหลีกเลี่ยงงานบ้านที่ต้องรับผิดชอบ'],0,'การเสียสละเวลาเพื่อส่วนรวมคือการแสดงจิตสาธารณะ'],
['a_citizen',3,'ข้อใดคือบทบาทของสื่อมวลชนในการป้องกันการทุจริต',['นำเสนอข้อเท็จจริงและเปิดเผยเรื่องที่ไม่ถูกต้องให้สังคมรับรู้','นำเสนอเฉพาะข่าวบันเทิงเพื่อผ่อนคลายความเครียดของผู้ชม','ปกปิดข้อมูลบางอย่างไว้เพื่อรักษาความสงบเรียบร้อยของบ้านเมือง','เผยแพร่ข่าวลือที่ได้ยินมาอย่างรวดเร็วโดยไม่ต้องตรวจสอบก่อน'],0,'สื่อที่ทำหน้าที่ตรวจสอบช่วยให้สังคมรับรู้และเกิดการแก้ไข'],
['a_citizen',3,'ข้อใดเป็นการปฏิบัติตนเป็นพลเมืองดีในโลกออนไลน์',['ตรวจสอบข้อมูลก่อนแชร์และไม่เผยแพร่ข่าวเท็จ','แชร์ทุกข่าวที่เห็นทันที','แสดงความเห็นด้วยถ้อยคำรุนแรง','สร้างบัญชีปลอมเพื่อว่าร้ายผู้อื่น'],0,'การไม่เผยแพร่ข้อมูลเท็จคือความรับผิดชอบของพลเมืองยุคดิจิทัล'],
['a_citizen',4,'ข้อใดอธิบายบทบาทของพลเมืองในการสร้างสังคมที่ปราศจากการทุจริตได้ครอบคลุมที่สุด',['เริ่มจากการเป็นคนซื่อสัตย์ ไม่ยอมรับการทุจริต และร่วมตรวจสอบผู้มีอำนาจอย่างสร้างสรรค์','เพียงแค่ระวังไม่ให้ตนเองกระทำผิดก็ถือว่าได้ทำหน้าที่พลเมืองครบถ้วนแล้ว','ปล่อยให้เป็นหน้าที่ของหน่วยงานรัฐที่มีอำนาจและความเชี่ยวชาญโดยตรง','รอดูให้ผู้อื่นในสังคมเริ่มลงมือทำก่อนแล้วจึงค่อยเข้าร่วมภายหลัง'],0,'ต้องมีทั้งการปฏิบัติที่ตนเองและการมีส่วนร่วมดูแลส่วนรวม'],
['a_citizen',2,'ข้อใดเป็นการใช้บริการสาธารณะอย่างมีความรับผิดชอบ',['ใช้ห้องสมุดประชาชนแล้วเก็บหนังสือเข้าที่และรักษาความสะอาด','นำหนังสือจากห้องสมุดกลับบ้านโดยไม่ทำเรื่องยืมตามระเบียบ','พูดคุยเสียงดังในห้องสมุดจนรบกวนผู้อื่นที่กำลังอ่านหนังสือ','ฉีกหน้าที่ต้องการออกจากหนังสือเพื่อนำกลับไปอ่านที่บ้าน'],0,'บริการสาธารณะเป็นของทุกคน จึงต้องใช้อย่างรักษาไว้ให้คนอื่นด้วย'],
['a_citizen',2,'ข้อใดคือประโยชน์ของการที่ชุมชนมีกติการ่วมกันที่ทุกคนยอมรับ',['ลดความขัดแย้งและทำให้การใช้ทรัพยากรส่วนรวมเป็นธรรมกับทุกคน','ทำให้ผู้นำชุมชนมีอำนาจในการสั่งการลูกบ้านได้มากขึ้นกว่าเดิม','ทำให้ชุมชนมีรายได้เพิ่มขึ้นทันทีจากการจัดระเบียบที่ดีขึ้น','ทำให้ไม่จำเป็นต้องปฏิบัติตามกฎหมายของรัฐอีกต่อไปในพื้นที่'],0,'กติกาที่ทุกคนยอมรับร่วมกันช่วยให้อยู่ร่วมกันได้อย่างเป็นธรรม'],
['a_citizen',3,'เหตุใดการปลูกฝังความเป็นพลเมืองดีจึงควรเริ่มตั้งแต่ในโรงเรียน',['เพราะโรงเรียนเป็นสังคมย่อยที่ฝึกให้นักเรียนอยู่ร่วมกันตามกติกาก่อนออกสู่สังคมใหญ่','เพราะโรงเรียนเป็นสถานที่ที่มีกฎระเบียบมากที่สุดเมื่อเทียบกับที่อื่นในสังคม','เพราะครูจำเป็นต้องใช้กฎเหล่านี้ในการควบคุมความประพฤติของนักเรียน','เพราะเป็นข้อบังคับที่กระทรวงกำหนดให้ทุกโรงเรียนต้องปฏิบัติตาม'],0,'โรงเรียนคือสนามฝึกความเป็นพลเมืองก่อนเข้าสู่สังคมจริง'],
];

['a_sep',1,'"ระบบคิดฐานสอง" (Digital) มีลักษณะอย่างไร',['แยกแยะถูกผิดออกจากกันอย่างชัดเจน ไม่นำมาปะปนกัน','คิดได้หลายระดับและปรับเปลี่ยนตามความเหมาะสมของสถานการณ์','ตัดสินใจตามความรู้สึกในขณะนั้นโดยไม่ต้องใช้หลักเกณฑ์ใด','ตัดสินใจตามแนวทางที่คนส่วนใหญ่ในสังคมนิยมปฏิบัติกัน'],0,'ระบบคิดฐานสองคือการแยกผิดกับถูกออกจากกันเด็ดขาดเหมือนเลข 0 กับ 1'],
['a_sep',1,'"ระบบคิดฐานสิบ" (Analog) มีลักษณะอย่างไร',['มีหลายระดับปะปนกันจนแยกผลประโยชน์ส่วนตนออกจากส่วนรวมได้ยาก','สามารถแยกความถูกออกจากความผิดได้อย่างชัดเจนที่สุดในทุกกรณี','เป็นวิธีคิดที่ใช้ได้เฉพาะกับการคำนวณในวิชาคณิตศาสตร์เท่านั้น','ช่วยให้การตัดสินใจของผู้มีอำนาจเป็นธรรมต่อทุกฝ่ายมากขึ้น'],0,'ระบบคิดฐานสิบมีหลายระดับจนเกิดข้ออ้างให้ผลประโยชน์ปะปนกันได้'],
['a_sep',2,'ระบบคิดแบบใดที่ช่วยป้องกันการทุจริตได้ดีกว่า และเพราะเหตุใด',['ระบบคิดฐานสอง เพราะแยกผลประโยชน์ส่วนตนกับส่วนรวมออกจากกันอย่างเด็ดขาด','ระบบคิดฐานสิบ เพราะมีความยืดหยุ่นและปรับใช้ได้กับหลายสถานการณ์','ทั้งสองระบบให้ผลในการป้องกันการทุจริตไม่แตกต่างกันอย่างมีนัยสำคัญ','ไม่มีระบบคิดใดที่เกี่ยวข้องกับการป้องกันการทุจริตได้อย่างแท้จริง'],0,'เมื่อไม่มีพื้นที่สีเทา ก็ไม่มีข้ออ้างให้ผลประโยชน์ปะปนกัน'],
['a_sep',2,'ข้อใดเป็นตัวอย่างของการคิดแบบระบบฐานสิบ',['คิดว่าเอาของหลวงมาใช้นิดหน่อยคงไม่เป็นไรเพราะไม่ได้เสียหายมาก','คิดว่าของหลวงคือของหลวง ห้ามนำมาใช้ส่วนตัวเด็ดขาด','แยกเงินส่วนตัวกับเงินส่วนรวมออกจากกันทันที','ปฏิเสธของขวัญจากผู้มาติดต่อทุกกรณี'],0,'คำว่า "นิดหน่อยคงไม่เป็นไร" คือลักษณะของการคิดแบบฐานสิบ'],
['a_sep',2,'ข้อใดเป็นตัวอย่างของการคิดแบบระบบฐานสอง',['ไม่รับของขวัญจากผู้ที่มาติดต่องานไม่ว่าจะมีมูลค่าเท่าใด','รับของขวัญจากผู้มาติดต่อได้หากมีราคาไม่สูงจนเกินไปนัก','รับของขวัญได้เพราะเพื่อนร่วมงานคนอื่นก็รับกันเป็นเรื่องปกติ','รับของขวัญได้ตราบใดที่ไม่มีผู้ใดล่วงรู้และไม่มีใครเสียหาย'],0,'ระบบคิดฐานสองไม่มีเงื่อนไขว่าเล็กหรือใหญ่ ถูกคือถูก ผิดคือผิด'],
['a_sep',2,'ข้อใดคือรูปแบบหนึ่งของการขัดกันระหว่างผลประโยชน์ส่วนตนกับส่วนรวม',['การที่เจ้าหน้าที่รัฐไปทำงานให้บริษัทที่ตนเคยกำกับดูแลทันทีหลังลาออก','การที่เจ้าหน้าที่รัฐรับเงินเดือนและค่าตอบแทนตามระเบียบที่กำหนดไว้','การที่เจ้าหน้าที่รัฐลาพักผ่อนประจำปีตามสิทธิที่ทางราชการให้ไว้','การที่เจ้าหน้าที่รัฐเข้ารับการอบรมเพิ่มความรู้ตามที่หน่วยงานจัดให้'],0,'การย้ายไปทำงานให้ผู้ที่ตนเคยกำกับดูแลอาจนำข้อมูลภายในไปใช้ได้'],
['a_sep',2,'"การรับผลประโยชน์" ในรูปแบบของประโยชน์ทับซ้อนหมายถึงข้อใด',['การรับเงิน สิ่งของ หรือบริการจากผู้ที่เกี่ยวข้องกับหน้าที่ของตน','การรับเงินเดือนและสวัสดิการจากหน่วยงานที่ตนปฏิบัติงานอยู่','การรับคำชมเชยและกำลังใจจากประชาชนที่มาใช้บริการของรัฐ','การรับมอบหมายงานเพิ่มเติมจากผู้บังคับบัญชาตามสายงาน'],0,'สิ่งที่ได้รับจากผู้เกี่ยวข้องกับงานอาจทำให้การตัดสินใจไม่เป็นกลาง'],
['a_sep',2,'"การใช้อิทธิพลเพื่อประโยชน์ของเครือญาติ" หมายถึงข้อใด',['การใช้ตำแหน่งหน้าที่ช่วยให้ญาติได้งานหรือได้สิทธิที่ไม่ควรได้','การให้คำแนะนำแก่ญาติเรื่องการเรียนต่อและการเลือกอาชีพในอนาคต','การช่วยญาติทำงานบ้านและงานในไร่นาในวันหยุดราชการของตน','การพาญาติผู้สูงอายุไปพบแพทย์ที่โรงพยาบาลเมื่อเจ็บป่วย'],0,'การใช้อำนาจในตำแหน่งเอื้อประโยชน์ให้เครือญาติคือประโยชน์ทับซ้อนรูปแบบหนึ่ง'],
['a_sep',2,'ข้อใดเป็นการนำทรัพย์สินของทางราชการไปใช้ประโยชน์ส่วนตัว',['ใช้รถของหน่วยงานไปรับส่งลูกไปโรงเรียนเป็นประจำ','ใช้รถของหน่วยงานไปปฏิบัติราชการตามคำสั่ง','ใช้รถส่วนตัวไปทำงานแล้วเบิกค่าน้ำมันตามระเบียบ','ใช้รถของหน่วยงานไปส่งเอกสารราชการ'],0,'รถของหน่วยงานมีไว้เพื่อภารกิจของหน่วยงานเท่านั้น'],
['a_sep',2,'ข้อใดคือความหมายของ "สินบน"',['เงินหรือประโยชน์ที่ให้แก่เจ้าหน้าที่เพื่อให้ทำหรือไม่ทำสิ่งใดในหน้าที่','ค่าจ้างที่ผู้ว่าจ้างจ่ายให้ผู้รับจ้างตามข้อตกลงในสัญญาที่ทำไว้','เงินบริจาคที่ประชาชนมอบให้วัดหรือโรงเรียนด้วยความสมัครใจ','ภาษีที่ประชาชนมีหน้าที่ต้องชำระให้รัฐตามที่กฎหมายกำหนดไว้'],0,'สินบนคือประโยชน์ที่ให้เพื่อแลกกับการใช้อำนาจหน้าที่'],
['a_sep',3,'เหตุใดการรับสินบนจึงเป็นความผิดร้ายแรงกว่าการรับของขวัญทั่วไป',['เพราะเป็นการซื้อขายอำนาจหน้าที่ ทำให้ผู้ที่ไม่จ่ายเสียสิทธิที่ควรได้','เพราะสินบนที่มีการเรียกรับกันมักมีมูลค่าสูงกว่าของขวัญทั่วไปเสมอ','เพราะการให้สินบนต้องจ่ายเป็นเงินสดเท่านั้นจึงตรวจสอบได้ยากกว่า','เพราะการให้สินบนมักกระทำต่อหน้าผู้คนจำนวนมากอย่างเปิดเผย'],0,'สินบนทำให้บริการของรัฐกลายเป็นสิ่งที่ต้องซื้อ ผู้ยากจนจึงเสียเปรียบ'],
['a_sep',3,'ข้อใดเป็นการทุจริตในการจัดซื้อจัดจ้างของหน่วยงาน',['ล็อกสเปกให้มีบริษัทเดียวที่เข้าเงื่อนไขได้','เปิดให้หลายบริษัทเสนอราคาแข่งขันกัน','ประกาศรายละเอียดการจัดซื้อทางเว็บไซต์','ตั้งกรรมการตรวจรับหลายคน'],0,'การกำหนดเงื่อนไขให้เอื้อบริษัทใดบริษัทหนึ่งคือการทุจริตรูปแบบหนึ่ง'],
['a_sep',3,'ข้อใดคือผลกระทบของการทุจริตในโครงการก่อสร้างของรัฐ',['งานมีคุณภาพต่ำ ชำรุดเร็ว และประชาชนต้องเสียงบประมาณซ่อมซ้ำ','งานก่อสร้างเสร็จเร็วขึ้นและได้คุณภาพดีกว่าที่กำหนดไว้ในสัญญา','ประชาชนได้ใช้สิ่งก่อสร้างที่มีต้นทุนถูกลงกว่าราคาตลาดทั่วไป','งบประมาณของรัฐเหลือมากขึ้นจนนำไปทำโครงการอื่นได้เพิ่ม'],0,'เงินที่รั่วไหลไปทำให้วัสดุและคุณภาพงานลดลงตามไปด้วย'],
['a_sep',3,'ข้อใดเป็นวิธีป้องกันการขัดกันของผลประโยชน์ที่ได้ผลที่สุด',['กำหนดให้ผู้มีส่วนได้เสียเปิดเผยข้อมูลและถอนตัวจากการตัดสินใจเรื่องนั้น','ให้ผู้มีอำนาจสูงสุดเป็นผู้ตัดสินใจเพียงคนเดียวเพื่อความรวดเร็วในการทำงาน','ลดขั้นตอนการบันทึกรายงานการประชุมลงเพื่อให้การทำงานคล่องตัวขึ้น','คัดเลือกกรรมการจากผู้ที่รู้จักคุ้นเคยกันเพื่อให้ทำงานร่วมกันได้ราบรื่น'],0,'การเปิดเผยและถอนตัวคือมาตรฐานสากลในการจัดการประโยชน์ทับซ้อน'],
['a_sep',3,'ข้อใดคือความแตกต่างระหว่างการทุจริตกับความผิดพลาดในการทำงาน',['การทุจริตมีเจตนาแสวงหาประโยชน์ ส่วนความผิดพลาดเกิดโดยไม่ตั้งใจ','การทุจริตกับความผิดพลาดมีความหมายเหมือนกันทุกประการในทางกฎหมาย','ความผิดพลาดในการทำงานมีบทลงโทษที่หนักกว่าการทุจริตอย่างชัดเจน','การทุจริตเกิดขึ้นได้เฉพาะกับผู้ที่ดำรงตำแหน่งระดับสูงในหน่วยงาน'],0,'เจตนาคือสิ่งที่แยกการทุจริตออกจากความบกพร่องธรรมดา'],
['a_sep',3,'เหตุใดผู้ดำรงตำแหน่งทางการเมืองจึงต้องยื่นบัญชีทรัพย์สินและหนี้สิน',['เพื่อให้ตรวจสอบได้ว่ามีทรัพย์สินเพิ่มขึ้นผิดปกติระหว่างดำรงตำแหน่งหรือไม่','เพื่อให้ประชาชนได้ทราบว่าผู้ดำรงตำแหน่งคนใดมีฐานะร่ำรวยที่สุด','เพื่อใช้เป็นข้อมูลประกอบการคำนวณเงินเดือนและค่าตอบแทนที่เหมาะสม','เพื่อใช้เป็นเอกสารประกอบการยื่นขอสินเชื่อจากธนาคารได้สะดวกขึ้น'],0,'การเปรียบเทียบทรัพย์สินก่อนและหลังดำรงตำแหน่งช่วยตรวจจับความร่ำรวยผิดปกติ'],
['a_sep',3,'ข้อใดแสดงว่าโรงเรียนมีการบริหารที่แยกผลประโยชน์ได้ชัดเจน',['เปิดเผยรายรับรายจ่ายและให้คณะกรรมการสถานศึกษาร่วมตรวจสอบ','ให้ผู้บริหารเก็บเอกสารการเงินไว้คนเดียว','จัดซื้อจากร้านเดียวมาโดยตลอดโดยไม่เปรียบเทียบราคา','ไม่ต้องรายงานผลการใช้เงินให้ใครทราบ'],0,'ความโปร่งใสและการมีผู้ร่วมตรวจสอบคือหลักประกันความเป็นธรรม'],
['a_sep',3,'ข้อใดคือเหตุผลที่การทุจริตส่งผลต่อการพัฒนาประเทศ',['งบประมาณที่ควรใช้พัฒนาถูกนำไปเป็นประโยชน์ส่วนตน ทำให้ประเทศพัฒนาช้าลง','ทำให้ประเทศได้รับเงินช่วยเหลือจากต่างประเทศเพิ่มขึ้นเพื่อแก้ปัญหา','ทำให้ประชาชนต้องขยันทำงานมากขึ้นเพื่อชดเชยรายได้ที่ขาดหายไป','การทุจริตเป็นเรื่องภายในหน่วยงานจึงไม่ส่งผลต่อการพัฒนาประเทศ'],0,'ทุกบาทที่รั่วไหลคือถนน โรงเรียน หรือโรงพยาบาลที่หายไป'],
['a_sep',4,'ข้อใดวิเคราะห์ระบบคิดฐานสองได้ถูกต้องที่สุด',['เป็นการฝึกให้ตัดสินใจโดยไม่หาข้ออ้างให้ผลประโยชน์ส่วนตนแทรกเข้ามาในหน้าที่','เป็นวิธีการคำนวณตัวเลขในระบบคอมพิวเตอร์ที่ใช้เลขศูนย์กับเลขหนึ่ง','เป็นการแบ่งงานที่ได้รับมอบหมายออกเป็นสองส่วนเพื่อให้เสร็จเร็วขึ้น','เป็นการตัดสินใจโดยเลือกทางที่ปฏิบัติได้ง่ายที่สุดในแต่ละสถานการณ์'],0,'หัวใจของระบบคิดฐานสองคือการไม่เปิดพื้นที่ให้ข้ออ้าง'],
['a_sep',4,'ข้อใดเป็นสถานการณ์ที่ต้องใช้ระบบคิดฐานสองมากที่สุด',['เป็นกรรมการคัดเลือกนักเรียนดีเด่นแล้วมีผู้ปกครองนำของมาให้','เลือกซื้อขนมที่ตนชอบด้วยเงินค่าขนมที่ได้รับจากผู้ปกครอง','เลือกลงเรียนวิชาเลือกเสรีที่ตรงกับความสนใจของตนเองมากที่สุด','ตัดสินใจว่าจะอ่านหนังสือวิชาใดก่อนในการเตรียมตัวสอบปลายภาค'],0,'สถานการณ์ที่หน้าที่ส่วนรวมกับประโยชน์ส่วนตนมาบรรจบกันคือจุดที่ต้องคิดฐานสอง'],
['a_sep',2,'ข้อใดเป็นทรัพย์สินของแผ่นดินที่ประชาชนทุกคนเป็นเจ้าของร่วมกัน',['ป่าไม้ แหล่งน้ำ และแร่ธาตุตามธรรมชาติ','บ้านและที่ดินของเอกชน','รถยนต์ส่วนบุคคล','เงินฝากในบัญชีธนาคารของประชาชน'],0,'ทรัพยากรธรรมชาติเป็นสมบัติของชาติที่ทุกคนเป็นเจ้าของร่วมกัน'],
['a_sep',2,'ข้อใดคือหน้าที่ของเจ้าหน้าที่รัฐต่อประชาชน',['ให้บริการอย่างเท่าเทียมโดยไม่เลือกปฏิบัติ','ให้บริการเฉพาะผู้ที่รู้จักกัน','ให้บริการเร็วขึ้นสำหรับผู้ที่จ่ายเงินเพิ่ม','ให้บริการเฉพาะผู้ที่มีฐานะดี'],0,'ความเท่าเทียมในการรับบริการเป็นสิทธิพื้นฐานของประชาชน'],
['a_sep',3,'ข้อใดเป็นตัวอย่างของการเลือกปฏิบัติที่ไม่เป็นธรรม',['จัดคิวให้ผู้ที่เป็นญาติได้รับบริการก่อนผู้ที่มารอตั้งแต่เช้า','จัดลำดับคิวตามเวลาที่มาถึง','ให้ผู้พิการและผู้สูงอายุได้รับบริการก่อนตามระเบียบ','ให้บริการตามหมายเลขบัตรคิว'],0,'การให้สิทธิตามระเบียบแก่ผู้ต้องการความช่วยเหลือพิเศษไม่ใช่การเลือกปฏิบัติ'],
['a_sep',3,'ข้อใดคือความสำคัญของการทำบัญชีและเก็บหลักฐานการใช้เงินของส่วนรวม',['ทำให้ตรวจสอบย้อนหลังได้และยืนยันความสุจริตของผู้รับผิดชอบ','ทำให้ขั้นตอนการทำงานล่าช้าลงจนผู้อื่นไม่กล้าขอใช้เงินโดยง่าย','ทำให้สิ้นเปลืองกระดาษและเวลาโดยไม่เกิดประโยชน์อันใดตามมา','ทำให้ผู้อื่นเกรงใจจนไม่กล้าตั้งคำถามเกี่ยวกับการใช้จ่ายเงิน'],0,'หลักฐานที่ครบถ้วนคือเกราะป้องกันทั้งของส่วนรวมและของผู้ปฏิบัติงานเอง'],
['a_sep',2,'ข้อใดคือความหมายที่ถูกต้องของ "ผลประโยชน์ส่วนรวม"',['ประโยชน์ที่ตกแก่สาธารณะและคนส่วนใหญ่ในสังคม','ประโยชน์ของกลุ่มคนที่มีอำนาจ','ประโยชน์ของครอบครัวตนเอง','ประโยชน์ของผู้ที่จ่ายภาษีมากที่สุด'],0,'ผลประโยชน์ส่วนรวมต้องตกแก่สาธารณะ ไม่ใช่กลุ่มใดกลุ่มหนึ่ง'],
['a_sep',3,'เหตุใดการที่ผู้มีอำนาจอนุมัติโครงการลงในพื้นที่ของตนเองเป็นหลักจึงเป็นปัญหา',['เพราะเป็นการใช้งบส่วนรวมเพื่อสร้างความนิยมส่วนตัว ทำให้พื้นที่อื่นเสียโอกาส','เพราะการดำเนินโครงการในพื้นที่ของตนเองมักใช้เวลานานกว่าที่อื่นเสมอ','เพราะพื้นที่ที่ผู้มีอำนาจอาศัยอยู่มักไม่มีความจำเป็นต้องพัฒนาเพิ่ม','เพราะต้องจัดทำเอกสารประกอบโครงการมากกว่าพื้นที่อื่นหลายเท่า'],0,'การจัดสรรต้องยึดความจำเป็นของส่วนรวม ไม่ใช่ฐานเสียงของผู้มีอำนาจ'],

/* ---------- หน่วยที่ 2 ความละอายและความไม่ทนต่อการทุจริต (26 ข้อ) ---------- */
['a_shame',1,'ความละอายและความไม่ทนต่อการทุจริตต่างกันอย่างไร',['ความละอายควบคุมไม่ให้ตนเองทำผิด ส่วนความไม่ทนคือการไม่ปล่อยผ่านเมื่อผู้อื่นทำผิด','ความละอายใช้กับความผิดเรื่องเล็กน้อย ส่วนความไม่ทนใช้กับความผิดเรื่องใหญ่','ทั้งสองอย่างมีความหมายเหมือนกันเพียงแต่ใช้คำเรียกต่างกันตามโอกาส','ความไม่ทนต่อการทุจริตหมายถึงการเป็นคนใจร้อนที่โกรธง่ายกับทุกเรื่อง'],0,'อย่างหนึ่งมองเข้าหาตนเอง อีกอย่างหนึ่งมองออกไปยังส่วนรวม'],
['a_shame',1,'หน่วยงานใดมีหน้าที่หลักในการป้องกันและปราบปรามการทุจริตของประเทศไทย',['คณะกรรมการ ป.ป.ช.','กรมการปกครอง','สำนักงานตำรวจแห่งชาติ','กระทรวงศึกษาธิการ'],0,'ป.ป.ช. คือคณะกรรมการป้องกันและปราบปรามการทุจริตแห่งชาติ'],
['a_shame',2,'"ป.ป.ช." ย่อมาจากข้อใด',['คณะกรรมการป้องกันและปราบปรามการทุจริตแห่งชาติ','คณะกรรมการประชาสัมพันธ์และเผยแพร่ข่าวสารแห่งชาติ','คณะกรรมการปกครองและพัฒนาส่วนท้องถิ่นแห่งชาติ','คณะกรรมการประเมินและพัฒนาคุณภาพการศึกษาชาติ'],0,'ป.ป.ช. คือองค์กรอิสระตามรัฐธรรมนูญที่ทำหน้าที่ตรวจสอบการทุจริต'],
['a_shame',2,'วันต่อต้านคอร์รัปชันสากลตรงกับวันใดของทุกปี',['9 ธันวาคม','5 ธันวาคม','10 ธันวาคม','1 มกราคม'],0,'องค์การสหประชาชาติกำหนดให้วันที่ 9 ธันวาคมเป็นวันต่อต้านคอร์รัปชันสากล'],
['a_shame',2,'ข้อใดเป็นการทุจริตในระบบการศึกษา',['การรับเงินแลกกับการรับนักเรียนเข้าเรียนนอกเกณฑ์','การรับนักเรียนเข้าเรียนตามเกณฑ์ที่ได้ประกาศไว้ล่วงหน้า','การประกาศผลการคัดเลือกอย่างเปิดเผยให้ผู้ปกครองตรวจสอบ','การจัดสอบคัดเลือกตามระเบียบของกระทรวงอย่างเคร่งครัด'],0,'การใช้เงินแลกกับสิทธิที่ควรได้จากการแข่งขันคือการทุจริต'],
['a_shame',2,'ข้อใดเป็นการทุจริตเชิงนโยบาย',['การออกนโยบายที่เอื้อประโยชน์แก่ธุรกิจของตนเองหรือพวกพ้อง','การออกนโยบายช่วยเหลือเกษตรกรทั้งประเทศอย่างเท่าเทียมกัน','การประกาศรายละเอียดของนโยบายให้ประชาชนทราบล่วงหน้า','การเปิดรับฟังความคิดเห็นของประชาชนก่อนประกาศใช้นโยบาย'],0,'การใช้อำนาจออกนโยบายเพื่อประโยชน์ของตนคือการทุจริตที่ร้ายแรง'],
['a_shame',2,'เมื่อพบเห็นการทุจริต ประชาชนสามารถแจ้งเบาะแสได้ที่ใด',['สำนักงาน ป.ป.ช. หรือหน่วยงานที่รับเรื่องร้องเรียน','ร้านค้าใกล้บ้านที่คนในชุมชนมักมารวมตัวพูดคุยกัน','โรงเรียนประจำตำบลที่มีครูและผู้บริหารดูแลอยู่','สถานีขนส่งผู้โดยสารที่มีเจ้าหน้าที่ประจำอยู่ตลอดวัน'],0,'ป.ป.ช. และหน่วยงานรับเรื่องร้องเรียนมีช่องทางรับแจ้งเบาะแสโดยตรง'],
['a_shame',2,'เหตุใดจึงต้องมีการคุ้มครองผู้แจ้งเบาะแสการทุจริต',['เพื่อให้ผู้แจ้งปลอดภัยและกล้าให้ข้อมูลโดยไม่ถูกกลั่นแกล้ง','เพื่อให้ผู้แจ้งได้รับเงินรางวัลตอบแทนเป็นจำนวนมากตามกฎหมาย','เพื่อให้ผู้แจ้งได้รับการเลื่อนตำแหน่งเร็วกว่าเพื่อนร่วมงาน','เพื่อให้ผู้แจ้งได้รับการยกเว้นไม่ต้องปฏิบัติงานตามปกติอีก'],0,'ความปลอดภัยของผู้แจ้งคือเงื่อนไขสำคัญที่ทำให้มีคนกล้าแจ้ง'],
['a_shame',2,'ข้อใดเป็นการทุจริตที่พบในการเลือกตั้งระดับท้องถิ่น',['การแจกเงินหรือสิ่งของเพื่อแลกกับคะแนนเสียง','การเดินพบปะประชาชนตามบ้านเรือนเพื่อแนะนำตัว','การติดป้ายหาเสียงในจุดที่คณะกรรมการกำหนดไว้','การแถลงนโยบายที่จะทำต่อประชาชนอย่างเปิดเผย'],0,'การซื้อเสียงทำให้การเลือกตั้งไม่สะท้อนเจตนาที่แท้จริงของประชาชน'],
['a_shame',2,'ข้อใดคือความเสียหายที่เกิดจากการทุจริตต่อคนยากจนมากที่สุด',['ต้องเสียเงินเพิ่มเพื่อให้ได้รับบริการที่ควรได้ฟรีหรือได้อยู่แล้ว','ได้รับบริการจากหน่วยงานของรัฐเร็วขึ้นกว่าเดิมอย่างเห็นได้ชัด','มีทางเลือกในการใช้บริการของรัฐเพิ่มขึ้นหลายช่องทางกว่าเดิม','ได้รับความช่วยเหลือจากหน่วยงานของรัฐมากกว่าคนกลุ่มอื่น'],0,'เมื่อบริการรัฐต้องซื้อ ผู้ที่ไม่มีเงินย่อมเสียเปรียบที่สุด'],
['a_shame',3,'ข้อใดคือลักษณะของ "การทุจริตเชิงระบบ"',['การทุจริตที่เกิดขึ้นเป็นเครือข่ายและกลายเป็นเรื่องปกติในองค์กร','การทุจริตที่กระทำโดยบุคคลเพียงคนเดียวและเกิดขึ้นเพียงครั้งเดียว','ความผิดพลาดในการกรอกเอกสารราชการที่เกิดจากความไม่รอบคอบ','การมาปฏิบัติงานสายเป็นประจำจนทำให้งานส่วนรวมล่าช้าไปด้วย'],0,'เมื่อการทุจริตกลายเป็นวัฒนธรรมองค์กร การแก้ไขจะยากกว่ากรณีรายบุคคล'],
['a_shame',3,'เหตุใดสังคมที่ยอมรับการทุจริตจึงพัฒนาได้ยาก',['เพราะคนเก่งและซื่อสัตย์ไม่ได้รับโอกาส ขณะที่ทรัพยากรถูกใช้อย่างไม่คุ้มค่า','เพราะจำนวนประชากรในสังคมนั้นจะลดลงอย่างรวดเร็วในระยะยาว','เพราะผู้คนจะหมดกำลังใจจนไม่มีใครอยากทำงานอาชีพใดอีกต่อไป','เพราะกฎหมายที่มีอยู่จะถูกยกเลิกไปทั้งหมดจนไม่มีกติกาใดเหลือ'],0,'ระบบที่ตอบแทนคนโกงจะผลักคนดีออกไปและทำให้ทรัพยากรรั่วไหล'],
['a_shame',3,'ข้อใดคือความหมายของ "การไม่ทนต่อการทุจริต" ในระดับสังคม',['สังคมร่วมกันแสดงออกว่าไม่ยอมรับและกดดันให้เกิดการแก้ไข','สังคมนิ่งเฉยเพื่อรักษาความสงบ','สังคมลงโทษผู้ทุจริตด้วยความรุนแรง','สังคมปล่อยให้เป็นหน้าที่ของศาลเพียงอย่างเดียว'],0,'แรงกดดันทางสังคมที่ชอบธรรมคือกลไกสำคัญคู่กับกฎหมาย'],
['a_shame',3,'นักเรียนพบว่ามีการนำอาหารกลางวันคุณภาพต่ำมาให้นักเรียนทั้งที่ได้งบเต็ม ควรทำอย่างไร',['รวบรวมข้อเท็จจริงและแจ้งครูหรือผู้ปกครองเพื่อให้ตรวจสอบตามช่องทางที่ถูกต้อง','ปฏิเสธที่จะรับประทานอาหารนั้นแล้วเก็บเรื่องไว้ไม่บอกให้ผู้ใดทราบ','ถ่ายภาพอาหารแล้วโพสต์ตำหนิลงสื่อสังคมออนไลน์ทันทีที่พบเห็น','ชวนเพื่อนรวมกลุ่มกันไปต่อว่าแม่ครัวที่โรงอาหารในเวลาพักเที่ยง'],0,'การแจ้งพร้อมข้อเท็จจริงผ่านช่องทางที่ถูกต้องนำไปสู่การแก้ไขที่ยั่งยืน'],
['a_shame',3,'ข้อใดคือความแตกต่างระหว่างการแจ้งเบาะแสกับการใส่ร้าย',['การแจ้งเบาะแสอยู่บนพื้นฐานของข้อเท็จจริง ส่วนการใส่ร้ายเป็นการกล่าวหาโดยไม่มีมูล','ทั้งสองอย่างมีความหมายเหมือนกันเพราะเป็นการกล่าวถึงความผิดของผู้อื่น','การแจ้งเบาะแสต้องเปิดเผยชื่อผู้แจ้งเสมอ ส่วนการใส่ร้ายทำโดยไม่ระบุชื่อ','การใส่ร้ายถือว่าทำได้หากผู้แจ้งเชื่อโดยสุจริตว่าเรื่องนั้นเป็นความจริง'],0,'ข้อเท็จจริงที่ตรวจสอบได้คือเส้นแบ่งระหว่างสองสิ่งนี้'],
['a_shame',3,'เหตุใดการทุจริตจึงมักเริ่มจากเรื่องเล็กน้อย',['เพราะเมื่อทำแล้วไม่มีใครทักท้วง จะเกิดความเคยชินและขยายไปสู่เรื่องใหญ่ขึ้น','เพราะการทุจริตเรื่องเล็กน้อยมีบทลงโทษที่หนักกว่าการทุจริตเรื่องใหญ่','เพราะผู้ที่ทุจริตส่วนใหญ่ยังขาดความสามารถที่จะทำเรื่องใหญ่ได้ทันที','เพราะกฎหมายที่มีอยู่ครอบคลุมเฉพาะเรื่องเล็กแต่ไม่ครอบคลุมเรื่องใหญ่'],0,'การปล่อยผ่านสิ่งเล็กน้อยคือการเปิดประตูให้สิ่งใหญ่ตามมา'],
['a_shame',3,'ข้อใดเป็นการแสดงความไม่ทนต่อการทุจริตของนักเรียนอย่างสร้างสรรค์',['จัดทำโครงงานรณรงค์ความซื่อสัตย์และเผยแพร่ในโรงเรียน','ประจานเพื่อนที่เคยทำผิดต่อหน้าทุกคน','ตั้งกลุ่มเพื่อกลั่นแกล้งผู้ที่สงสัยว่าโกง','เก็บเงียบเพื่อไม่ให้เกิดความขัดแย้ง'],0,'การรณรงค์เชิงบวกสร้างการเปลี่ยนแปลงได้โดยไม่ทำร้ายผู้อื่น'],
['a_shame',3,'ข้อใดคือเหตุผลสำคัญที่ทำให้คนกล้ายืนหยัดต่อต้านการทุจริต',['การมีจิตสำนึกที่มั่นคงและเห็นว่าประโยชน์ส่วนรวมสำคัญกว่าประโยชน์ส่วนตน','การได้รับเงินรางวัลตอบแทนจำนวนมากจากหน่วยงานที่รับเรื่องร้องเรียน','ความต้องการมีชื่อเสียงและได้รับการยกย่องจากคนในสังคมวงกว้าง','การถูกผู้บังคับบัญชาสั่งการให้ต้องดำเนินการตามระเบียบที่วางไว้'],0,'จิตสำนึกที่มั่นคงทำให้ยืนหยัดได้แม้ต้องแลกกับความลำบาก'],
['a_shame',3,'ข้อใดคือผลของการที่เยาวชนได้รับการปลูกฝังความละอายต่อการทุจริตตั้งแต่เล็ก',['เมื่อเติบโตขึ้นจะเป็นผู้ใหญ่ที่ไม่ยอมทุจริตแม้มีโอกาส','จะเกิดความกลัวจนไม่กล้ารับงานที่มีความรับผิดชอบสูง','จะลังเลจนไม่กล้าตัดสินใจเรื่องใดด้วยตนเองเมื่อโตขึ้น','จะเสียเปรียบจนไม่สามารถแข่งขันกับผู้อื่นในสังคมได้'],0,'จิตสำนึกที่ปลูกฝังตั้งแต่เด็กจะกลายเป็นเกราะป้องกันเมื่อมีอำนาจในอนาคต'],
['a_shame',4,'ข้อใดวิเคราะห์ได้ถูกต้องเกี่ยวกับคำกล่าวที่ว่า "ใครๆ ก็ทำกัน"',['เป็นข้ออ้างที่ทำให้การทุจริตกลายเป็นเรื่องปกติ ทั้งที่ความผิดไม่ได้ลดลงเพราะมีคนทำมาก','เป็นเหตุผลที่รับฟังได้เพราะแสดงว่าสิ่งนั้นเป็นแนวปฏิบัติที่ยอมรับกันทั่วไป','แสดงว่าการกระทำนั้นถูกต้องแล้วเพราะได้รับการยอมรับจากคนส่วนใหญ่','เป็นการยืนยันว่ากฎหมายที่ใช้อยู่ไม่มีความจำเป็นและควรได้รับการแก้ไข'],0,'จำนวนผู้กระทำไม่ได้เปลี่ยนความผิดให้กลายเป็นความถูก'],
['a_shame',4,'ข้อใดคือความท้าทายที่สุดในการสร้างสังคมที่ไม่ทนต่อการทุจริต',['การเปลี่ยนค่านิยมที่มองว่าการโกงเล็กน้อยเป็นเรื่องยอมรับได้','การจัดหางบประมาณมาจัดตั้งหน่วยงานตรวจสอบเพิ่มขึ้นทุกจังหวัด','การออกกฎหมายฉบับใหม่ให้ครอบคลุมความผิดทุกรูปแบบที่เกิดขึ้น','การก่อสร้างเรือนจำเพิ่มขึ้นเพื่อรองรับผู้กระทำผิดที่มีจำนวนมาก'],0,'กฎหมายอย่างเดียวไม่พอ ต้องเปลี่ยนค่านิยมของคนในสังคมด้วย'],
['a_shame',2,'ข้อใดเป็นการทุจริตในการสอบระดับชาติ',['การนำข้อสอบออกไปเผยแพร่ก่อนวันสอบ','การอ่านหนังสือทบทวนก่อนสอบ','การเข้าห้องสอบตรงเวลา','การทำข้อสอบด้วยความรู้ของตนเอง'],0,'การรั่วไหลของข้อสอบทำลายความเป็นธรรมของผู้เข้าสอบทั้งประเทศ'],
['a_shame',2,'ข้อใดคือความหมายของ "ธรรมาภิบาล"',['หลักการบริหารบ้านเมืองที่ดีซึ่งเน้นความโปร่งใสและตรวจสอบได้','รูปแบบการปกครองที่ให้อำนาจสูงสุดแก่ผู้นำเพียงคนเดียว','แนวทางการบริหารงานที่มุ่งเน้นความรวดเร็วเป็นเป้าหมายหลัก','วิธีบริหารงานที่ยืดหยุ่นโดยไม่ต้องยึดกฎระเบียบใดเป็นกรอบ'],0,'ธรรมาภิบาลประกอบด้วยหลักนิติธรรม คุณธรรม ความโปร่งใส การมีส่วนร่วม ความรับผิดชอบ และความคุ้มค่า'],
['a_shame',3,'การประเมินคุณธรรมและความโปร่งใสของหน่วยงานภาครัฐมีจุดมุ่งหมายใด',['กระตุ้นให้หน่วยงานปรับปรุงการทำงานให้โปร่งใสและตรวจสอบได้','จัดอันดับหน่วยงานที่ได้รับงบประมาณมากที่สุดในแต่ละปีงบประมาณ','ลดจำนวนเจ้าหน้าที่ในหน่วยงานที่มีผลการปฏิบัติงานไม่เป็นไปตามเป้า','เพิ่มงบประมาณให้หน่วยงานที่ได้คะแนนต่ำเพื่อนำไปพัฒนาตนเอง'],0,'การประเมินเป็นเครื่องมือให้หน่วยงานเห็นจุดอ่อนและพัฒนาความโปร่งใส'],
['a_shame',3,'ข้อใดเป็นสิ่งที่นักเรียนควรทำเมื่อไม่แน่ใจว่าการกระทำหนึ่งเป็นการทุจริตหรือไม่',['ปรึกษาครูหรือผู้ใหญ่ที่ไว้ใจได้ก่อนตัดสินใจ','ลงมือทำไปก่อนแล้วค่อยสอบถามผู้รู้ในภายหลัง','ปฏิบัติตามแนวทางที่เพื่อนส่วนใหญ่ในห้องทำกัน','หลีกเลี่ยงการตัดสินใจใดๆ แล้วปล่อยเรื่องนั้นไป'],0,'การขอคำปรึกษาก่อนลงมือช่วยป้องกันความผิดพลาดได้'],
['a_shame',2,'ข้อใดคือคุณสมบัติสำคัญของผู้ที่มีความซื่อสัตย์สุจริต',['ประพฤติตรงไปตรงมาทั้งต่อหน้าและลับหลัง','พูดจาไพเราะและอ่อนน้อมกับทุกคนที่พบเจอ','ทำงานที่ได้รับมอบหมายเสร็จเร็วกว่าผู้อื่นเสมอ','มีเพื่อนฝูงจำนวนมากและเป็นที่รักของคนรอบข้าง'],0,'ความสม่ำเสมอทั้งต่อหน้าและลับหลังคือแก่นของความซื่อสัตย์'],

/* ---------- หน่วยที่ 3 STRONG จิตพอเพียงต้านทุจริต (24 ข้อ) ---------- */
['a_strong',1,'แนวคิด STRONG มุ่งสร้างสิ่งใดในตัวบุคคล',['จิตพอเพียงที่เป็นภูมิคุ้มกันไม่ให้ทุจริต','ความแข็งแรงของร่างกาย','ความสามารถในการแข่งขันทางธุรกิจ','ความรู้ทางวิทยาศาสตร์'],0,'STRONG คือการสร้างภูมิคุ้มกันการทุจริตจากภายในตัวบุคคล'],
['a_strong',2,'ข้อใดจับคู่ตัวอักษร S T R กับความหมายใน STRONG ได้ถูกต้องทั้งหมด',['S พอเพียง · T โปร่งใส · R ตื่นรู้','S แข็งแรง · T จริงใจ · R รวดเร็ว','S ซื่อสัตย์ · T อดทน · R รับผิดชอบ','S สามัคคี · T ตรงเวลา · R เรียบร้อย'],0,'S คือ Sufficient, T คือ Transparent และ R คือ Realise'],
['a_strong',2,'ข้อใดจับคู่ตัวอักษร O N G กับความหมายใน STRONG ได้ถูกต้องทั้งหมด',['O มุ่งไปข้างหน้า · N ความรู้ · G เอื้ออาทร','O โอกาส · N ใหม่ · G ยิ่งใหญ่','O เปิดเผย · N จำเป็น · G เติบโต','O เป็นระเบียบ · N ธรรมชาติ · G ดีงาม'],0,'O คือ Onward, N คือ Knowledge และ G คือ Generosity'],
['a_strong',2,'หลักความพอเพียงมีองค์ประกอบสำคัญ 3 ประการคือข้อใด',['ความพอประมาณ ความมีเหตุผล และการมีภูมิคุ้มกันที่ดี','ความประหยัด ความขยันหมั่นเพียร และความอดทนอดกลั้น','ความรู้ ความสามารถในการทำงาน และความซื่อสัตย์สุจริต','การออมทรัพย์ การลงทุนที่ดี และการกู้ยืมอย่างมีวินัย'],0,'สามห่วงของเศรษฐกิจพอเพียงคือพอประมาณ มีเหตุผล และมีภูมิคุ้มกัน'],
['a_strong',2,'เงื่อนไขสำคัญที่กำกับหลักปรัชญาของเศรษฐกิจพอเพียงคือข้อใด',['ความรู้และคุณธรรม','เงินทุนและแรงงาน','เทคโนโลยีและการตลาด','อำนาจและตำแหน่ง'],0,'สองเงื่อนไขที่กำกับสามห่วงคือความรู้และคุณธรรม'],
['a_strong',2,'ข้อใดคือการนำหลักความโปร่งใสมาใช้ในหน่วยงานราชการ',['เปิดเผยข้อมูลการจัดซื้อจัดจ้างบนเว็บไซต์ให้ประชาชนตรวจสอบได้','จัดเก็บข้อมูลการจัดซื้อไว้ภายในหน่วยงานเพื่อความปลอดภัยของข้อมูล','ชี้แจงข้อมูลการจัดซื้อจัดจ้างเฉพาะเมื่อมีผู้ยื่นคำร้องขอมาเท่านั้น','เผยแพร่เฉพาะข้อมูลโครงการที่ดำเนินการได้ผลดีเพื่อรักษาภาพลักษณ์'],0,'ความโปร่งใสหมายถึงการเปิดเผยเชิงรุกและครบถ้วน'],
['a_strong',2,'ข้อใดคือการปฏิบัติตามหลัก "ความตื่นรู้" ของประชาชน',['ติดตามข่าวสารและตรวจสอบการทำงานของหน่วยงานในท้องถิ่น','เชื่อข่าวสารทุกอย่างที่ได้ยินมาโดยไม่ต้องตรวจสอบที่มาก่อน','ไม่ให้ความสนใจกับเรื่องส่วนรวมเพราะเป็นหน้าที่ของหน่วยงาน','รอให้ผู้อื่นมาบอกเล่าให้ฟังว่าเกิดเหตุการณ์อะไรขึ้นในชุมชน'],0,'การตื่นรู้คือการติดตามและรู้เท่าทันสถานการณ์รอบตัว'],
['a_strong',3,'เหตุใดความรู้จึงเป็นเงื่อนไขสำคัญของการต่อต้านการทุจริต',['เพราะผู้ที่รู้กฎหมายและระเบียบจะรู้ว่าสิ่งใดผิดและไม่ตกเป็นเครื่องมือของผู้อื่น','เพราะผู้ที่มีความรู้สูงมักได้รับการเลื่อนตำแหน่งให้สูงขึ้นอย่างรวดเร็ว','เพราะผู้ที่มีความรู้มากย่อมมีรายได้มากจนไม่จำเป็นต้องทุจริตอีก','เพราะความรู้ช่วยให้หาช่องว่างหลบเลี่ยงกฎหมายได้อย่างแนบเนียน'],0,'ความรู้ทำให้เรารู้สิทธิของตนและปฏิเสธการมีส่วนร่วมในสิ่งที่ผิดได้'],
['a_strong',3,'ข้อใดคือการนำหลัก STRONG มาใช้ในการบริหารกองทุนของโรงเรียน',['ตั้งคณะกรรมการที่มาจากหลายฝ่าย ทำบัญชีเปิดเผย และรายงานผลอย่างสม่ำเสมอ','มอบให้ผู้อำนวยการโรงเรียนเป็นผู้ดูแลและตัดสินใจเพียงคนเดียว','เบิกใช้เงินไปก่อนตามความจำเป็นแล้วค่อยสรุปรายงานเมื่อสิ้นปี','ลดขั้นตอนการเก็บใบเสร็จรับเงินลงเพื่อความสะดวกในการทำงาน'],0,'การกระจายอำนาจร่วมกับความโปร่งใสคือการนำ STRONG มาใช้จริง'],
['a_strong',3,'ข้อใดสะท้อนหลัก "การมุ่งไปข้างหน้า" ในการต่อต้านการทุจริต',['แม้การเปลี่ยนแปลงจะช้า ก็ยังคงรณรงค์และทำสิ่งที่ถูกต้องอย่างต่อเนื่อง','ยุติการรณรงค์เพราะดำเนินการมานานแล้วยังไม่เห็นผลที่ชัดเจน','รอให้รัฐบาลเป็นผู้แก้ไขปัญหาเพียงฝ่ายเดียวเพราะมีอำนาจมากกว่า','ย้ายถิ่นฐานไปอยู่ที่อื่นเพื่อหลีกหนีจากปัญหาที่เกิดขึ้นในพื้นที่'],0,'Onward คือความมุ่งมั่นที่ไม่ยอมแพ้ต่ออุปสรรค'],
['a_strong',3,'ข้อใดคือความสัมพันธ์ระหว่างความพอเพียงกับการทุจริต',['เมื่อคนรู้จักพอ ความโลภซึ่งเป็นต้นเหตุของการทุจริตก็ลดลง','ความพอเพียงทำให้คนมีเงินสะสมมากจนไม่จำเป็นต้องโกงอีก','ความพอเพียงทำให้ไม่ต้องทำงานหนักจึงไม่มีโอกาสได้ทุจริต','ความพอเพียงกับการทุจริตเป็นคนละเรื่องที่ไม่เกี่ยวข้องกัน'],0,'ความโลภคือรากของการทุจริต ความพอเพียงจึงตัดที่รากโดยตรง'],
['a_strong',3,'ข้อใดเป็นการแสดงความเอื้ออาทรในระดับสังคมที่ช่วยลดการทุจริต',['สร้างระบบสวัสดิการและช่วยเหลือผู้ด้อยโอกาสเพื่อลดแรงจูงใจในการกระทำผิด','มอบเงินช่วยเหลือแก่ผู้ที่มาร้องขอความช่วยเหลือจากเจ้าหน้าที่ทุกราย','ช่วยปกปิดความผิดของเพื่อนร่วมงานเพื่อรักษาความสัมพันธ์ที่ดีไว้','บริจาคเงินให้แก่ผู้มีอำนาจเพื่อให้ช่วยดูแลเรื่องต่างๆ ในภายหลัง'],0,'การลดความเดือดร้อนของคนในสังคมช่วยลดเงื่อนไขที่ผลักให้คนทำผิด'],
['a_strong',3,'ข้อใดคือความหมายของ "ความมีเหตุผล" ตามหลักเศรษฐกิจพอเพียง',['การตัดสินใจโดยพิจารณาจากเหตุปัจจัยและผลที่จะตามมาอย่างรอบคอบ','การตัดสินใจตามความรู้สึกและสัญชาตญาณของตนเองในขณะนั้น','การตัดสินใจตามแนวทางที่คนส่วนใหญ่ในสังคมเลือกปฏิบัติกัน','การตัดสินใจให้เร็วที่สุดเพื่อไม่ให้เสียโอกาสที่ผ่านเข้ามา'],0,'ความมีเหตุผลคือการคิดถึงเหตุและผลอย่างรอบด้านก่อนตัดสินใจ'],
['a_strong',3,'ข้อใดคือการสร้างภูมิคุ้มกันให้ตนเองตามหลัก STRONG',['หมั่นหาความรู้ ฝึกวินัยทางการเงิน และมีจิตสำนึกที่มั่นคง','สะสมทรัพย์สินเงินทองให้มากที่สุดเท่าที่จะทำได้ในชีวิต','หลีกเลี่ยงการรับงานที่มีความรับผิดชอบสูงเพื่อลดความเสี่ยง','พึ่งพาความช่วยเหลือจากผู้อื่นในทุกเรื่องที่ตนทำไม่ได้'],0,'ภูมิคุ้มกันเกิดจากความรู้ วินัย และจิตสำนึกที่ฝึกฝนอย่างสม่ำเสมอ'],
['a_strong',3,'เหตุใดหลัก STRONG จึงต้องเริ่มที่ตัวบุคคลก่อน',['เพราะสังคมประกอบด้วยบุคคล เมื่อแต่ละคนมีภูมิคุ้มกัน สังคมก็เข้มแข็งตาม','เพราะบุคคลแต่ละคนมีอำนาจในการตัดสินใจมากกว่าองค์กรที่สังกัดอยู่','เพราะองค์กรและหน่วยงานไม่จำเป็นต้องปรับเปลี่ยนวิธีทำงานใดๆ','เพราะกฎหมายที่มีอยู่ไม่มีผลบังคับใช้กับหน่วยงานของรัฐอยู่แล้ว'],0,'การเปลี่ยนแปลงที่ยั่งยืนเริ่มจากจิตสำนึกของแต่ละคน'],
['a_strong',3,'ข้อใดเป็นการประยุกต์หลักความพอเพียงในระดับชุมชน',['จัดทำแผนใช้ทรัพยากรของชุมชนอย่างสมดุลและคำนึงถึงคนรุ่นต่อไป','เร่งใช้ทรัพยากรที่มีอยู่ให้หมดโดยเร็วที่สุดก่อนที่จะเสื่อมสภาพ','ขายทรัพยากรของชุมชนทั้งหมดให้นายทุนภายนอกเพื่อนำเงินมาพัฒนา','ออกกฎห้ามมิให้ผู้ใดใช้ทรัพยากรของชุมชนโดยเด็ดขาดทุกกรณี'],0,'ความพอเพียงคือความสมดุลระหว่างการใช้ประโยชน์กับการรักษาไว้'],
['a_strong',4,'ข้อใดวิเคราะห์ความสัมพันธ์ของทั้ง 6 องค์ประกอบใน STRONG ได้ถูกต้องที่สุด',['ทั้ง 6 ด้านทำงานร่วมกัน โดยความพอเพียงเป็นฐาน ความรู้และความตื่นรู้เป็นเครื่องมือ ส่วนความโปร่งใสและความเอื้ออาทรทำให้ยั่งยืน','แต่ละด้านทำงานแยกกันโดยสิ้นเชิงและไม่มีความเกี่ยวข้องเชื่อมโยงกัน ผู้ปฏิบัติจึงเลือกใช้เพียงด้านใดด้านหนึ่งได้','ต้องปฏิบัติให้ครบสมบูรณ์ทีละด้านตามลำดับตัวอักษรก่อน จึงจะเริ่มปฏิบัติด้านถัดไปได้อย่างมีประสิทธิภาพ','มีเพียงความพอเพียงเท่านั้นที่จำเป็นต่อการป้องกันการทุจริต ส่วนอีกห้าด้านเป็นเพียงส่วนประกอบเสริมเท่านั้น'],0,'ทั้ง 6 ด้านเสริมกัน ขาดด้านใดด้านหนึ่งภูมิคุ้มกันก็ไม่สมบูรณ์'],
['a_strong',4,'ข้อใดเป็นการนำ STRONG ไปใช้ในระดับประเทศได้อย่างเป็นรูปธรรมที่สุด',['เปิดเผยข้อมูลงบประมาณภาครัฐให้ประชาชนเข้าถึงและตรวจสอบได้','เพิ่มบทลงโทษให้หนักขึ้นเพียงอย่างเดียว','เพิ่มจำนวนเจ้าหน้าที่ตรวจสอบให้มากที่สุด','ลดการเผยแพร่ข่าวการทุจริตเพื่อรักษาภาพลักษณ์'],0,'ความโปร่งใสของข้อมูลเปิดโอกาสให้ประชาชนทั้งประเทศร่วมตรวจสอบ'],
['a_strong',2,'การทำบัญชีครัวเรือนช่วยสร้างภูมิคุ้มกันอย่างไร',['ทำให้รู้สถานะการเงินของตนเองและวางแผนไม่ให้ใช้จ่ายเกินตัวจนเป็นหนี้','ทำให้ครัวเรือนมีรายได้เพิ่มขึ้นทันทีโดยไม่ต้องทำงานเพิ่ม','ทำให้ได้รับการยกเว้นไม่ต้องเสียภาษีเงินได้ประจำปีอีกต่อไป','ทำให้ยื่นขอสินเชื่อจากสถาบันการเงินได้ง่ายและวงเงินสูงขึ้น'],0,'การรู้สถานะการเงินช่วยป้องกันการก่อหนี้ที่อาจนำไปสู่การทุจริต'],
['a_strong',3,'ข้อใดคือความเชื่อมโยงระหว่างหนี้สินกับการทุจริต',['ผู้ที่มีหนี้สินล้นพ้นตัวอาจถูกกดดันจนหาทางทุจริตเพื่อหาเงินมาใช้หนี้','การมีหนี้สินเป็นแรงผลักดันให้คนขยันทำงานมากขึ้นกว่าเดิมเสมอ','การมีหนี้สินเป็นเรื่องส่วนตัวที่ไม่เกี่ยวข้องกับการทุจริตแต่อย่างใด','ผู้ที่มีหนี้สินจำนวนมากจะได้รับความช่วยเหลือจากรัฐเป็นลำดับแรก'],0,'ความกดดันทางการเงินเป็นหนึ่งในเงื่อนไขที่ผลักให้คนตัดสินใจผิด'],
['a_strong',2,'ข้อใดเป็นการใช้ทรัพยากรของโรงเรียนตามหลักความพอเพียง',['ใช้กระดาษทั้งสองหน้าและเปิดไฟเฉพาะเท่าที่จำเป็น','ใช้กระดาษเพียงหน้าเดียวแล้วทิ้งเพื่อความสวยงามของงาน','เปิดเครื่องปรับอากาศทิ้งไว้ตลอดวันเพื่อให้ห้องเย็นอยู่เสมอ','เปิดน้ำใช้อย่างเต็มที่เพราะโรงเรียนเป็นผู้รับผิดชอบค่าใช้จ่าย'],0,'การใช้ทรัพยากรส่วนรวมอย่างคุ้มค่าคือความพอเพียงที่ทำได้ทันที'],
['a_strong',3,'ข้อใดคือบทบาทของเยาวชนในการขับเคลื่อน STRONG',['เป็นแกนนำรณรงค์ในโรงเรียนและชุมชนเพื่อสร้างค่านิยมความซื่อสัตย์','รอให้ผู้ใหญ่ที่มีประสบการณ์เป็นผู้ดำเนินการทั้งหมดแต่เพียงฝ่ายเดียว','เข้าร่วมเฉพาะกิจกรรมที่มีของรางวัลหรือเกียรติบัตรมอบให้เท่านั้น','วิพากษ์วิจารณ์การทำงานของผู้อื่นโดยที่ตนเองไม่ได้ลงมือทำสิ่งใด'],0,'เยาวชนคือกำลังสำคัญในการเปลี่ยนค่านิยมของสังคม'],
['a_strong',3,'ข้อใดคือความหมายที่ถูกต้องของคำว่า "จิตพอเพียงต้านทุจริต"',['จิตใจที่รู้จักพอ มีเหตุผล และมีภูมิคุ้มกันจนไม่คิดแสวงหาประโยชน์โดยมิชอบ','จิตใจที่ไม่ต้องการสิ่งใดเลยในชีวิตและปฏิเสธความสะดวกสบายทุกอย่าง','จิตใจที่ยอมรับได้ว่าการทุจริตเล็กน้อยเป็นเรื่องธรรมดาของสังคม','จิตใจที่มุ่งสะสมทรัพย์สินเงินทองไว้ให้มากเพื่อความมั่นคงในอนาคต'],0,'จิตพอเพียงคือความพอดีที่ทำให้ไม่ต้องแสวงหาสิ่งที่ไม่ควรได้'],
['a_strong',2,'ข้อใดเป็นตัวอย่างของความโปร่งใสในระดับบุคคล',['กล้าเปิดเผยที่มาของรายได้และทรัพย์สินของตนเองเมื่อถูกตรวจสอบ','ปกปิดข้อมูลส่วนตัวทุกอย่างไว้เพื่อความปลอดภัยของตนและครอบครัว','บอกความจริงเฉพาะกับคนที่สนิทสนมและไว้วางใจกันได้เท่านั้น','ยอมเปิดเผยข้อมูลของตนเมื่อถูกบังคับตามกฎหมายเท่านั้น'],0,'ความโปร่งใสคือความพร้อมที่จะให้ตรวจสอบได้เพราะไม่มีสิ่งใดต้องปิดบัง'],

/* ---------- หน่วยที่ 4 พลเมืองกับความรับผิดชอบต่อสังคม (24 ข้อ) ---------- */
['a_citizen',1,'ข้อใดคือความหมายของ "พลเมือง" ในระบอบประชาธิปไตย',['ผู้ที่มีสิทธิและหน้าที่ ร่วมรับผิดชอบต่อส่วนรวม และตรวจสอบผู้มีอำนาจได้','ผู้ที่อาศัยอยู่ในประเทศโดยไม่จำเป็นต้องมีบทบาทใดต่อส่วนรวม','ผู้ที่เชื่อฟังและปฏิบัติตามคำสั่งของผู้มีอำนาจทุกอย่างโดยไม่โต้แย้ง','ผู้ที่ถือสัญชาติไทยและมีชื่ออยู่ในทะเบียนบ้านเท่านั้น'],0,'พลเมืองต่างจากราษฎรตรงที่มีบทบาทร่วมรับผิดชอบและตรวจสอบ'],
['a_citizen',2,'ข้อใดคือสิทธิของประชาชนตามรัฐธรรมนูญที่เกี่ยวข้องกับการป้องกันการทุจริต',['สิทธิในการเข้าถึงข้อมูลข่าวสารของราชการ','สิทธิในการเลือกถิ่นที่อยู่อาศัยได้อย่างอิสระ','สิทธิในการเดินทางไปยังที่ใดก็ได้ในราชอาณาจักร','สิทธิในการนับถือศาสนาตามความเชื่อของตนเอง'],0,'การเข้าถึงข้อมูลของรัฐทำให้ประชาชนตรวจสอบการใช้อำนาจได้'],
['a_citizen',2,'ข้อใดคือหน้าที่ของพลเมืองที่ช่วยป้องกันการทุจริตได้โดยตรง',['ติดตามตรวจสอบการใช้งบประมาณและแจ้งเบาะแสเมื่อพบความผิดปกติ','ชำระภาษีให้ครบถ้วนและตรงตามกำหนดเวลาทุกปีอย่างสม่ำเสมอ','เข้าร่วมกิจกรรมกีฬาและงานประเพณีของชุมชนอย่างต่อเนื่อง','ปลูกต้นไม้ในบริเวณบ้านเพื่อช่วยรักษาสภาพแวดล้อมของชุมชน'],0,'การเฝ้าระวังและแจ้งเบาะแสคือบทบาทที่กระทบการทุจริตโดยตรง'],
['a_citizen',2,'การมีส่วนร่วมของประชาชนในการพัฒนาท้องถิ่นควรเริ่มจากขั้นตอนใด',['ร่วมรับรู้ข้อมูลและร่วมแสดงความคิดเห็นตั้งแต่ขั้นวางแผน','เข้าร่วมเฉพาะในวันพิธีเปิดโครงการเพื่อเป็นเกียรติแก่ผู้จัด','รอตรวจสอบผลงานเมื่อโครงการดำเนินการเสร็จเรียบร้อยแล้ว','ไม่จำเป็นต้องเข้าร่วมเพราะเป็นหน้าที่ของหน่วยงานโดยตรง'],0,'การมีส่วนร่วมตั้งแต่ต้นทำให้โครงการตรงความต้องการและตรวจสอบได้'],
['a_citizen',2,'ข้อใดคือผลเสียของการซื้อสิทธิขายเสียงต่อระบอบประชาธิปไตย',['ผู้แทนที่ได้รับเลือกไม่ได้มาจากเจตนาที่แท้จริงของประชาชน','ทำให้กระบวนการเลือกตั้งดำเนินไปได้เร็วกว่าที่กำหนดไว้','ทำให้ประชาชนในพื้นที่มีรายได้ที่มั่นคงและยั่งยืนมากขึ้น','ทำให้ผู้สมัครที่ลงแข่งขันมีคุณภาพและความสามารถสูงขึ้น'],0,'เสียงที่ถูกซื้อไม่ได้สะท้อนความต้องการที่แท้จริงของประชาชน'],
['a_citizen',2,'ข้อใดเป็นการใช้สื่อสังคมออนไลน์อย่างรับผิดชอบ',['ตรวจสอบความถูกต้องของข้อมูลก่อนแชร์ต่อ','แชร์ข้อมูลทันทีเพราะกลัวตกข่าว','แชร์ข้อมูลที่ทำให้คนอื่นเสียหายโดยไม่ตรวจสอบ','สร้างข่าวขึ้นมาเองเพื่อให้มีคนสนใจ'],0,'การส่งต่อข้อมูลเท็จสร้างความเสียหายที่แก้ไขได้ยาก'],
['a_citizen',2,'ข้อใดคือความหมายของ "ความรับผิดชอบต่อสังคม"',['การกระทำที่คำนึงถึงผลกระทบต่อผู้อื่นและส่วนรวม','การปฏิบัติหน้าที่ในความรับผิดชอบของตนให้ดีที่สุดเท่านั้น','การให้ความช่วยเหลือเฉพาะคนในครอบครัวและเครือญาติ','การไม่เข้าไปยุ่งเกี่ยวกับเรื่องของผู้อื่นเพื่อไม่ให้เกิดปัญหา'],0,'ความรับผิดชอบต่อสังคมคือการคิดถึงผลกระทบที่เกิดกับส่วนรวม'],
['a_citizen',3,'เหตุใดการเข้าถึงข้อมูลข่าวสารของราชการจึงสำคัญต่อการป้องกันการทุจริต',['เพราะประชาชนที่มีข้อมูลจะสามารถตรวจสอบและตั้งคำถามได้อย่างมีน้ำหนัก','เพราะทำให้ประชาชนในชุมชนมีเรื่องราวไว้พูดคุยแลกเปลี่ยนกันมากขึ้น','เพราะทำให้เจ้าหน้าที่ต้องใช้เวลาทำงานนานขึ้นจนเกิดความล่าช้า','เพราะทำให้หน่วยงานต้องใช้กระดาษและงบประมาณเพิ่มขึ้นมาก'],0,'ข้อมูลคือเครื่องมือที่ทำให้การตรวจสอบมีพลัง'],
['a_citizen',3,'ข้อใดคือบทบาทขององค์กรอิสระในการตรวจสอบการใช้อำนาจรัฐ',['ตรวจสอบการทำงานของหน่วยงานรัฐโดยไม่อยู่ภายใต้การสั่งการของฝ่ายบริหาร','ปฏิบัติงานตามคำสั่งและนโยบายของรัฐบาลอย่างเคร่งครัดทุกประการ','ดูแลรับผิดชอบเฉพาะงานด้านการศึกษาและการพัฒนาเยาวชนของชาติ','จัดกิจกรรมส่งเสริมการท่องเที่ยวและประชาสัมพันธ์ภาพลักษณ์ประเทศ'],0,'ความเป็นอิสระทำให้การตรวจสอบเป็นไปได้โดยไม่ถูกแทรกแซง'],
['a_citizen',3,'ข้อใดเป็นการมีส่วนร่วมของประชาชนในการตรวจสอบโครงการก่อสร้างของท้องถิ่น',['ติดตามความคืบหน้า ตรวจดูป้ายโครงการ และสอบถามเมื่อพบสิ่งผิดปกติ','รอจนกว่าโครงการจะดำเนินการเสร็จแล้วจึงค่อยวิจารณ์ผลงานที่ออกมา','ไม่ให้ความสนใจเพราะเห็นว่าเป็นงบประมาณของทางราชการไม่ใช่ของตน','ติดต่อขอส่วนแบ่งผลประโยชน์จากผู้รับเหมาที่ดำเนินโครงการนั้น'],0,'การติดตามอย่างต่อเนื่องช่วยให้ผู้ดำเนินโครงการทำงานอย่างระมัดระวัง'],
['a_citizen',3,'ข้อใดคือความสำคัญของการเคารพกฎหมายในสังคม',['ทำให้ทุกคนอยู่ภายใต้กติกาเดียวกันและได้รับความเป็นธรรมเท่าเทียมกัน','ทำให้ผู้มีอำนาจสามารถควบคุมความประพฤติของประชาชนได้โดยง่าย','ทำให้การดำเนินชีวิตประจำวันมีขั้นตอนที่ยุ่งยากซับซ้อนมากขึ้น','ทำให้ผู้ที่มีฐานะทางการเงินดีได้เปรียบผู้อื่นในสังคมมากขึ้น'],0,'หลักนิติธรรมหมายถึงทุกคนอยู่ใต้กฎหมายเดียวกันโดยไม่มีข้อยกเว้น'],
['a_citizen',3,'ข้อใดคือความหมายของ "หลักนิติธรรม"',['ทุกคนต้องอยู่ภายใต้กฎหมายเดียวกัน รวมถึงผู้มีอำนาจด้วย','กฎหมายมีไว้ใช้บังคับกับประชาชนทั่วไปแต่ยกเว้นผู้มีตำแหน่งสูง','ผู้มีอำนาจสามารถออกกฎหมายและแก้ไขได้ตามที่เห็นสมควร','กฎหมายควรเปลี่ยนแปลงได้ตลอดเวลาตามสถานการณ์ที่เกิดขึ้น'],0,'หัวใจของหลักนิติธรรมคือไม่มีใครอยู่เหนือกฎหมาย'],
['a_citizen',3,'ข้อใดเป็นการปฏิบัติตนเป็นพลเมืองที่กระตือรือร้น',['เข้าร่วมเวทีประชาคมและเสนอแนวทางแก้ปัญหาของชุมชน','วิจารณ์ปัญหาบนสื่อออนไลน์โดยไม่เข้าร่วมกิจกรรมใด','รอให้หน่วยงานรัฐแก้ปัญหาทั้งหมด','ย้ายออกจากพื้นที่เมื่อมีปัญหา'],0,'พลเมืองที่กระตือรือร้นทั้งแสดงความเห็นและลงมือมีส่วนร่วม'],
['a_citizen',3,'ข้อใดคือความสัมพันธ์ระหว่างการศึกษากับการลดการทุจริต',['การศึกษาที่ปลูกฝังคุณธรรมทำให้พลเมืองมีจิตสำนึกและรู้เท่าทันการทุจริต','การศึกษาเป็นเรื่องของความรู้ทางวิชาการซึ่งไม่มีผลต่อการทุจริต','ผู้ที่มีการศึกษาสูงยิ่งหาช่องทางทุจริตได้แนบเนียนกว่าคนทั่วไป','การศึกษาที่เน้นระเบียบวินัยทำให้คนไม่กล้าตรวจสอบผู้มีอำนาจ'],0,'การศึกษาสร้างทั้งจิตสำนึกและความรู้ที่จำเป็นในการต่อต้านการทุจริต'],
['a_citizen',3,'ข้อใดเป็นการแสดงความรับผิดชอบต่อสังคมของภาคธุรกิจ',['ดำเนินธุรกิจอย่างสุจริต เสียภาษีถูกต้อง และไม่ให้สินบนเจ้าหน้าที่','มุ่งทำกำไรให้สูงที่สุดโดยไม่ต้องคำนึงถึงวิธีการที่ใช้ให้ได้มา','จ่ายเงินให้เจ้าหน้าที่เพื่อให้การอนุมัติงานเป็นไปอย่างรวดเร็ว','หาช่องทางตามกฎหมายเพื่อหลีกเลี่ยงการเสียภาษีให้น้อยที่สุด'],0,'ธุรกิจที่สุจริตคือส่วนสำคัญของระบบที่ปลอดการทุจริต'],
['a_citizen',3,'ข้อใดเป็นผลดีของสังคมที่มีความโปร่งใสสูง',['นักลงทุนเชื่อมั่น ประชาชนได้รับบริการที่มีคุณภาพ และประเทศพัฒนาได้เร็ว','ประชาชนในสังคมจะเกิดความขัดแย้งและแบ่งฝ่ายกันมากขึ้นกว่าเดิม','เจ้าหน้าที่ของรัฐจะทำงานล่าช้าลงเพราะต้องคอยรายงานอยู่ตลอด','งบประมาณของรัฐจะถูกใช้จ่ายจนหมดเร็วกว่าที่ได้วางแผนไว้'],0,'ความโปร่งใสสร้างความเชื่อมั่นซึ่งเป็นพื้นฐานของการพัฒนา'],
['a_citizen',3,'นักเรียนสามารถมีส่วนร่วมสร้างสังคมที่โปร่งใสได้อย่างไรในชีวิตประจำวัน',['ปฏิบัติตนซื่อสัตย์ ไม่ลอกงาน และตักเตือนเพื่อนที่ทำสิ่งไม่ถูกต้อง','รอให้เติบโตเป็นผู้ใหญ่และมีอำนาจหน้าที่ก่อนแล้วจึงค่อยลงมือทำ','ประพฤติตนให้ถูกต้องเฉพาะในเวลาที่มีครูหรือผู้ใหญ่คอยดูอยู่','ตั้งใจเรียนของตนเองให้ดีโดยไม่ต้องสนใจเรื่องของส่วนรวม'],0,'การเริ่มจากพฤติกรรมในชีวิตประจำวันคือรากฐานของสังคมที่โปร่งใส'],
['a_citizen',4,'ข้อใดวิเคราะห์บทบาทของพลเมืองในการป้องกันการทุจริตได้ครอบคลุมที่สุด',['ต้องทำทั้งการปฏิบัติตนให้สุจริต ไม่ยอมรับการทุจริต และร่วมตรวจสอบอย่างมีข้อมูลและสร้างสรรค์','เพียงแค่ระมัดระวังไม่ให้ตนเองกระทำการทุจริตในทุกสถานการณ์ก็ถือว่าได้ทำหน้าที่พลเมืองครบถ้วนแล้ว','เพียงแค่แจ้งเบาะแสให้หน่วยงานที่รับผิดชอบทราบเมื่อพบเห็นก็เพียงพอต่อการแก้ไขปัญหาได้ทั้งหมด','เป็นหน้าที่โดยตรงขององค์กรตรวจสอบที่มีอำนาจตามกฎหมาย ประชาชนทั่วไปจึงไม่ต้องเข้าไปเกี่ยวข้อง'],0,'บทบาทพลเมืองครอบคลุมทั้งการควบคุมตนเอง การไม่ยอมรับ และการตรวจสอบ'],
['a_citizen',4,'ข้อใดคือความท้าทายสำคัญที่สุดของการมีส่วนร่วมของประชาชนในการตรวจสอบ',['ประชาชนอาจขาดข้อมูล ขาดช่องทางที่ปลอดภัย และรู้สึกว่าเสียงของตนไม่มีผล','ประชาชนมีเวลาว่างมากเกินไปจนเข้ามาตรวจสอบบ่อยกว่าที่ควรจะเป็น','ประชาชนมีความรู้ความเข้าใจเรื่องกฎหมายมากเกินความจำเป็นในการตรวจสอบ','หน่วยงานของรัฐเปิดเผยข้อมูลมากเกินไปจนประชาชนตามอ่านไม่ทัน'],0,'ข้อมูล ช่องทางที่ปลอดภัย และความเชื่อมั่นว่าจะเกิดผล คือเงื่อนไขของการมีส่วนร่วม'],
['a_citizen',2,'ข้อใดเป็นการเคารพสิทธิและเสรีภาพของผู้อื่น',['รับฟังความคิดเห็นที่แตกต่างโดยไม่ดูหมิ่นผู้พูด','บังคับให้ทุกคนในกลุ่มคิดเห็นไปในทางเดียวกับตน','ตำหนิผู้ที่มีความเห็นต่างด้วยถ้อยคำที่รุนแรงและเสียดสี','ไม่เปิดโอกาสให้ผู้อื่นได้แสดงความคิดเห็นในที่ประชุม'],0,'การรับฟังความเห็นต่างคือพื้นฐานของสังคมประชาธิปไตย'],
['a_citizen',2,'ข้อใดเป็นหน้าที่ของประชาชนตามที่รัฐธรรมนูญกำหนด',['ปฏิบัติตามกฎหมาย เสียภาษี และไปใช้สิทธิเลือกตั้ง','เข้าร่วมพิธีกรรมทางศาสนาที่จัดขึ้นในชุมชนทุกครั้ง','บริจาคเงินสนับสนุนการดำเนินงานของหน่วยงานรัฐ','เข้าทำงานรับราชการในหน่วยงานของรัฐอย่างน้อยหนึ่งครั้ง'],0,'การปฏิบัติตามกฎหมาย เสียภาษี และใช้สิทธิเลือกตั้ง เป็นหน้าที่พื้นฐานของพลเมือง'],
['a_citizen',3,'ข้อใดคือความสำคัญของการปลูกฝังความเป็นพลเมืองดีตั้งแต่ระดับประถมศึกษา',['เพราะค่านิยมที่ฝังตั้งแต่เด็กจะเป็นรากฐานของพฤติกรรมเมื่อเข้าสู่สังคมจริง','เพราะเด็กในวัยประถมมีเวลาว่างมากที่สุดเมื่อเทียบกับช่วงวัยอื่น','เพราะเป็นข้อกำหนดขององค์กรระหว่างประเทศที่ไทยต้องปฏิบัติตาม','เพราะผู้ใหญ่ที่ทำงานแล้วไม่จำเป็นต้องเรียนรู้เรื่องเหล่านี้อีก'],0,'พฤติกรรมที่ฝึกซ้ำจนเป็นนิสัยในวัยเด็กจะติดตัวไปตลอดชีวิต'],

   =========================================================== */
const BANK_SETS = [
  { subj:'hist', grade:'p4', rows: Q_HIST_P4 },
  { subj:'hist', grade:'p5', rows: Q_HIST_P5 },
  { subj:'hist', grade:'p6', rows: Q_HIST_P6 },
  { subj:'hist', grade:'m1', rows: Q_HIST_M1 },
  { subj:'hist', grade:'m2', rows: Q_HIST_M2 },
  { subj:'hist', grade:'m3', rows: Q_HIST_M3 },
  { subj:'anti', grade:'p4', rows: Q_ANTI_P4 },
  { subj:'anti', grade:'p5', rows: Q_ANTI_P5 },
  { subj:'anti', grade:'p6', rows: Q_ANTI_P6 },
];

const QBANK_BUILTIN = [];
for (const set of BANK_SETS){
  set.rows.forEach((row, i) => {
    const [unit, diff, q, ch, ans, exp] = row;
    QBANK_BUILTIN.push({
      id: `${set.subj}_${set.grade}_${i}`,
      subj: set.subj, grade: set.grade, unit,
      diff, q, ch: ch.slice(), ans, exp: exp || '', built: true
    });
  });
}

/* จำนวนข้อที่มีอยู่จริง แยกตามวิชาและระดับชั้น */
function bankCount(subj, grade){
  return QBANK_BUILTIN.filter(q => q.subj === subj && q.grade === grade).length;
}

const MEM = {};
const Store = {
  async get(k){
    if (typeof window !== 'undefined' && window.storage && window.storage.get){
      try { const r = await window.storage.get(k); return r ? r.value : null; }
      catch(e){ return null; }
    }
    try { return localStorage.getItem(k); } catch(e){ return MEM[k] ?? null; }
  },
  async set(k, v){
    if (typeof window !== 'undefined' && window.storage && window.storage.set){
      try { await window.storage.set(k, v); return; } catch(e){}
    }
    try { localStorage.setItem(k, v); } catch(e){ MEM[k] = v; }
  }
};

function newPet(sp, name){
  const s = SPECIES[sp];
  const mul = RARITY[s.rarity].statMul;
  const base = {STR:5, VIT:5, AGI:5, INT:5, LUK:5};
  base[s.main] += 3;
  base[s.sub]  += 2;
  for (const k in base) base[k] = Math.round(base[k] * mul);
  return {
    sp, name: name || s.name,
    stage:0, branch:null,
    lv:1, xp:0,
    stats: base,
    hunger:70, mood:70, hp:100, aff:5,
    care:{body:0, mind:0, play:0},
    born: Date.now(),
    sick:false,
  };
}

function makeUid(){
  let s = '';
  const c = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  for (let i=0;i<8;i++) s += c[Math.floor(Math.random()*c.length)];
  return s;
}

/* ===================== ตัวช่วย ===================== */
const clamp = (v,a,b)=>Math.max(a, Math.min(b, v));
const todayKey = ()=>{ const d=new Date(); return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`; };
const pick = a => a[Math.floor(Math.random()*a.length)];

function hashStr(str){
  let h = 2166136261;
  for (let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function rngFrom(seed){
  let s = seed >>> 0;
  return function(){ s ^= s<<13; s>>>=0; s ^= s>>17; s ^= s<<5; s>>>=0; return s/4294967296; };
}
// รหัสสะสม 13 หลัก ผูกกับบัญชี+ร่าง
function collectCode(formIdStr){
  const c = 'ABCDEFGHJKLMNPQRSTUVWXYZ0123456789';
  const r = rngFrom(hashStr(S.uid + '|' + formIdStr + '|' + S.created));
  let out = '';
  for (let i=0;i<13;i++){
    if (i===4 || i===9) { out += '-'; continue; }
    out += c[Math.floor(r()*c.length)];
  }
  return out;
}

function fmtTime(sec){
  sec = Math.max(0, Math.round(sec));
  const m = Math.floor(sec/60), s = sec%60;
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
function fmtLeft(ms){
  const m = Math.ceil(ms/60000);
  if (m >= 60) return `${Math.floor(m/60)} ชม. ${m%60} นาที`;
  return `${m} นาที`;
}
function fmtDate(ts){

  return `${d.getDate()}/${d.getMonth()+1}/${(d.getFullYear()+543)%100}`;
}

/* ===================== โบนัสจากเฟอร์นิเจอร์ ===================== */
function roomBonus(){
  const b = {moodSlow:0, hungerSlow:0, focusXp:0, exploreLuck:0, aff:0, coin:0, light:0,
             rest:0, foodBoost:0, duelAtk:0, duelDef:0, crystal:0, exploreFast:0, eggBoost:0};
  for (const k of S.room){
    if (!k || !FURN[k]) continue;
    for (const [ek, ev] of Object.entries(FURN[k].eff)) b[ek] = (b[ek]||0) + ev;
  }
  return b;
}
function isNight(){ const h = new Date().getHours(); return h >= 19 || h < 6; }

/* ===================== ค่าประสบการณ์ / เลเวล ===================== */
function xpNeed(lv){ return Math.round(20 + 5.3 * Math.pow(lv, 1.35)); }

function gainXp(n){
  const p = S.pet; if (!p) return {levels:0};
  n = Math.round(n);
  p.xp += n;
  let levels = 0;
  while (p.xp >= xpNeed(p.lv) && p.lv < 99){
    p.xp -= xpNeed(p.lv);
    p.lv++; levels++;
    const sp = SPECIES[p.sp];
    for (const k of ['STR','VIT','AGI','INT','LUK']){
      p.stats[k] += (k === sp.main) ? 2 : (k === sp.sub ? 1 : (Math.random() < .5 ? 1 : 0));
    }
    // โบนัสตามความหายาก
    const extra = (RARITY[sp.rarity].statMul - 1) * 3;
    if (Math.random() < extra) p.stats[sp.main] += 1;
    if (Math.random() < extra - 1) p.stats[sp.sub] += 1;
  }
  return {levels, xp:n};
}

/* ===================== วิวัฒนาการ ===================== */
function dominantBranch(){
  const c = S.pet.care;
  let best = 'body', bv = -1;
  for (const k of ['body','mind','play']) if (c[k] > bv){ bv = c[k]; best = k; }
  return best;
}
function evoCheck(){
  const p = S.pet; if (!p) return null;
  const next = p.stage + 1;
  if (next > 5) return null;
  const needLv = STAGE_LV[next];
  const needAff = [0, 10, 25, 45, 65, 85][next];
  const br = p.stage >= 3 ? p.branch : dominantBranch();
  const stoneKey = {body:'stone_b', mind:'stone_m', play:'stone_p'}[br];
  const needStone = next === 5;
  const ok = p.lv >= needLv && p.aff >= needAff && (!needStone || (S.bag[stoneKey]||0) > 0);
  return { next, needLv, needAff, needStone, stoneKey, br, ok };
}
function doEvolve(){
  const e = evoCheck();
  if (!e || !e.ok) return null;
  const p = S.pet;
  if (e.needStone){ S.bag[e.stoneKey]--; if (!S.bag[e.stoneKey]) delete S.bag[e.stoneKey]; }
  p.stage = e.next;
  p.branch = e.next >= 5 ? 'anc' : (e.next >= 3 ? e.br : null);
  for (const k of ['STR','VIT','AGI','INT','LUK']) p.stats[k] += 3;
  p.mood = clamp(p.mood + 20, 0, 100);
  p.hp = 100;
  unlockForm();
  return formName(p.sp, p.stage, p.branch);
}
function currentFormId(){
  const p = S.pet;
  return p.stage <= 2 ? formId(p.sp, p.stage) : formId(p.sp, p.stage, p.branch);
}
function unlockForm(){
  const id = currentFormId();
  if (!S.book[id]) S.book[id] = Date.now();
  if (!S.seen) S.seen = {};
  if (!S.seen[S.pet.sp]) S.seen[S.pet.sp] = Date.now();
}

/* ===================== สุ่มสายพันธุ์จากเมล็ด ===================== */
function rollSpecies(tier, n = 3){
  const odds = SEED_ODDS[tier] || SEED_ODDS[1];
  const out = [];
  let guard = 0;
  while (out.length < n && guard++ < 400){
    let total = 0;
    for (const r in odds) total += odds[r];
    let roll = Math.random() * total, rar = 1;
    for (const r in odds){ roll -= odds[r]; if (roll <= 0){ rar = +r; break; } }
    const pool = SP_BY_RARITY(rar).filter(k => !out.includes(k));
    if (!pool.length) continue;
    out.push(pick(pool));
  }
  return out;
}

/* ===================== เวลาเดินจริง ===================== */
function tickOffline(){
  const now = Date.now();
  const hrs = (now - S.lastTick) / 3600000;
  S.lastTick = now;
  if (hrs <= 0) return;
  const t0 = todayKey();
  if (S.daily.day !== t0){ S.daily.day = t0; S.daily.plays = 0; }
  if (!S.pet) return;
  const b = roomBonus();
  const p = S.pet;
  const hMul = RARITY[SPECIES[p.sp].rarity].hungerMul;
  p.hunger = clamp(p.hunger - hrs * 4.2 * hMul * (1 - Math.min(.5, b.hungerSlow)), 0, 100);
  p.mood   = clamp(p.mood   - hrs * 3.0 * (1 - Math.min(.5, b.moodSlow)), 0, 100);
  if (b.light && isNight()) p.mood = clamp(p.mood + hrs * 2, 0, 100);
  if (p.hunger <= 0) p.hp = clamp(p.hp - hrs * 5, 1, 100);
  else if (p.hunger > 50 && p.mood > 40) p.hp = clamp(p.hp + hrs * 3, 0, 100);
  if (b.rest) p.hp = clamp(p.hp + hrs * b.rest, 0, 100);
  if (p.hp < 30) p.sick = true;
  if (p.hp >= 60) p.sick = false;

  // รีเซ็ตรายวัน
  const t = todayKey();
  if (S.daily.day !== t){ S.daily.day = t; S.daily.plays = 0; }
}

/* ===================== การกระทำกับสัตว์เลี้ยง ===================== */
function useItem(key){
  const it = ITEMS[key]; const p = S.pet;
  if (!it || !p || !(S.bag[key] > 0)) return null;
  const b = roomBonus();
  let msg = '';
  if (it.t === 'food'){
    if (p.hunger >= 99) return {err:'อิ่มจนกินไม่ลงแล้ว'};
    const gain = Math.round(it.hunger * (1 + b.foodBoost));
    p.hunger = clamp(p.hunger + gain, 0, 100);
    p.mood = clamp(p.mood + (it.mood||0), 0, 100);
    p.aff = clamp(p.aff + (it.aff||0) * (1 + b.aff), 0, 100);
    p.care.body += 1;
    gainXp(6);
    let extraMsg = '';
    if (it.boost){ S.boost = (S.boost || 0) + it.boost; extraMsg = ` · ตื่นตัวอีก ${S.boost} รอบ`; }
    msg = `ให้${it.n}แล้ว ความอิ่ม +${gain}${b.foodBoost?' (เตาถ่านช่วยเพิ่ม)':''}${extraMsg}`;
  } else if (it.t === 'heal'){
    if (p.hp >= 100 && !(it.cure && p.sick) && !it.guard) return {err:'สุขภาพเต็มอยู่แล้ว'};
    p.hp = clamp(p.hp + it.heal, 0, 100);
    p.mood = clamp(p.mood + (it.mood||0), 0, 100);
    p.care.body += 2;
    if (it.cure) p.sick = false;
    if (p.hp >= 60) p.sick = false;
    const extra = [];
    if (it.cure) extra.push('หายป่วยแล้ว');
    if (it.guard){ S.guard = (S.guard || 0) + it.guard; extra.push('กันบาดเจ็บได้อีก ' + S.guard + ' ครั้ง'); }
    msg = `ใช้${it.n} สุขภาพ +${it.heal}${extra.length?' · '+extra.join(' · '):''}`;
  } else if (it.t === 'stat'){
    const sp = SPECIES[p.sp];
    const key = it.target === 'sub' ? sp.sub : sp.main;
    p.stats[key] += it.up;
    p.care.body += 1;
    msg = `${p.name} แข็งแรงขึ้น ${key} +${it.up}`;
  } else if (it.t === 'care'){
    p.care[it.br] = (p.care[it.br] || 0) + it.up;
    p.mood = clamp(p.mood + 4, 0, 100);
    msg = `เส้นทางสาย${BRANCHES[it.br]} +${it.up}`;
  } else if (it.t === 'eggboost'){
    if (!S.egg) return {err:'ยังไม่มีไข่ที่กำลังฟัก'};
    if (S.egg.pts >= S.egg.need) return {err:'ไข่ใบนี้พร้อมฟักอยู่แล้ว'};
    S.egg.pts += it.up;
    msg = `ไข่ได้รับ +${it.up} คะแนน`;
  } else if (it.t === 'explore'){
    if (!S.explore) return {err:'ยังไม่ได้ส่งวิญญาณออกสำรวจ'};
    if (Date.now() >= S.explore.endAt) return {err:'กลับมาถึงบ้านแล้ว กดรับของได้เลย'};
    S.explore.endAt = Date.now();
    msg = `${p.name} กลับถึงบ้านทันที`;
  } else if (it.t === 'tool'){
    const t = todayKey();
    if (S.mopDay === t) return {err:'วันนี้ถูบ้านไปแล้ว พรุ่งนี้ค่อยถูใหม่'};
    S.mopDay = t;
    p.mood = clamp(p.mood + 15, 0, 100);
    p.hp = clamp(p.hp + 8, 0, 100);
    p.sick = false;
    p.care.body += 2;
    gainXp(10);
    return {msg:`ถูบ้านจนสะอาด ${p.name} อารมณ์ +15 สุขภาพ +8 และหายป่วย`, keep:true};
  } else if (it.t === 'egg'){
    return {egg:true};
  } else {
    return {err:'ไอเทมนี้ใช้กับวิญญาณไม่ได้'};
  }
  S.bag[key]--; if (!S.bag[key]) delete S.bag[key];
  return {msg};
}

function addItem(key, n=1){
  S.bag[key] = (S.bag[key]||0) + n;
}
function bagCount(){ return Object.values(S.bag).reduce((a,b)=>a+b, 0); }
function petPower(p){ p = p || S.pet; return ['STR','VIT','AGI','INT','LUK'].reduce((a,k)=>a+p.stats[k], 0); }

function allQuestions(){
  const off = S.qoff || {};
  const built = QBANK_BUILTIN.filter(q => !off[q.id]);
