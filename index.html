<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ห้องเรียนไร้ขีดจำกัด — #ห้องเรียนครูชัช</title>
<meta name="theme-color" content="#101b22">
<meta name="description" content="ห้องเรียนไร้ขีดจำกัด #ห้องเรียนครูชัช — เกมตอบคำถามตามหลักสูตรที่เปลี่ยนคะแนนของนักเรียนให้กลายเป็นวิญญาณที่เลี้ยงและเติบโตได้">
<meta property="og:title" content="ห้องเรียนไร้ขีดจำกัด #ห้องเรียนครูชัช">
<meta property="og:description" content="ตอบคำถามตามหลักสูตร สะสมคะแนนฟักไข่ เลี้ยงวิญญาณ 32 สายพันธุ์ 320 ร่าง">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23142430'/%3E%3Cpath d='M7 18h18l-3 9H10z' fill='%236d9d8b'/%3E%3Cellipse cx='16' cy='18' rx='9' ry='2.4' fill='%23a9cfbe'/%3E%3Cellipse cx='16' cy='11' rx='5' ry='6' fill='%23d8b04a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Trirong:wght@400;600;700&family=IBM+Plex+Sans+Thai:wght@300;400;500;600&family=IBM+Plex+Mono:wght@300;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0d161c;
  --deep:#152430;
  --panel:#1b303c;
  --line:rgba(190,222,210,.14);
  --glaze:#7cae9b;
  --glaze-dk:#42705f;
  --glaze-lt:#a8d3c2;
  --gold:#d8b04a;
  --lacquer:#a03b45;
  --mist:#e6efe9;
  --dim:#8ba69c;
  --ok:#7cae9b;
  --warn:#d8b04a;
  --bad:#c26a6a;
  --r:14px;
  --tabh:68px;
  --fs:1;              /* ตัวคูณขนาดตัวอักษร ปรับได้จากปุ่ม Aa */
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(120% 80% at 50% -10%, #1d3441 0%, transparent 60%),
    var(--ink);
  color:var(--mist);
  font-family:'IBM Plex Sans Thai',system-ui,sans-serif;
  font-weight:400;
  font-size:calc(16px * var(--fs));
  line-height:1.6;
  min-height:100vh;
  overflow-x:hidden;
}
body.night{--glaze:#6f9db1;}
h1,h2,h3,.disp{font-family:'Trirong',serif;font-weight:600;letter-spacing:.01em;margin:0}
.mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
#app{max-width:900px;margin:0 auto;padding:0 14px calc(var(--tabh) + 26px);}
header.top{
  position:sticky;top:0;z-index:30;
  margin:0 -14px 12px;padding:10px 14px 10px;
  background:linear-gradient(180deg,rgba(13,22,28,.96) 70%,rgba(13,22,28,0));
  backdrop-filter:blur(8px);
  display:flex;align-items:center;gap:10px;
}
.brand{display:flex;align-items:baseline;gap:8px;flex:1;min-width:0}
.brand{flex-direction:column;align-items:flex-start;gap:0}
.brand b{font-family:'Trirong',serif;font-size:18px;font-weight:700;letter-spacing:.01em;line-height:1.2;white-space:nowrap}
.brand .tag{font-size:10.5px;color:var(--glaze);font-family:'IBM Plex Mono',monospace;letter-spacing:.04em}
.brand span.who{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
@media(max-width:420px){ .brand b{font-size:calc(15px * var(--fs))} }
.purse{display:flex;gap:6px;flex-shrink:0}
.coin{
  display:flex;align-items:center;gap:5px;
  background:rgba(255,255,255,.05);border:1px solid var(--line);
  border-radius:999px;padding:5px 11px;font-size:14px;
}
.coin i{width:9px;height:9px;border-radius:50%;display:block}
.coin.g i{background:var(--gold);box-shadow:0 0 8px rgba(216,176,74,.5)}
.coin.c i{background:var(--glaze-lt);box-shadow:0 0 8px rgba(168,211,194,.5)}

/* ---------- cards ---------- */
.card{
  background:linear-gradient(180deg,var(--panel),var(--deep));
  border:1px solid var(--line);border-radius:var(--r);
  padding:14px;margin-bottom:12px;
}
.card h2{font-size:calc(18.5px * var(--fs));margin-bottom:2px}
.sub{font-size:calc(13px * var(--fs));color:var(--dim)}
.eyebrow{
  font-size:calc(11px * var(--fs));letter-spacing:.18em;text-transform:uppercase;
  color:var(--glaze);font-family:'IBM Plex Mono',monospace;margin-bottom:6px;
}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.spread{justify-content:space-between}
.grow{flex:1;min-width:0}

/* ---------- buttons ---------- */
button{font-family:inherit;font-size:calc(15px * var(--fs));color:inherit;cursor:pointer;border:none;background:none}
.btn{
  background:rgba(255,255,255,.05);border:1px solid var(--line);
  border-radius:10px;padding:10px 14px;color:var(--mist);
  transition:background .15s,border-color .15s,transform .08s;
}
.btn:hover{background:rgba(255,255,255,.09)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.pri{background:var(--glaze-dk);border-color:var(--glaze);color:#f2fbf6;font-weight:500}
.btn.pri:hover{background:#4f8471}
.btn.gold{background:rgba(216,176,74,.16);border-color:rgba(216,176,74,.5);color:#f0dda6}
.btn.danger{border-color:rgba(194,106,106,.45);color:#e8b4b4}
.btn.sm{padding:7px 11px;font-size:calc(13.5px * var(--fs));border-radius:8px}
.btn.on{background:var(--glaze-dk);border-color:var(--glaze)}
.btn.block{width:100%;display:block}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* ---------- pot stage ---------- */
.stage{position:relative;display:flex;justify-content:center;padding:6px 0 0}
#pot{width:100%;max-width:420px;height:auto;display:block;touch-action:manipulation}
.stagelabel{
  position:absolute;left:50%;transform:translateX(-50%);bottom:-2px;
  font-size:calc(11px * var(--fs));color:var(--dim);letter-spacing:.14em;font-family:'IBM Plex Mono',monospace;
}

/* ---------- meters ---------- */
.meters{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 14px;margin-top:12px}
.meter .lab{display:flex;justify-content:space-between;font-size:calc(12.5px * var(--fs));color:var(--dim);margin-bottom:3px}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.07);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:3px;transition:width .4s ease}
.bar.hp>i{background:linear-gradient(90deg,#8fbfae,#c9e3d6)}
.bar.hu>i{background:linear-gradient(90deg,#c9a24a,#e6cf8b)}
.bar.mo>i{background:linear-gradient(90deg,#7fa8c9,#b4d4ea)}
.bar.af>i{background:linear-gradient(90deg,#a0555f,#d2909a)}
.bar.xp>i{background:linear-gradient(90deg,var(--glaze-dk),var(--glaze-lt))}

.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px;text-align:center}
.stat{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:9px;padding:6px 2px}
.stat b{display:block;font-family:'IBM Plex Mono',monospace;font-size:calc(16.5px * var(--fs));font-weight:500}
.stat span{font-size:calc(10.5px * var(--fs));color:var(--dim);letter-spacing:.1em}

/* ---------- focus ---------- */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:calc(14px * var(--fs));
  background:rgba(255,255,255,.03);transition:all .15s;
}
.chip.on{background:var(--glaze-dk);border-color:var(--glaze);color:#f2fbf6}
#clock{font-family:'IBM Plex Mono',monospace;font-size:calc(52px * var(--fs));font-weight:300;letter-spacing:-.02em;line-height:1;text-align:center;margin:4px 0 2px}
#clocknote{text-align:center;font-size:calc(12px * var(--fs));color:var(--dim);min-height:18px}
.drift{color:var(--warn)}
.focusing #tabs{opacity:.35;pointer-events:none}

/* ---------- ตอบคำถาม ---------- */
.qmeta{display:flex;justify-content:space-between;align-items:center;font-size:calc(13px * var(--fs));color:var(--dim);margin-bottom:8px}
.qtext{font-size:calc(20.5px * var(--fs));line-height:1.65;font-family:'Trirong',serif;font-weight:600;margin:2px 0 14px}
.choices{display:flex;flex-direction:column;gap:8px}
.ch{
  display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;
  background:rgba(255,255,255,.04);border:1px solid var(--line);
  border-radius:12px;padding:14px 14px;font-size:calc(16.5px * var(--fs));line-height:1.5;
  transition:background .15s,border-color .15s;
}
.ch:hover:not(:disabled){background:rgba(255,255,255,.08)}
.ch .k{
  flex:none;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;
  background:rgba(255,255,255,.07);border:1px solid var(--line);
  font-family:'IBM Plex Mono',monospace;font-size:calc(13px * var(--fs));margin-top:1px;
}
.ch.right{background:rgba(124,174,155,.20);border-color:var(--glaze)}
.ch.right .k{background:var(--glaze-dk);border-color:var(--glaze)}
.ch.wrong{background:rgba(194,106,106,.16);border-color:var(--bad)}
.ch.wrong .k{background:rgba(194,106,106,.35);border-color:var(--bad)}
.ch:disabled{opacity:.55}
.ch.right:disabled,.ch.wrong:disabled{opacity:1}
.expl{
  margin-top:12px;padding:11px 13px;border-radius:10px;font-size:calc(14.5px * var(--fs));line-height:1.65;
  background:rgba(255,255,255,.04);border-left:3px solid var(--glaze);
}
#qclock{font-family:'IBM Plex Mono',monospace;font-size:calc(16px * var(--fs))}
#qclock.low{color:var(--bad)}
.combo{font-family:'IBM Plex Mono',monospace;color:var(--gold);font-size:calc(14px * var(--fs))}
.dots{display:flex;gap:4px}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.14);display:block}
.dots i.ok{background:var(--glaze)}
.dots i.no{background:var(--bad)}
.dots i.now{background:var(--gold);transform:scale(1.35)}
.eggbar{height:9px;border-radius:5px;background:rgba(255,255,255,.07);overflow:hidden}
.eggbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--glaze-dk),var(--gold));transition:width .5s}
.odds{display:flex;flex-direction:column;gap:5px;margin-top:8px}
.odd{display:flex;align-items:center;gap:8px;font-size:calc(13px * var(--fs))}
.odd .nm{width:74px;flex:none;color:var(--dim)}
.odd .tr{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.06);overflow:hidden}
.odd .tr>i{display:block;height:100%;border-radius:3px}
.odd .pc{width:44px;text-align:right;font-family:'IBM Plex Mono',monospace}
.fld{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);
  background:rgba(255,255,255,.05);color:var(--mist);font-family:inherit;font-size:calc(16px * var(--fs));margin-bottom:8px}
textarea.fld{min-height:76px;resize:vertical;line-height:1.5}
select.fld{appearance:none}

/* ---------- สรุปผลสัมฤทธิ์ ---------- */
.prow{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:none}
.prow .lab{flex:1;min-width:0}
.prow .lab b{display:block;font-size:calc(14.5px * var(--fs));font-weight:500}
.prow .lab .tiny{font-size:calc(12px * var(--fs))}
.prow .num{font-family:'IBM Plex Mono',monospace;font-size:calc(13.5px * var(--fs));text-align:right;width:84px;flex:none}
.pbar{height:7px;border-radius:4px;background:rgba(255,255,255,.07);overflow:hidden;margin-top:5px}
.pbar>i{display:block;height:100%;border-radius:4px}
.trend{font-size:calc(12px * var(--fs));font-family:'IBM Plex Mono',monospace;width:60px;flex:none;text-align:right}
.trend.up{color:var(--ok)} .trend.down{color:var(--bad)} .trend.flat{color:var(--dim)}
.bigstat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.bigstat div{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;padding:9px 4px}
.bigstat b{display:block;font-family:'IBM Plex Mono',monospace;font-size:calc(21px * var(--fs));font-weight:500}
.bigstat span{font-size:calc(11.5px * var(--fs));color:var(--dim)}

/* ---------- lists ---------- */
.list{display:flex;flex-direction:column;gap:8px}
.item{
  display:flex;gap:10px;align-items:center;
  background:rgba(255,255,255,.04);border:1px solid var(--line);
  border-radius:11px;padding:10px 12px;
}
.item .ic{
  width:42px;height:42px;flex:none;border-radius:9px;
  background:rgba(255,255,255,.05);border:1px solid var(--line);
  display:grid;place-items:center;font-size:calc(20px * var(--fs));
}
.item b{display:block;font-size:calc(15px * var(--fs));font-weight:500}
.item .sub{font-size:calc(12.5px * var(--fs))}
.qty{font-family:'IBM Plex Mono',monospace;color:var(--glaze-lt);font-size:calc(14px * var(--fs))}

/* ---------- room ---------- */
#room{
  position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);
  background:linear-gradient(180deg,#20323d 0%,#20323d 58%,#2b3a3a 58%,#243231 100%);
  aspect-ratio:16/10;
}
#room.lit{background:linear-gradient(180deg,#31485a 0%,#31485a 58%,#3d5350 58%,#334744 100%)}
.slots{position:absolute;inset:8%;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr);gap:4px}
.slot{
  border:1px dashed rgba(190,222,210,.16);border-radius:8px;
  display:grid;place-items:center;font-size:calc(26px * var(--fs));line-height:1;
  transition:background .15s;
}
.slot:hover{background:rgba(255,255,255,.05)}
.slot.filled{border-style:solid;border-color:rgba(190,222,210,.22)}

/* ---------- book ---------- */
.book{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.bcard{
  border:1px solid var(--line);border-radius:11px;padding:8px 6px;text-align:center;
  background:rgba(255,255,255,.04);font-size:calc(12px * var(--fs));
}
.bcard.locked{opacity:.32}
.bcard .nm{font-size:calc(12.5px * var(--fs));font-weight:500;margin-top:4px;line-height:1.3}
.bcard .st{font-size:calc(10.5px * var(--fs));color:var(--dim);font-family:'IBM Plex Mono',monospace}
.sigil{margin:0 auto;display:block;border-radius:5px;background:rgba(0,0,0,.25)}

/* ---------- tabs ---------- */
#tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:40;height:var(--tabh);
  padding-bottom:env(safe-area-inset-bottom);
  background:rgba(13,22,28,.94);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);
  display:flex;transition:opacity .2s;
}
#tabs button{
  flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:10px;color:var(--dim);letter-spacing:0;white-space:nowrap;
}
#tabs button .g{font-size:20px;line-height:1;filter:grayscale(1) opacity(.7)}
#tabs button.on{color:var(--glaze-lt)}
#tabs button.on .g{filter:none}
#tabs button .dot{position:absolute;margin:-14px 0 0 20px;width:6px;height:6px;border-radius:50%;background:var(--gold)}

/* ---------- modal / toast ---------- */
#veil{position:fixed;inset:0;z-index:60;background:rgba(5,10,13,.72);backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center}
#veil.show{display:flex}
#sheet{
  width:100%;max-width:520px;max-height:86vh;overflow-y:auto;
  background:linear-gradient(180deg,#1f3543,#152430);
  border:1px solid var(--line);border-bottom:none;
  border-radius:18px 18px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));
  animation:rise .22s ease;
}
@keyframes rise{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
#toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + 16px);
  z-index:70;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:92%;max-width:420px;
}
.tst{
  background:rgba(21,36,48,.97);border:1px solid var(--glaze-dk);
  border-radius:999px;padding:9px 17px;font-size:calc(14px * var(--fs));
  animation:pop .2s ease;box-shadow:0 6px 20px rgba(0,0,0,.4);
}
.tst.gold{border-color:var(--gold);color:#f0dda6}
.tst.bad{border-color:var(--bad);color:#e8b4b4}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}

.hide{display:none !important}
.tiny{font-size:calc(12.5px * var(--fs));color:var(--dim)}
.gap{height:8px}
hr.sep{border:none;border-top:1px solid var(--line);margin:12px 0}
.pill{font-size:calc(11.5px * var(--fs));font-family:'IBM Plex Mono',monospace;letter-spacing:.1em;border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--dim)}

@media(min-width:760px){
  #app{padding-bottom:24px}
  #tabs{position:sticky;bottom:0;border-radius:14px;margin-bottom:14px;border:1px solid var(--line)}
  .meters{grid-template-columns:repeat(4,1fr)}
}
@media(prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}

/* ---------- ปรับขนาดตัวอักษร ---------- */
#fsbtn{
  flex:none;width:38px;height:38px;border-radius:11px;
  border:1px solid var(--line);background:rgba(255,255,255,.05);
  color:var(--mist);font-family:'Trirong',serif;font-size:16px;font-weight:600;
  display:grid;place-items:center;line-height:1;
}
#fsbtn:active{transform:scale(.94)}
.fsrow{display:flex;gap:8px;align-items:stretch}
.fsopt{
  flex:1;border:1px solid var(--line);border-radius:11px;background:rgba(255,255,255,.04);
  padding:12px 4px;text-align:center;color:var(--mist);line-height:1.2;
}
.fsopt.on{background:var(--glaze-dk);border-color:var(--glaze)}
.fsopt b{display:block;font-family:'Trirong',serif;font-weight:600}
.fsopt span{display:block;font-size:10.5px;color:var(--dim);margin-top:3px}
.fsopt.on span{color:#dff0e7}
.fspreview{
  border:1px solid var(--line);border-radius:12px;padding:14px;
  background:rgba(255,255,255,.03);
}
.fspreview .q{font-family:'Trirong',serif;font-weight:600;font-size:calc(20.5px * var(--fs));line-height:1.6}
.fspreview .c{
  margin-top:10px;display:flex;gap:10px;align-items:center;
  border:1px solid var(--line);border-radius:12px;padding:12px;
  font-size:calc(16.5px * var(--fs));
}
.fspreview .c .k{
  width:calc(26px * var(--fs));height:calc(26px * var(--fs));flex:none;border-radius:7px;
  background:rgba(255,255,255,.07);border:1px solid var(--line);
  display:grid;place-items:center;font-family:'IBM Plex Mono',monospace;font-size:calc(13px * var(--fs));
}
</style>
</head>
<body>

<div id="app">
  <header class="top">
    <div class="brand">
      <b>ห้องเรียนไร้ขีดจำกัด</b>
      <span class="who" id="petline">#ห้องเรียนครูชัช</span>
    </div>
    <button id="fsbtn" title="ปรับขนาดตัวอักษร" aria-label="ปรับขนาดตัวอักษร">Aa</button>
    <div class="purse">
      <div class="coin g"><i></i><span class="mono" id="coins">0</span></div>
      <div class="coin c"><i></i><span class="mono" id="crys">0</span></div>
    </div>
  </header>

  <main id="view"></main>
</div>

<nav id="tabs">
  <button data-tab="pot" class="on"><span class="g">🪴</span>กระถาง</button>
  <button data-tab="quiz"><span class="g">❓</span>ตอบคำถาม</button>
  <button data-tab="explore"><span class="g">🧭</span>สำรวจ</button>
  <button data-tab="bag"><span class="g">🎒</span>กระเป๋า</button>

function clampN(v,a,b){ return Math.max(a, Math.min(b, v)); }
function _hsl(h, s, l){ return `hsl(${((Math.round(h)%360)+360)%360}, ${clampN(Math.round(s),6,92)}%, ${clampN(Math.round(l),8,94)}%)`; }
function _hsla(h, s, l, a){ return `hsla(${((Math.round(h)%360)+360)%360}, ${clampN(Math.round(s),6,92)}%, ${clampN(Math.round(l),8,94)}%, ${a})`; }

const SPECIES = {};
const SP_KEYS = [];

  const [id, name, elk, rar, sub, desc] = row;
  const E = ELEMENTS[elk];
  const idxInEl = SP_RAW.filter(r => r[2] === elk).findIndex(r => r[0] === id);
  const r = rngFrom(hashStr('sp:' + id));

  const h = E.h + [-16, 0, 14, 30][idxInEl] + Math.round((r() - .5) * 10);
  const s = E.s + Math.round((r() - .3) * 14) + (rar - 1) * 5;
  const l = E.l + Math.round((r() - .5) * 12) - (rar === 4 ? 4 : 0);

  SPECIES[id] = {
    id, name, elk, el: E.n, g: E.g,
    main: E.main, sub, rarity: rar, desc,
    hue: h, sat: s, lum: l,
    c1:     _hsl(h, s, l),
    c2:     _hsl(h + 6, s + 8, l - 20),
    accent: _hsl(h - 6, s - 6, l + 22),
    dim:    _hsla(h, s, l, .30),
    a: al => _hsla(h - 6, s - 6, l + 22, al),
    traits: {
      body: BODY_SHAPES[Math.floor(r() * BODY_SHAPES.length)],
      horn: rar >= 3 ? HORNS[1 + Math.floor(r() * (HORNS.length - 1))] : HORNS[Math.floor(r() * HORNS.length)],
      ear:  EARS[Math.floor(r() * EARS.length)],
      tail: rar >= 2 ? TAILS[1 + Math.floor(r() * (TAILS.length - 1))] : TAILS[Math.floor(r() * TAILS.length)],
      mark: MARKS[Math.floor(r() * MARKS.length)],
      halo: rar >= 4,
    }
  };
  SP_KEYS.push(id);
});

const STAGE5_NAME = 'ร่างโบราณ';

function formId(sp, stage, branch){
  return stage <= 2 ? `${sp}:${stage}` : `${sp}:${stage}:${branch}`;
}
function formName(sp, stage, branch){
  const b = SPECIES[sp].name;
  if (stage <= 2) return `${b} ${STAGE_NAMES[stage]}`;
  if (stage === 3) return `${b} ${STAGE3_NAME[branch]}`;
  if (stage === 4) return `${b} ${STAGE4_NAME[branch]}`;
  return `${b} ${STAGE5_NAME}`;
}
// ร่างทั้งหมด: 32 สายพันธุ์ × 10 ร่าง = 320
const ALL_FORMS = (() => {
  const out = [];
  for (const sp of SP_KEYS){
    out.push({id:formId(sp,0), sp, stage:0, branch:null});
    out.push({id:formId(sp,1), sp, stage:1, branch:null});
    out.push({id:formId(sp,2), sp, stage:2, branch:null});
    for (const br of Object.keys(BRANCHES)){
      out.push({id:formId(sp,3,br), sp, stage:3, branch:br});
      out.push({id:formId(sp,4,br), sp, stage:4, branch:br});
    }
    out.push({id:formId(sp,5,'anc'), sp, stage:5, branch:'anc'});
  }
  return out;
})();
const FORMS_BY_SP = {};

['a_sep',1,'"ประโยชน์ทับซ้อน" มีความหมายตรงกับข้อใด',['การขัดกันระหว่างผลประโยชน์ส่วนตนกับผลประโยชน์ส่วนรวม','การทำงานหลายอย่างพร้อมกัน','การเรียนสองวิชาในเวลาเดียวกัน','การมีรายได้หลายทาง'],0,'ประโยชน์ทับซ้อนคือคำเรียกภาวะที่ผลประโยชน์สองอย่างขัดกัน'],

['a_sep',2,'ข้อใดเป็นการรับผลประโยชน์ที่ไม่เหมาะสม',['เจ้าหน้าที่รับของขวัญราคาแพงจากผู้ที่มาติดต่อขอใบอนุญาต','เจ้าหน้าที่รับคำขอบคุณจากประชาชน','เจ้าหน้าที่รับเงินเดือนตามที่ราชการกำหนด','เจ้าหน้าที่รับรางวัลจากการทำงานดีเด่นของหน่วยงาน'],0,'การรับของจากผู้มาติดต่ออาจทำให้การตัดสินใจไม่เป็นกลาง'],

['a_sep',2,'ครูที่ปรึกษาให้คะแนนกิจกรรมนักเรียนที่เป็นญาติสูงกว่าคนอื่นทั้งที่ทำงานเท่ากัน เป็นการกระทำแบบใด',['ใช้ความสัมพันธ์ส่วนตัวมาปนกับหน้าที่ ทำให้เกิดความไม่เป็นธรรม','แสดงความรักต่อญาติอย่างเหมาะสม','ให้กำลังใจนักเรียนในความดูแล','เป็นเรื่องปกติที่ทำได้'],0,'การประเมินต้องยึดผลงาน ไม่ใช่ความสัมพันธ์'],
['a_sep',2,'ข้อใดคือวิธีป้องกันการขัดกันของผลประโยชน์ในการจัดซื้อของโรงเรียน',['ตั้งคณะกรรมการหลายคนและเปิดเผยราคาให้ตรวจสอบได้','ให้คนเดียวตัดสินใจเพื่อความรวดเร็ว','เลือกร้านที่รู้จักกันเป็นการส่วนตัว','ไม่ต้องทำเอกสารเพื่อประหยัดกระดาษ'],0,'การกระจายอำนาจตัดสินใจและความโปร่งใสช่วยป้องกันการเอื้อประโยชน์'],

['a_sep',2,'ข้อใดเป็นการใช้ข้อมูลภายในเพื่อประโยชน์ส่วนตน',['ผู้ที่รู้ล่วงหน้าว่าจะมีการสร้างถนน จึงรีบไปซื้อที่ดินบริเวณนั้นไว้ก่อน','ผู้ที่อ่านประกาศของทางราชการที่ติดไว้หน้าที่ว่าการอำเภอ','ผู้ที่สอบถามข้อมูลจากเจ้าหน้าที่ตามช่องทางปกติ','ผู้ที่เข้าร่วมประชุมประชาคมหมู่บ้าน'],0,'การใช้ข้อมูลที่คนอื่นยังไม่รู้เพื่อประโยชน์ตนเองคือการเอาเปรียบส่วนรวม'],
['a_sep',2,'เมื่อได้รับมอบหมายให้เป็นกรรมการนักเรียน สิ่งใดสำคัญที่สุด',['ทำหน้าที่เพื่อประโยชน์ของนักเรียนทุกคนอย่างเป็นธรรม','ใช้ตำแหน่งให้เพื่อนเกรงใจ','ได้สิทธิพิเศษมากกว่าคนอื่น','ได้รับการยกเว้นจากกฎของโรงเรียน'],0,'ตำแหน่งคือหน้าที่ที่ต้องทำเพื่อส่วนรวม ไม่ใช่สิทธิพิเศษ'],
['a_sep',3,'เพราะเหตุใดการรับของขวัญจากผู้มาติดต่อราชการจึงเป็นเรื่องที่ต้องระวัง',['เพราะอาจทำให้เจ้าหน้าที่รู้สึกเกรงใจและตัดสินใจเข้าข้างผู้ให้','เพราะของขวัญมีราคาแพงเกินไป','เพราะเจ้าหน้าที่ไม่ชอบของขวัญ','เพราะทำให้เสียเวลาในการทำงาน'],0,'ความเกรงใจที่เกิดขึ้นทำให้การตัดสินใจไม่เป็นกลางอีกต่อไป'],
['a_sep',3,'ข้อใดคือความแตกต่างระหว่าง "การให้ด้วยน้ำใจ" กับ "การให้เพื่อหวังผล"',['การให้ด้วยน้ำใจไม่ต้องการสิ่งตอบแทน ส่วนการให้เพื่อหวังผลต้องการให้ผู้รับทำอะไรบางอย่างให้','ทั้งสองอย่างเหมือนกันทุกประการ','การให้ด้วยน้ำใจต้องมีราคาแพงกว่า','การให้เพื่อหวังผลต้องให้ต่อหน้าคนอื่น'],0,'เจตนาของผู้ให้และเงื่อนไขที่แฝงมาคือจุดแยกที่สำคัญ'],
['a_sep',3,'โรงเรียนได้รับบริจาคคอมพิวเตอร์ 10 เครื่อง แต่ครูคนหนึ่งนำกลับบ้าน 1 เครื่อง เป็นการกระทำแบบใด',['นำทรัพย์สินของส่วนรวมไปเป็นของส่วนตัวซึ่งเป็นการทุจริต','เป็นสิทธิของครูที่ดูแลเครื่อง','ช่วยลดภาระการดูแลของโรงเรียน','ไม่ผิดเพราะเป็นของบริจาค'],0,'ของบริจาคที่มอบให้โรงเรียนถือเป็นทรัพย์สินของโรงเรียน'],
['a_sep',3,'ข้อใดแสดงว่าผู้นำชุมชนแยกแยะผลประโยชน์ได้ถูกต้อง',['จัดสรรงบพัฒนาหมู่บ้านตามความจำเป็นของทุกคุ้ม ไม่ใช่เฉพาะคุ้มที่ตนอาศัยอยู่','นำงบไปพัฒนาเฉพาะถนนหน้าบ้านตนเอง','ให้ญาติเป็นผู้รับเหมาทุกโครงการ','ใช้งบซื้อของแจกเฉพาะผู้ที่เลือกตน'],0,'การจัดสรรตามความจำเป็นของส่วนรวมคือการยึดประโยชน์ส่วนรวม'],
['a_sep',3,'เหตุใดจึงต้องเปิดเผยข้อมูลการใช้งบประมาณของหน่วยงานให้ประชาชนทราบ',['เพราะเป็นเงินภาษีของประชาชน จึงต้องให้เจ้าของเงินตรวจสอบได้','เพราะกฎหมายบังคับโดยไม่มีเหตุผล','เพราะทำให้หน่วยงานดูน่าเชื่อถือเท่านั้น','เพราะต้องการให้ประชาชนบริจาคเพิ่ม'],0,'ประชาชนเป็นเจ้าของภาษีจึงมีสิทธิรู้ว่าเงินถูกใช้ไปอย่างไร'],
['a_sep',3,'ข้อใดเป็นการปฏิบัติที่ถูกต้องเมื่อกรรมการคนหนึ่งมีส่วนได้เสียกับเรื่องที่กำลังพิจารณา',['ถอนตัวจากการพิจารณาเรื่องนั้นเพื่อความเป็นกลาง','ร่วมพิจารณาต่อไปแต่ไม่ออกความเห็น','ร่วมพิจารณาและออกเสียงตามปกติ','ให้เพื่อนออกเสียงแทนตนเอง'],0,'การถอนตัวเมื่อมีส่วนได้เสียคือหลักปฏิบัติสากลในการป้องกันประโยชน์ทับซ้อน'],
['a_sep',3,'ผลกระทบระยะยาวของการที่ผู้มีอำนาจแยกแยะผลประโยชน์ไม่ได้คือข้อใด',['ทรัพยากรของส่วนรวมถูกใช้ไม่คุ้มค่าและประชาชนขาดความไว้วางใจ','ประชาชนมีรายได้เพิ่มขึ้น','การพัฒนาชุมชนรวดเร็วขึ้น','ทุกคนได้รับความเป็นธรรมมากขึ้น'],0,'เงินส่วนรวมรั่วไหลและความเชื่อมั่นในระบบก็ลดลงตามไปด้วย'],
['a_sep',3,'ข้อใดเป็นการใช้ตำแหน่งหน้าที่โดยมิชอบ',['ครูเวรใช้อำนาจยกเว้นโทษให้เฉพาะนักเรียนที่นำของมาให้','ครูเวรบันทึกชื่อผู้มาสายตามความเป็นจริง','ครูเวรตักเตือนนักเรียนทุกคนที่ทำผิดเหมือนกัน','ครูเวรรายงานผลการอยู่เวรต่อผู้บริหาร'],0,'การเลือกปฏิบัติเพื่อแลกกับสิ่งของคือการใช้อำนาจโดยมิชอบ'],
['a_sep',4,'ข้อใดวิเคราะห์ได้ถูกต้องที่สุดเกี่ยวกับการแยกแยะผลประโยชน์',['ผู้ที่มีหน้าที่ต้องถามตนเองเสมอว่าการตัดสินใจนี้ทำเพื่อส่วนรวมหรือเพื่อตนเองและพวกพ้อง','ถ้าไม่มีใครเสียหายก็ถือว่าไม่ผิด','ถ้าทำเป็นครั้งคราวก็ยอมรับได้','ถ้าผู้อื่นก็ทำเหมือนกันก็ไม่ถือว่าผิด'],0,'คำถามที่ต้องถามตัวเองเสมอคือการตัดสินใจนี้ยึดประโยชน์ของใครเป็นหลัก'],
['a_sep',2,'การจับสลากเพื่อแบ่งหน้าที่ในกิจกรรมของห้อง แสดงถึงสิ่งใด',['ความเป็นธรรมและการไม่เลือกที่รักมักที่ชัง','ความไม่กล้าตัดสินใจ','การหลีกเลี่ยงความรับผิดชอบ','การเล่นเสี่ยงโชค'],0,'การจับสลากทำให้ทุกคนมีโอกาสเท่ากันโดยไม่มีอคติ'],
['a_sep',2,'ข้อใดเป็นทรัพยากรส่วนรวมที่คนในชุมชนใช้ร่วมกัน',['แหล่งน้ำสาธารณะและป่าชุมชน','สวนหลังบ้านของเพื่อนบ้าน','บ่อน้ำในบ้านตนเอง','รถจักรยานยนต์ของพี่ชาย'],0,'แหล่งน้ำสาธารณะและป่าชุมชนเป็นทรัพยากรที่ทุกคนใช้ร่วมกัน'],
['a_sep',3,'การจับปลาในแหล่งน้ำสาธารณะด้วยวิธีที่ทำลายลูกปลาทั้งหมด ส่งผลอย่างไร',['ได้ประโยชน์ส่วนตนระยะสั้น แต่ทำให้ส่วนรวมเสียประโยชน์ในระยะยาว','ทำให้ปลาในแหล่งน้ำเพิ่มขึ้น','เป็นการช่วยรักษาระบบนิเวศ','ไม่มีผลกระทบต่อผู้อื่น'],0,'การเอาประโยชน์ส่วนตนจนทรัพยากรส่วนรวมเสียหายคือการเบียดเบียนคนทั้งชุมชน'],

['a_sep',1,'"ระบบคิดฐานสอง" (Digital) มีลักษณะอย่างไร',['แยกแยะถูกผิดออกจากกันอย่างชัดเจน ไม่นำมาปะปนกัน','คิดได้หลายระดับตามความเหมาะสม','ตัดสินใจตามความรู้สึกในขณะนั้น','ตัดสินใจตามที่คนส่วนใหญ่ทำ'],0,'ระบบคิดฐานสองคือการแยกผิดกับถูกออกจากกันเด็ดขาดเหมือนเลข 0 กับ 1'],
['a_sep',1,'"ระบบคิดฐานสิบ" (Analog) มีลักษณะอย่างไร',['มีหลายระดับปะปนกันจนแยกผลประโยชน์ส่วนตนออกจากส่วนรวมได้ยาก','แยกถูกผิดได้ชัดเจนที่สุด','ใช้ได้เฉพาะกับวิชาคณิตศาสตร์','ทำให้การตัดสินใจเป็นธรรมมากขึ้น'],0,'ระบบคิดฐานสิบมีหลายระดับจนเกิดข้ออ้างให้ผลประโยชน์ปะปนกันได้'],
['a_sep',2,'ระบบคิดแบบใดที่ช่วยป้องกันการทุจริตได้ดีกว่า และเพราะเหตุใด',['ระบบคิดฐานสอง เพราะแยกผลประโยชน์ส่วนตนกับส่วนรวมออกจากกันอย่างเด็ดขาด','ระบบคิดฐานสิบ เพราะยืดหยุ่นกว่า','ทั้งสองระบบให้ผลเหมือนกัน','ไม่มีระบบใดเกี่ยวข้องกับการทุจริต'],0,'เมื่อไม่มีพื้นที่สีเทา ก็ไม่มีข้ออ้างให้ผลประโยชน์ปะปนกัน'],
['a_sep',2,'ข้อใดเป็นตัวอย่างของการคิดแบบระบบฐานสิบ',['คิดว่าเอาของหลวงมาใช้นิดหน่อยคงไม่เป็นไรเพราะไม่ได้เสียหายมาก','คิดว่าของหลวงคือของหลวง ห้ามนำมาใช้ส่วนตัวเด็ดขาด','แยกเงินส่วนตัวกับเงินส่วนรวมออกจากกันทันที','ปฏิเสธของขวัญจากผู้มาติดต่อทุกกรณี'],0,'คำว่า "นิดหน่อยคงไม่เป็นไร" คือลักษณะของการคิดแบบฐานสิบ'],
['a_sep',2,'ข้อใดเป็นตัวอย่างของการคิดแบบระบบฐานสอง',['ไม่รับของขวัญจากผู้ที่มาติดต่องานไม่ว่าจะมีมูลค่าเท่าใด','รับของขวัญได้ถ้าราคาไม่แพงมาก','รับได้ถ้าคนอื่นก็รับเหมือนกัน','รับได้ถ้าไม่มีใครรู้'],0,'ระบบคิดฐานสองไม่มีเงื่อนไขว่าเล็กหรือใหญ่ ถูกคือถูก ผิดคือผิด'],
['a_sep',2,'ข้อใดคือรูปแบบหนึ่งของการขัดกันระหว่างผลประโยชน์ส่วนตนกับส่วนรวม',['การที่เจ้าหน้าที่รัฐไปทำงานให้บริษัทที่ตนเคยกำกับดูแลทันทีหลังลาออก','การที่เจ้าหน้าที่รับเงินเดือนตามระเบียบ','การที่เจ้าหน้าที่ลาพักร้อนตามสิทธิ','การที่เจ้าหน้าที่เข้ารับการอบรมเพิ่มความรู้'],0,'การย้ายไปทำงานให้ผู้ที่ตนเคยกำกับดูแลอาจนำข้อมูลภายในไปใช้ได้'],
['a_sep',2,'"การรับผลประโยชน์" ในรูปแบบของประโยชน์ทับซ้อนหมายถึงข้อใด',['การรับเงิน สิ่งของ หรือบริการจากผู้ที่เกี่ยวข้องกับหน้าที่ของตน','การรับเงินเดือนจากหน่วยงาน','การรับคำชมจากประชาชน','การรับมอบหมายงานจากผู้บังคับบัญชา'],0,'สิ่งที่ได้รับจากผู้เกี่ยวข้องกับงานอาจทำให้การตัดสินใจไม่เป็นกลาง'],
['a_sep',2,'"การใช้อิทธิพลเพื่อประโยชน์ของเครือญาติ" หมายถึงข้อใด',['การใช้ตำแหน่งหน้าที่ช่วยให้ญาติได้งานหรือได้สิทธิที่ไม่ควรได้','การให้คำแนะนำแก่ญาติเรื่องการเรียน','การช่วยญาติทำงานบ้านในวันหยุด','การพาญาติไปโรงพยาบาลเมื่อป่วย'],0,'การใช้อำนาจในตำแหน่งเอื้อประโยชน์ให้เครือญาติคือประโยชน์ทับซ้อนรูปแบบหนึ่ง'],
['a_sep',2,'ข้อใดเป็นการนำทรัพย์สินของทางราชการไปใช้ประโยชน์ส่วนตัว',['ใช้รถของหน่วยงานไปรับส่งลูกไปโรงเรียนเป็นประจำ','ใช้รถของหน่วยงานไปปฏิบัติราชการตามคำสั่ง','ใช้รถส่วนตัวไปทำงานแล้วเบิกค่าน้ำมันตามระเบียบ','ใช้รถของหน่วยงานไปส่งเอกสารราชการ'],0,'รถของหน่วยงานมีไว้เพื่อภารกิจของหน่วยงานเท่านั้น'],
['a_sep',2,'ข้อใดคือความหมายของ "สินบน"',['เงินหรือประโยชน์ที่ให้แก่เจ้าหน้าที่เพื่อให้ทำหรือไม่ทำสิ่งใดในหน้าที่','ค่าจ้างที่จ่ายตามสัญญา','เงินบริจาคให้วัดหรือโรงเรียน','ภาษีที่ประชาชนต้องจ่าย'],0,'สินบนคือประโยชน์ที่ให้เพื่อแลกกับการใช้อำนาจหน้าที่'],
['a_sep',3,'เหตุใดการรับสินบนจึงเป็นความผิดร้ายแรงกว่าการรับของขวัญทั่วไป',['เพราะเป็นการซื้อขายอำนาจหน้าที่ ทำให้ผู้ที่ไม่จ่ายเสียสิทธิที่ควรได้','เพราะสินบนมีมูลค่าสูงกว่าเสมอ','เพราะสินบนต้องให้เป็นเงินสดเท่านั้น','เพราะสินบนให้ต่อหน้าคนจำนวนมาก'],0,'สินบนทำให้บริการของรัฐกลายเป็นสิ่งที่ต้องซื้อ ผู้ยากจนจึงเสียเปรียบ'],
['a_sep',3,'ข้อใดเป็นการทุจริตในการจัดซื้อจัดจ้างของหน่วยงาน',['ล็อกสเปกให้มีบริษัทเดียวที่เข้าเงื่อนไขได้','เปิดให้หลายบริษัทเสนอราคาแข่งขันกัน','ประกาศรายละเอียดการจัดซื้อทางเว็บไซต์','ตั้งกรรมการตรวจรับหลายคน'],0,'การกำหนดเงื่อนไขให้เอื้อบริษัทใดบริษัทหนึ่งคือการทุจริตรูปแบบหนึ่ง'],
['a_sep',3,'ข้อใดคือผลกระทบของการทุจริตในโครงการก่อสร้างของรัฐ',['งานมีคุณภาพต่ำ ชำรุดเร็ว และประชาชนต้องเสียงบประมาณซ่อมซ้ำ','งานเสร็จเร็วขึ้นและมีคุณภาพดีขึ้น','ประชาชนได้ใช้ของราคาถูกลง','งบประมาณเหลือมากขึ้น'],0,'เงินที่รั่วไหลไปทำให้วัสดุและคุณภาพงานลดลงตามไปด้วย'],
['a_sep',3,'ข้อใดเป็นวิธีป้องกันการขัดกันของผลประโยชน์ที่ได้ผลที่สุด',['กำหนดให้ผู้มีส่วนได้เสียเปิดเผยข้อมูลและถอนตัวจากการตัดสินใจเรื่องนั้น','ให้ผู้มีอำนาจตัดสินใจคนเดียวเพื่อความรวดเร็ว','ไม่ต้องบันทึกการประชุมเพื่อความคล่องตัว','เลือกกรรมการจากคนที่รู้จักกันทั้งหมด'],0,'การเปิดเผยและถอนตัวคือมาตรฐานสากลในการจัดการประโยชน์ทับซ้อน'],
['a_sep',3,'ข้อใดคือความแตกต่างระหว่างการทุจริตกับความผิดพลาดในการทำงาน',['การทุจริตมีเจตนาแสวงหาประโยชน์ ส่วนความผิดพลาดเกิดโดยไม่ตั้งใจ','ทั้งสองอย่างเหมือนกันทุกประการ','ความผิดพลาดมีโทษหนักกว่า','การทุจริตเกิดขึ้นเฉพาะกับผู้มีตำแหน่งสูง'],0,'เจตนาคือสิ่งที่แยกการทุจริตออกจากความบกพร่องธรรมดา'],
['a_sep',3,'เหตุใดผู้ดำรงตำแหน่งทางการเมืองจึงต้องยื่นบัญชีทรัพย์สินและหนี้สิน',['เพื่อให้ตรวจสอบได้ว่ามีทรัพย์สินเพิ่มขึ้นผิดปกติระหว่างดำรงตำแหน่งหรือไม่','เพื่อให้ประชาชนทราบว่าใครรวยที่สุด','เพื่อใช้ในการคำนวณเงินเดือน','เพื่อประกอบการขอสินเชื่อจากธนาคาร'],0,'การเปรียบเทียบทรัพย์สินก่อนและหลังดำรงตำแหน่งช่วยตรวจจับความร่ำรวยผิดปกติ'],
['a_sep',3,'ข้อใดแสดงว่าโรงเรียนมีการบริหารที่แยกผลประโยชน์ได้ชัดเจน',['เปิดเผยรายรับรายจ่ายและให้คณะกรรมการสถานศึกษาร่วมตรวจสอบ','ให้ผู้บริหารเก็บเอกสารการเงินไว้คนเดียว','จัดซื้อจากร้านเดียวมาโดยตลอดโดยไม่เปรียบเทียบราคา','ไม่ต้องรายงานผลการใช้เงินให้ใครทราบ'],0,'ความโปร่งใสและการมีผู้ร่วมตรวจสอบคือหลักประกันความเป็นธรรม'],
['a_sep',3,'ข้อใดคือเหตุผลที่การทุจริตส่งผลต่อการพัฒนาประเทศ',['งบประมาณที่ควรใช้พัฒนาถูกนำไปเป็นประโยชน์ส่วนตน ทำให้ประเทศพัฒนาช้าลง','ทำให้ประเทศได้รับเงินช่วยเหลือมากขึ้น','ทำให้ประชาชนขยันทำงานมากขึ้น','ไม่มีผลต่อการพัฒนาประเทศ'],0,'ทุกบาทที่รั่วไหลคือถนน โรงเรียน หรือโรงพยาบาลที่หายไป'],
['a_sep',4,'ข้อใดวิเคราะห์ระบบคิดฐานสองได้ถูกต้องที่สุด',['เป็นการฝึกให้ตัดสินใจโดยไม่หาข้ออ้างให้ผลประโยชน์ส่วนตนแทรกเข้ามาในหน้าที่','เป็นการคิดเลขในระบบคอมพิวเตอร์','เป็นการแบ่งงานออกเป็นสองส่วน','เป็นการตัดสินใจโดยเลือกทางที่ง่ายที่สุด'],0,'หัวใจของระบบคิดฐานสองคือการไม่เปิดพื้นที่ให้ข้ออ้าง'],
['a_sep',4,'ข้อใดเป็นสถานการณ์ที่ต้องใช้ระบบคิดฐานสองมากที่สุด',['เป็นกรรมการคัดเลือกนักเรียนดีเด่นแล้วมีผู้ปกครองนำของมาให้','เลือกซื้อขนมด้วยเงินของตนเอง','เลือกวิชาเลือกเสรีที่ตนสนใจ','ตัดสินใจว่าจะอ่านหนังสือเล่มใดก่อน'],0,'สถานการณ์ที่หน้าที่ส่วนรวมกับประโยชน์ส่วนตนมาบรรจบกันคือจุดที่ต้องคิดฐานสอง'],
['a_sep',2,'ข้อใดเป็นทรัพย์สินของแผ่นดินที่ประชาชนทุกคนเป็นเจ้าของร่วมกัน',['ป่าไม้ แหล่งน้ำ และแร่ธาตุตามธรรมชาติ','บ้านและที่ดินของเอกชน','รถยนต์ส่วนบุคคล','เงินฝากในบัญชีธนาคารของประชาชน'],0,'ทรัพยากรธรรมชาติเป็นสมบัติของชาติที่ทุกคนเป็นเจ้าของร่วมกัน'],
['a_sep',2,'ข้อใดคือหน้าที่ของเจ้าหน้าที่รัฐต่อประชาชน',['ให้บริการอย่างเท่าเทียมโดยไม่เลือกปฏิบัติ','ให้บริการเฉพาะผู้ที่รู้จักกัน','ให้บริการเร็วขึ้นสำหรับผู้ที่จ่ายเงินเพิ่ม','ให้บริการเฉพาะผู้ที่มีฐานะดี'],0,'ความเท่าเทียมในการรับบริการเป็นสิทธิพื้นฐานของประชาชน'],
['a_sep',3,'ข้อใดเป็นตัวอย่างของการเลือกปฏิบัติที่ไม่เป็นธรรม',['จัดคิวให้ผู้ที่เป็นญาติได้รับบริการก่อนผู้ที่มารอตั้งแต่เช้า','จัดลำดับคิวตามเวลาที่มาถึง','ให้ผู้พิการและผู้สูงอายุได้รับบริการก่อนตามระเบียบ','ให้บริการตามหมายเลขบัตรคิว'],0,'การให้สิทธิตามระเบียบแก่ผู้ต้องการความช่วยเหลือพิเศษไม่ใช่การเลือกปฏิบัติ'],
['a_sep',3,'ข้อใดคือความสำคัญของการทำบัญชีและเก็บหลักฐานการใช้เงินของส่วนรวม',['ทำให้ตรวจสอบย้อนหลังได้และยืนยันความสุจริตของผู้รับผิดชอบ','ทำให้การทำงานล่าช้าลง','ทำให้เปลืองกระดาษโดยไม่จำเป็น','ทำให้ผู้อื่นไม่กล้าถามคำถาม'],0,'หลักฐานที่ครบถ้วนคือเกราะป้องกันทั้งของส่วนรวมและของผู้ปฏิบัติงานเอง'],
['a_sep',2,'ข้อใดคือความหมายที่ถูกต้องของ "ผลประโยชน์ส่วนรวม"',['ประโยชน์ที่ตกแก่สาธารณะและคนส่วนใหญ่ในสังคม','ประโยชน์ของกลุ่มคนที่มีอำนาจ','ประโยชน์ของครอบครัวตนเอง','ประโยชน์ของผู้ที่จ่ายภาษีมากที่สุด'],0,'ผลประโยชน์ส่วนรวมต้องตกแก่สาธารณะ ไม่ใช่กลุ่มใดกลุ่มหนึ่ง'],
['a_sep',3,'เหตุใดการที่ผู้มีอำนาจอนุมัติโครงการลงในพื้นที่ของตนเองเป็นหลักจึงเป็นปัญหา',['เพราะเป็นการใช้งบส่วนรวมเพื่อสร้างความนิยมส่วนตัว ทำให้พื้นที่อื่นเสียโอกาส','เพราะทำให้โครงการเสร็จช้า','เพราะพื้นที่นั้นไม่ต้องการโครงการ','เพราะทำให้ต้องใช้เอกสารมาก'],0,'การจัดสรรต้องยึดความจำเป็นของส่วนรวม ไม่ใช่ฐานเสียงของผู้มีอำนาจ'],

['a_shame',2,'ข้อใดเป็นการทุจริตที่พบในการเลือกตั้งระดับท้องถิ่น',['การแจกเงินหรือสิ่งของเพื่อแลกกับคะแนนเสียง','การเดินหาเสียงตามบ้านเรือน','การติดป้ายหาเสียงตามจุดที่กำหนด','การแถลงนโยบายต่อประชาชน'],0,'การซื้อเสียงทำให้การเลือกตั้งไม่สะท้อนเจตนาที่แท้จริงของประชาชน'],

['a_shame',3,'เหตุใดสังคมที่ยอมรับการทุจริตจึงพัฒนาได้ยาก',['เพราะคนเก่งและซื่อสัตย์ไม่ได้รับโอกาส ขณะที่ทรัพยากรถูกใช้อย่างไม่คุ้มค่า','เพราะประชากรจะลดลง','เพราะไม่มีใครอยากทำงาน','เพราะกฎหมายจะถูกยกเลิก'],0,'ระบบที่ตอบแทนคนโกงจะผลักคนดีออกไปและทำให้ทรัพยากรรั่วไหล'],

['a_shame',3,'ข้อใดคือเหตุผลสำคัญที่ทำให้คนกล้ายืนหยัดต่อต้านการทุจริต',['การมีจิตสำนึกที่มั่นคงและเห็นว่าประโยชน์ส่วนรวมสำคัญกว่าประโยชน์ส่วนตน','การได้รับเงินรางวัลจำนวนมาก','การต้องการมีชื่อเสียง','การถูกบังคับโดยผู้บังคับบัญชา'],0,'จิตสำนึกที่มั่นคงทำให้ยืนหยัดได้แม้ต้องแลกกับความลำบาก'],

['a_shame',4,'ข้อใดวิเคราะห์ได้ถูกต้องเกี่ยวกับคำกล่าวที่ว่า "ใครๆ ก็ทำกัน"',['เป็นข้ออ้างที่ทำให้การทุจริตกลายเป็นเรื่องปกติ ทั้งที่ความผิดไม่ได้ลดลงเพราะมีคนทำมาก','เป็นเหตุผลที่รับฟังได้','แสดงว่าการกระทำนั้นถูกต้อง','เป็นการยืนยันว่ากฎหมายไม่จำเป็น'],0,'จำนวนผู้กระทำไม่ได้เปลี่ยนความผิดให้กลายเป็นความถูก'],

['a_shame',3,'ข้อใดเป็นสิ่งที่นักเรียนควรทำเมื่อไม่แน่ใจว่าการกระทำหนึ่งเป็นการทุจริตหรือไม่',['ปรึกษาครูหรือผู้ใหญ่ที่ไว้ใจได้ก่อนตัดสินใจ','ทำไปก่อนแล้วค่อยถามภายหลัง','ทำตามที่เพื่อนส่วนใหญ่ทำ','เลี่ยงไม่ตัดสินใจอะไรเลย'],0,'การขอคำปรึกษาก่อนลงมือช่วยป้องกันความผิดพลาดได้'],
['a_shame',2,'ข้อใดคือคุณสมบัติสำคัญของผู้ที่มีความซื่อสัตย์สุจริต',['ประพฤติตรงไปตรงมาทั้งต่อหน้าและลับหลัง','พูดจาไพเราะกับทุกคน','ทำงานได้รวดเร็วที่สุด','มีเพื่อนจำนวนมาก'],0,'ความสม่ำเสมอทั้งต่อหน้าและลับหลังคือแก่นของความซื่อสัตย์'],

['a_strong',1,'แนวคิด STRONG มุ่งสร้างสิ่งใดในตัวบุคคล',['จิตพอเพียงที่เป็นภูมิคุ้มกันไม่ให้ทุจริต','ความแข็งแรงของร่างกาย','ความสามารถในการแข่งขันทางธุรกิจ','ความรู้ทางวิทยาศาสตร์'],0,'STRONG คือการสร้างภูมิคุ้มกันการทุจริตจากภายในตัวบุคคล'],

['a_strong',2,'หลักความพอเพียงมีองค์ประกอบสำคัญ 3 ประการคือข้อใด',['ความพอประมาณ ความมีเหตุผล และการมีภูมิคุ้มกันที่ดี','ความประหยัด ความขยัน และความอดทน','ความรู้ ความสามารถ และความซื่อสัตย์','การออม การลงทุน และการกู้ยืม'],0,'สามห่วงของเศรษฐกิจพอเพียงคือพอประมาณ มีเหตุผล และมีภูมิคุ้มกัน'],
['a_strong',2,'เงื่อนไขสำคัญที่กำกับหลักปรัชญาของเศรษฐกิจพอเพียงคือข้อใด',['ความรู้และคุณธรรม','เงินทุนและแรงงาน','เทคโนโลยีและการตลาด','อำนาจและตำแหน่ง'],0,'สองเงื่อนไขที่กำกับสามห่วงคือความรู้และคุณธรรม'],
['a_strong',2,'ข้อใดคือการนำหลักความโปร่งใสมาใช้ในหน่วยงานราชการ',['เปิดเผยข้อมูลการจัดซื้อจัดจ้างบนเว็บไซต์ให้ประชาชนตรวจสอบได้','เก็บข้อมูลไว้เฉพาะในหน่วยงาน','เปิดเผยข้อมูลเมื่อมีคนร้องขอเท่านั้น','เปิดเผยเฉพาะข้อมูลที่เป็นผลงานที่ดี'],0,'ความโปร่งใสหมายถึงการเปิดเผยเชิงรุกและครบถ้วน'],
['a_strong',2,'ข้อใดคือการปฏิบัติตามหลัก "ความตื่นรู้" ของประชาชน',['ติดตามข่าวสารและตรวจสอบการทำงานของหน่วยงานในท้องถิ่น','เชื่อข่าวทุกอย่างที่ได้ยินมา','ไม่สนใจเรื่องส่วนรวมเลย','รอให้คนอื่นมาบอกว่าเกิดอะไรขึ้น'],0,'การตื่นรู้คือการติดตามและรู้เท่าทันสถานการณ์รอบตัว'],
['a_strong',3,'เหตุใดความรู้จึงเป็นเงื่อนไขสำคัญของการต่อต้านการทุจริต',['เพราะผู้ที่รู้กฎหมายและระเบียบจะรู้ว่าสิ่งใดผิดและไม่ตกเป็นเครื่องมือของผู้อื่น','เพราะความรู้ทำให้ได้ตำแหน่งสูงขึ้น','เพราะความรู้ทำให้มีรายได้มากขึ้น','เพราะความรู้ทำให้หลบเลี่ยงกฎหมายได้'],0,'ความรู้ทำให้เรารู้สิทธิของตนและปฏิเสธการมีส่วนร่วมในสิ่งที่ผิดได้'],
['a_strong',3,'ข้อใดคือการนำหลัก STRONG มาใช้ในการบริหารกองทุนของโรงเรียน',['ตั้งคณะกรรมการที่มาจากหลายฝ่าย ทำบัญชีเปิดเผย และรายงานผลอย่างสม่ำเสมอ','ให้ผู้อำนวยการดูแลเพียงคนเดียว','ใช้เงินก่อนแล้วค่อยรายงานเมื่อสิ้นปี','ไม่ต้องเก็บใบเสร็จเพื่อความสะดวก'],0,'การกระจายอำนาจร่วมกับความโปร่งใสคือการนำ STRONG มาใช้จริง'],
['a_strong',3,'ข้อใดสะท้อนหลัก "การมุ่งไปข้างหน้า" ในการต่อต้านการทุจริต',['แม้การเปลี่ยนแปลงจะช้า ก็ยังคงรณรงค์และทำสิ่งที่ถูกต้องอย่างต่อเนื่อง','เลิกรณรงค์เพราะไม่เห็นผลในทันที','รอให้รัฐบาลแก้ปัญหาเพียงฝ่ายเดียว','ย้ายไปอยู่ที่อื่นเพื่อหนีปัญหา'],0,'Onward คือความมุ่งมั่นที่ไม่ยอมแพ้ต่ออุปสรรค'],
['a_strong',3,'ข้อใดคือความสัมพันธ์ระหว่างความพอเพียงกับการทุจริต',['เมื่อคนรู้จักพอ ความโลภซึ่งเป็นต้นเหตุของการทุจริตก็ลดลง','ความพอเพียงทำให้คนมีเงินมากจนไม่ต้องโกง','ความพอเพียงทำให้ไม่ต้องทำงาน','ทั้งสองเรื่องไม่เกี่ยวข้องกัน'],0,'ความโลภคือรากของการทุจริต ความพอเพียงจึงตัดที่รากโดยตรง'],
['a_strong',3,'ข้อใดเป็นการแสดงความเอื้ออาทรในระดับสังคมที่ช่วยลดการทุจริต',['สร้างระบบสวัสดิการและช่วยเหลือผู้ด้อยโอกาสเพื่อลดแรงจูงใจในการกระทำผิด','ให้เงินแก่ผู้ที่มาขอความช่วยเหลือจากเจ้าหน้าที่','ช่วยปกปิดความผิดของเพื่อนร่วมงาน','บริจาคเงินให้ผู้มีอำนาจ'],0,'การลดความเดือดร้อนของคนในสังคมช่วยลดเงื่อนไขที่ผลักให้คนทำผิด'],
['a_strong',3,'ข้อใดคือความหมายของ "ความมีเหตุผล" ตามหลักเศรษฐกิจพอเพียง',['การตัดสินใจโดยพิจารณาจากเหตุปัจจัยและผลที่จะตามมาอย่างรอบคอบ','การทำตามความรู้สึกของตนเอง','การทำตามที่คนส่วนใหญ่ทำ','การตัดสินใจให้เร็วที่สุด'],0,'ความมีเหตุผลคือการคิดถึงเหตุและผลอย่างรอบด้านก่อนตัดสินใจ'],
['a_strong',3,'ข้อใดคือการสร้างภูมิคุ้มกันให้ตนเองตามหลัก STRONG',['หมั่นหาความรู้ ฝึกวินัยทางการเงิน และมีจิตสำนึกที่มั่นคง','สะสมทรัพย์สินให้มากที่สุด','หลีกเลี่ยงการทำงานที่มีความรับผิดชอบ','พึ่งพาผู้อื่นในทุกเรื่อง'],0,'ภูมิคุ้มกันเกิดจากความรู้ วินัย และจิตสำนึกที่ฝึกฝนอย่างสม่ำเสมอ'],
['a_strong',3,'เหตุใดหลัก STRONG จึงต้องเริ่มที่ตัวบุคคลก่อน',['เพราะสังคมประกอบด้วยบุคคล เมื่อแต่ละคนมีภูมิคุ้มกัน สังคมก็เข้มแข็งตาม','เพราะบุคคลมีอำนาจมากกว่าองค์กร','เพราะองค์กรไม่จำเป็นต้องเปลี่ยนแปลง','เพราะกฎหมายไม่มีผลบังคับใช้'],0,'การเปลี่ยนแปลงที่ยั่งยืนเริ่มจากจิตสำนึกของแต่ละคน'],
['a_strong',3,'ข้อใดเป็นการประยุกต์หลักความพอเพียงในระดับชุมชน',['จัดทำแผนใช้ทรัพยากรของชุมชนอย่างสมดุลและคำนึงถึงคนรุ่นต่อไป','ใช้ทรัพยากรให้หมดโดยเร็วที่สุด','ขายทรัพยากรทั้งหมดให้นายทุนภายนอก','ห้ามใช้ทรัพยากรของชุมชนโดยเด็ดขาด'],0,'ความพอเพียงคือความสมดุลระหว่างการใช้ประโยชน์กับการรักษาไว้'],
['a_strong',4,'ข้อใดวิเคราะห์ความสัมพันธ์ของทั้ง 6 องค์ประกอบใน STRONG ได้ถูกต้องที่สุด',['ทั้ง 6 ด้านทำงานร่วมกัน โดยความพอเพียงเป็นฐาน ความรู้และความตื่นรู้เป็นเครื่องมือ ส่วนความโปร่งใสและความเอื้ออาทรทำให้ยั่งยืน','แต่ละด้านแยกกันโดยสิ้นเชิงและไม่เกี่ยวข้องกัน','ต้องทำทีละด้านให้ครบก่อนจึงเริ่มด้านถัดไป','มีเพียงความพอเพียงเท่านั้นที่จำเป็น'],0,'ทั้ง 6 ด้านเสริมกัน ขาดด้านใดด้านหนึ่งภูมิคุ้มกันก็ไม่สมบูรณ์'],
['a_strong',4,'ข้อใดเป็นการนำ STRONG ไปใช้ในระดับประเทศได้อย่างเป็นรูปธรรมที่สุด',['เปิดเผยข้อมูลงบประมาณภาครัฐให้ประชาชนเข้าถึงและตรวจสอบได้','เพิ่มบทลงโทษให้หนักขึ้นเพียงอย่างเดียว','เพิ่มจำนวนเจ้าหน้าที่ตรวจสอบให้มากที่สุด','ลดการเผยแพร่ข่าวการทุจริตเพื่อรักษาภาพลักษณ์'],0,'ความโปร่งใสของข้อมูลเปิดโอกาสให้ประชาชนทั้งประเทศร่วมตรวจสอบ'],
['a_strong',2,'การทำบัญชีครัวเรือนช่วยสร้างภูมิคุ้มกันอย่างไร',['ทำให้รู้สถานะการเงินของตนเองและวางแผนไม่ให้ใช้จ่ายเกินตัวจนเป็นหนี้','ทำให้มีรายได้เพิ่มขึ้นทันที','ทำให้ไม่ต้องเสียภาษี','ทำให้กู้เงินได้ง่ายขึ้น'],0,'การรู้สถานะการเงินช่วยป้องกันการก่อหนี้ที่อาจนำไปสู่การทุจริต'],
['a_strong',3,'ข้อใดคือความเชื่อมโยงระหว่างหนี้สินกับการทุจริต',['ผู้ที่มีหนี้สินล้นพ้นตัวอาจถูกกดดันจนหาทางทุจริตเพื่อหาเงินมาใช้หนี้','หนี้สินทำให้คนขยันทำงานมากขึ้นเสมอ','หนี้สินไม่มีความเกี่ยวข้องกับการทุจริต','ผู้มีหนี้สินจะได้รับความช่วยเหลือจากรัฐเสมอ'],0,'ความกดดันทางการเงินเป็นหนึ่งในเงื่อนไขที่ผลักให้คนตัดสินใจผิด'],
['a_strong',2,'ข้อใดเป็นการใช้ทรัพยากรของโรงเรียนตามหลักความพอเพียง',['ใช้กระดาษทั้งสองหน้าและเปิดไฟเฉพาะเท่าที่จำเป็น','ใช้กระดาษหน้าเดียวแล้วทิ้ง','เปิดแอร์ทิ้งไว้ตลอดวัน','เปิดน้ำทิ้งไว้เพราะไม่ได้จ่ายเอง'],0,'การใช้ทรัพยากรส่วนรวมอย่างคุ้มค่าคือความพอเพียงที่ทำได้ทันที'],
['a_strong',3,'ข้อใดคือบทบาทของเยาวชนในการขับเคลื่อน STRONG',['เป็นแกนนำรณรงค์ในโรงเรียนและชุมชนเพื่อสร้างค่านิยมความซื่อสัตย์','รอให้ผู้ใหญ่ดำเนินการทั้งหมด','เข้าร่วมเฉพาะกิจกรรมที่มีรางวัล','วิพากษ์วิจารณ์ผู้อื่นโดยไม่ลงมือทำ'],0,'เยาวชนคือกำลังสำคัญในการเปลี่ยนค่านิยมของสังคม'],
['a_strong',3,'ข้อใดคือความหมายที่ถูกต้องของคำว่า "จิตพอเพียงต้านทุจริต"',['จิตใจที่รู้จักพอ มีเหตุผล และมีภูมิคุ้มกันจนไม่คิดแสวงหาประโยชน์โดยมิชอบ','จิตใจที่ไม่ต้องการอะไรเลยในชีวิต','จิตใจที่ยอมรับการทุจริตเล็กน้อย','จิตใจที่มุ่งสะสมทรัพย์สิน'],0,'จิตพอเพียงคือความพอดีที่ทำให้ไม่ต้องแสวงหาสิ่งที่ไม่ควรได้'],
['a_strong',2,'ข้อใดเป็นตัวอย่างของความโปร่งใสในระดับบุคคล',['กล้าเปิดเผยที่มาของรายได้และทรัพย์สินของตนเองเมื่อถูกตรวจสอบ','ปกปิดข้อมูลส่วนตัวทุกอย่าง','บอกความจริงเฉพาะกับคนสนิท','เปิดเผยข้อมูลเมื่อถูกบังคับเท่านั้น'],0,'ความโปร่งใสคือความพร้อมที่จะให้ตรวจสอบได้เพราะไม่มีสิ่งใดต้องปิดบัง'],

/* ---------- หน่วยที่ 4 พลเมืองกับความรับผิดชอบต่อสังคม (24 ข้อ) ---------- */
['a_citizen',1,'ข้อใดคือความหมายของ "พลเมือง" ในระบอบประชาธิปไตย',['ผู้ที่มีสิทธิและหน้าที่ ร่วมรับผิดชอบต่อส่วนรวม และตรวจสอบผู้มีอำนาจได้','ผู้ที่อาศัยอยู่ในประเทศโดยไม่ต้องทำอะไร','ผู้ที่เชื่อฟังผู้มีอำนาจทุกอย่าง','ผู้ที่มีสัญชาติไทยเท่านั้น'],0,'พลเมืองต่างจากราษฎรตรงที่มีบทบาทร่วมรับผิดชอบและตรวจสอบ'],
['a_citizen',2,'ข้อใดคือสิทธิของประชาชนตามรัฐธรรมนูญที่เกี่ยวข้องกับการป้องกันการทุจริต',['สิทธิในการเข้าถึงข้อมูลข่าวสารของราชการ','สิทธิในการเลือกที่อยู่อาศัย','สิทธิในการเดินทาง','สิทธิในการนับถือศาสนา'],0,'การเข้าถึงข้อมูลของรัฐทำให้ประชาชนตรวจสอบการใช้อำนาจได้'],
['a_citizen',2,'ข้อใดคือหน้าที่ของพลเมืองที่ช่วยป้องกันการทุจริตได้โดยตรง',['ติดตามตรวจสอบการใช้งบประมาณและแจ้งเบาะแสเมื่อพบความผิดปกติ','เสียภาษีให้ตรงเวลาเท่านั้น','เข้าร่วมกิจกรรมกีฬาของชุมชน','ปลูกต้นไม้ในบริเวณบ้าน'],0,'การเฝ้าระวังและแจ้งเบาะแสคือบทบาทที่กระทบการทุจริตโดยตรง'],
['a_citizen',2,'การมีส่วนร่วมของประชาชนในการพัฒนาท้องถิ่นควรเริ่มจากขั้นตอนใด',['ร่วมรับรู้ข้อมูลและร่วมแสดงความคิดเห็นตั้งแต่ขั้นวางแผน','เข้าร่วมเฉพาะตอนพิธีเปิดโครงการ','รอตรวจสอบเมื่อโครงการเสร็จแล้ว','ไม่ต้องเข้าร่วมเลย'],0,'การมีส่วนร่วมตั้งแต่ต้นทำให้โครงการตรงความต้องการและตรวจสอบได้'],
['a_citizen',2,'ข้อใดคือผลเสียของการซื้อสิทธิขายเสียงต่อระบอบประชาธิปไตย',['ผู้แทนที่ได้รับเลือกไม่ได้มาจากเจตนาที่แท้จริงของประชาชน','ทำให้การเลือกตั้งเสร็จเร็วขึ้น','ทำให้ประชาชนมีรายได้ยั่งยืน','ทำให้ผู้สมัครมีคุณภาพสูงขึ้น'],0,'เสียงที่ถูกซื้อไม่ได้สะท้อนความต้องการที่แท้จริงของประชาชน'],
['a_citizen',2,'ข้อใดเป็นการใช้สื่อสังคมออนไลน์อย่างรับผิดชอบ',['ตรวจสอบความถูกต้องของข้อมูลก่อนแชร์ต่อ','แชร์ข้อมูลทันทีเพราะกลัวตกข่าว','แชร์ข้อมูลที่ทำให้คนอื่นเสียหายโดยไม่ตรวจสอบ','สร้างข่าวขึ้นมาเองเพื่อให้มีคนสนใจ'],0,'การส่งต่อข้อมูลเท็จสร้างความเสียหายที่แก้ไขได้ยาก'],
['a_citizen',2,'ข้อใดคือความหมายของ "ความรับผิดชอบต่อสังคม"',['การกระทำที่คำนึงถึงผลกระทบต่อผู้อื่นและส่วนรวม','การทำตามหน้าที่ของตนเองเท่านั้น','การช่วยเหลือเฉพาะคนในครอบครัว','การไม่ยุ่งเกี่ยวกับเรื่องของผู้อื่น'],0,'ความรับผิดชอบต่อสังคมคือการคิดถึงผลกระทบที่เกิดกับส่วนรวม'],
['a_citizen',3,'เหตุใดการเข้าถึงข้อมูลข่าวสารของราชการจึงสำคัญต่อการป้องกันการทุจริต',['เพราะประชาชนที่มีข้อมูลจะสามารถตรวจสอบและตั้งคำถามได้อย่างมีน้ำหนัก','เพราะทำให้ประชาชนมีเรื่องคุยกันมากขึ้น','เพราะทำให้เจ้าหน้าที่ทำงานช้าลง','เพราะทำให้ต้องใช้กระดาษมากขึ้น'],0,'ข้อมูลคือเครื่องมือที่ทำให้การตรวจสอบมีพลัง'],
['a_citizen',3,'ข้อใดคือบทบาทขององค์กรอิสระในการตรวจสอบการใช้อำนาจรัฐ',['ตรวจสอบการทำงานของหน่วยงานรัฐโดยไม่อยู่ภายใต้การสั่งการของฝ่ายบริหาร','ทำงานตามคำสั่งของรัฐบาลอย่างเคร่งครัด','ดูแลเฉพาะงานด้านการศึกษา','จัดกิจกรรมส่งเสริมการท่องเที่ยว'],0,'ความเป็นอิสระทำให้การตรวจสอบเป็นไปได้โดยไม่ถูกแทรกแซง'],
['a_citizen',3,'ข้อใดเป็นการมีส่วนร่วมของประชาชนในการตรวจสอบโครงการก่อสร้างของท้องถิ่น',['ติดตามความคืบหน้า ตรวจดูป้ายโครงการ และสอบถามเมื่อพบสิ่งผิดปกติ','รอให้โครงการเสร็จแล้วค่อยบ่น','ไม่สนใจเพราะไม่ใช่เงินของตน','ขอส่วนแบ่งจากผู้รับเหมา'],0,'การติดตามอย่างต่อเนื่องช่วยให้ผู้ดำเนินโครงการทำงานอย่างระมัดระวัง'],
['a_citizen',3,'ข้อใดคือความสำคัญของการเคารพกฎหมายในสังคม',['ทำให้ทุกคนอยู่ภายใต้กติกาเดียวกันและได้รับความเป็นธรรมเท่าเทียมกัน','ทำให้ผู้มีอำนาจควบคุมประชาชนได้ง่าย','ทำให้ชีวิตประจำวันยุ่งยากขึ้น','ทำให้ผู้มีเงินได้เปรียบมากขึ้น'],0,'หลักนิติธรรมหมายถึงทุกคนอยู่ใต้กฎหมายเดียวกันโดยไม่มีข้อยกเว้น'],
['a_citizen',3,'ข้อใดคือความหมายของ "หลักนิติธรรม"',['ทุกคนต้องอยู่ภายใต้กฎหมายเดียวกัน รวมถึงผู้มีอำนาจด้วย','กฎหมายใช้บังคับเฉพาะกับประชาชนทั่วไป','ผู้มีอำนาจสามารถออกกฎหมายได้ตามใจชอบ','กฎหมายเปลี่ยนแปลงได้ตามสถานการณ์เสมอ'],0,'หัวใจของหลักนิติธรรมคือไม่มีใครอยู่เหนือกฎหมาย'],
['a_citizen',3,'ข้อใดเป็นการปฏิบัติตนเป็นพลเมืองที่กระตือรือร้น',['เข้าร่วมเวทีประชาคมและเสนอแนวทางแก้ปัญหาของชุมชน','วิจารณ์ปัญหาบนสื่อออนไลน์โดยไม่เข้าร่วมกิจกรรมใด','รอให้หน่วยงานรัฐแก้ปัญหาทั้งหมด','ย้ายออกจากพื้นที่เมื่อมีปัญหา'],0,'พลเมืองที่กระตือรือร้นทั้งแสดงความเห็นและลงมือมีส่วนร่วม'],
['a_citizen',3,'ข้อใดคือความสัมพันธ์ระหว่างการศึกษากับการลดการทุจริต',['การศึกษาที่ปลูกฝังคุณธรรมทำให้พลเมืองมีจิตสำนึกและรู้เท่าทันการทุจริต','การศึกษาไม่มีผลต่อการทุจริต','การศึกษาสูงทำให้ทุจริตเก่งขึ้น','การศึกษาทำให้คนไม่กล้าตรวจสอบ'],0,'การศึกษาสร้างทั้งจิตสำนึกและความรู้ที่จำเป็นในการต่อต้านการทุจริต'],
['a_citizen',3,'ข้อใดเป็นการแสดงความรับผิดชอบต่อสังคมของภาคธุรกิจ',['ดำเนินธุรกิจอย่างสุจริต เสียภาษีถูกต้อง และไม่ให้สินบนเจ้าหน้าที่','เน้นทำกำไรสูงสุดโดยไม่คำนึงถึงวิธีการ','ให้สินบนเพื่อให้ได้งานเร็วขึ้น','หลีกเลี่ยงภาษีอย่างชาญฉลาด'],0,'ธุรกิจที่สุจริตคือส่วนสำคัญของระบบที่ปลอดการทุจริต'],
['a_citizen',3,'ข้อใดเป็นผลดีของสังคมที่มีความโปร่งใสสูง',['นักลงทุนเชื่อมั่น ประชาชนได้รับบริการที่มีคุณภาพ และประเทศพัฒนาได้เร็ว','ประชาชนจะขัดแย้งกันมากขึ้น','เจ้าหน้าที่จะทำงานช้าลง','งบประมาณจะถูกใช้หมดเร็วขึ้น'],0,'ความโปร่งใสสร้างความเชื่อมั่นซึ่งเป็นพื้นฐานของการพัฒนา'],
['a_citizen',3,'นักเรียนสามารถมีส่วนร่วมสร้างสังคมที่โปร่งใสได้อย่างไรในชีวิตประจำวัน',['ปฏิบัติตนซื่อสัตย์ ไม่ลอกงาน และตักเตือนเพื่อนที่ทำสิ่งไม่ถูกต้อง','รอให้โตขึ้นก่อนแล้วค่อยเริ่มทำ','ทำเฉพาะเมื่อมีคนเห็น','สนใจเฉพาะการเรียนของตนเอง'],0,'การเริ่มจากพฤติกรรมในชีวิตประจำวันคือรากฐานของสังคมที่โปร่งใส'],
['a_citizen',4,'ข้อใดวิเคราะห์บทบาทของพลเมืองในการป้องกันการทุจริตได้ครอบคลุมที่สุด',['ต้องทำทั้งการปฏิบัติตนให้สุจริต ไม่ยอมรับการทุจริต และร่วมตรวจสอบอย่างมีข้อมูลและสร้างสรรค์','เพียงแค่ไม่ทุจริตเองก็เพียงพอ','เพียงแค่แจ้งเบาะแสก็เพียงพอ','เป็นหน้าที่ขององค์กรตรวจสอบทั้งหมด'],0,'บทบาทพลเมืองครอบคลุมทั้งการควบคุมตนเอง การไม่ยอมรับ และการตรวจสอบ'],

/* ===========================================================
   ประกอบคลังคำถามทั้งหมด
   เพิ่มชุดใหม่: ประกาศตัวแปร Q_XXX_YY แล้วมาลงทะเบียนใน BANK_SETS
   =========================================================== */
const BANK_SETS = [
  { subj:'hist', grade:'p4', rows: Q_HIST_P4 },
  { subj:'hist', grade:'p5', rows: Q_HIST_P5 },
  { subj:'hist', grade:'p6', rows: Q_HIST_P6 },
  { subj:'hist', grade:'m1', rows: Q_HIST_M1 },
  { subj:'hist', grade:'m2', rows: Q_HIST_M2 },
  { subj:'hist', grade:'m3', rows: Q_HIST_M3 },
  { subj:'anti', grade:'p4', rows: Q_ANTI_P4 },
  { subj:'anti', grade:'p5', rows: Q_ANTI_P5 },
  { subj:'anti', grade:'p6', rows: Q_ANTI_P6 },
];

const QBANK_BUILTIN = [];
for (const set of BANK_SETS){
  set.rows.forEach((row, i) => {
    const [unit, diff, q, ch, ans, exp] = row;
    QBANK_BUILTIN.push({
      id: `${set.subj}_${set.grade}_${i}`,
      subj: set.subj, grade: set.grade, unit,
      diff, q, ch: ch.slice(), ans, exp: exp || '', built: true
    });
  });
}

/* จำนวนข้อที่มีอยู่จริง แยกตามวิชาและระดับชั้น */
function bankCount(subj, grade){
  return QBANK_BUILTIN.filter(q => q.subj === subj && q.grade === grade).length;
}

/* ===================== เซฟข้อมูล ===================== */
const MEM = {};
const Store = {
  async get(k){
    if (typeof window !== 'undefined' && window.storage && window.storage.get){
      try { const r = await window.storage.get(k); return r ? r.value : null; }
      catch(e){ return null; }
    }
    try { return localStorage.getItem(k); } catch(e){ return MEM[k] ?? null; }
  },
  async set(k, v){
    if (typeof window !== 'undefined' && window.storage && window.storage.set){
      try { await window.storage.set(k, v); return; } catch(e){}
    }
    try { localStorage.setItem(k, v); } catch(e){ MEM[k] = v; }
  }
};

let S = null;

function newPet(sp, name){
  const s = SPECIES[sp];
  const mul = RARITY[s.rarity].statMul;
  const base = {STR:5, VIT:5, AGI:5, INT:5, LUK:5};
  base[s.main] += 3;
  base[s.sub]  += 2;
  for (const k in base) base[k] = Math.round(base[k] * mul);
  return {
    sp, name: name || s.name,
    stage:0, branch:null,
    lv:1, xp:0,
    stats: base,
    hunger:70, mood:70, hp:100, aff:5,
    care:{body:0, mind:0, play:0},
    born: Date.now(),
    sick:false,
  };
}
