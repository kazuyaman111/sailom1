function makeUid(){
  let s = '';
  const c = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  for (let i=0;i<8;i++) s += c[Math.floor(Math.random()*c.length)];
  return s;
}

/* ===================== ตัวช่วย ===================== */
const clamp = (v,a,b)=>Math.max(a, Math.min(b, v));
const todayKey = ()=>{ const d=new Date(); return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`; };
const pick = a => a[Math.floor(Math.random()*a.length)];

function hashStr(str){
  let h = 2166136261;
  for (let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function rngFrom(seed){
  let s = seed >>> 0;
  return function(){ s ^= s<<13; s>>>=0; s ^= s>>17; s ^= s<<5; s>>>=0; return s/4294967296; };
}
// รหัสสะสม 13 หลัก ผูกกับบัญชี+ร่าง
function collectCode(formIdStr){
  const c = 'ABCDEFGHJKLMNPQRSTUVWXYZ0123456789';
  const r = rngFrom(hashStr(S.uid + '|' + formIdStr + '|' + S.created));
  let out = '';
  for (let i=0;i<13;i++){
    if (i===4 || i===9) { out += '-'; continue; }
    out += c[Math.floor(r()*c.length)];
  }
  return out;
}

function fmtTime(sec){
  sec = Math.max(0, Math.round(sec));
  const m = Math.floor(sec/60), s = sec%60;
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
function fmtLeft(ms){
  const m = Math.ceil(ms/60000);
  if (m >= 60) return `${Math.floor(m/60)} ชม. ${m%60} นาที`;
  return `${m} นาที`;
}
function fmtDate(ts){
  const d = new Date(ts);
  return `${d.getDate()}/${d.getMonth()+1}/${(d.getFullYear()+543)%100}`;
}

/* ===================== โบนัสจากเฟอร์นิเจอร์ ===================== */
function roomBonus(){
  const b = {moodSlow:0, hungerSlow:0, focusXp:0, exploreLuck:0, aff:0, coin:0, light:0};
  for (const k of S.room){
    if (!k || !FURN[k]) continue;
    for (const [ek, ev] of Object.entries(FURN[k].eff)) b[ek] = (b[ek]||0) + ev;
  }
  return b;
}
function isNight(){ const h = new Date().getHours(); return h >= 19 || h < 6; }

/* ===================== ค่าประสบการณ์ / เลเวล ===================== */
function xpNeed(lv){ return Math.round(20 + 5.3 * Math.pow(lv, 1.35)); }

function gainXp(n){
  const p = S.pet; if (!p) return {levels:0};
  n = Math.round(n);
  p.xp += n;
  let levels = 0;
  while (p.xp >= xpNeed(p.lv) && p.lv < 99){
    p.xp -= xpNeed(p.lv);
    p.lv++; levels++;
    const sp = SPECIES[p.sp];
    for (const k of ['STR','VIT','AGI','INT','LUK']){
      p.stats[k] += (k === sp.main) ? 2 : (k === sp.sub ? 1 : (Math.random() < .5 ? 1 : 0));
    }
    // โบนัสตามความหายาก
    const extra = (RARITY[sp.rarity].statMul - 1) * 3;
    if (Math.random() < extra) p.stats[sp.main] += 1;
    if (Math.random() < extra - 1) p.stats[sp.sub] += 1;
  }
  return {levels, xp:n};
}

/* ===================== วิวัฒนาการ ===================== */
function dominantBranch(){
  const c = S.pet.care;
  let best = 'body', bv = -1;
  for (const k of ['body','mind','play']) if (c[k] > bv){ bv = c[k]; best = k; }
  return best;
}
function evoCheck(){
  const p = S.pet; if (!p) return null;
  const next = p.stage + 1;
  if (next > 5) return null;
  const needLv = STAGE_LV[next];
  const needAff = [0, 10, 25, 45, 65, 85][next];
  const br = p.stage >= 3 ? p.branch : dominantBranch();
  const stoneKey = {body:'stone_b', mind:'stone_m', play:'stone_p'}[br];
  const needStone = next === 5;
  const ok = p.lv >= needLv && p.aff >= needAff && (!needStone || (S.bag[stoneKey]||0) > 0);
  return { next, needLv, needAff, needStone, stoneKey, br, ok };
}
function doEvolve(){
  const e = evoCheck();
  if (!e || !e.ok) return null;
  const p = S.pet;
  if (e.needStone){ S.bag[e.stoneKey]--; if (!S.bag[e.stoneKey]) delete S.bag[e.stoneKey]; }
  p.stage = e.next;
  p.branch = e.next >= 5 ? 'anc' : (e.next >= 3 ? e.br : null);
  for (const k of ['STR','VIT','AGI','INT','LUK']) p.stats[k] += 3;
  p.mood = clamp(p.mood + 20, 0, 100);
  p.hp = 100;
  unlockForm();
  return formName(p.sp, p.stage, p.branch);
}
function currentFormId(){
  const p = S.pet;
  return p.stage <= 2 ? formId(p.sp, p.stage) : formId(p.sp, p.stage, p.branch);
}
function unlockForm(){
  const id = currentFormId();
  if (!S.book[id]) S.book[id] = Date.now();
  if (!S.seen) S.seen = {};
  if (!S.seen[S.pet.sp]) S.seen[S.pet.sp] = Date.now();
}

/* ===================== สวน: เก็บวิญญาณหลายตัว ===================== */
function gardenCount(){ return (S.garden || []).length; }
function stashActive(){
  if (!S.pet) return;
  S.garden = S.garden || [];
  S.garden.push(S.pet);
  S.pet = null;
}
function swapWith(i){
  S.garden = S.garden || [];
  const other = S.garden[i];
  if (!other) return false;
  S.garden[i] = S.pet;
  S.pet = other;
  return true;
}
function releasePet(i){
  S.garden = S.garden || [];
  return S.garden.splice(i, 1)[0];
}

/* ===================== สุ่มสายพันธุ์จากเมล็ด ===================== */
function rollSpecies(tier, n = 3){
  const odds = SEED_ODDS[tier] || SEED_ODDS[1];
  const out = [];
  let guard = 0;
  while (out.length < n && guard++ < 400){
    let total = 0;
    for (const r in odds) total += odds[r];
    let roll = Math.random() * total, rar = 1;
    for (const r in odds){ roll -= odds[r]; if (roll <= 0){ rar = +r; break; } }
    const pool = SP_BY_RARITY(rar).filter(k => !out.includes(k));
    if (!pool.length) continue;
    out.push(pick(pool));
  }
  return out;
}

/* ===================== เวลาเดินจริง ===================== */
function tickOffline(){
  const now = Date.now();
  const hrs = (now - S.lastTick) / 3600000;
  S.lastTick = now;
  if (hrs <= 0) return;
  const t0 = todayKey();
  if (S.daily.day !== t0){ S.daily.day = t0; S.daily.plays = 0; }
  if (!S.pet) return;
  const b = roomBonus();
  const p = S.pet;
  const hMul = RARITY[SPECIES[p.sp].rarity].hungerMul;
  p.hunger = clamp(p.hunger - hrs * 4.2 * hMul * (1 - Math.min(.5, b.hungerSlow)), 0, 100);
  p.mood   = clamp(p.mood   - hrs * 3.0 * (1 - Math.min(.5, b.moodSlow)), 0, 100);
  if (b.light && isNight()) p.mood = clamp(p.mood + hrs * 2, 0, 100);
  if (p.hunger <= 0) p.hp = clamp(p.hp - hrs * 5, 1, 100);
  else if (p.hunger > 50 && p.mood > 40) p.hp = clamp(p.hp + hrs * 3, 0, 100);
  if (p.hp < 30) p.sick = true;
  if (p.hp >= 60) p.sick = false;

  // รีเซ็ตรายวัน
  const t = todayKey();
  if (S.daily.day !== t){ S.daily.day = t; S.daily.plays = 0; }
}

/* ===================== การกระทำกับสัตว์เลี้ยง ===================== */
function useItem(key){
  const it = ITEMS[key]; const p = S.pet;
  if (!it || !p || !(S.bag[key] > 0)) return null;
  const b = roomBonus();
  let msg = '';
  if (it.t === 'food'){
    if (p.hunger >= 99) return {err:'อิ่มจนกินไม่ลงแล้ว'};
    p.hunger = clamp(p.hunger + it.hunger, 0, 100);
    p.mood = clamp(p.mood + (it.mood||0), 0, 100);
    p.aff = clamp(p.aff + (it.aff||0) * (1 + b.aff), 0, 100);
    p.care.body += 1;
    gainXp(6);
    msg = `ให้${it.n}แล้ว ความอิ่ม +${it.hunger}`;
  } else if (it.t === 'heal'){
    if (p.hp >= 100) return {err:'สุขภาพเต็มอยู่แล้ว'};
    p.hp = clamp(p.hp + it.heal, 0, 100);
    p.mood = clamp(p.mood + (it.mood||0), 0, 100);
    p.care.body += 2;
    if (p.hp >= 60) p.sick = false;
    msg = `ใช้${it.n} สุขภาพ +${it.heal}`;
  } else if (it.t === 'egg'){
    return {egg:true};
  } else {
    return {err:'ไอเทมนี้ใช้กับวิญญาณไม่ได้'};
  }
  S.bag[key]--; if (!S.bag[key]) delete S.bag[key];
  return {msg};
}

function addItem(key, n=1){
  S.bag[key] = (S.bag[key]||0) + n;
}
function bagCount(){ return Object.values(S.bag).reduce((a,b)=>a+b, 0); }
function petPower(p){ p = p || S.pet; return ['STR','VIT','AGI','INT','LUK'].reduce((a,k)=>a+p.stats[k], 0); }


/* ===================== คลังคำถาม ===================== */
function allQuestions(){
  const off = S.qoff || {};
  const built = QBANK_BUILTIN.filter(q => !off[q.id]);
  return built.concat(S.qcustom || []);
}
function questionsBy(subj, grade){
  let all = allQuestions();
  if (grade) all = all.filter(q => q.grade === grade);
  return subj === 'mix' ? all : all.filter(q => q.subj === subj);
}
/* วิชาที่มีคำถามพร้อมใช้ในระดับชั้นนั้น */
function subjectsReady(grade){
  return SUBJ_KEYS.filter(k => questionsBy(k, grade).length > 0);
}
function gradesReady(){
  return GRADE_KEYS.filter(g => questionsBy('mix', g).length > 0);
}
function qstate(id){
  S.qstate = S.qstate || {};
  if (!S.qstate[id]) S.qstate[id] = {box:1, seen:0, right:0, wrong:0, at:-999, lastDay:''};
  return S.qstate[id];
}

/* เลือกคำถามถัดไป: ข้อที่ถึงกำหนดทวนก่อน กล่องต่ำมาก่อน */
function pickQuestion(subj, grade, exclude){
  const pool = questionsBy(subj, grade).filter(q => !exclude.includes(q.id));
  if (!pool.length) return null;
  const now = S.qcount || 0;
  const scored = pool.map(q => {
    const st = qstate(q.id);
    const gap = LEITNER_GAP[Math.min(5, st.box)] || 0;
    const overdue = (now - st.at) - gap;        // > 0 คือถึงกำหนดแล้ว
    const fresh = st.seen === 0 ? 40 : 0;       // ข้อที่ยังไม่เคยเจอมาก่อน
    const weight = fresh + Math.max(0, overdue) * 2 + (6 - st.box) * 6 + Math.random() * 18;
    return {q, weight, ready: st.seen === 0 || overdue >= 0};
  });
  const ready = scored.filter(x => x.ready);
  const use = ready.length ? ready : scored;
  use.sort((a, b) => b.weight - a.weight);
  return use[0].q;
}

/* ===================== ให้คะแนนคำตอบ ===================== */
function scoreAnswer(q, correct, msLeft, msTotal, streak){
  const base = DIFF[q.diff].pt;
  if (!correct) return {pts:0, speed:0, mult:0, base};
  const speed = msTotal > 0 ? clamp(msLeft / msTotal, 0, 1) * SPEED_BONUS_MAX : 0;
  const mult = 1 + Math.min(STREAK_CAP, streak) * (1 / STREAK_CAP);   // 1.0 → 2.0
  const st = qstate(q.id);
  const repeat = (st.lastDay === todayKey() && st.seen > 0) ? REPEAT_PENALTY : 1;
  return {
    pts: Math.max(1, Math.round(base * (1 + speed) * mult * repeat)),
    speed, mult, base, repeat
  };
}

/* บันทึกผลสัมฤทธิ์แยกตามวิชา ระดับชั้น และหน่วยการเรียนรู้ */
function progKey(q){ return `${q.subj}|${q.grade}|${q.unit}`; }
function progOf(key){
  S.prog = S.prog || {};
  if (!S.prog[key]) S.prog[key] = {r:0, w:0, recent:[]};
  return S.prog[key];
}
function recordProgress(q, correct){
  const p = progOf(progKey(q));
  if (correct) p.r++; else p.w++;
  p.recent.push(correct ? 1 : 0);
  if (p.recent.length > 40) p.recent.shift();
}
/* แนวโน้ม: เทียบครึ่งหลังกับครึ่งแรกของผลล่าสุด */
function trendOf(p){
  const n = p.recent.length;
  if (n < 10) return null;
  const half = Math.floor(n/2);
  const a = p.recent.slice(0, half), b = p.recent.slice(half);
  const av = a.reduce((x,y)=>x+y,0)/a.length, bv = b.reduce((x,y)=>x+y,0)/b.length;
  return { diff: bv - av, before: av, after: bv };
}

/* บันทึกผลลงกล่องทวนซ้ำ */
function recordAnswer(q, correct){
  const st = qstate(q.id);
  st.seen++;
  st.at = S.qcount || 0;
  st.lastDay = todayKey();
  if (correct){ st.right++; st.box = Math.min(5, st.box + 1); }
  else { st.wrong++; st.box = 1; }
  S.qcount = (S.qcount || 0) + 1;
  recordProgress(q, correct);
}

/* ===================== ไข่ ===================== */
/* ---- สุ่มผังธาตุประจำไข่แต่ละใบ ----
   หน่วยการเรียนรู้เดิมจะให้ธาตุไม่เหมือนกันในไข่คนละใบ
   ทำให้ฟาร์มหน่วยเดิมซ้ำๆ ไม่ได้สายพันธุ์เดิมเสมอไป */
function rollEggMap(){
  const units = Object.keys(UNITS);
  const pool = [];
  while (pool.length < units.length){
    pool.push(...EL_KEYS.slice().sort(() => Math.random() - .5));
  }
  const order = units.slice().sort(() => Math.random() - .5);
  const map = {};
  order.forEach((u, i) => { map[u] = pool[i]; });
  return map;
}
function eggMap(){
  if (!S.egg) return null;
  if (!S.egg.map) S.egg.map = rollEggMap();
  return S.egg.map;
}
function unitEl(u){
  const m = eggMap();
  return (m && m[u]) || (UNITS[u] ? UNITS[u].el : 'wood');
}

function startEgg(tier){
  const key = {1:'seed_r', 2:'seed_g', 3:'seed_m'}[tier];
  S.egg = { tier, pts:0, need: ITEMS[key].need, el:{}, unit:{}, map: rollEggMap() };
}
/* ไข่รับคะแนนพร้อมหน่วยการเรียนรู้ ธาตุของหน่วยเป็นตัวกำหนดสายพันธุ์ */
function eggAddPoints(pts, unitCounts){
  if (!S.egg) return false;
  S.egg.pts += pts;
  S.egg.el = S.egg.el || {}; S.egg.unit = S.egg.unit || {};
  const m = eggMap();
  for (const u in unitCounts){
    if (!UNITS[u]) continue;
    const el = m[u] || UNITS[u].el;
    S.egg.unit[u] = (S.egg.unit[u] || 0) + unitCounts[u];
    S.egg.el[el] = (S.egg.el[el] || 0) + unitCounts[u];
  }
  return S.egg.pts >= S.egg.need;
}
/* สัดส่วนธาตุที่สะสมในไข่ */
function eggElShare(){
  const e = S.egg; if (!e || !e.el) return {};
  let tot = 0;
  for (const k in e.el) tot += e.el[k];
  const out = {};
  if (tot <= 0) return out;
  for (const k in e.el) out[k] = e.el[k] / tot;
  return out;
}
/* หน่วยการเรียนรู้ที่สะสมมากที่สุดในไข่ */
function eggTopUnit(){
  const e = S.egg; if (!e || !e.unit) return null;
  let best = null, bv = -1;
  for (const k in e.unit) if (e.unit[k] > bv){ bv = e.unit[k]; best = k; }
  return best;
}
/* น้ำหนักของแต่ละสายพันธุ์ตอนฟัก
   ขั้นที่ 1 สุ่มความหายากจากชั้นของไข่  ขั้นที่ 2 สุ่มสายพันธุ์ในระดับนั้น
   โดยถ่วงน้ำหนักด้วยสัดส่วนวิชาที่ตอบระหว่างฟัก */
const AFFINITY_K = 10;
const CHAOS_CHANCE = 0.15;   // โอกาสที่ไข่จะสุ่มธาตุเองโดยไม่สนหน่วยที่ตอบ

function hatchWeights(ignoreAffinity){
  const e = S.egg;
  const odds = SEED_ODDS[e ? e.tier : 1] || SEED_ODDS[1];
  const share = ignoreAffinity ? {} : eggElShare();
  const w = {}; for (const k of SP_KEYS) w[k] = 0;
  let tot = 0; for (const r in odds) tot += odds[r];
  for (const r in odds){
    const p = odds[r] / tot;
    if (p <= 0) continue;
    const pool = SP_BY_RARITY(+r);
    if (!pool.length) continue;
    const ws = {}; let sum = 0;
    for (const k of pool){
      const a = 1 + AFFINITY_K * (share[SPECIES[k].elk] || 0);
      ws[k] = a; sum += a;
    }
    for (const k of pool) w[k] += p * ws[k] / sum;
  }
  return w;   // รวมกันได้ 1
}
/* โอกาสเป็นเปอร์เซ็นต์ รวมตามธาตุ */
function hatchOddsByEl(ignoreAffinity){
  const w = hatchWeights(ignoreAffinity);
  const out = {};
  for (const k in w){
    const e = SPECIES[k].elk;
    out[e] = (out[e] || 0) + w[k];
  }
  return out;
}
function hatchRoll(ignoreAffinity){
  const w = hatchWeights(ignoreAffinity);
  let tot = 0; for (const k in w) tot += w[k];
  let r = Math.random() * tot;
  for (const k in w){ r -= w[k]; if (r <= 0) return k; }
  return SP_KEYS[0];
}

/* ===================== แคนวาส: กระถาง + รอยราน + วิญญาณ ===================== */
const CW = 420, CH = 340;
let canvas, ctx, rafId = null, t0 = performance.now();
let crackle = null, crackleSeed = 0;

function initCanvas(el){
  canvas = el; ctx = el.getContext && el.getContext('2d');
  if (!ctx) return;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = CW * dpr; canvas.height = CH * dpr;
  canvas.style.aspectRatio = `${CW}/${CH}`;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (!crackle) buildCrackle(hashStr(S.uid || 'pot'));
  if (rafId) cancelAnimationFrame(rafId);
  loop();
}

/* ---- สร้างเส้นรอยรานแบบสุ่มคงที่ ---- */
function buildCrackle(seed){
  crackleSeed = seed;
  const r = rngFrom(seed || 12345);
  const lines = [];
  for (let i=0;i<26;i++){
    const x = 90 + r()*240, y = 200 + r()*100;
    const pts = [[x,y]];
    let ang = r()*Math.PI*2;
    const n = 3 + Math.floor(r()*4);
    for (let j=0;j<n;j++){
      ang += (r()-.5)*1.5;
      const len = 8 + r()*22;
      const p = pts[pts.length-1];
      pts.push([p[0] + Math.cos(ang)*len, p[1] + Math.sin(ang)*len*.6]);
    }
    lines.push(pts);
  }
  crackle = lines;
}

/* ---- สถานะที่ใช้วาด ---- */
const View = { progress:0, focusing:false, drift:false, mood:70, bounce:0 };

function loop(){
  const t = (performance.now() - t0) / 1000;
  draw(t);
  rafId = requestAnimationFrame(loop);
}

function draw(t){
  if (!ctx || !S) return;
  if (!S.pet && !S.egg) return;
  ctx.clearRect(0,0,CW,CH);
  const p = S.pet, sp = p ? SPECIES[p.sp] : null;
  const night = isNight();
  const lit = roomBonus().light > 0;

  /* พื้นหลังวงกลมนุ่ม */
  const g = ctx.createRadialGradient(CW/2, 150, 20, CW/2, 160, 200);
  const warm = (!night || lit);
  g.addColorStop(0, warm ? 'rgba(124,174,155,.20)' : 'rgba(90,130,170,.16)');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0,0,CW,CH);

  /* วงแหวนโฟกัส */
  drawRing(t);

  /* วิญญาณ หรือไข่ */
  if (p) drawSpirit(t, p, sp);
  if (S.egg) drawEgg(t, !p);

  /* กระถาง */
  drawPot(t);
}

/* ---- วงแหวนรอบกระถาง แสดงความคืบหน้าโฟกัส ---- */
function drawRing(t){
  const cx = CW/2, cy = 172, R = 128;
  ctx.save();
  ctx.lineWidth = 2;
  ctx.strokeStyle = 'rgba(190,222,210,.10)';
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI*2); ctx.stroke();
  if (View.focusing || View.progress > 0){
    ctx.lineWidth = 3.5;
    ctx.lineCap = 'round';
    ctx.strokeStyle = View.drift ? '#d8b04a' : '#a8d3c2';
    ctx.shadowColor = View.drift ? 'rgba(216,176,74,.6)' : 'rgba(168,211,194,.55)';
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.arc(cx, cy, R, -Math.PI/2, -Math.PI/2 + Math.PI*2*clamp(View.progress,0,1));
    ctx.stroke();
    ctx.shadowBlur = 0;
    // จุดหัวเส้น
    const a = -Math.PI/2 + Math.PI*2*clamp(View.progress,0,1);
    ctx.fillStyle = View.drift ? '#e8cf8a' : '#dff0e7';
    ctx.beginPath(); ctx.arc(cx + Math.cos(a)*R, cy + Math.sin(a)*R, 4.5, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

/* ---- กระถางสังคโลก ---- */
function drawPot(t){
  const cx = CW/2;
  const topY = 214, botY = 316, topR = 84, botR = 58;

  ctx.save();
  // เงา
  ctx.fillStyle = 'rgba(0,0,0,.28)';
  ctx.beginPath(); ctx.ellipse(cx, botY+6, botR+14, 10, 0, 0, Math.PI*2); ctx.fill();

  // ตัวกระถาง
  const body = new Path2D();
  body.moveTo(cx-topR, topY);
  body.bezierCurveTo(cx-topR-6, topY+42, cx-botR-8, botY-34, cx-botR, botY);
  body.lineTo(cx+botR, botY);
  body.bezierCurveTo(cx+botR+8, botY-34, cx+topR+6, topY+42, cx+topR, topY);
  body.closePath();

  const pg = ctx.createLinearGradient(cx-topR, topY, cx+topR, botY);
  pg.addColorStop(0, '#8fbba9');
  pg.addColorStop(.45, '#6d9d8b');
  pg.addColorStop(1, '#3f6455');
  ctx.fillStyle = pg; ctx.fill(body);

  // เคลือบสะท้อนแสง
  ctx.save(); ctx.clip(body);
  const sh = ctx.createLinearGradient(cx-70, topY, cx-10, botY);
  sh.addColorStop(0, 'rgba(255,255,255,.22)');
  sh.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = sh; ctx.fillRect(cx-topR, topY, topR, botY-topY);

  // รอยรานตามความคืบหน้า
  const prog = clamp(View.progress, 0, 1);
  const show = Math.floor(crackle.length * prog);
  ctx.lineWidth = 1;
  for (let i=0;i<crackle.length;i++){
    const full = i < show;
    const partial = (i === show) ? (crackle.length*prog - show) : 0;
    if (!full && partial <= 0) continue;
    const pts = crackle[i];
    const lim = full ? pts.length : Math.max(2, Math.ceil(pts.length * partial));
    ctx.strokeStyle = View.drift ? 'rgba(216,176,74,.5)' : 'rgba(233,247,240,.42)';
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let j=1;j<lim;j++) ctx.lineTo(pts[j][0], pts[j][1]);
    ctx.stroke();
  }
  ctx.restore();

  // ขอบปากกระถาง
  ctx.strokeStyle = 'rgba(220,240,232,.35)'; ctx.lineWidth = 1.5; ctx.stroke(body);
  ctx.fillStyle = '#a9cfbe';
  ctx.beginPath(); ctx.ellipse(cx, topY, topR, 15, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#2c4a3f';
  ctx.beginPath(); ctx.ellipse(cx, topY+3, topR-9, 11, 0, 0, Math.PI*2); ctx.fill();
  // ดิน
  ctx.fillStyle = '#3a3026';
  ctx.beginPath(); ctx.ellipse(cx, topY+4, topR-13, 9, 0, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

/* ---- ตัววิญญาณ ---- */
function bodyPath(shape, R){
  const P = new Path2D();
  if (shape === 'tall'){
    P.moveTo(0, -R*1.16);
    P.bezierCurveTo(R*0.80, -R*1.05, R*0.86, R*0.62, 0, R*0.98);
    P.bezierCurveTo(-R*0.86, R*0.62, -R*0.80, -R*1.05, 0, -R*1.16);
  } else if (shape === 'tear'){
    P.moveTo(0, -R*1.24);
    P.bezierCurveTo(R*0.62, -R*0.72, R*1.02, R*0.42, 0, R*0.96);
    P.bezierCurveTo(-R*1.02, R*0.42, -R*0.62, -R*0.72, 0, -R*1.24);
  } else if (shape === 'chunky'){
    P.moveTo(0, -R*0.88);
    P.bezierCurveTo(R*1.18, -R*0.86, R*1.24, R*0.58, 0, R*0.88);
    P.bezierCurveTo(-R*1.24, R*0.58, -R*1.18, -R*0.86, 0, -R*0.88);
  } else {
    P.moveTo(0, -R);
    P.bezierCurveTo(R*0.95, -R*0.95, R*1.05, R*0.6, 0, R*0.92);
    P.bezierCurveTo(-R*1.05, R*0.6, -R*0.95, -R*0.95, 0, -R);
  }
  P.closePath();
  return P;
}
const BODY_TOP = { round:1.0, tall:1.16, tear:1.24, chunky:0.88 };
const BODY_SIDE = { round:1.0, tall:0.84, tear:0.86, chunky:1.18 };

function drawTail(kind, R, sp, t){
  if (kind === 'none') return;
  ctx.save();
  ctx.strokeStyle = sp.a(.75); ctx.lineWidth = Math.max(2, R*0.10); ctx.lineCap = 'round';
  const sway = Math.sin(t*1.8)*R*0.16;
  if (kind === 'wisp'){
    ctx.beginPath();
    ctx.moveTo(R*0.5, R*0.5);
    ctx.quadraticCurveTo(R*1.3, R*0.7 + sway, R*1.5, R*0.05 + sway);
    ctx.stroke();
  } else if (kind === 'plume'){
    ctx.fillStyle = sp.a(.55);
    for (let i=0;i<3;i++){
      ctx.beginPath();
      ctx.moveTo(R*0.45, R*0.55);
      ctx.quadraticCurveTo(R*(1.1+i*0.12), R*(0.5-i*0.35) + sway, R*(1.35+i*0.1), R*(0.1-i*0.42) + sway);
      ctx.quadraticCurveTo(R*(0.95+i*0.1), R*(0.35-i*0.2) + sway, R*0.45, R*0.55);
      ctx.fill();
    }
  } else if (kind === 'curl'){
    ctx.beginPath();
    ctx.moveTo(R*0.5, R*0.45);
    ctx.bezierCurveTo(R*1.35, R*0.55 + sway, R*1.45, -R*0.35 + sway, R*0.85, -R*0.15 + sway);
    ctx.stroke();
  }
  ctx.restore();
}

function drawEars(kind, R, sp, t){
  if (kind === 'none') return;
  ctx.save();
  ctx.fillStyle = sp.c2;
  const wob = Math.sin(t*1.5)*0.08;
  for (const d of [-1, 1]){
    ctx.save(); ctx.translate(d*R*0.62, -R*0.62); ctx.rotate(d*(0.35 + wob));
    ctx.beginPath();
    if (kind === 'leaf'){
      ctx.moveTo(0,0); ctx.quadraticCurveTo(d*R*0.42, -R*0.30, d*R*0.12, -R*0.60);
      ctx.quadraticCurveTo(-d*R*0.06, -R*0.28, 0, 0);
    } else if (kind === 'long'){
      ctx.moveTo(0,0); ctx.quadraticCurveTo(d*R*0.24, -R*0.75, d*R*0.06, -R*1.05);
      ctx.quadraticCurveTo(-d*R*0.16, -R*0.62, 0, 0);
    } else { // fin
      ctx.moveTo(0,0); ctx.lineTo(d*R*0.52, -R*0.22); ctx.lineTo(d*R*0.30, -R*0.52);
      ctx.closePath();
    }
    ctx.fill(); ctx.restore();
  }
  ctx.restore();
}

function drawHorn(kind, R, sp, top){
  if (kind === 'none') return;
  ctx.save();
  ctx.fillStyle = sp.accent; ctx.strokeStyle = sp.accent;
  ctx.lineWidth = Math.max(2, R*0.09); ctx.lineCap = 'round';
  const y = -R*top;
  if (kind === 'single'){
    ctx.beginPath(); ctx.moveTo(-R*0.10, y+R*0.10); ctx.lineTo(0, y-R*0.45); ctx.lineTo(R*0.10, y+R*0.10); ctx.fill();
  } else if (kind === 'pair'){
    for (const d of [-1,1]){
      ctx.beginPath();
      ctx.moveTo(d*R*0.24, y+R*0.16); ctx.lineTo(d*R*0.36, y-R*0.34); ctx.lineTo(d*R*0.44, y+R*0.10);
      ctx.fill();
    }
  } else if (kind === 'curved'){
    for (const d of [-1,1]){
      ctx.beginPath();
      ctx.moveTo(d*R*0.28, y+R*0.16);
      ctx.quadraticCurveTo(d*R*0.72, y-R*0.30, d*R*0.34, y-R*0.52);
      ctx.stroke();
    }
  } else if (kind === 'antler'){
    for (const d of [-1,1]){
      ctx.beginPath();
      ctx.moveTo(d*R*0.22, y+R*0.14); ctx.lineTo(d*R*0.40, y-R*0.48);
      ctx.moveTo(d*R*0.32, y-R*0.18); ctx.lineTo(d*R*0.62, y-R*0.30);
      ctx.moveTo(d*R*0.37, y-R*0.34); ctx.lineTo(d*R*0.20, y-R*0.62);
      ctx.stroke();
    }
  }
  ctx.restore();
}

function drawMarks(kind, R, sp, seed){
  if (kind === 'none') return;
  const r = rngFrom(seed);
  ctx.save();
  if (kind === 'spots'){
    ctx.fillStyle = sp.a(.42);
    for (let i=0;i<6;i++){
      const a = r()*Math.PI*2, d = r()*R*0.8;
      ctx.beginPath(); ctx.arc(Math.cos(a)*d, Math.sin(a)*d*0.9, R*(0.07+r()*0.07), 0, Math.PI*2); ctx.fill();
    }
  } else if (kind === 'stripes'){
    ctx.strokeStyle = sp.a(.38); ctx.lineWidth = R*0.11; ctx.lineCap='round';
    for (let i=0;i<3;i++){
      const y = -R*0.35 + i*R*0.42;
      ctx.beginPath(); ctx.moveTo(-R*1.1, y); ctx.quadraticCurveTo(0, y+R*0.16, R*1.1, y); ctx.stroke();
    }
  } else if (kind === 'veins'){
    ctx.strokeStyle = sp.a(.5); ctx.lineWidth = R*0.05; ctx.lineCap='round';
    for (let i=0;i<5;i++){
      const a = -Math.PI/2 + (i-2)*0.42;
      ctx.beginPath(); ctx.moveTo(0, R*0.55);
      ctx.quadraticCurveTo(Math.cos(a)*R*0.4, R*0.05, Math.cos(a)*R*0.92, Math.sin(a)*R*0.9);
      ctx.stroke();
    }
  }
  ctx.restore();
}

function drawSpirit(t, p, sp){
  const T = sp.traits;
  const cx = CW/2;
  const scale = [0.55, 0.68, 0.82, 1.0, 1.16, 1.3][p.stage];
  const breathe = Math.sin(t*1.6) * 3;
  const happy = p.mood > 60 && p.hp > 40;
  const hop = happy ? Math.abs(Math.sin(t*2.2)) * 5 : 0;
  const cy = 168 - hop + breathe*0.4 + View.bounce;
  const R = 42 * scale;

  ctx.save();
  ctx.translate(cx, cy);

  // แสงเรืองตามความหายาก
  if (sp.rarity >= 3){ ctx.shadowColor = sp.a(.85); ctx.shadowBlur = sp.rarity === 4 ? 26 : 15; }

  // ออร่าร่างโบราณ / วงในตำนาน
  if (p.stage === 5 || T.halo){
    const n = p.stage === 5 ? 7 : 5;
    for (let i=0;i<n;i++){
      const a = t*0.6 + i*Math.PI*2/n;
      const rr = R*1.7 + Math.sin(t*2+i)*6;
      ctx.fillStyle = sp.a(.7);
      ctx.beginPath(); ctx.arc(Math.cos(a)*rr, Math.sin(a)*rr*.5, 3, 0, Math.PI*2); ctx.fill();
    }
  }

  if (p.stage === 0){ drawSeed(R, sp, t); ctx.restore(); return; }

  const top = BODY_TOP[T.body] || 1, side = BODY_SIDE[T.body] || 1;

  // หาง หู เขา อยู่หลังตัว
  drawTail(T.tail, R, sp, t);
  drawEars(T.ear, R, sp, t);
  drawHorn(T.horn, R, sp, top);

  // ปีก / ริ้ว สายระบำ
  if (p.stage >= 3 && p.branch === 'play'){
    ctx.save();
    ctx.strokeStyle = sp.a(.7); ctx.lineWidth = 3; ctx.lineCap = 'round';
    for (const dir of [-1, 1]){
      ctx.beginPath();
      ctx.moveTo(dir*R*0.7, 4);
      ctx.quadraticCurveTo(dir*R*1.8, -14 + Math.sin(t*3)*8, dir*R*2.1, 18 + Math.cos(t*2.4)*8);
      ctx.stroke();
    }
    ctx.restore();
  }
  // เกราะเปลือก สายกายา
  if (p.stage >= 3 && p.branch === 'body'){
    ctx.fillStyle = sp.c2;
    ctx.beginPath(); ctx.ellipse(0, R*0.15, R*side*1.05, R*0.85, 0, Math.PI*0.05, Math.PI*0.95); ctx.fill();
  }
  // วงแหวนฌาน
  if (p.stage >= 3 && p.branch === 'mind'){
    ctx.save();
    ctx.strokeStyle = sp.a(.85); ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.ellipse(0, -R*(top+0.18), R*0.72, R*0.20 + Math.sin(t*1.5)*2, 0, 0, Math.PI*2); ctx.stroke();
    ctx.restore();
  }

  // ตัว
  const P = bodyPath(T.body, R);
  const bg = ctx.createRadialGradient(-R*.3, -R*.35, R*.2, 0, 0, R*1.15);
  bg.addColorStop(0, sp.accent);
  bg.addColorStop(.55, sp.c1);
  bg.addColorStop(1, sp.c2);
  ctx.fillStyle = bg;
  ctx.fill(P);
  ctx.shadowBlur = 0;

  // ลายบนตัว
  ctx.save(); ctx.clip(P);
  drawMarks(T.mark, R, sp, hashStr('mk:' + sp.id));
  ctx.restore();

  // ใบบนหัวสำหรับสายไม้
  if (sp.elk === 'wood'){
    ctx.fillStyle = sp.c2;
    ctx.save(); ctx.translate(0, -R*(top-0.02)); ctx.rotate(Math.sin(t*1.2)*0.12);
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.quadraticCurveTo(R*0.42, -R*0.32, R*0.10, -R*0.72);
    ctx.quadraticCurveTo(-R*0.06, -R*0.36, 0, 0);
    ctx.fill();
    ctx.restore();
  }

  // แก้ม
  if (happy){
    ctx.fillStyle = 'rgba(220,120,120,.28)';
    ctx.beginPath(); ctx.ellipse(-R*side*0.48, R*0.16, R*0.15, R*0.10, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse( R*side*0.48, R*0.16, R*0.15, R*0.10, 0, 0, Math.PI*2); ctx.fill();
  }

  // ตา
  const blink = (Math.sin(t*0.9) > 0.985) ? 0.12 : 1;
  const sleepy = p.hp < 35 || p.mood < 20;
  ctx.fillStyle = '#15242c';
  for (const dx of [-R*0.27*side, R*0.27*side]){
    if (sleepy || View.focusing){
      ctx.strokeStyle = '#15242c'; ctx.lineWidth = 2.6; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(dx - R*0.11, -R*0.06); ctx.quadraticCurveTo(dx, R*0.04, dx + R*0.11, -R*0.06); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.ellipse(dx, -R*0.06, R*0.085, R*0.115*blink, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.85)';
      ctx.beginPath(); ctx.arc(dx + R*0.03, -R*0.11, R*0.03, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#15242c';
    }
  }

  // ปาก
  ctx.strokeStyle = '#15242c'; ctx.lineWidth = 2; ctx.lineCap = 'round';
  ctx.beginPath();
  if (p.mood > 55){ ctx.moveTo(-R*0.12, R*0.24); ctx.quadraticCurveTo(0, R*0.38, R*0.12, R*0.24); }
  else if (p.mood > 25){ ctx.moveTo(-R*0.10, R*0.28); ctx.lineTo(R*0.10, R*0.28); }
  else { ctx.moveTo(-R*0.12, R*0.32); ctx.quadraticCurveTo(0, R*0.18, R*0.12, R*0.32); }
  ctx.stroke();

  if (p.sick){
    ctx.font = '18px serif'; ctx.textAlign='center';
    ctx.fillText('\u{1FA79}', R*0.75, -R*0.75);
  }
  ctx.restore();
}

function drawSeed(R, sp, t){
  ctx.fillStyle = '#6b5540';
  ctx.beginPath(); ctx.ellipse(0, R*0.2, R*0.62, R*0.78, 0, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#48382a'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-R*0.2, -R*0.3); ctx.quadraticCurveTo(0, R*0.2, -R*0.1, R*0.7); ctx.stroke();
  ctx.fillStyle = sp.c1;
  ctx.save(); ctx.translate(0, -R*0.5); ctx.rotate(Math.sin(t*1.4)*0.15);
  ctx.beginPath();
  ctx.moveTo(0,0); ctx.quadraticCurveTo(R*0.5, -R*0.25, R*0.14, -R*0.62);
  ctx.quadraticCurveTo(0, -R*0.3, 0, 0); ctx.fill();
  ctx.restore();
}

/* ---- ไข่ ---- */
function eggTint(){
  const odds = hatchOddsByEl();
  let best = null, bv = -1;
  for (const k in odds) if (odds[k] > bv){ bv = odds[k]; best = k; }
  const E = ELEMENTS[best] || ELEMENTS.wood;
  // ยิ่งธาตุนำมาก สียิ่งชัด
  const lean = clamp((bv - 0.125) / 0.5, 0, 1);
  return { h: E.h, s: 10 + 42 * lean, l: 62 - 6 * lean, lean, el: best };
}

function drawEgg(t, big){
  const e = S.egg; if (!e) return;
  const prog = clamp(e.pts / e.need, 0, 1);
  const tint = eggTint();
  const R = big ? 52 : 22;
  const cx = big ? CW/2 : CW/2 + 96;
  const cy = big ? (168 + Math.sin(t*1.4)*3) : 214;

  ctx.save();
  ctx.translate(cx, cy);

  // ตัวไข่
  const g = ctx.createRadialGradient(-R*0.3, -R*0.45, R*0.2, 0, 0, R*1.3);
  g.addColorStop(0, _hsl(tint.h, tint.s, tint.l + 18));
  g.addColorStop(.6, _hsl(tint.h, tint.s, tint.l));
  g.addColorStop(1, _hsl(tint.h + 6, tint.s + 8, tint.l - 20));
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(0, -R*1.26);
  ctx.bezierCurveTo(R*0.86, -R*0.92, R*0.98, R*0.55, 0, R*1.02);
  ctx.bezierCurveTo(-R*0.98, R*0.55, -R*0.86, -R*0.92, 0, -R*1.26);
  ctx.closePath();
  ctx.fill();

  // ลายจุดตามธาตุ
  const rr = rngFrom(hashStr('egg' + tint.el));
  ctx.fillStyle = _hsla(tint.h, tint.s + 14, tint.l - 26, .45);
  for (let i=0;i<7;i++){
    const a = rr()*Math.PI*2, d = rr()*R*0.72;
    ctx.beginPath(); ctx.arc(Math.cos(a)*d, Math.sin(a)*d*1.05, R*(0.06+rr()*0.06), 0, Math.PI*2); ctx.fill();
  }

  // รอยร้าวตามความคืบหน้าการฟัก
  if (prog > 0.05){
    const n = Math.floor(prog * 7);
    ctx.strokeStyle = 'rgba(20,32,40,.55)'; ctx.lineWidth = Math.max(1, R*0.045);
    const cr = rngFrom(hashStr('crack' + e.tier));
    for (let i=0;i<n;i++){
      let x = (cr()-.5)*R*1.2, y = (cr()-.5)*R*1.6;
      ctx.beginPath(); ctx.moveTo(x, y);
      for (let j=0;j<3;j++){
        x += (cr()-.5)*R*0.5; y += (cr()-.5)*R*0.5;
        ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
  }
  // แสงตอนใกล้ฟัก
  if (prog > 0.85){
    ctx.shadowColor = _hsla(tint.h, 70, 70, .9);
    ctx.shadowBlur = 18 + Math.sin(t*4)*8;
    ctx.strokeStyle = _hsla(tint.h, 60, 78, .5); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(0, -R*0.1, R*0.9, R*1.12, 0, 0, Math.PI*2); ctx.stroke();
    ctx.shadowBlur = 0;
  }
  ctx.restore();
}

/* ---- ตราสัญลักษณ์การ์ด (พิกเซล 7x7) ---- */
function sigilSVG(seedStr, color, size=44){
  const r = rngFrom(hashStr(seedStr));
  const n = 7, cell = size/n;
  let rects = '';
  for (let y=0;y<n;y++){
    for (let x=0;x<Math.ceil(n/2);x++){
      if (r() > .48){
        const o = 0.5 + r()*0.5;
        rects += `<rect x="${x*cell}" y="${y*cell}" width="${cell}" height="${cell}" fill="${color}" opacity="${o.toFixed(2)}"/>`;
        const mx = n-1-x;
        if (mx !== x) rects += `<rect x="${mx*cell}" y="${y*cell}" width="${cell}" height="${cell}" fill="${color}" opacity="${o.toFixed(2)}"/>`;
      }
    }
  }
  return `<svg class="sigil" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${rects}</svg>`;
}

function viewBag(){
  const keys = Object.keys(S.bag).filter(k => S.bag[k] > 0 && ITEMS[k]);
  const order = {food:0, heal:1, stone:2, egg:3, mat:4};
  keys.sort((a,b) => (order[ITEMS[a].t] - order[ITEMS[b].t]) || ITEMS[a].n.localeCompare(ITEMS[b].n,'th'));
  const list = keys.length ? keys.map(k => {

/* ===================== หน้า: สรุปผลสัมฤทธิ์ ===================== */
function accColor(pct){
  if (pct >= 80) return '#7cae9b';
  if (pct >= 60) return '#a8c98a';
  if (pct >= 40) return '#d8b04a';
  return '#c26a6a';
}
function accBar(r, w){
  const t = r + w;
  const pct = t ? Math.round(r / t * 100) : 0;
  return {pct, t, html:`<div class="pbar"><i style="width:${pct}%;background:${accColor(pct)}"></i></div>`};
}
function trendTag(p){
  const tr = trendOf(p);
  if (!tr) return `<span class="trend flat">—</span>`;
  const d = Math.round(tr.diff * 100);
  if (d >= 8)  return `<span class="trend up">▲ ${d}%</span>`;
  if (d <= -8) return `<span class="trend down">▼ ${Math.abs(d)}%</span>`;
  return `<span class="trend flat">คงที่</span>`;
}

function viewSummary(){
  const st = S.stats;
  const acc = st.answered ? Math.round(st.correct / st.answered * 100) : 0;

  // รวมตามวิชา+ระดับชั้น และตามหน่วย
  const bySG = {}, byUnit = {};
  for (const key in (S.prog || {})){
    const [subj, grade, unit] = key.split('|');
    const p = S.prog[key];
    const sg = subj + '|' + grade;
    if (!bySG[sg]) bySG[sg] = {r:0, w:0, subj, grade};
    bySG[sg].r += p.r; bySG[sg].w += p.w;
    byUnit[key] = {subj, grade, unit, p};
  }

  const petCard = S.pet ? (() => {
    const p = S.pet, sp = SPECIES[p.sp];
    return `<div class="card">
      <div class="stage"><canvas id="pot" width="420" height="340" aria-label="วิญญาณปัจจุบัน"></canvas></div>
      <div style="text-align:center;margin-top:4px">

      <div class="stage"><canvas id="pot" width="420" height="340"></canvas></div>

  const sgRows = Object.values(bySG)
    .sort((a,b) => (GRADES[a.grade].ord - GRADES[b.grade].ord) || a.subj.localeCompare(b.subj))

      const b = accBar(x.r, x.w);

          <b>${SUBJECTS[x.subj].g} ${SUBJECTS[x.subj].short} · ${GRADES[x.grade].n}</b>

      </div>`;
    }).join('');

  const unitRows = Object.values(byUnit)
    .sort((a,b) => (b.p.r + b.p.w) - (a.p.r + a.p.w))

      const b = accBar(x.p.r, x.p.w);

      return `<div class="prow">

        <div class="num" style="color:${accColor(b.pct)}">${b.pct}%</div>
        ${trendTag(x.p)}
      </div>`;
    }).join('');

  // หน่วยที่ควรทบทวน
  const weak = Object.values(byUnit)
    .filter(x => (x.p.r + x.p.w) >= 5)
    .map(x => ({...x, pct: x.p.r / (x.p.r + x.p.w) * 100}))

  return `

  ${sgRows ? `<div class="card">
    <div class="eyebrow">แยกตามวิชาและระดับชั้น</div>
    ${sgRows}
  </div>` : ''}
  ${unitRows ? `<div class="card">
    <div class="eyebrow">ผลสัมฤทธิ์รายหน่วยการเรียนรู้</div>
    <div class="sub">ลูกศรเทียบผลครึ่งหลังกับครึ่งแรกของ 40 ข้อล่าสุดในหน่วยนั้น ต้องตอบอย่างน้อย 10 ข้อจึงเริ่มแสดง</div>
    <div class="gap" style="height:6px"></div>
    ${unitRows}
  </div>` : `<div class="card"><div class="eyebrow">ยังไม่มีข้อมูล</div>
    <div class="sub">ตอบคำถามสักรอบแล้วกลับมาดูผลสัมฤทธิ์รายหน่วยได้ที่นี่</div></div>`}
  ${weak.length ? `<div class="card">
    <div class="eyebrow">ควรทบทวน</div>
    <div class="list">${weak.map(x => `<div class="item">
      <div class="ic">${ELEMENTS[UNITS[x.unit].el].g}</div>
      <div class="grow"><b>${UNITS[x.unit].n}</b>
        <div class="sub">${SUBJECTS[x.subj].short} ${GRADES[x.grade].n} · ทำได้ ${Math.round(x.pct)}%</div></div>
    </div>`).join('')}</div>
    <div class="tiny" style="margin-top:8px">ข้อที่ตอบผิดจะถูกนำกลับมาถามซ้ำเร็วขึ้นโดยอัตโนมัติ</div>
  </div>` : ''}`;
}

function quizQuestionHtml(){
  const q = QUIZ.cur;
  const d = DIFF[q.diff];
  const dots = Array.from({length:QUIZ.len}, (_,i) => {
    const m = QUIZ.marks[i];
    return `<i class="${i===QUIZ.idx?'now':(m===1?'ok':(m===0?'no':''))}"></i>`;
  }).join('');

  const choices = q.ch.map((c, i) => {
    let cls = '';
    if (QUIZ.locked){
      if (i === q.ans) cls = 'right';
      else if (i === QUIZ.chosen) cls = 'wrong';
    }
    return `<button class="ch ${cls}" data-ans="${i}" ${QUIZ.locked?'disabled':''}>
      <span class="k">${'กขคง'[i]}</span><span>${esc(c)}</span></button>`;
  }).join('');

  let after = '';
  if (QUIZ.locked){
    const ok = QUIZ.chosen === q.ans;
    const g = QUIZ.gained;
    after = `<div class="expl" style="border-left-color:${ok?'var(--glaze)':'var(--bad)'}">
      <b>${ok ? `ถูกต้อง +${g.pts} คะแนน` : 'ยังไม่ใช่ คำตอบคือ ' + 'กขคง'[q.ans]}</b>
      ${ok && (g.speed > 0.02 || g.mult > 1) ? `<div class="tiny" style="margin-top:2px">ฐาน ${g.base} · เร็ว +${Math.round(g.speed*100)}% · ต่อเนื่อง ×${g.mult.toFixed(1)}${g.repeat<1?' · ข้อซ้ำวันนี้ ×'+g.repeat:''}</div>` : ''}
      ${q.exp ? `<div style="margin-top:6px">${esc(q.exp)}</div>` : ''}
      ${!ok ? `<div class="tiny" style="margin-top:6px;color:var(--glaze-lt)">อ่านคำอธิบายแล้วได้ประสบการณ์เล็กน้อย ข้อนี้จะกลับมาถามอีกเร็วๆ นี้</div>` : ''}
    </div>
    <div class="gap"></div>
    <button class="btn pri block" data-act="nextQ">${QUIZ.idx + 1 >= QUIZ.len ? 'จบรอบ' : 'ข้อถัดไป'}</button>`;
  }

  return `
  ${stageBlock()}
  <div class="card">
    <div class="qmeta">
      <span>ข้อ ${QUIZ.idx+1}/${QUIZ.len} · ${SUBJECTS[q.subj].g} ${GRADES[q.grade].n}
        · ${UNITS[q.unit].n} · <span style="color:${d.c}">${d.n}</span></span>
      <span>${S.settings.timed && !QUIZ.locked ? `<span id="qclock">${Math.ceil(Math.max(0,QUIZ.limitMs-(Date.now()-QUIZ.startAt))/1000)} วิ</span>` : ''}
        ${QUIZ.streak > 1 ? `<span class="combo">🔥 ${QUIZ.streak}</span>` : ''}</span>
    </div>
    <div class="dots" style="margin-bottom:10px">${dots}</div>
    <div class="qtext">${esc(q.q)}</div>
    <div class="choices">${choices}</div>
    ${after}
  </div>
  <div class="card">
    <div class="row spread">
      <span class="sub">คะแนนรอบนี้</span><b class="mono" style="font-size:calc(19px * var(--fs))">${QUIZ.pts}</b>
    </div>
    ${QUIZ.locked ? '' : '<div class="gap"></div><button class="btn sm danger block" data-act="quitQuiz">ออกจากรอบนี้</button>'}
  </div>`;
}

function startQuiz(){
  QUIZ.grade = QUIZ.grade || S.grade;
  const avail = questionsBy(QUIZ.subj, QUIZ.grade).length;
  if (!avail) return toast('วิชานี้ยังไม่มีคำถามในคลัง', 'bad');
  QUIZ.running = true; QUIZ.idx = 0; QUIZ.used = []; QUIZ.streak = 0;
  QUIZ.pts = 0; QUIZ.eggPts = 0; QUIZ.correct = 0; QUIZ.marks = []; QUIZ.units = {};
  QUIZ.len = Math.min(ROUND_LEN, avail);
  nextQuestion();
}

function nextQuestion(){
  const q = pickQuestion(QUIZ.subj, QUIZ.grade, QUIZ.used);
  if (!q){ return finishQuiz(); }
  QUIZ.used.push(q.id);
  // สลับตัวเลือกไม่ให้จำตำแหน่ง
  let cur = q;
  if (S.settings.shuffle){
    const order = q.ch.map((c,i) => i).sort(() => Math.random() - .5);
    cur = Object.assign({}, q, {
      ch: order.map(i => q.ch[i]),
      ans: order.indexOf(q.ans)
    });
  }
  QUIZ.cur = cur;
  QUIZ.locked = false; QUIZ.chosen = -1; QUIZ.gained = null;
  QUIZ.limitMs = S.settings.timed ? DIFF[cur.diff].sec * 1000 : 0;
  QUIZ.startAt = Date.now();
  View.focusing = true; View.progress = 0; View.drift = false;
  clearInterval(QUIZ.tickId);
  if (QUIZ.limitMs) QUIZ.tickId = setInterval(quizTick, 120);
  render();
}

function quizTick(){
  if (!QUIZ.running || QUIZ.locked || !QUIZ.limitMs) return;
  const left = QUIZ.limitMs - (Date.now() - QUIZ.startAt);
  View.progress = clamp(1 - left / QUIZ.limitMs, 0, 1);
  View.drift = left < QUIZ.limitMs * 0.25;
  const c = document.getElementById('qclock');
  if (c){
    c.textContent = Math.max(0, Math.ceil(left/1000)) + ' วิ';
    c.classList.toggle('low', left < QUIZ.limitMs * 0.25);
  }
  if (left <= 0) answerQuestion(-1);
}

function answerQuestion(i){
  if (QUIZ.locked) return;
  clearInterval(QUIZ.tickId);
  const q = QUIZ.cur;
  const correct = i === q.ans;
  const left = QUIZ.limitMs ? Math.max(0, QUIZ.limitMs - (Date.now() - QUIZ.startAt)) : 0;

  QUIZ.chosen = i;
  QUIZ.locked = true;
  QUIZ.gained = scoreAnswer(q, correct, left, QUIZ.limitMs, QUIZ.streak);
  QUIZ.marks[QUIZ.idx] = correct ? 1 : 0;

  if (correct){
    QUIZ.pts += QUIZ.gained.pts;
    QUIZ.eggPts += QUIZ.gained.base;      // ไข่โตจากคะแนนฐานอย่างเดียว
    QUIZ.units[q.unit] = (QUIZ.units[q.unit] || 0) + QUIZ.gained.base;
    QUIZ.correct++;
    QUIZ.streak++;
    S.stats.bestStreak = Math.max(S.stats.bestStreak, QUIZ.streak);
    if (S.pet){
      const p = S.pet;
      if (q.diff >= 3) p.care.mind += 2;
      else if (QUIZ.gained.speed > 0.3) p.care.play += 1;
      else p.care.mind += 1;
    }
  } else {
    QUIZ.streak = 0;
    if (S.pet) S.pet.mood = clamp(S.pet.mood - 2, 0, 100);
  }
  recordAnswer(q, correct);
  S.stats.answered++;
  if (correct) S.stats.correct++;
  View.drift = false;
  View.progress = correct ? 1 : View.progress;
  save(); render();
}

function advanceQuiz(){
  if (!QUIZ.locked) return;
  if (!QUIZ.marks[QUIZ.idx] && S.pet) gainXp(3);   // อ่านคำอธิบายหลังตอบผิด
  QUIZ.idx++;
  if (QUIZ.idx >= QUIZ.len) return finishQuiz();
  nextQuestion();
}

function finishQuiz(){
  clearInterval(QUIZ.tickId);
  QUIZ.running = false;
  View.focusing = false; View.drift = false; View.progress = 0;

  const b = roomBonus();
  const pts = QUIZ.pts;
  const answered = QUIZ.marks.length;
  const acc = answered ? QUIZ.correct / answered : 0;
  const perfect = answered > 0 && QUIZ.correct === answered && answered === QUIZ.len;

  const xp = Math.round(pts * 0.6 * (1 + b.focusXp));
  const coin = Math.round(pts * 0.35 * (1 + b.coin));
  const aff = Math.round(pts / 40 * (1 + b.aff));
  let lv = 0;

  if (S.pet){
    lv = gainXp(xp).levels;
    S.pet.aff = clamp(S.pet.aff + aff, 0, 100);
    S.pet.mood = clamp(S.pet.mood + (acc >= .7 ? 6 : 2), 0, 100);
    S.pet.hunger = clamp(S.pet.hunger - 2, 0, 100);
  }
  S.coins += coin;
  S.stats.points += pts;
  S.stats.rounds++;
  S.stats.best = Math.max(S.stats.best, pts);

  // ต่อเนื่องรายวัน
  const t = todayKey();
  if (S.stats.lastDay !== t){
    const y = new Date(Date.now() - 86400000);
    const yk = `${y.getFullYear()}-${y.getMonth()+1}-${y.getDate()}`;
    S.stats.streak = (S.stats.lastDay === yk) ? S.stats.streak + 1 : 1;
    S.stats.lastDay = t;
  }

  // ผลึกสมาธิ
  const cr = Math.floor(QUIZ.correct / 4) + (perfect ? 2 : 0);
  if (cr > 0) S.crystals += cr;

  // ของติดมือ
  const got = [];
  const pool = ['leaf','leaf','berry','clay','bamboo','ricecake','shard'];
  for (let i=0;i<QUIZ.correct;i++){
    if (Math.random() < .30 + b.exploreLuck){ const k = pick(pool); addItem(k); got.push(ITEMS[k].n); }
  }
  if (perfect && Math.random() < .25 + b.exploreLuck){
    const k = pick(['stone_b','stone_m','stone_p']); addItem(k); got.push(ITEMS[k].n);
  }

  // ป้อนคะแนนให้ไข่
  let hatchReady = false;
  if (S.egg && QUIZ.eggPts > 0) hatchReady = eggAddPoints(QUIZ.eggPts, QUIZ.units);

  save(); render();
  sheet(quizResultSheet(pts, acc, perfect, xp, coin, aff, cr, got, lv, hatchReady));
}

    ${got.length ? line('🎁', 'ได้รับ', got.join(' · ')) : ''}
    ${S.egg ? line('🥚', `ไข่ได้รับ +${QUIZ.eggPts} คะแนนฐาน`, `${Math.min(S.egg.pts,S.egg.need)}/${S.egg.need}`) : ''}
    ${S.stats.streak > 1 ? line('🔥', `ตอบต่อเนื่อง ${S.stats.streak} วัน`) : ''}

/* ---- CSV ---- */
function csvEscape(v){
  v = String(v == null ? '' : v);
  return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
}
function parseCSV(text){
  const rows = []; let row = [], cell = '', q = false;
  for (let i=0;i<text.length;i++){
    const c = text[i];
    if (q){
      if (c === '"'){ if (text[i+1] === '"'){ cell += '"'; i++; } else q = false; }
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === ',' || c === '\t'){ row.push(cell); cell = ''; }
    else if (c === '\n'){ row.push(cell); cell = ''; if (row.some(x => x.trim() !== '')) rows.push(row); row = []; }
    else if (c !== '\r') cell += c;
  }
  row.push(cell);
  if (row.some(x => x.trim() !== '')) rows.push(row);
  return rows;
}
const SUBJ_BY_NAME = {};

const GRADE_BY_NAME = {};
for (const g of GRADE_KEYS){ GRADE_BY_NAME[GRADES[g].n] = g; GRADE_BY_NAME[g] = g; GRADE_BY_NAME[GRADES[g].n.replace('.','')] = g; }

function qdoimport(){
  const txt = document.getElementById('csvIn').value;
  if (!txt.trim()) return toast('ยังไม่ได้วางข้อมูล', 'bad');
  const rows = parseCSV(txt);
  let added = 0, skipped = 0;
  S.qcustom = S.qcustom || [];
  for (const r of rows){
    if (r.length < 10){ skipped++; continue; }
    const subj = SUBJ_BY_NAME[(r[0]||'').trim()];
    const grade = GRADE_BY_NAME[(r[1]||'').trim()];
    let unit = UNIT_BY_NAME[(r[2]||'').trim()];
    const diff = DIFF_BY_NAME[(r[3]||'').trim()];
    const q = (r[4]||'').trim();
    const ch = [r[5],r[6],r[7],r[8]].map(x => (x||'').trim());
    const ans = parseInt((r[9]||'').trim(), 10) - 1;
    if (!subj || !grade || !diff || !q || ch.some(c => !c) || !(ans >= 0 && ans <= 3)){ skipped++; continue; }
    if (!unit || UNITS[unit].subj !== subj) unit = unitsOf(subj)[0];
    if (!SUBJECTS[subj].code[grade]){ skipped++; continue; }
    S.qcustom.push({ id:'c' + Date.now().toString(36) + added, subj, grade, unit, diff, q, ch, ans, exp:(r[10]||'').trim() });
    added++;
  }
  save();
  if (!added) return toast(`นำเข้าไม่สำเร็จ ตรวจลำดับคอลัมน์อีกครั้ง (ข้าม ${skipped} แถว)`, 'bad');
  render();
  toast(`นำเข้า ${added} ข้อ${skipped?` · ข้าม ${skipped} แถว`:''}`, 'gold');
  qbankSheet();
}

function qexport(){
  const head = ['วิชา','ระดับชั้น','หน่วยการเรียนรู้','ความยาก','โจทย์','ก','ข','ค','ง','เฉลย','คำอธิบาย'];
  const lines = [head.join(',')];
  for (const q of allQuestions()){
    lines.push([SUBJECTS[q.subj].n, GRADES[q.grade].n, UNITS[q.unit].n, DIFF[q.diff].n,
      q.q, q.ch[0], q.ch[1], q.ch[2], q.ch[3], q.ans+1, q.exp].map(csvEscape).join(','));
  }
  const blob = new Blob(['\ufeff' + lines.join('\n')], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `คลังคำถาม-${allQuestions().length}ข้อ.csv`; a.click();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
  toast('ส่งออกไฟล์ CSV แล้ว');
}

function startExplore(id){
  const z = ZONES.find(x => x.id === id);
  S.explore = { zone:id, endAt: Date.now() + z.min * 60000 };
  save(); render();
  toast(`${S.pet.name}ออกเดินทางไป${z.n}แล้ว`);
}

function collectExplore(half){
  const z = ZONES.find(x => x.id === S.explore.zone);
  const p = S.pet, b = roomBonus();
  S.explore = null;
  const luck = 1 + b.exploreLuck + p.stats.LUK / 120;
  const got = [];
  for (const [key, chance] of z.loot){
    if (Math.random() < chance * luck * (half ? .5 : 1)){
      const n = 1 + (Math.random() < .18 ? 1 : 0);
      addItem(key, n); got.push(`${ITEMS[key].n}${n>1?' ×'+n:''}`);
    }
  }
  const xp = Math.round(z.min * 2.2 * (half ? .5 : 1));
  const lv = gainXp(xp).levels;
  S.coins += Math.round(z.min * (half ? .6 : 1.2));
  p.hunger = clamp(p.hunger - z.min / 10, 0, 100);
  p.care.body += 1;

  let hurt = 0;
  const dodge = (p.stats.AGI + p.stats.VIT) / 200;
  if (!half && Math.random() < Math.max(.02, z.risk - dodge)){
    hurt = Math.round(12 + Math.random() * 22);
    p.hp = clamp(p.hp - hurt, 1, 100);
    if (p.hp < 30) p.sick = true;
  }
  save(); render();
  sheet(`<div class="eyebrow">กลับจาก${z.n}</div>
    <h2>${got.length ? 'เก็บของมาได้' : 'ไม่เจออะไรเลย'}</h2>
    <div class="sub">${got.length ? got.join(' · ') : 'บางวันก็เป็นแบบนี้ ลองใหม่คราวหน้า'}</div>
    <div class="gap"></div>
    <div class="list">
      <div class="item"><div class="ic">⭐</div><div class="grow"><b>ประสบการณ์ +${xp}</b>${lv?`<div class="sub">เลื่อนเป็น Lv.${p.lv}</div>`:''}</div></div>
      ${hurt?`<div class="item"><div class="ic">🩹</div><div class="grow"><b>บาดเจ็บ −${hurt} สุขภาพ</b><div class="sub">ใช้ยาหม่องหรือพาพักก่อนออกไปอีก</div></div></div>`:''}
    </div>
    <div class="gap"></div>
    <button class="btn pri block" data-act="closeSheet">ปิด</button>`);
}

function doRps(k){
  const mine = RPS.find(r => r.k === k), theirs = pick(RPS);
  const beats = {rock:'sci', paper:'rock', sci:'paper'};
  const p = S.pet;
  let res, coin = 0;
  if (mine.k === theirs.k) res = 'เสมอ';
  else if (beats[mine.k] === theirs.k) res = 'คุณชนะ';
  else res = `${p.name}ชนะ`;
  p.care.play += 1;
  if (S.daily.plays < 8){
    S.daily.plays++;
    coin = res === 'เสมอ' ? 8 : (res === 'คุณชนะ' ? 18 : 12);
    S.coins += coin;
    p.mood = clamp(p.mood + 6, 0, 100);
    p.aff = clamp(p.aff + 1 * (1 + roomBonus().aff), 0, 100);
    gainXp(8);
  } else p.mood = clamp(p.mood + 2, 0, 100);
  const out = document.getElementById('rpsout');
  if (out) out.innerHTML = `<div class="item"><div class="ic">${theirs.g}</div>
    <div class="grow"><b>${res}</b><div class="sub">${p.name}ออก${theirs.n}${coin?` · เหรียญ +${coin} · อารมณ์ +6`:''}</div></div></div>`;
  save(); paintTop();
}

/* ===================== การกระทำ ===================== */
function bindView(){
  view().querySelectorAll('[data-subj]').forEach(b => b.onclick = () => { QUIZ.subj = b.dataset.subj; render(); });
  view().querySelectorAll('[data-grade]').forEach(b => b.onclick = () => {
    QUIZ.grade = b.dataset.grade; S.grade = b.dataset.grade;
    const ok = subjectsReady(S.grade);
    if (QUIZ.subj !== 'mix' && !ok.includes(QUIZ.subj)) QUIZ.subj = 'mix';
    save(); render();
  });
  view().querySelectorAll('[data-ans]').forEach(b => b.onclick = () => answerQuestion(+b.dataset.ans));
  view().querySelectorAll('[data-go]').forEach(b => b.onclick = () => startExplore(b.dataset.go));
  view().querySelectorAll('[data-bookel]').forEach(b => b.onclick = () => { BOOKEL = b.dataset.bookel; render(); });
  view().querySelectorAll('[data-card]').forEach(b => b.onclick = () => sheet(cardSheet(b.dataset.card)));
  view().querySelectorAll('[data-use]').forEach(b => b.onclick = () => {
    const r = useItem(b.dataset.use);
    if (!r) return;
    if (r.err) return toast(r.err, 'bad');
    if (r.egg) return openEgg(b.dataset.use);
    toast(r.msg); save(); render();
  });
  view().querySelectorAll('[data-sell]').forEach(b => b.onclick = () => {
    const k = b.dataset.sell, it = ITEMS[k];
    if (!(S.bag[k] > 0)) return;
    S.bag[k]--; if (!S.bag[k]) delete S.bag[k];
    S.coins += it.sell;
    toast(`ขาย${it.n} ได้ ${it.sell} เหรียญ`); save(); render();
  });
  view().querySelectorAll('[data-buy]').forEach(b => b.onclick = () => {
    const k = b.dataset.buy, price = +b.dataset.price;
    if (S.coins < price) return toast('เหรียญไม่พอ', 'bad');
    S.coins -= price; addItem(k);
    toast(`ซื้อ${ITEMS[k].n}แล้ว`); save(); render();
  });
  view().querySelectorAll('[data-buyf]').forEach(b => b.onclick = () => {
    const k = b.dataset.buyf, f = FURN[k];
    if (S.coins < f.cost) return toast('เหรียญไม่พอ', 'bad');
    const slot = S.room.indexOf(null);
    if (slot < 0) return toast('ห้องเต็มแล้ว เก็บของบางชิ้นออกก่อน', 'bad');
    S.coins -= f.cost; S.room[slot] = k;
    toast(`วาง${f.n}ไว้ในห้องแล้ว`); save(); render();
  });
  view().querySelectorAll('[data-slot]').forEach(b => b.onclick = () => {
    const i = +b.dataset.slot;
    if (S.room[i]){
      const f = FURN[S.room[i]];
      S.room[i] = null;
      S.coins += Math.round(f.cost * .5);
      toast(`เก็บ${f.n} คืนมา ${Math.round(f.cost*.5)} เหรียญ`); save(); render();
    } else toast('ซื้อของจากร้านด้านล่างเพื่อวางลงช่องนี้');
  });
  view().querySelectorAll('[data-act]').forEach(b => b.onclick = () => act(b.dataset.act));
}

document.getElementById('fsbtn').addEventListener('click', fsSheet);

document.getElementById('sheet').addEventListener('click', e => {
  const b = e.target.closest('[data-fs],[data-act],[data-rps],[data-feed],[data-swap],[data-free],[data-freeyes],[data-cbuy],[data-qlist],[data-qdel],[data-pick]');
  if (!b) return;
  if (b.dataset.fs) return setFS(+b.dataset.fs);
  if (b.dataset.rps) return doRps(b.dataset.rps);
  if (b.dataset.pick !== undefined && b.dataset.pick !== ''){ QADD_ANS = +b.dataset.pick; return markPick(); }
  if (b.dataset.qlist) return qlistSheet(b.dataset.qlist);
  if (b.dataset.qdel){
    const id = b.dataset.qdel;
    if (id.startsWith('c')){ S.qcustom = (S.qcustom||[]).filter(q => q.id !== id); toast('ลบคำถามแล้ว'); }
    else { S.qoff = S.qoff || {}; S.qoff[id] = 1; toast('ปิดคำถามนี้แล้ว'); }
    save(); render();
    const q = QBANK_BUILTIN.concat(S.qcustom||[]).find(x => x.id === id);
    return qlistSheet(q ? q.subj : SUBJ_KEYS[0]);
  }
  if (b.dataset.cbuy){
    const row = CRYSTAL_SHOP.find(x => x.k === b.dataset.cbuy);
    if (S.crystals < row.cost) return toast('ผลึกสมาธิไม่พอ', 'bad');
    S.crystals -= row.cost; addItem(row.k);
    save(); paintTop(); toast(`แลก${ITEMS[row.k].n}แล้ว`, 'gold');
    return crystalSheet();
  }
  if (b.dataset.feed){
    const r = useItem(b.dataset.feed);
    if (r && r.err) return toast(r.err, 'bad');
    if (r) toast(r.msg);
    closeSheet(); save(); render(); return;
  }
  if (b.dataset.swap !== undefined && b.dataset.swap !== ''){
    swapWith(+b.dataset.swap); save(); closeSheet(); render();
    return toast(`สลับมาเลี้ยง${S.pet.name}แล้ว`);
  }
  if (b.dataset.free !== undefined && b.dataset.free !== ''){
    const i = +b.dataset.free, nm = S.garden[i] && S.garden[i].name;
    return sheet(`<h2>ปล่อย${esc(nm)}</h2>
      <div class="sub">ตัวนี้จะกลับสู่ป่าถาวร เลเวลและค่าสถานะจะหายไป แต่ร่างที่เคยพบยังอยู่ในสมุดสะสม</div>
      <div class="gap"></div>
      <button class="btn danger block" data-freeyes="${i}">ปล่อยไป</button>
      <div class="gap"></div>
      <button class="btn pri block" data-act="garden">ไม่ปล่อย</button>`);
  }
  if (b.dataset.freeyes !== undefined && b.dataset.freeyes !== ''){
    const pet = releasePet(+b.dataset.freeyes);
    S.coins += 60 + pet.lv * 8;
    save(); toast(`ปล่อย${pet.name}กลับป่า ได้ ${60 + pet.lv*8} เหรียญ`);
    return gardenSheet();
  }
  act(b.dataset.act);
});

function act(a){
  const p = S.pet;
  if (a === 'closeSheet') return closeSheet();
  if (a === 'goQuiz'){
    TAB = 'quiz';
    document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x.dataset.tab === 'quiz'));
    return render();
  }
  if (a === 'goQuizStart'){ closeSheet(); act('goQuiz'); return; }
  if (a === 'startQuiz') return startQuiz();
  if (a === 'nextQ') return advanceQuiz();
  if (a === 'quitQuiz'){
    return sheet(`<h2>ออกจากรอบนี้</h2>
      <div class="sub">คะแนนที่ทำได้ ${QUIZ.pts} จะถูกเก็บตามปกติ แต่จะไม่ได้โบนัสตอบถูกทั้งรอบ</div>
      <div class="gap"></div>
      <button class="btn danger block" data-act="quitYes">ออก</button>
      <div class="gap"></div>
      <button class="btn pri block" data-act="closeSheet">ตอบต่อ</button>`);
  }
  if (a === 'quitYes'){ closeSheet(); return finishQuiz(); }
  if (a === 'hatch'){ closeSheet(); return doHatch(); }
  if (a === 'qbank') return qbankSheet();
  if (a === 'qadd') return qaddSheet();
  if (a === 'qsave') return qsave();
  if (a === 'qimport') return qimportSheet();
  if (a === 'qdoimport') return qdoimport();
  if (a === 'qexport') return qexport();
  if (a === 'fontsize') return fsSheet();
  if (a === 'eggmap') return eggMapSheet();
  if (a === 'garden') return gardenSheet();
  if (a === 'crystal') return crystalSheet();
  if (a === 'settings') return settingsSheet();
  if (a === 'togTimed'){ S.settings.timed = !S.settings.timed; save(); return settingsSheet(); }
  if (a === 'togShuf'){ S.settings.shuffle = !S.settings.shuffle; save(); return settingsSheet(); }
  if (a === 'feed'){
    const foods = Object.keys(S.bag).filter(k => ITEMS[k] && ITEMS[k].t === 'food' && S.bag[k] > 0);
    if (!foods.length) return toast('ไม่มีอาหารเลย ซื้อได้ที่กระเป๋า', 'bad');
    return sheet(`<div class="eyebrow">ให้อาหาร</div><h2>จะให้อะไรดี</h2><div class="gap"></div>
      <div class="list">${foods.map(k => `<button class="item" data-feed="${k}" style="text-align:left;width:100%">
        <div class="ic">${ITEMS[k].g}</div>
        <div class="grow"><b>${ITEMS[k].n}</b><div class="sub">อิ่ม +${ITEMS[k].hunger} · อารมณ์ +${ITEMS[k].mood}</div></div>
        <span class="qty">×${S.bag[k]}</span></button>`).join('')}</div>
      <div class="gap"></div><button class="btn block" data-act="closeSheet">ปิด</button>`);
  }
  if (a === 'play') return playSheet();
  if (a === 'rest'){
    const gap = Date.now() - (S.lastRest || 0);
    if (gap < 1800000) return toast(`เพิ่งพักไป ลองอีกครั้งใน ${fmtLeft(1800000-gap)}`, 'bad');
    S.lastRest = Date.now();
    p.mood = clamp(p.mood + 8, 0, 100);
    p.hp = clamp(p.hp + 6, 0, 100);
    p.care.body += 1;
    View.bounce = -12; setTimeout(()=>{ View.bounce = 0; }, 260);
    toast(`${p.name}ได้พักแล้ว อารมณ์ +8 สุขภาพ +6`);
    save(); return render();
  }
  if (a === 'evolve'){
    const nm = doEvolve();
    if (!nm) return toast('ยังไม่ครบเงื่อนไข', 'bad');
    toast(`วิวัฒนาการเป็น ${nm}`, 'gold');
    save(); render();
    return sheet(`<div class="eyebrow">วิวัฒนาการ</div><h2>${nm}</h2>
      <div class="sub">${SPECIES[p.sp].desc}</div><div class="gap"></div>
      <div style="text-align:center">${sigilSVG(S.uid + currentFormId(), SPECIES[p.sp].accent, 88)}</div>
      <div class="tiny" style="text-align:center">การ์ดใบใหม่ถูกบันทึกลงสมุดสะสมแล้ว · ${collectCode(currentFormId())}</div>
      <div class="gap"></div><button class="btn pri block" data-act="closeSheet">ดีมาก</button>`);
  }
  if (a === 'collect') return collectExplore(false);
  if (a === 'recall') return collectExplore(true);
  if (a === 'rename'){
    return sheet(`<div class="eyebrow">เปลี่ยนชื่อ</div><h2>จะเรียกว่าอะไรดี</h2><div class="gap"></div>
      <input id="nameIn" maxlength="14" value="${esc(p.name)}" class="fld">
      <button class="btn pri block" data-act="saveName">บันทึกชื่อ</button>`);
  }
  if (a === 'saveName'){
    const el = document.getElementById('nameIn');
    const v = (el && el.value || '').trim();
    if (v && S.pet) S.pet.name = v.slice(0,14);
    closeSheet(); save(); return render();
  }
  if (a === 'export'){
    const blob = new Blob([JSON.stringify(S)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a2 = document.createElement('a');
    a2.href = url; a2.download = `kruchat-save-${S.uid}.json`; a2.click();
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
    return toast('ดาวน์โหลดไฟล์เซฟแล้ว');
  }
  if (a === 'import'){
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'application/json';
    inp.onchange = () => {
      const f = inp.files[0]; if (!f) return;
      const rd = new FileReader();
      rd.onload = () => {
        try {
          const d = JSON.parse(rd.result);
          S = Object.assign(freshSave(), d);
          crackle = null; buildCrackle(hashStr(S.uid));
          save(); closeSheet(); render(); toast('โหลดเซฟเรียบร้อย');
        } catch(e){ toast('ไฟล์นี้อ่านไม่ได้', 'bad'); }
      };
      rd.readAsText(f);
    };
    inp.click();
    return;
  }
  if (a === 'wipe'){
    return sheet(`<h2>เริ่มใหม่ทั้งหมด</h2>
      <div class="sub">สมุดสะสม สวน คลังคำถามที่เพิ่มเอง และวิญญาณทุกตัวจะหายไปถาวร</div>
      <div class="gap"></div>
      <button class="btn danger block" data-act="wipeYes">ลบและเริ่มใหม่</button>
      <div class="gap"></div><button class="btn pri block" data-act="closeSheet">ไม่ลบ</button>`);
  }
  if (a === 'wipeYes'){
    S = freshSave(); crackle = null; buildCrackle(hashStr(S.uid));
    startEgg(1); save(); closeSheet(); render(); return intro();
  }
}

/* ===================== ขนาดตัวอักษร ===================== */
const FS_STEPS = [
  {v:0.9,  n:'เล็ก',      d:'90%'},
  {v:1.0,  n:'ปกติ',      d:'100%'},
  {v:1.15, n:'ใหญ่',      d:'115%'},
  {v:1.3,  n:'ใหญ่มาก',   d:'130%'},
  {v:1.5,  n:'ใหญ่พิเศษ', d:'150%'},
];
function applyFS(){
  const v = (S && S.settings && S.settings.fs) || 1;
  document.documentElement.style.setProperty('--fs', v);
}
function setFS(v){
  S.settings.fs = v;
  applyFS(); save();
  const box = document.getElementById('fsopts');
  if (box) box.querySelectorAll('[data-fs]').forEach(b =>
    b.classList.toggle('on', Math.abs(+b.dataset.fs - v) < 0.001));
  const now = document.getElementById('fsnow');
  if (now) now.textContent = (FS_STEPS.find(x => Math.abs(x.v - v) < 0.001) || {d:Math.round(v*100)+'%'}).d;
}
function fsSheet(){
  const cur = (S.settings && S.settings.fs) || 1;
  sheet(`<div class="eyebrow">ขนาดตัวอักษร</div>
    <h2>ปรับให้อ่านสบายตา</h2>
    <div class="sub">ตอนนี้ <span id="fsnow">${(FS_STEPS.find(x=>Math.abs(x.v-cur)<0.001)||{d:Math.round(cur*100)+'%'}).d}</span> · ตัวอย่างด้านล่างจะเปลี่ยนตามทันที</div>
    <div class="gap"></div>
    <div class="fsrow" id="fsopts">
      ${FS_STEPS.map(x => `<button class="fsopt ${Math.abs(x.v-cur)<0.001?'on':''}" data-fs="${x.v}">
        <b style="font-size:${Math.round(13*x.v)}px">ก</b><span>${x.n}</span></button>`).join('')}
    </div>
    <div class="gap"></div>
    <div class="fspreview">
      <div class="q">กรุงศรีอยุธยาสถาปนาขึ้นในปีใด</div>
      <div class="c"><span class="k">ก</span><span>พ.ศ. 1781</span></div>
      <div class="c"><span class="k">ข</span><span>พ.ศ. 1893</span></div>
    </div>
    <div class="gap"></div>
    <div class="tiny">ค่านี้จะถูกจำไว้ในเครื่องนี้ เปิดเกมครั้งหน้าก็ยังเป็นขนาดเดิม · ถ้ายังเล็กไป ใช้การซูมของเบราว์เซอร์เพิ่มได้อีก</div>
    <div class="gap"></div>
    <button class="btn pri block" data-act="closeSheet">เรียบร้อย</button>`);
}

/* ===================== เริ่มระบบ ===================== */
function intro(){
  sheet(`<div class="eyebrow">ห้องเรียนไร้ขีดจำกัด · #ห้องเรียนครูชัช</div>
    <h2>มีไข่ใบหนึ่งอยู่ในกระถาง</h2>
    <div class="sub">ยังไม่มีใครรู้ว่าข้างในเป็นอะไร เพราะมันยังไม่ถูกกำหนด</div>
    <div class="gap"></div>
    <div class="list">
      <div class="item"><div class="ic">❓</div><div class="grow"><b>ตอบคำถามเพื่อฟักไข่</b>
        <div class="sub">ตอบถูกได้คะแนน ตอบเร็วได้โบนัส ตอบถูกติดกันได้ตัวคูณถึง ×2</div></div></div>
      <div class="item"><div class="ic">🎨</div><div class="grow"><b>หน่วยที่เรียนกำหนดธาตุ</b>
        <div class="sub">ตอบหน่วยพัฒนาการของอาณาจักรมาก ไข่จะเอนไปทางธาตุดิน ตอบหน่วยบุคคลสำคัญมากจะเอนไปทางธาตุไฟ ดูเปอร์เซ็นต์สดได้ที่หน้ากระถาง</div></div></div>
      <div class="item"><div class="ic">🌱</div><div class="grow"><b>เลี้ยงต่อให้โต</b>
        <div class="sub">มี 32 สายพันธุ์ 320 ร่างให้เก็บ วิธีดูแลจะกำหนดว่ามันจะแตกสายไปทางไหน</div></div></div>
    </div>
    <div class="gap"></div>
    <button class="btn pri block" data-act="goQuizStart">เริ่มตอบคำถาม</button>`);
}

let saveTimer = null;
function save(){
  if (!S) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { Store.set(SAVEKEY, JSON.stringify(S)); }, 250);
}

async function boot(){
  const raw = await Store.get(SAVEKEY);
  if (raw){
    try { S = Object.assign(freshSave(), JSON.parse(raw)); }
    catch(e){ S = freshSave(); }
  } else S = freshSave();

  if (!Array.isArray(S.room) || S.room.length !== 12) S.room = new Array(12).fill(null);
  if (!S.settings || typeof S.settings.timed === 'undefined') S.settings = {timed:true, shuffle:true, fs:1};
  if (typeof S.settings.fs !== 'number' || !(S.settings.fs > 0)) S.settings.fs = 1;
  applyFS();
  if (!S.stats || typeof S.stats.answered === 'undefined')
    S.stats = {answered:0, correct:0, points:0, rounds:0, best:0, streak:0, bestStreak:0, lastDay:''};
  S.qcustom = S.qcustom || [];
  S.qoff = S.qoff || {};
  S.qstate = S.qstate || {};
  S.garden = S.garden || [];
  S.seen = S.seen || {};
  S.prog = S.prog || {};
  if (!S.grade || !GRADES[S.grade]) S.grade = (gradesReady()[0] || 'p5');
  QUIZ.grade = S.grade;

  buildCrackle(hashStr(S.uid));
  tickOffline();

  const firstTime = !S.pet && !S.egg;
  if (firstTime) startEgg(1);
  render();
  if (firstTime) intro();

  setInterval(() => {
    if (QUIZ.running) return;
    tickOffline(); paintTop();
    if (TAB === 'explore' && S.explore) render();
    save();
  }, 20000);
}

/* จุดเข้าถึงสถานะสำหรับตรวจสอบ */
window.__game = () => ({ S, QUIZ, TAB, VERSION });

boot();
