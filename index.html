<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ห้องเรียนไร้ขีดจำกัด — #ห้องเรียนครูชัช</title>
<meta name="theme-color" content="#101b22">
<meta name="description" content="ห้องเรียนไร้ขีดจำกัด #ห้องเรียนครูชัช — เกมตอบคำถามตามหลักสูตรที่เปลี่ยนคะแนนของนักเรียนให้กลายเป็นวิญญาณที่เลี้ยงและเติบโตได้">
<meta property="og:title" content="ห้องเรียนไร้ขีดจำกัด #ห้องเรียนครูชัช">
<meta property="og:description" content="ตอบคำถามตามหลักสูตร สะสมคะแนนฟักไข่ เลี้ยงวิญญาณ 32 สายพันธุ์ 320 ร่าง">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23142430'/%3E%3Cpath d='M7 18h18l-3 9H10z' fill='%236d9d8b'/%3E%3Cellipse cx='16' cy='18' rx='9' ry='2.4' fill='%23a9cfbe'/%3E%3Cellipse cx='16' cy='11' rx='5' ry='6' fill='%23d8b04a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Trirong:wght@400;600;700&family=IBM+Plex+Sans+Thai:wght@300;400;500;600&family=IBM+Plex+Mono:wght@300;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0d161c;
  --deep:#152430;
  --panel:#1b303c;
  --line:rgba(190,222,210,.14);
  --glaze:#7cae9b;
  --glaze-dk:#42705f;
  --glaze-lt:#a8d3c2;
  --gold:#d8b04a;
  --lacquer:#a03b45;
  --mist:#e6efe9;
  --dim:#8ba69c;
  --ok:#7cae9b;
  --warn:#d8b04a;
  --bad:#c26a6a;
  --r:14px;
  --tabh:68px;
  --fs:1;              /* ตัวคูณขนาดตัวอักษร ปรับได้จากปุ่ม Aa */
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(120% 80% at 50% -10%, #1d3441 0%, transparent 60%),
    var(--ink);
  color:var(--mist);
  font-family:'IBM Plex Sans Thai',system-ui,sans-serif;
  font-weight:400;
  font-size:calc(16px * var(--fs));
  line-height:1.6;
  min-height:100vh;
  overflow-x:hidden;
}
body.night{--glaze:#6f9db1;}
h1,h2,h3,.disp{font-family:'Trirong',serif;font-weight:600;letter-spacing:.01em;margin:0}
.mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
#app{max-width:900px;margin:0 auto;padding:0 14px calc(var(--tabh) + 26px);}
header.top{
  position:sticky;top:0;z-index:30;
  margin:0 -14px 12px;padding:10px 14px 10px;
  background:linear-gradient(180deg,rgba(13,22,28,.96) 70%,rgba(13,22,28,0));
  backdrop-filter:blur(8px);
  display:flex;align-items:center;gap:10px;
}
.brand{display:flex;align-items:baseline;gap:8px;flex:1;min-width:0}
.brand{flex-direction:column;align-items:flex-start;gap:0}
.brand b{font-family:'Trirong',serif;font-size:18px;font-weight:700;letter-spacing:.01em;line-height:1.2;white-space:nowrap}
.brand .tag{font-size:10.5px;color:var(--glaze);font-family:'IBM Plex Mono',monospace;letter-spacing:.04em}
.brand span.who{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
@media(max-width:420px){ .brand b{font-size:calc(15px * var(--fs))} }
.purse{display:flex;gap:6px;flex-shrink:0}
.coin{
  display:flex;align-items:center;gap:5px;
  background:rgba(255,255,255,.05);border:1px solid var(--line);
  border-radius:999px;padding:5px 11px;font-size:14px;
}
.coin i{width:9px;height:9px;border-radius:50%;display:block}
.coin.g i{background:var(--gold);box-shadow:0 0 8px rgba(216,176,74,.5)}
.coin.c i{background:var(--glaze-lt);box-shadow:0 0 8px rgba(168,211,194,.5)}

/* ---------- cards ---------- */
.card{
  background:linear-gradient(180deg,var(--panel),var(--deep));
  border:1px solid var(--line);border-radius:var(--r);
  padding:14px;margin-bottom:12px;
}
.card h2{font-size:calc(18.5px * var(--fs));margin-bottom:2px}
.sub{font-size:calc(13px * var(--fs));color:var(--dim)}
.eyebrow{
  font-size:calc(11px * var(--fs));letter-spacing:.18em;text-transform:uppercase;
  color:var(--glaze);font-family:'IBM Plex Mono',monospace;margin-bottom:6px;
}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.spread{justify-content:space-between}
.grow{flex:1;min-width:0}

/* ---------- buttons ---------- */
button{font-family:inherit;font-size:calc(15px * var(--fs));color:inherit;cursor:pointer;border:none;background:none}
.btn{
  background:rgba(255,255,255,.05);border:1px solid var(--line);
  border-radius:10px;padding:10px 14px;color:var(--mist);
  transition:background .15s,border-color .15s,transform .08s;
}
.btn:hover{background:rgba(255,255,255,.09)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.pri{background:var(--glaze-dk);border-color:var(--glaze);color:#f2fbf6;font-weight:500}
.btn.pri:hover{background:#4f8471}
.btn.gold{background:rgba(216,176,74,.16);border-color:rgba(216,176,74,.5);color:#f0dda6}
.btn.danger{border-color:rgba(194,106,106,.45);color:#e8b4b4}
.btn.sm{padding:7px 11px;font-size:calc(13.5px * var(--fs));border-radius:8px}
.btn.on{background:var(--glaze-dk);border-color:var(--glaze)}
.btn.block{width:100%;display:block}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* ---------- pot stage ---------- */
.stage{position:relative;display:flex;justify-content:center;padding:6px 0 0}
#pot{width:100%;max-width:420px;height:auto;display:block;touch-action:manipulation}
.stagelabel{
  position:absolute;left:50%;transform:translateX(-50%);bottom:-2px;
  font-size:calc(11px * var(--fs));color:var(--dim);letter-spacing:.14em;font-family:'IBM Plex Mono',monospace;
}

/* ---------- meters ---------- */
.meters{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 14px;margin-top:12px}
.meter .lab{display:flex;justify-content:space-between;font-size:calc(12.5px * var(--fs));color:var(--dim);margin-bottom:3px}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.07);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:3px;transition:width .4s ease}
.bar.hp>i{background:linear-gradient(90deg,#8fbfae,#c9e3d6)}
.bar.hu>i{background:linear-gradient(90deg,#c9a24a,#e6cf8b)}
.bar.mo>i{background:linear-gradient(90deg,#7fa8c9,#b4d4ea)}
.bar.af>i{background:linear-gradient(90deg,#a0555f,#d2909a)}
.bar.xp>i{background:linear-gradient(90deg,var(--glaze-dk),var(--glaze-lt))}

.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px;text-align:center}
.stat{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:9px;padding:6px 2px}
.stat b{display:block;font-family:'IBM Plex Mono',monospace;font-size:calc(16.5px * var(--fs));font-weight:500}
.stat span{font-size:calc(10.5px * var(--fs));color:var(--dim);letter-spacing:.1em}

/* ---------- focus ---------- */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:calc(14px * var(--fs));
  background:rgba(255,255,255,.03);transition:all .15s;
}
.chip.on{background:var(--glaze-dk);border-color:var(--glaze);color:#f2fbf6}
#clock{font-family:'IBM Plex Mono',monospace;font-size:calc(52px * var(--fs));font-weight:300;letter-spacing:-.02em;line-height:1;text-align:center;margin:4px 0 2px}
#clocknote{text-align:center;font-size:calc(12px * var(--fs));color:var(--dim);min-height:18px}
.drift{color:var(--warn)}
.focusing #tabs{opacity:.35;pointer-events:none}

/* ---------- ตอบคำถาม ---------- */
.qmeta{display:flex;justify-content:space-between;align-items:center;font-size:calc(13px * var(--fs));color:var(--dim);margin-bottom:8px}
.qtext{font-size:calc(20.5px * var(--fs));line-height:1.65;font-family:'Trirong',serif;font-weight:600;margin:2px 0 14px}
.choices{display:flex;flex-direction:column;gap:8px}
.ch{
  display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;
  background:rgba(255,255,255,.04);border:1px solid var(--line);
  border-radius:12px;padding:14px 14px;font-size:calc(16.5px * var(--fs));line-height:1.5;
  transition:background .15s,border-color .15s;
}
.ch:hover:not(:disabled){background:rgba(255,255,255,.08)}
.ch .k{
  flex:none;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;
  background:rgba(255,255,255,.07);border:1px solid var(--line);
  font-family:'IBM Plex Mono',monospace;font-size:calc(13px * var(--fs));margin-top:1px;
}
.ch.right{background:rgba(124,174,155,.20);border-color:var(--glaze)}
.ch.right .k{background:var(--glaze-dk);border-color:var(--glaze)}
.ch.wrong{background:rgba(194,106,106,.16);border-color:var(--bad)}
.ch.wrong .k{background:rgba(194,106,106,.35);border-color:var(--bad)}
.ch:disabled{opacity:.55}
.ch.right:disabled,.ch.wrong:disabled{opacity:1}
.expl{
  margin-top:12px;padding:11px 13px;border-radius:10px;font-size:calc(14.5px * var(--fs));line-height:1.65;
  background:rgba(255,255,255,.04);border-left:3px solid var(--glaze);
}
#qclock{font-family:'IBM Plex Mono',monospace;font-size:calc(16px * var(--fs))}
#qclock.low{color:var(--bad)}
.combo{font-family:'IBM Plex Mono',monospace;color:var(--gold);font-size:calc(14px * var(--fs))}
.dots{display:flex;gap:4px}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.14);display:block}
.dots i.ok{background:var(--glaze)}
.dots i.no{background:var(--bad)}
.dots i.now{background:var(--gold);transform:scale(1.35)}
.eggbar{height:9px;border-radius:5px;background:rgba(255,255,255,.07);overflow:hidden}
.eggbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--glaze-dk),var(--gold));transition:width .5s}
.odds{display:flex;flex-direction:column;gap:5px;margin-top:8px}
.odd{display:flex;align-items:center;gap:8px;font-size:calc(13px * var(--fs))}
.odd .nm{width:74px;flex:none;color:var(--dim)}
.odd .tr{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.06);overflow:hidden}
.odd .tr>i{display:block;height:100%;border-radius:3px}
.odd .pc{width:44px;text-align:right;font-family:'IBM Plex Mono',monospace}
.fld{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);
  background:rgba(255,255,255,.05);color:var(--mist);font-family:inherit;font-size:calc(16px * var(--fs));margin-bottom:8px}
textarea.fld{min-height:76px;resize:vertical;line-height:1.5}
select.fld{appearance:none}

/* ---------- สรุปผลสัมฤทธิ์ ---------- */
.prow{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:none}
.prow .lab{flex:1;min-width:0}
.prow .lab b{display:block;font-size:calc(14.5px * var(--fs));font-weight:500}
.prow .lab .tiny{font-size:calc(12px * var(--fs))}
.prow .num{font-family:'IBM Plex Mono',monospace;font-size:calc(13.5px * var(--fs));text-align:right;width:84px;flex:none}
.pbar{height:7px;border-radius:4px;background:rgba(255,255,255,.07);overflow:hidden;margin-top:5px}
.pbar>i{display:block;height:100%;border-radius:4px}
.trend{font-size:calc(12px * var(--fs));font-family:'IBM Plex Mono',monospace;width:60px;flex:none;text-align:right}
.trend.up{color:var(--ok)} .trend.down{color:var(--bad)} .trend.flat{color:var(--dim)}
.bigstat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.bigstat div{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;padding:9px 4px}
.bigstat b{display:block;font-family:'IBM Plex Mono',monospace;font-size:calc(21px * var(--fs));font-weight:500}
.bigstat span{font-size:calc(11.5px * var(--fs));color:var(--dim)}

/* ---------- lists ---------- */
.list{display:flex;flex-direction:column;gap:8px}
.item{
  display:flex;gap:10px;align-items:center;
  background:rgba(255,255,255,.04);border:1px solid var(--line);
  border-radius:11px;padding:10px 12px;
}
.item .ic{
  width:42px;height:42px;flex:none;border-radius:9px;
  background:rgba(255,255,255,.05);border:1px solid var(--line);
  display:grid;place-items:center;font-size:calc(20px * var(--fs));
}
.item b{display:block;font-size:calc(15px * var(--fs));font-weight:500}
.item .sub{font-size:calc(12.5px * var(--fs))}
.qty{font-family:'IBM Plex Mono',monospace;color:var(--glaze-lt);font-size:calc(14px * var(--fs))}

/* ---------- room ---------- */
#room{
  position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);
  background:linear-gradient(180deg,#20323d 0%,#20323d 58%,#2b3a3a 58%,#243231 100%);
  aspect-ratio:1/0.82;
}
#room.lit{background:linear-gradient(180deg,#31485a 0%,#31485a 58%,#3d5350 58%,#334744 100%)}
.slots{position:absolute;inset:7%;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:4px}
.slot{
  border:1px dashed rgba(190,222,210,.16);border-radius:8px;
  display:grid;place-items:center;font-size:calc(26px * var(--fs));line-height:1;
  transition:background .15s;
}
.slot:hover{background:rgba(255,255,255,.05)}
.slot.filled{border-style:solid;border-color:rgba(190,222,210,.22)}

/* ---------- book ---------- */
.book{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.bcard{
  border:1px solid var(--line);border-radius:11px;padding:8px 6px;text-align:center;
  background:rgba(255,255,255,.04);font-size:calc(12px * var(--fs));
}
.bcard.locked{opacity:.32}
.bcard .nm{font-size:calc(12.5px * var(--fs));font-weight:500;margin-top:4px;line-height:1.3}
.bcard .st{font-size:calc(10.5px * var(--fs));color:var(--dim);font-family:'IBM Plex Mono',monospace}
.sigil{margin:0 auto;display:block;border-radius:5px;background:rgba(0,0,0,.25)}

/* ---------- tabs ---------- */
#tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:40;height:var(--tabh);
  padding-bottom:env(safe-area-inset-bottom);
  background:rgba(13,22,28,.94);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);
  display:flex;transition:opacity .2s;
}
#tabs button{
  flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:10px;color:var(--dim);letter-spacing:0;white-space:nowrap;
}
#tabs button .g{font-size:20px;line-height:1;filter:grayscale(1) opacity(.7)}
#tabs button.on{color:var(--glaze-lt)}
#tabs button.on .g{filter:none}
#tabs button .dot{position:absolute;margin:-14px 0 0 20px;width:6px;height:6px;border-radius:50%;background:var(--gold)}

/* ---------- modal / toast ---------- */
#veil{position:fixed;inset:0;z-index:60;background:rgba(5,10,13,.72);backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center}
#veil.show{display:flex}
#sheet{
  width:100%;max-width:520px;max-height:86vh;overflow-y:auto;
  background:linear-gradient(180deg,#1f3543,#152430);
  border:1px solid var(--line);border-bottom:none;
  border-radius:18px 18px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));
  animation:rise .22s ease;
}
@keyframes rise{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
#toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + 16px);
  z-index:70;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:92%;max-width:420px;
}
.tst{
  background:rgba(21,36,48,.97);border:1px solid var(--glaze-dk);
  border-radius:999px;padding:9px 17px;font-size:calc(14px * var(--fs));
  animation:pop .2s ease;box-shadow:0 6px 20px rgba(0,0,0,.4);
}
.tst.gold{border-color:var(--gold);color:#f0dda6}
.tst.bad{border-color:var(--bad);color:#e8b4b4}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}

.hide{display:none !important}
.tiny{font-size:calc(12.5px * var(--fs));color:var(--dim)}
.gap{height:8px}
hr.sep{border:none;border-top:1px solid var(--line);margin:12px 0}
.pill{font-size:calc(11.5px * var(--fs));font-family:'IBM Plex Mono',monospace;letter-spacing:.1em;border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--dim)}

@media(min-width:760px){
  #app{padding-bottom:24px}
  #tabs{position:sticky;bottom:0;border-radius:14px;margin-bottom:14px;border:1px solid var(--line)}
  .meters{grid-template-columns:repeat(4,1fr)}
}
@media(prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}

/* ---------- ปรับขนาดตัวอักษร ---------- */
#fsbtn{
  flex:none;width:38px;height:38px;border-radius:11px;
  border:1px solid var(--line);background:rgba(255,255,255,.05);
  color:var(--mist);font-family:'Trirong',serif;font-size:16px;font-weight:600;
  display:grid;place-items:center;line-height:1;
}
#fsbtn:active{transform:scale(.94)}
.fsrow{display:flex;gap:8px;align-items:stretch}
.fsopt{
  flex:1;border:1px solid var(--line);border-radius:11px;background:rgba(255,255,255,.04);
  padding:12px 4px;text-align:center;color:var(--mist);line-height:1.2;
}
.fsopt.on{background:var(--glaze-dk);border-color:var(--glaze)}
.fsopt b{display:block;font-family:'Trirong',serif;font-weight:600}
.fsopt span{display:block;font-size:10.5px;color:var(--dim);margin-top:3px}
.fsopt.on span{color:#dff0e7}
.fspreview{
  border:1px solid var(--line);border-radius:12px;padding:14px;
  background:rgba(255,255,255,.03);
}
.fspreview .q{font-family:'Trirong',serif;font-weight:600;font-size:calc(20.5px * var(--fs));line-height:1.6}
.fspreview .c{
  margin-top:10px;display:flex;gap:10px;align-items:center;
  border:1px solid var(--line);border-radius:12px;padding:12px;
  font-size:calc(16.5px * var(--fs));
}
.fspreview .c .k{
  width:calc(26px * var(--fs));height:calc(26px * var(--fs));flex:none;border-radius:7px;
  background:rgba(255,255,255,.07);border:1px solid var(--line);
  display:grid;place-items:center;font-family:'IBM Plex Mono',monospace;font-size:calc(13px * var(--fs));
}
</style>
</head>
<body>

<div id="app">
  <header class="top">
    <div class="brand">
      <b>ห้องเรียนไร้ขีดจำกัด</b>
      <span class="who" id="petline">#ห้องเรียนครูชัช</span>
    </div>
    <button id="fsbtn" title="ปรับขนาดตัวอักษร" aria-label="ปรับขนาดตัวอักษร">Aa</button>
    <div class="purse">
      <div class="coin g"><i></i><span class="mono" id="coins">0</span></div>
      <div class="coin c"><i></i><span class="mono" id="crys">0</span></div>
    </div>
  </header>

  <main id="view"></main>
</div>

<nav id="tabs">
  <button data-tab="pot" class="on"><span class="g">🪴</span>กระถาง</button>
  <button data-tab="quiz"><span class="g">❓</span>ตอบคำถาม</button>
  <button data-tab="explore"><span class="g">🧭</span>สำรวจ</button>
  <button data-tab="bag"><span class="g">🎒</span>กระเป๋า</button>

function clampN(v,a,b){ return Math.max(a, Math.min(b, v)); }
function _hsl(h, s, l){ return `hsl(${((Math.round(h)%360)+360)%360}, ${clampN(Math.round(s),6,92)}%, ${clampN(Math.round(l),8,94)}%)`; }
function _hsla(h, s, l, a){ return `hsla(${((Math.round(h)%360)+360)%360}, ${clampN(Math.round(s),6,92)}%, ${clampN(Math.round(l),8,94)}%, ${a})`; }

  const r = rngFrom(hashStr('sp:' + id));

  const h = E.h + [-16, 0, 14, 30][idxInEl] + Math.round((r() - .5) * 10);
  const s = E.s + Math.round((r() - .3) * 14) + (rar - 1) * 5;
  const l = E.l + Math.round((r() - .5) * 12) - (rar === 4 ? 4 : 0);

  SPECIES[id] = {
    id, name, elk, el: E.n, g: E.g,
    main: E.main, sub, rarity: rar, desc,
    hue: h, sat: s, lum: l,
    c1:     _hsl(h, s, l),
    c2:     _hsl(h + 6, s + 8, l - 20),
    accent: _hsl(h - 6, s - 6, l + 22),
    dim:    _hsla(h, s, l, .30),
    a: al => _hsla(h - 6, s - 6, l + 22, al),
    traits: {
      body: BODY_SHAPES[Math.floor(r() * BODY_SHAPES.length)],
      horn: rar >= 3 ? HORNS[1 + Math.floor(r() * (HORNS.length - 1))] : HORNS[Math.floor(r() * HORNS.length)],

      tail: rar >= 2 ? TAILS[1 + Math.floor(r() * (TAILS.length - 1))] : TAILS[Math.floor(r() * TAILS.length)],
      mark: MARKS[Math.floor(r() * MARKS.length)],
      halo: rar >= 4,
    }
  };
  SP_KEYS.push(id);
});

function formId(sp, stage, branch){
  return stage <= 2 ? `${sp}:${stage}` : `${sp}:${stage}:${branch}`;
}
function formName(sp, stage, branch){
  const b = SPECIES[sp].name;
  if (stage <= 2) return `${b} ${STAGE_NAMES[stage]}`;
  if (stage === 3) return `${b} ${STAGE3_NAME[branch]}`;
  if (stage === 4) return `${b} ${STAGE4_NAME[branch]}`;
  return `${b} ${STAGE5_NAME}`;
}
// ร่างทั้งหมด: 32 สายพันธุ์ × 10 ร่าง = 320
const ALL_FORMS = (() => {
  const out = [];
  for (const sp of SP_KEYS){
    out.push({id:formId(sp,0), sp, stage:0, branch:null});
    out.push({id:formId(sp,1), sp, stage:1, branch:null});
    out.push({id:formId(sp,2), sp, stage:2, branch:null});
    for (const br of Object.keys(BRANCHES)){
      out.push({id:formId(sp,3,br), sp, stage:3, branch:br});
      out.push({id:formId(sp,4,br), sp, stage:4, branch:br});
    }
    out.push({id:formId(sp,5,'anc'), sp, stage:5, branch:'anc'});
  }
  return out;
})();
const FORMS_BY_SP = {};

['h_time',3,'เพราะเหตุใดจึงต้องแบ่งเวลาออกเป็นยุคสมัย',['เพื่อให้เข้าใจลำดับความเป็นมาและเปรียบเทียบเหตุการณ์ในแต่ละช่วงได้ง่ายขึ้น','เพื่อให้สามารถจดจำวันเดือนปีของเหตุการณ์ต่างๆ ได้อย่างแม่นยำ','เพื่อให้หนังสือเรียนประวัติศาสตร์มีความหนาและมีเนื้อหามากขึ้น','เพื่อให้มีวันหยุดราชการในแต่ละปีเพิ่มมากขึ้นกว่าเดิม'],0,'การแบ่งยุคช่วยจัดระเบียบเรื่องราวที่ยาวนานให้เข้าใจง่าย'],

['h_time',3,'ในการศึกษาประวัติศาสตร์ เหตุใดจึงต้องรู้ว่าเหตุการณ์ใดเกิดก่อนหลัง',['เพราะช่วยให้เข้าใจว่าเหตุการณ์หนึ่งเป็นสาเหตุหรือผลของอีกเหตุการณ์หนึ่ง','เพราะช่วยให้ท่องจำชื่อเหตุการณ์และปีที่เกิดขึ้นได้ง่ายกว่าเดิม','เพราะครูผู้สอนกำหนดให้เรียงลำดับเหตุการณ์เป็นข้อบังคับ','เพราะช่วยให้เขียนรายงานส่งครูได้ยาวขึ้นกว่าที่เคยเขียน'],0,'ลำดับเวลาช่วยให้มองเห็นความสัมพันธ์ของเหตุและผล'],

['h_method',1,'หลักฐานทางประวัติศาสตร์แบ่งออกเป็นสองประเภทใหญ่ตามข้อใด',['หลักฐานที่เป็นลายลักษณ์อักษรและหลักฐานที่ไม่เป็นลายลักษณ์อักษร','หลักฐานที่มีอายุเก่าแก่และหลักฐานที่เพิ่งจัดทำขึ้นใหม่','หลักฐานที่พบภายในบ้านและหลักฐานที่พบนอกบ้านเรือน','หลักฐานที่ทางราชการจัดทำและหลักฐานของภาคเอกชน'],0,'แบ่งตามว่ามีตัวอักษรบันทึกไว้หรือไม่'],
['h_method',1,'ข้อใดเป็นหลักฐานที่เป็นลายลักษณ์อักษร',['ศิลาจารึกและพงศาวดาร','เจดีย์และพระพุทธรูป','เครื่องปั้นดินเผา','เครื่องมือหิน'],0,'ศิลาจารึกและพงศาวดารมีตัวอักษรบันทึกเรื่องราวไว้'],

['h_method',1,'ในการศึกษาความเป็นมาของหมู่บ้าน ข้อใดเป็นแหล่งข้อมูลที่เหมาะสม',['ผู้สูงอายุในหมู่บ้าน วัด และเอกสารของชุมชน','หนังสือการ์ตูนที่ชอบอ่านอยู่เป็นประจำทุกวัน','โฆษณาสินค้าที่ออกอากาศทางสถานีโทรทัศน์','เกมที่เล่นบนโทรศัพท์มือถือในเวลาว่าง'],0,'ผู้รู้ในชุมชนและเอกสารของท้องถิ่นเก็บเรื่องราวความเป็นมาไว้มากที่สุด'],
['h_method',2,'การสอบถามเรื่องราวในอดีตจากผู้สูงอายุจัดเป็นหลักฐานประเภทใด',['หลักฐานจากคำบอกเล่า','หลักฐานลายลักษณ์อักษร','โบราณวัตถุ','แผนที่โบราณ'],0,'เรื่องเล่าที่ถ่ายทอดด้วยปากเรียกว่าหลักฐานจากคำบอกเล่าหรือมุขปาฐะ'],
['h_method',2,'ข้อใดคือข้อควรระวังในการใช้หลักฐานจากคำบอกเล่า',['อาจคลาดเคลื่อนได้เพราะความจำและการเล่าต่อกันมาหลายทอด','อ่านไม่ออกเพราะบันทึกไว้ด้วยภาษาโบราณที่เลิกใช้แล้ว','มีน้ำหนักมากเกินกว่าที่จะเคลื่อนย้ายไปเก็บที่อื่นได้','ต้องเสียเงินซื้อจากเจ้าของจึงจะนำมาศึกษาได้'],0,'ความจำเลือนรางและการเล่าต่อทำให้รายละเอียดเปลี่ยนไปได้'],
['h_method',2,'ภาพถ่ายเก่าของหมู่บ้านจัดเป็นหลักฐานประเภทใด',['หลักฐานที่ไม่เป็นลายลักษณ์อักษร','หลักฐานลายลักษณ์อักษร','หลักฐานจากคำบอกเล่า','ไม่ใช่หลักฐานทางประวัติศาสตร์'],0,'ภาพถ่ายบันทึกภาพเหตุการณ์ไว้โดยไม่ต้องใช้ตัวอักษร'],
['h_method',2,'ข้อใดเป็นประโยชน์ของการศึกษาหลักฐานในท้องถิ่น',['ทำให้รู้จักและภาคภูมิใจในความเป็นมาของบ้านเกิดตนเอง','ทำให้ได้รับเงินรางวัลตอบแทนจากหน่วยงานทางราชการ','ทำให้ไม่ต้องเรียนวิชาอื่นในหลักสูตรอีกต่อไปในปีนั้น','ทำให้ท้องถิ่นของเรามีชื่อเสียงโด่งดังไปทั่วโลกทันที'],0,'การรู้จักรากเหง้าของตนนำไปสู่ความรักและความภูมิใจในท้องถิ่น'],
['h_method',2,'เมื่อพบเครื่องปั้นดินเผาโบราณในที่ดินของตน ควรทำอย่างไร',['แจ้งกรมศิลปากรหรือหน่วยงานราชการในพื้นที่','เก็บซ่อนไว้ในบ้านไม่ให้ผู้ใดล่วงรู้','นำไปขายต่อให้นักสะสมของเก่าในราคาสูง','ทุบทำลายทิ้งเพราะเห็นว่าไม่มีประโยชน์'],0,'โบราณวัตถุเป็นสมบัติของชาติ ต้องแจ้งหน่วยงานที่รับผิดชอบตามกฎหมาย'],
['h_method',3,'เหตุใดจึงควรใช้หลักฐานหลายชิ้นในการศึกษาเรื่องเดียวกัน',['เพราะหลักฐานแต่ละชิ้นให้ข้อมูลไม่ครบ การนำมาประกอบกันจึงได้เรื่องราวที่ถูกต้องขึ้น','เพราะการค้นหาหลักฐานหลายชิ้นทำให้ใช้เวลาศึกษานานขึ้นกว่าเดิม','เพราะครูผู้สอนได้กำหนดจำนวนหลักฐานขั้นต่ำไว้ให้นักเรียนปฏิบัติ','เพราะหลักฐานที่มีอยู่เพียงชิ้นเดียวมักสูญหายไปได้โดยง่าย'],0,'การเทียบเคียงหลายชิ้นช่วยลดความคลาดเคลื่อน'],
['h_method',3,'ข้อใดเป็นหลักฐานที่น่าเชื่อถือที่สุดในการหาว่าโรงเรียนสร้างขึ้นเมื่อใด',['เอกสารและป้ายบันทึกการก่อตั้งที่โรงเรียนเก็บไว้','คำบอกเล่าของเพื่อนร่วมชั้นที่เคยได้ยินมาจากผู้อื่น','เรื่องเล่าที่คนในหมู่บ้านพูดต่อกันมาโดยไม่มีที่มา','การคาดเดาจากสภาพความเก่าใหม่ของอาคารเรียน'],0,'เอกสารที่จัดทำขึ้นในช่วงนั้นเป็นหลักฐานที่ตรงและน่าเชื่อถือที่สุด'],
['h_method',3,'พิพิธภัณฑ์ท้องถิ่นมีความสำคัญอย่างไร',['เป็นแหล่งรวบรวมและจัดแสดงหลักฐานที่บอกความเป็นมาของชุมชน','เป็นสถานที่พักผ่อนหย่อนใจของคนในชุมชนเพียงอย่างเดียว','เป็นที่สำหรับเก็บสิ่งของเก่าที่ไม่มีใครใช้งานแล้วเท่านั้น','เป็นสถานที่ซื้อขายแลกเปลี่ยนของเก่าระหว่างนักสะสม'],0,'พิพิธภัณฑ์ท้องถิ่นทำหน้าที่เก็บรักษาและเผยแพร่หลักฐานของชุมชน'],
['h_method',3,'การศึกษาชื่อหมู่บ้านหรือชื่อคลองในท้องถิ่นช่วยให้รู้เรื่องใด',['ที่มา อาชีพ หรือเหตุการณ์สำคัญของชุมชนในอดีต','จำนวนประชากรที่อาศัยอยู่ในชุมชนนั้นในปัจจุบัน','ราคาซื้อขายที่ดินในชุมชนนั้นในอนาคตข้างหน้า','สภาพอากาศและปริมาณน้ำฝนในแต่ละปีของพื้นที่'],0,'ชื่อสถานที่มักตั้งตามลักษณะภูมิประเทศ อาชีพ หรือเรื่องราวในอดีต'],
['h_method',4,'ข้อใดเป็นขั้นตอนที่ถูกต้องในการศึกษาความเป็นมาของท้องถิ่น',['ตั้งคำถามว่าอยากรู้อะไร → หาหลักฐาน → ตรวจสอบความน่าเชื่อถือ → สรุปและนำเสนอ','สรุปคำตอบไว้ก่อน → หาหลักฐานที่ตรงกับข้อสรุปนั้น → นำเสนอผลงาน','นำเสนอผลงาน → ตั้งคำถามที่อยากรู้ → หาหลักฐาน → สรุปผลการศึกษา','หาหลักฐานที่พบได้ง่ายที่สุด → นำเสนอผลงานทันทีโดยไม่ตรวจสอบ'],0,'ต้องเริ่มจากคำถาม แล้วหาและตรวจสอบหลักฐานก่อนสรุป'],

['h_method',3,'ข้อใดคือความแตกต่างระหว่างหลักฐานชั้นต้นกับหลักฐานชั้นรอง',['ชั้นต้นเกิดร่วมสมัยกับเหตุการณ์ ชั้นรองเกิดภายหลังจากการเรียบเรียง','ชั้นต้นบันทึกด้วยภาษาไทย ส่วนชั้นรองบันทึกด้วยภาษาต่างประเทศ','ชั้นต้นเป็นเอกสารของทางราชการ ส่วนชั้นรองเป็นของภาคเอกชน','ชั้นต้นมีภาพประกอบเสมอ ส่วนชั้นรองไม่มีภาพประกอบเลย'],0,'เกณฑ์สำคัญคือความใกล้ชิดกับเหตุการณ์ ไม่ใช่ภาษาหรือผู้จัดทำ'],
['h_method',3,'พงศาวดารกรุงศรีอยุธยาที่ชำระขึ้นในสมัยรัตนโกสินทร์ จัดเป็นหลักฐานประเภทใดสำหรับการศึกษาสมัยอยุธยา',['หลักฐานชั้นต้น','หลักฐานชั้นรอง','โบราณวัตถุ','หลักฐานคำบอกเล่า'],1,'เพราะเรียบเรียงขึ้นภายหลังเหตุการณ์ จึงเป็นหลักฐานชั้นรอง'],
['h_method',4,'ข้อใดอธิบายเหตุผลที่นักประวัติศาสตร์ต้องใช้หลักฐานหลายชิ้นประกอบกันได้ดีที่สุด',['เพื่อให้รายงานผลการศึกษามีความยาวและมีเนื้อหามากขึ้น','เพราะหลักฐานแต่ละชิ้นมีมุมมองและข้อจำกัดต่างกัน การประกอบกันจึงใกล้เคียงความจริงมากขึ้น','เพราะครูผู้สอนได้กำหนดจำนวนหลักฐานขั้นต่ำไว้ให้ปฏิบัติตาม','เพราะหลักฐานที่มีอยู่เพียงชิ้นเดียวมักอ่านข้อความไม่ออก'],1,'หลักฐานแต่ละชิ้นมีอคติและช่องว่างของตัวเอง การเทียบเคียงหลายชิ้นช่วยลดความคลาดเคลื่อน'],

['h_nation',1,'แหล่งข้อมูลใดเหมาะสมที่สุดในการศึกษาความเป็นมาของท้องถิ่นตนเอง',['นิตยสารบันเทิงรายสัปดาห์','พิพิธภัณฑ์ท้องถิ่นและวัดในชุมชน','การ์ตูนออนไลน์ที่อ่านฟรี','โฆษณาสินค้าตามป้ายริมถนน'],1,'พิพิธภัณฑ์ท้องถิ่น วัด และผู้รู้ในชุมชน เก็บร่องรอยความเป็นมาของท้องถิ่นไว้มากที่สุด'],
['h_nation',1,'ข้อใดเป็นหลักฐานที่บอกความเป็นมาของชุมชนได้',['ชื่อหมู่บ้านและชื่อคลองที่ใช้กันมาแต่เดิม','สีที่ใช้ทาบ้านแต่ละหลังในหมู่บ้าน','จำนวนรถยนต์ที่คนในหมู่บ้านครอบครอง','รายการโทรทัศน์ที่คนในหมู่บ้านชอบดู'],0,'ชื่อสถานที่มักบอกที่มา อาชีพ หรือเหตุการณ์ในอดีตของชุมชน'],
['h_nation',2,'การศึกษาประวัติความเป็นมาของท้องถิ่นมีประโยชน์อย่างไรมากที่สุด',['ทำให้เกิดความรักและภาคภูมิใจในท้องถิ่นของตน','ทำให้ได้เงินรางวัล','ทำให้ไม่ต้องเรียนวิชาอื่น','ทำให้ท้องถิ่นมีชื่อเสียงระดับโลกทันที'],0,'ความเข้าใจรากเหง้าของตนนำไปสู่ความรัก ความภูมิใจ และการอนุรักษ์'],
['h_nation',2,'เมื่อพบโบราณวัตถุในที่ดินของตนเอง ควรปฏิบัติอย่างไรจึงเหมาะสมที่สุด',['เก็บรักษาไว้เป็นสมบัติส่วนตัวของครอบครัว','นำไปขายต่อให้นักสะสมของเก่าในราคาสูง','แจ้งกรมศิลปากรหรือหน่วยงานราชการในพื้นที่','ทำลายทิ้งเสียเพราะเห็นว่าไม่มีประโยชน์ใด'],2,'โบราณวัตถุเป็นสมบัติของชาติ ต้องแจ้งหน่วยงานที่รับผิดชอบตามกฎหมาย'],
['h_nation',2,'ข้อใดคือวิธีอนุรักษ์โบราณสถานในท้องถิ่นที่นักเรียนทำได้',['ปีนขึ้นไปถ่ายรูปบนเจดีย์','ขีดเขียนชื่อตนเองไว้บนกำแพง','ช่วยเก็บขยะและไม่ทำให้โบราณสถานเสียหาย','เก็บอิฐเก่ากลับบ้านเป็นที่ระลึก'],2,'การไม่ทำลายและช่วยดูแลความสะอาดเป็นสิ่งที่นักเรียนทำได้ทันที'],
['h_nation',3,'เพราะเหตุใดเรื่องเล่าในท้องถิ่นบางเรื่องจึงต้องตรวจสอบก่อนเชื่อ',['เพราะเรื่องเล่ามักผสมความเชื่อและจินตนาการเข้ากับเหตุการณ์จริง','เพราะเรื่องเล่าในท้องถิ่นทุกเรื่องล้วนเป็นเรื่องที่แต่งขึ้น','เพราะผู้เล่าเรื่องมีเจตนาหลอกลวงผู้ฟังอยู่เสมอทุกครั้ง','เพราะเรื่องเล่าเป็นเรื่องบันเทิงที่ไม่เกี่ยวกับประวัติศาสตร์'],0,'เรื่องเล่ามักมีแก่นความจริงปนกับตำนาน จึงต้องเทียบกับหลักฐานอื่น'],

['h_world',3,'ข้อใดแสดงอิทธิพลของอารยธรรมอินเดียในด้านการปกครองของไทยสมัยอยุธยา',['การจัดให้ราษฎรเลือกตั้งผู้นำของตนเอง','การใช้กฎหมายพระธรรมศาสตร์และคติเทวราชา','การแบ่งเขตปกครองแบบสหพันธรัฐ','การปกครองโดยสภาขุนนางร่วมกันตัดสินใจ'],1,'พระธรรมศาสตร์และคติเทวราชาเป็นแบบแผนที่รับจากอินเดีย'],

['h_time',2,'การเทียบจุลศักราชเป็นพุทธศักราชใช้วิธีใด',['พ.ศ. = จ.ศ. + 621','พ.ศ. = จ.ศ. + 1181','พ.ศ. = จ.ศ. + 1122','พ.ศ. = จ.ศ. + 543'],1,'จุลศักราชเริ่มเมื่อ พ.ศ. 1181 จึงบวก 1181'],

['h_time',2,'ฮิจเราะห์ศักราชเป็นศักราชของศาสนาใด',['ศาสนาพุทธ','ศาสนาคริสต์','ศาสนาอิสลาม','ศาสนาฮินดู'],2,'ฮิจเราะห์ศักราชเริ่มนับเมื่อท่านนบีมุฮัมมัดอพยพจากมักกะฮ์ไปมะดีนะฮ์'],
['h_time',2,'สมัยก่อนประวัติศาสตร์กับสมัยประวัติศาสตร์แบ่งกันด้วยเกณฑ์ใด',['การรู้จักก่อไฟและนำไฟมาใช้ประโยชน์','การรู้จักใช้ตัวอักษรบันทึกเรื่องราว','การรู้จักเลี้ยงสัตว์ไว้ใช้งานและเป็นอาหาร','การรู้จักสร้างบ้านเรือนเป็นที่อยู่ถาวร'],1,'เมื่อมนุษย์รู้จักประดิษฐ์ตัวอักษรและบันทึกเรื่องราว จึงเข้าสู่สมัยประวัติศาสตร์'],

['h_time',2,'ยุคโลหะแบ่งย่อยออกเป็นยุคใดบ้าง',['ยุคทองและยุคเงิน','ยุคสำริดและยุคเหล็ก','ยุคทองแดงและยุคดีบุก','ยุคเหล็กและยุคอะลูมิเนียม'],1,'ยุคโลหะแบ่งเป็นยุคสำริดและยุคเหล็ก'],
['h_time',3,'อารยธรรมใดถือเป็นจุดเริ่มต้นของสมัยประวัติศาสตร์สากล',['อารยธรรมเมโสโปเตเมีย','อารยธรรมกรีก','อารยธรรมโรมัน','อารยธรรมจีน'],0,'ชาวสุเมเรียนในเมโสโปเตเมียประดิษฐ์อักษรคูนิฟอร์มเป็นชาติแรกๆ ของโลก'],
['h_time',3,'ตัวอักษรของอารยธรรมอียิปต์โบราณเรียกว่าอะไร',['คูนิฟอร์ม','เฮียโรกลิฟิก','อักษรเบรลล์','อักษรกรีก'],1,'อักษรภาพของอียิปต์โบราณเรียกว่าเฮียโรกลิฟิก'],
['h_time',3,'เพราะเหตุใดการศึกษาประวัติศาสตร์จึงต้องให้ความสำคัญกับเรื่องเวลา',['เพื่อให้ท่องจำวันเดือนปีของเหตุการณ์ได้ครบทุกเหตุการณ์','เพื่อลำดับเหตุการณ์และเข้าใจความสัมพันธ์ของเหตุและผลได้ถูกต้อง','เพื่อให้รายงานผลการศึกษามีตัวเลขปีศักราชปรากฏอยู่มาก','เพื่อแยกวิชาประวัติศาสตร์ออกจากวิชาอื่นในหลักสูตร'],1,'เวลาช่วยจัดลำดับเหตุการณ์และมองเห็นความสัมพันธ์ของเหตุกับผล'],
['h_time',3,'พุทธศตวรรษที่ 19 หมายถึงช่วงปีใด',['พ.ศ. 1701-1800','พ.ศ. 1801-1900','พ.ศ. 1901-2000','พ.ศ. 1900-2000'],1,'พุทธศตวรรษที่ 19 คือช่วง พ.ศ. 1801 ถึง พ.ศ. 1900'],
['h_time',4,'เหตุใดจึงต้องมีการเทียบศักราชในการศึกษาประวัติศาสตร์',['เพราะหลักฐานแต่ละชิ้นอาจใช้ระบบศักราชต่างกัน ต้องแปลงให้เป็นระบบเดียวกันจึงเปรียบเทียบได้','เพราะครูผู้สอนกำหนดให้นักเรียนต้องคำนวณเทียบศักราชทุกครั้งที่ทำรายงาน','เพราะระบบศักราชที่คนไทยใช้อยู่มีความคลาดเคลื่อนไปจากความเป็นจริง','เพราะการเทียบศักราชทำให้ตัวเลขปีที่ต้องจดจำมีจำนวนน้อยลงกว่าเดิม'],0,'หลักฐานไทยเก่าใช้ ม.ศ. จ.ศ. ร.ศ. ปะปนกัน ต้องแปลงเป็นระบบเดียวจึงลำดับเหตุการณ์ได้'],

/* ---------- วิธีการทางประวัติศาสตร์ (12 ข้อ) ---------- */
['h_method',1,'ถ้านักเรียนต้องการศึกษาเรื่อง "สาเหตุที่สุโขทัยเลือกทำเลนี้ตั้งเมือง" ขั้นตอนแรกที่ต้องทำคือข้อใด',['กำหนดประเด็นและตั้งคำถามที่ต้องการหาคำตอบให้ชัดเจน','เขียนสรุปผลการศึกษาไว้ล่วงหน้าก่อนหาข้อมูล','ตีความหลักฐานที่ยังไม่ได้เริ่มค้นหามาก่อนเลย','นำเสนอผลงานหน้าชั้นเรียนให้เพื่อนช่วยกันคิด'],0,'ต้องตั้งประเด็นให้ชัดก่อน จึงจะรู้ว่าควรไปหาหลักฐานประเภทใด'],
['h_method',1,'ข้อใดเป็นหลักฐานชั้นต้นในการศึกษาสมัยสุโขทัย',['ศิลาจารึกหลักที่ 1','หนังสือเรียนประวัติศาสตร์ ม.1','สารคดีทางโทรทัศน์','บทความวิเคราะห์สมัยปัจจุบัน'],0,'ศิลาจารึกทำขึ้นในสมัยนั้นจึงเป็นหลักฐานชั้นต้น'],
['h_method',2,'วิธีการทางประวัติศาสตร์เรียงลำดับอย่างไร',['รวบรวมหลักฐาน → กำหนดประเด็นที่ศึกษา → ตีความ → เรียบเรียงนำเสนอ','กำหนดประเด็น → รวบรวมหลักฐาน → ประเมินคุณค่าหลักฐาน → วิเคราะห์ตีความ → เรียบเรียงนำเสนอ','ตีความหลักฐาน → เรียบเรียงนำเสนอ → รวบรวมหลักฐาน → สรุปผล','เรียบเรียงนำเสนอ → กำหนดประเด็นที่ศึกษา → ตีความ → รวบรวมหลักฐาน'],1,'มี 5 ขั้นตอน เริ่มจากกำหนดประเด็นและจบที่การเรียบเรียงนำเสนอ'],
['h_method',2,'การวิพากษ์หลักฐานภายนอกหมายถึงข้อใด',['การตรวจสอบว่าหลักฐานเป็นของแท้หรือของปลอม ทำขึ้นเมื่อใด โดยใคร','การตรวจสอบว่าเนื้อหาภายในหลักฐานมีความน่าเชื่อถือเพียงใด','การตรวจสอบว่าหลักฐานชิ้นนั้นอ่านเข้าใจได้ง่ายหรือยาก','การตรวจนับจำนวนหน้าและปริมาณเนื้อหาของหลักฐาน'],0,'วิพากษ์ภายนอกดูที่ตัวหลักฐาน ส่วนวิพากษ์ภายในดูที่เนื้อหา'],
['h_method',2,'การวิพากษ์หลักฐานภายในหมายถึงข้อใด',['ตรวจสอบอายุของกระดาษและวัสดุที่ใช้ทำหลักฐาน','ตรวจสอบความน่าเชื่อถือของเนื้อหาและเจตนาของผู้บันทึก','ตรวจสอบว่าหลักฐานชิ้นนั้นถูกเก็บรักษาไว้ที่ใด','ตรวจสอบราคาซื้อขายของหลักฐานในตลาดของเก่า'],1,'วิพากษ์ภายในคือการประเมินว่าเนื้อหาน่าเชื่อถือเพียงใดและผู้บันทึกมีอคติหรือไม่'],
['h_method',2,'ข้อใดคือหลักฐานที่ไม่เป็นลายลักษณ์อักษร',['พระราชพงศาวดารกรุงศรีอยุธยา','จดหมายเหตุของทูตชาวต่างชาติ','เครื่องสังคโลกและซากเจดีย์','ศิลาจารึกสมัยสุโขทัย'],2,'โบราณวัตถุและโบราณสถานเป็นหลักฐานที่ไม่เป็นลายลักษณ์อักษร'],
['h_method',2,'ตำนานและนิทานพื้นบ้านมีคุณค่าต่อการศึกษาประวัติศาสตร์อย่างไร',['ใช้เป็นข้อเท็จจริงได้ทันทีโดยไม่จำเป็นต้องตรวจสอบกับหลักฐานอื่น','สะท้อนความคิด ความเชื่อ และวิถีชีวิตของผู้คนในยุคนั้น แต่ต้องตรวจสอบกับหลักฐานอื่น','ไม่มีคุณค่าทางวิชาการใดเลยเพราะเป็นเรื่องที่แต่งขึ้นทั้งหมด','ใช้อ้างอิงได้เฉพาะเรื่องที่มีหนังสือพิมพ์ในสมัยนั้นยืนยันไว้'],1,'ตำนานสะท้อนโลกทัศน์ของคนยุคนั้น แต่มีจินตนาการปนจึงต้องเทียบกับหลักฐานอื่น'],
['h_method',3,'ถ้าต้องการศึกษาการปกครองสมัยพ่อขุนรามคำแหง ควรเริ่มจากหลักฐานใด',['ศิลาจารึกหลักที่ 1 และจารึกร่วมสมัยอื่น','นวนิยายอิงประวัติศาสตร์ที่แต่งขึ้นใหม่','บทความที่เผยแพร่ในสื่อสังคมออนไลน์','ภาพยนตร์ที่สร้างจากเหตุการณ์ในยุคนั้น'],0,'จารึกร่วมสมัยเป็นหลักฐานชั้นต้นที่ใกล้เหตุการณ์ที่สุด'],
['h_method',3,'ข้อใดคือความแตกต่างระหว่างข้อเท็จจริงกับการตีความทางประวัติศาสตร์',['ข้อเท็จจริงคือสิ่งที่หลักฐานระบุและตรวจสอบได้ ส่วนการตีความคือคำอธิบายความหมายของนักประวัติศาสตร์','ข้อเท็จจริงเป็นสิ่งที่เชื่อถือไม่ได้ ส่วนการตีความเป็นสิ่งที่เชื่อถือได้เสมอ','ทั้งสองอย่างมีความหมายเหมือนกันทุกประการเพียงแต่ใช้คำเรียกต่างกัน','การตีความต้องกระทำก่อนการหาข้อเท็จจริงเสมอในทุกกรณีที่ศึกษา'],0,'ข้อเท็จจริงมาจากหลักฐาน ส่วนการตีความคือการให้ความหมายซึ่งอาจต่างกันได้'],
['h_method',3,'เพราะเหตุใดนักประวัติศาสตร์จึงอาจสรุปเหตุการณ์เดียวกันต่างกัน',['เพราะใช้หลักฐานคนละชุดและมีมุมมองในการตีความต่างกัน','เพราะบางคนอ่านหนังสือไม่ออก','เพราะประวัติศาสตร์ไม่มีข้อเท็จจริง','เพราะเวลาผ่านไปข้อเท็จจริงเปลี่ยนได้'],0,'ชุดหลักฐานและกรอบการตีความที่ต่างกันนำไปสู่ข้อสรุปที่ต่างกัน'],
['h_method',3,'การนำเสนอผลการศึกษาทางประวัติศาสตร์ที่ดีควรมีลักษณะใด',['ใส่ความคิดเห็นส่วนตัวของผู้ศึกษาลงไปให้มากที่สุด','เรียบเรียงอย่างมีเหตุผล อ้างอิงแหล่งที่มา และแยกข้อเท็จจริงออกจากความคิดเห็น','เลือกนำเสนอเฉพาะข้อมูลที่สนับสนุนความคิดของผู้ศึกษา','ไม่ต้องระบุแหล่งที่มาของข้อมูลเพื่อให้รายงานกระชับ'],1,'ต้องอ้างอิงตรวจสอบได้และแยกให้ชัดว่าส่วนใดเป็นข้อเท็จจริง ส่วนใดเป็นการตีความ'],
['h_method',4,'ข้อใดเป็นการใช้วิธีการทางประวัติศาสตร์ได้ถูกต้องที่สุด',['อ่านบทความเพียงชิ้นเดียวแล้วสรุปเป็นข้อค้นพบทันทีโดยไม่ตรวจสอบข้อมูลจากแหล่งอื่นเพิ่มเติมเลยแม้แต่น้อย','ตั้งคำถามว่าชุมชนเราตั้งเมื่อใด ค้นเอกสารราชการ สัมภาษณ์ผู้สูงอายุ ตรวจสอบความน่าเชื่อถือของแต่ละแหล่ง แล้วเรียบเรียงพร้อมอ้างอิง','เชื่อตามคำบอกเล่าที่ได้ยินมาบ่อยที่สุดจากคนในชุมชนโดยไม่ตรวจสอบกับเอกสารหรือหลักฐานชิ้นอื่นประกอบ','คัดลอกข้อมูลจากเว็บไซต์ต่างๆ ในอินเทอร์เน็ตมารวมกันทั้งหมดโดยไม่ระบุแหล่งที่มาของข้อมูลแต่ละส่วน'],1,'ครบทั้งการตั้งประเด็น รวบรวมหลากหลายแหล่ง ประเมินคุณค่า และนำเสนออย่างอ้างอิงได้'],

['h_nation',4,'ข้อใดสรุปลักษณะของดินแดนไทยก่อนสมัยสุโขทัยได้ถูกต้องที่สุด',['เป็นดินแดนว่างเปล่าที่ไม่มีผู้คนเข้ามาตั้งถิ่นฐานอาศัยอยู่เลยจนถึงสมัยสุโขทัย','มีบ้านเมืองและแว่นแคว้นหลายแห่งที่รับอารยธรรมอินเดียและเขมร กระจายอยู่ตามภูมิภาคต่างๆ','มีอาณาจักรขนาดใหญ่เพียงแห่งเดียวที่ปกครองดินแดนทั้งหมดอย่างเป็นเอกภาพ','เป็นดินแดนที่อยู่ภายใต้การปกครองของจักรวรรดิจีนมาโดยตลอดทุกยุคสมัย'],1,'ก่อนสุโขทัยมีทั้งทวารวดี ละโว้ หริภุญชัย ศรีวิชัย และตามพรลิงค์ กระจายอยู่หลายภูมิภาค'],

['h_person',2,'ไตรภูมิพระร่วงมีความสำคัญอย่างไร',['เป็นวรรณคดีทางพระพุทธศาสนาเล่มแรกของไทยที่อธิบายเรื่องนรก สวรรค์ และการทำความดี','เป็นตำราการทำสงครามและการจัดทัพที่ใช้สืบต่อมาหลายยุคสมัย','เป็นบันทึกการค้าขายกับต่างประเทศที่ละเอียดที่สุดในสมัยนั้น','เป็นประมวลกฎหมายฉบับแรกของไทยที่ใช้บังคับทั่วอาณาจักร'],0,'เป็นวรรณคดีพุทธศาสนาเล่มแรกที่ใช้สอนเรื่องบุญบาปแก่ราษฎร'],

['h_method',2,'ข้อใดเป็นความคิดเห็นมากกว่าข้อเท็จจริง',['อยุธยามีพระมหากษัตริย์ 33 พระองค์','อยุธยาตั้งอยู่บริเวณที่แม่น้ำสามสายมาบรรจบกัน','อยุธยาล่มสลายเพราะคนไทยขาดความสามัคคีเพียงอย่างเดียว','กรุงธนบุรีสถาปนาขึ้นใน พ.ศ. 2310'],2,'การชี้สาเหตุเพียงข้อเดียวเป็นการตีความ ไม่ใช่ข้อเท็จจริงที่ตรวจสอบได้โดยตรง'],
['h_method',3,'ความแตกต่างระหว่างข้อเท็จจริงกับความจริงทางประวัติศาสตร์คือข้อใด',['ข้อเท็จจริงคือข้อมูลที่ปรากฏในหลักฐาน ส่วนความจริงคือสิ่งที่เกิดขึ้นจริงซึ่งต้องประมวลจากข้อเท็จจริงหลายชิ้น','ข้อเท็จจริงเป็นสิ่งที่เชื่อถือไม่ได้เพราะมาจากหลักฐาน ส่วนความจริงเป็นสิ่งที่เชื่อถือได้เสมอในทุกกรณี','ทั้งสองคำมีความหมายเหมือนกันทุกประการเพียงแต่นักประวัติศาสตร์เลือกใช้ต่างกันตามโอกาส','ความจริงทางประวัติศาสตร์คือความคิดเห็นส่วนตัวของนักประวัติศาสตร์ที่ศึกษาเรื่องนั้นเป็นหลัก'],0,'ข้อเท็จจริงเป็นข้อมูลจากหลักฐาน ส่วนความจริงคือภาพเหตุการณ์ที่ประมวลได้จากข้อเท็จจริงหลายชิ้น'],
['h_method',3,'เหตุใดหลักฐานเพียงชิ้นเดียวจึงไม่เพียงพอต่อการสรุปเหตุการณ์ทางประวัติศาสตร์',['เพราะหลักฐานที่มีเพียงชิ้นเดียวมักเขียนด้วยภาษาโบราณที่อ่านทำความเข้าใจได้ยาก','เพราะหลักฐานแต่ละชิ้นให้ข้อมูลเพียงบางส่วนและมีมุมมองเฉพาะของผู้บันทึก','เพราะกฎเกณฑ์การศึกษาวิจัยกำหนดให้ต้องใช้หลักฐานอย่างน้อยสามชิ้นขึ้นไป','เพราะหลักฐานที่มีอายุเก่าแก่มักชำรุดเสียหายจนอ่านข้อความไม่ครบถ้วน'],1,'หลักฐานแต่ละชิ้นเห็นเหตุการณ์คนละด้าน ต้องประกอบกันจึงได้ภาพที่ใกล้ความจริง'],
['h_method',3,'พระราชพงศาวดารที่เขียนโดยราชสำนักมักมีข้อจำกัดในเรื่องใด',['เขียนด้วยลายมือแบบโบราณที่ผู้อ่านสมัยใหม่อ่านได้ยาก','มักเน้นยกย่องพระมหากษัตริย์และบันทึกชีวิตของสามัญชนไว้น้อย','ไม่ระบุปีศักราชที่เกิดเหตุการณ์ไว้อย่างชัดเจนในหลายตอน','ไม่ได้รับการเก็บรักษาไว้อย่างเป็นระบบจนสูญหายไปเกือบหมด'],1,'พงศาวดารมองจากศูนย์กลางอำนาจ จึงสะท้อนชีวิตราษฎรทั่วไปได้จำกัด'],
['h_method',3,'หากหลักฐานสองชิ้นระบุจำนวนทหารในสงครามเดียวกันไม่ตรงกัน ควรทำอย่างไร',['เลือกใช้ตัวเลขที่มากกว่าเสมอเพราะแสดงถึงความสำคัญของสงคราม','ตรวจสอบที่มา ความใกล้ชิดกับเหตุการณ์ และเจตนาของผู้บันทึกแต่ละชิ้น','นำตัวเลขจากหลักฐานทั้งสองชิ้นมาหาค่าเฉลี่ยแล้วใช้ตัวเลขนั้น','ตัดข้อมูลเรื่องจำนวนทหารออกทั้งหมดเพราะสรุปไม่ได้ว่าชิ้นใดถูก'],1,'ตัวเลขในเอกสารเก่ามักถูกขยายเพื่อยกย่องฝ่ายตน จึงต้องประเมินความน่าเชื่อถือของแต่ละแหล่ง'],
['h_method',3,'การตีความหลักฐานทางประวัติศาสตร์หมายถึงข้อใด',['การคัดลอกข้อความจากหลักฐานมาใส่ในรายงานอย่างครบถ้วน','การอธิบายความหมายของหลักฐานโดยคำนึงถึงบริบทของยุคสมัยนั้น','การแปลเอกสารที่เป็นภาษาต่างประเทศให้เป็นภาษาไทยที่อ่านเข้าใจ','การจัดเก็บหลักฐานให้เป็นระบบเพื่อความสะดวกในการค้นหาภายหลัง'],1,'การตีความคือการหาความหมายของหลักฐานภายใต้บริบททางสังคมและวัฒนธรรมของยุคนั้น'],
['h_method',3,'เพราะเหตุใดนักประวัติศาสตร์สองคนจึงอาจตีความหลักฐานชิ้นเดียวกันต่างกัน',['เพราะใช้กรอบแนวคิด ประสบการณ์ และคำถามตั้งต้นที่ต่างกัน','เพราะนักประวัติศาสตร์คนหนึ่งอ่านข้อความในหลักฐานผิดพลาด','เพราะเนื้อหาในหลักฐานเปลี่ยนแปลงไปตามกาลเวลาที่ผ่านไป','เพราะวิชาประวัติศาสตร์ไม่มีข้อเท็จจริงที่แน่นอนให้ยึดถือเลย'],0,'มุมมองและคำถามที่ต่างกันทำให้มองเห็นความหมายในหลักฐานเดียวกันต่างกันได้'],
['h_method',3,'ข้อใดคือประโยชน์ของการตีความหลักฐานอย่างมีหลักเกณฑ์',['ทำให้ได้คำอธิบายอดีตที่มีเหตุผลรองรับและตรวจสอบย้อนกลับได้','ทำให้เรื่องราวในประวัติศาสตร์มีคำตอบเดียวที่ตายตัวไม่เปลี่ยนแปลง','ทำให้ไม่จำเป็นต้องใช้หลักฐานประกอบการศึกษาอีกต่อไปในอนาคต','ทำให้เขียนรายงานการศึกษาได้เสร็จเร็วขึ้นกว่าวิธีการแบบอื่น'],0,'การตีความที่มีหลักเกณฑ์ทำให้ข้อสรุปมีเหตุผลและผู้อื่นตรวจสอบได้'],
['h_method',3,'เรื่องเล่าปาฏิหาริย์ที่ปรากฏในพงศาวดารควรใช้อย่างไร',['เชื่อตามที่บันทึกไว้ทั้งหมดเพราะปรากฏอยู่ในพงศาวดารของทางราชการ','ใช้เป็นข้อมูลสะท้อนความเชื่อของคนยุคนั้น แต่ไม่ใช้เป็นข้อเท็จจริงโดยตรง','ตัดทิ้งออกจากการศึกษาทั้งหมดเพราะไม่มีประโยชน์ทางวิชาการใดเลย','ใช้แทนหลักฐานชั้นต้นได้เพราะบันทึกไว้ร่วมสมัยกับเหตุการณ์นั้น'],1,'เรื่องเหนือธรรมชาติสะท้อนโลกทัศน์ของยุคนั้น แต่ต้องแยกออกจากข้อเท็จจริงที่พิสูจน์ได้'],
['h_method',3,'ข้อใดเป็นตัวอย่างของหลักฐานที่จัดทำขึ้นเพื่อโฆษณาชวนเชื่อ',['ใบปลิวและประกาศที่จัดทำขึ้นเพื่อปลุกใจในภาวะสงคราม','ใบเสร็จรับเงินที่ร้านค้าออกให้ลูกค้าตามปกติทั่วไป','บันทึกส่วนตัวที่ผู้เขียนไม่ได้ตั้งใจจะเผยแพร่ต่อผู้อื่น','ทะเบียนสำมะโนครัวที่ทางราชการจัดทำขึ้นตามระเบียบ'],0,'เอกสารปลุกใจมีเป้าหมายชักจูงความคิด จึงต้องอ่านอย่างระวังเป็นพิเศษ'],
['h_method',3,'ข้อใดคือลำดับขั้นตอนที่ถูกต้องของวิธีการทางประวัติศาสตร์',['รวบรวมหลักฐาน → กำหนดประเด็นที่จะศึกษา → เรียบเรียงนำเสนอ → วิเคราะห์ตีความ','กำหนดประเด็น → รวบรวมหลักฐาน → ประเมินคุณค่าหลักฐาน → วิเคราะห์ตีความ → เรียบเรียงนำเสนอ','วิเคราะห์ตีความ → กำหนดประเด็นที่จะศึกษา → รวบรวมหลักฐาน → เรียบเรียงนำเสนอ','เรียบเรียงนำเสนอ → รวบรวมหลักฐาน → ประเมินคุณค่า → วิเคราะห์ตีความ'],1,'ทั้ง 5 ขั้นตอนเรียงจากการตั้งประเด็นไปจนถึงการเรียบเรียงนำเสนอ'],
['h_method',4,'ข้อใดสะท้อนการใช้หลักฐานอย่างมีวิจารณญาณมากที่สุด',['ยึดถือตามหลักฐานที่มีอายุเก่าแก่ที่สุดเสมอเพราะใกล้เหตุการณ์มากกว่าชิ้นอื่น','เลือกเชื่อเฉพาะหลักฐานที่ให้ข้อมูลตรงกับความคิดและความเชื่อเดิมของตนเอง','เปรียบเทียบหลักฐานหลายชิ้นจากหลายฝ่าย ประเมินความน่าเชื่อถือ แล้วสรุปพร้อมระบุข้อจำกัด','เลือกใช้เฉพาะหลักฐานที่บันทึกโดยฝ่ายไทยเท่านั้นเพราะเข้าใจบริบทของสังคมไทยดีกว่า'],2,'การเทียบหลายฝ่ายและระบุข้อจำกัดของข้อสรุปคือหัวใจของการใช้หลักฐานอย่างมีวิจารณญาณ'],
['h_method',4,'เหตุใดประวัติศาสตร์จึงถูกเขียนใหม่ได้เรื่อยๆ',['เพราะเหตุการณ์ในอดีตมีการเปลี่ยนแปลงไปอยู่ตลอดเวลาตามยุคสมัย','เพราะมีการค้นพบหลักฐานใหม่และเกิดมุมมองใหม่ในการตีความ','เพราะนักประวัติศาสตร์มักเปลี่ยนใจและปรับข้อสรุปของตนอยู่เสมอ','เพราะหนังสือประวัติศาสตร์เล่มเก่ามีอายุการใช้งานที่จำกัดไว้'],1,'อดีตไม่เปลี่ยน แต่หลักฐานใหม่และคำถามใหม่ทำให้คำอธิบายอดีตเปลี่ยนได้'],
['h_method',4,'ข้อใดคือเจตคติที่เหมาะสมที่สุดของผู้ศึกษาประวัติศาสตร์',['เชื่อถือทุกอย่างที่มีการบันทึกไว้เป็นลายลักษณ์อักษรโดยไม่ต้องสงสัย','ตั้งคำถามอย่างมีเหตุผล เปิดรับหลักฐานใหม่ และเข้าใจบริบทของยุคสมัยนั้นก่อนตัดสิน','ปฏิเสธหลักฐานทุกชิ้นเพราะไม่มีสิ่งใดที่พิสูจน์ได้อย่างแน่นอน','เลือกเชื่อเฉพาะเรื่องราวที่ตรงกับความรู้สึกและความเชื่อของตนเอง'],1,'ต้องมีทั้งความสงสัยอย่างมีเหตุผลและความเข้าใจบริบทของยุคสมัยที่ศึกษา'],

['h_world',1,'อารยธรรมเมโสโปเตเมียเกิดขึ้นบริเวณลุ่มแม่น้ำใด',['ไทกริสและยูเฟรทีส','สินธุและคงคา','ฮวงโหและแยงซี','ไนล์และคองโก'],0,'เมโสโปเตเมียแปลว่าดินแดนระหว่างแม่น้ำสองสาย คือไทกริสกับยูเฟรทีส'],
['h_world',1,'ชนชาติใดเป็นผู้ประดิษฐ์อักษรคูนิฟอร์ม',['ชาวสุเมเรียน','ชาวอียิปต์','ชาวจีน','ชาวอารยัน'],0,'ชาวสุเมเรียนในเมโสโปเตเมียประดิษฐ์อักษรรูปลิ่มหรือคูนิฟอร์ม'],
['h_world',1,'ประมวลกฎหมายที่เก่าแก่ที่สุดฉบับหนึ่งของโลกซึ่งจารึกไว้บนแท่งหินคือข้อใด',['ประมวลกฎหมายฮัมมูราบี','กฎหมายตราสามดวง','พระธรรมศาสตร์','กฎบัตรแมกนาคาร์ตา'],0,'ประมวลกฎหมายฮัมมูราบีของบาบิโลเนียยึดหลักตาต่อตาฟันต่อฟัน'],
['h_world',1,'อารยธรรมลุ่มแม่น้ำสินธุมีเมืองสำคัญคือเมืองใด',['โมเฮนโจ-ดาโรและฮารัปปา','เอเธนส์และสปาร์ตา','ซีอานและลั่วหยาง','แบกแดดและดามัสกัส'],0,'ทั้งสองเมืองมีผังเมืองเป็นระเบียบและระบบระบายน้ำที่ก้าวหน้ามาก'],
['h_world',1,'อารยธรรมจีนโบราณเริ่มต้นบริเวณลุ่มแม่น้ำใด',['ฮวงโห','แยงซี','โขง','สินธุ'],0,'ลุ่มแม่น้ำฮวงโหหรือแม่น้ำเหลืองเป็นแหล่งกำเนิดอารยธรรมจีน'],
['h_world',2,'ระบบวรรณะของอินเดียเกิดขึ้นในช่วงใด',['เมื่อชาวอารยันเข้ามาตั้งถิ่นฐานและนำคัมภีร์พระเวทเข้ามา','สมัยราชวงศ์โมกุลที่ปกครองอินเดียในยุคหลังต่อมา','สมัยที่อังกฤษเข้าปกครองอินเดียเป็นอาณานิคม','สมัยอารยธรรมลุ่มแม่น้ำสินธุที่เมืองฮารัปปารุ่งเรือง'],0,'ชาวอารยันนำคัมภีร์พระเวทและระบบวรรณะเข้ามาในอินเดีย'],
['h_world',2,'วรรณะใดในสังคมอินเดียโบราณมีหน้าที่ประกอบพิธีกรรมทางศาสนา',['พราหมณ์','กษัตริย์','แพศย์','ศูทร'],0,'วรรณะพราหมณ์เป็นนักบวชผู้ประกอบพิธีกรรม'],

['h_world',2,'สี่สิ่งประดิษฐ์สำคัญของจีนโบราณคือข้อใด',['กระดาษ เข็มทิศ ดินปืน และการพิมพ์','เหล็ก ทอง เงิน และทองแดง','นาฬิกา แว่นตา รถไฟ และโทรเลข','ปฏิทิน แผนที่ ตาชั่ง และร่ม'],0,'ทั้งสี่อย่างส่งผลต่อพัฒนาการของโลกอย่างกว้างขวาง'],

['h_world',2,'เส้นทางสายไหมมีความสำคัญอย่างไร',['เป็นเส้นทางการค้าทางบกที่เชื่อมจีนกับเอเชียกลาง อินเดีย และดินแดนตะวันตก','เป็นเส้นทางที่กองทัพมองโกลใช้เดินทัพเข้ารุกรานยุโรปเพียงอย่างเดียว','เป็นเส้นทางแสวงบุญที่ชาวพุทธใช้เดินทางไปยังอินเดียเท่านั้น','เป็นคลองขุดสำหรับให้เรือสินค้าแล่นเชื่อมระหว่างสองมหาสมุทร'],0,'นอกจากสินค้าแล้วยังเป็นเส้นทางแลกเปลี่ยนศาสนา เทคโนโลยี และวัฒนธรรม'],

['h_world',3,'ชนชั้นนักรบในสังคมศักดินาของญี่ปุ่นเรียกว่าอะไร',['ซามูไร','โชกุน','ไดเมียว','ชินโต'],0,'ซามูไรเป็นชนชั้นนักรบที่รับใช้ไดเมียวภายใต้การปกครองของโชกุน'],
['h_world',3,'อารยธรรมลุ่มแม่น้ำสินธุมีความก้าวหน้าโดดเด่นในเรื่องใด',['การวางผังเมืองและระบบระบายน้ำ','การต่อเรือเดินสมุทรขนาดใหญ่','การประดิษฐ์ดินปืนและอาวุธไฟ','การสร้างพีระมิดเป็นสุสานกษัตริย์'],0,'โมเฮนโจ-ดาโรมีถนนตัดเป็นตาราง มีท่อระบายน้ำและยุ้งฉางส่วนกลาง'],
['h_world',3,'เหตุใดอารยธรรมโบราณของเอเชียส่วนใหญ่จึงเกิดขึ้นบริเวณลุ่มแม่น้ำ',['เพราะดินอุดมสมบูรณ์และมีน้ำเพียงพอ ทำให้ผลิตอาหารเลี้ยงประชากรจำนวนมากได้','เพราะแม่น้ำเป็นปราการธรรมชาติที่ใช้ป้องกันข้าศึกได้เพียงอย่างเดียว','เพราะบริเวณลุ่มแม่น้ำมักมีแหล่งแร่ทองคำอุดมสมบูรณ์อยู่ใต้พื้นดิน','เพราะบริเวณลุ่มแม่น้ำมีอากาศหนาวเย็นตลอดปีจึงเหมาะแก่การอยู่อาศัย'],0,'ผลผลิตส่วนเกินจากการเกษตรทำให้เกิดเมือง ชนชั้น และการปกครองที่ซับซ้อน'],
['h_world',3,'ราชวงศ์คุปตะได้รับการยกย่องว่าเป็นยุคทองของอินเดียในด้านใด',['ศิลปวิทยาการ คณิตศาสตร์ และวรรณคดี','การขยายอาณาเขตด้วยการทำสงคราม','การเดินเรือค้าขายกับยุโรป','การสร้างกำแพงป้องกันประเทศ'],0,'สมัยคุปตะเจริญด้านคณิตศาสตร์ ดาราศาสตร์ และวรรณคดีสันสกฤต'],
['h_world',3,'การเดินเรือของเจิ้งเหอในสมัยราชวงศ์หมิงมีความสำคัญอย่างไร',['ขยายความสัมพันธ์ทางการค้าและการทูตของจีนไปถึงเอเชียใต้และชายฝั่งแอฟริกา','เป็นการค้นพบทวีปอเมริกาก่อนที่ชาวยุโรปจะเดินทางไปถึงหลายสิบปี','เป็นการยกกองเรือไปยึดครองดินแดนอินเดียทั้งหมดให้เป็นของจีน','เป็นการขนส่งชาวจีนจำนวนมากไปตั้งถิ่นฐานในทวีปยุโรปตะวันตก'],0,'กองเรือมหาสมบัติของเจิ้งเหอเดินทางไปไกลถึงชายฝั่งแอฟริกาตะวันออก'],
['h_world',3,'อารยธรรมเอเชียมีอิทธิพลต่อดินแดนไทยในด้านใดชัดเจนที่สุด',['ศาสนา ตัวอักษร กฎหมาย และรูปแบบศิลปกรรม','ระบบรัฐสภาและการเลือกตั้งผู้แทนราษฎร','เทคโนโลยีการบินและการคมนาคมสมัยใหม่','ระบบธนาคารและการเงินการคลังสมัยใหม่'],0,'อินเดียให้ศาสนาและตัวอักษร ส่วนจีนให้เทคโนโลยีและรูปแบบการค้า'],
['h_world',3,'แหล่งอารยธรรมโบราณใดตั้งอยู่ในภูมิภาคเอเชียตะวันตกเฉียงใต้',['เมโสโปเตเมีย','ลุ่มแม่น้ำฮวงโห','ลุ่มแม่น้ำสินธุ','เกาะชวา'],0,'เมโสโปเตเมียอยู่บริเวณประเทศอิรักปัจจุบัน ซึ่งอยู่ในเอเชียตะวันตกเฉียงใต้'],
['h_world',4,'ข้อใดอธิบายพัฒนาการทางการเมืองของภูมิภาคเอเชียในภาพรวมได้ถูกต้องที่สุด',['เอเชียใช้ระบอบการปกครองรูปแบบเดียวกันมาโดยตลอดตั้งแต่ยุคโบราณจนถึงยุคปัจจุบันโดยไม่เคยเปลี่ยนแปลง','เอเชียพัฒนาจากรัฐโบราณที่มีกษัตริย์และศาสนาเป็นศูนย์กลาง ผ่านยุคจักรวรรดิ สู่ยุคอาณานิคม และกลายเป็นรัฐชาติสมัยใหม่','เอเชียไม่เคยปรากฏอาณาจักรหรือจักรวรรดิที่มีขนาดใหญ่และมีอำนาจครอบคลุมภูมิภาคกว้างขวางเลยแม้แต่แห่งเดียว','เอเชียรับเอาระบอบการปกครองมาจากยุโรปทั้งหมดตั้งแต่แรกเริ่มโดยไม่เคยมีรูปแบบการปกครองของตนเองมาก่อน'],1,'เส้นทางหลักคือจากรัฐโบราณสู่จักรวรรดิ ผ่านยุคอาณานิคม แล้วกลายเป็นรัฐชาติในปัจจุบัน'],
['h_world',4,'การศึกษาอารยธรรมโบราณของเอเชียมีคุณค่าต่อคนปัจจุบันอย่างไรมากที่สุด',['ทำให้สามารถจดจำชื่อราชวงศ์และลำดับกษัตริย์ได้ครบถ้วนทุกพระองค์','ทำให้เข้าใจรากเหง้าของความคิด ความเชื่อ และสถาบันที่ยังส่งผลต่อสังคมปัจจุบัน','ทำให้ทราบว่าชาติใดในทวีปเอเชียมีกำลังทหารเข้มแข็งที่สุดในอดีต','ทำให้สามารถลดเวลาที่ต้องใช้เรียนวิชาอื่นในหลักสูตรลงได้มาก'],1,'ระบบกฎหมาย ศาสนา และค่านิยมหลายอย่างในปัจจุบันมีรากมาจากอารยธรรมเหล่านั้น'],

['h_kingdom',2,'สมเด็จพระบรมไตรโลกนาถทรงปฏิรูปการปกครองส่วนกลางอย่างไร',['แยกฝ่ายทหารและพลเรือนออกจากกัน โดยมีสมุหพระกลาโหมและสมุหนายก','ยกเลิกระบบจตุสดมภ์ทั้งหมดแล้วให้ขุนนางบริหารร่วมกันเป็นคณะ','ให้ราษฎรมีสิทธิเลือกตั้งขุนนางผู้ปกครองหัวเมืองด้วยตนเอง','ย้ายราชธานีจากอยุธยาไปตั้งที่เมืองพิษณุโลกอย่างถาวร'],0,'ทรงตั้งสมุหนายกดูแลพลเรือนและสมุหพระกลาโหมดูแลทหาร โดยยังคงจตุสดมภ์ไว้'],
['h_kingdom',2,'ระบบศักดินามีบทบาทสำคัญอย่างไรในสังคมอยุธยา',['กำหนดฐานะ สิทธิ หน้าที่ และความรับผิดชอบของคนแต่ละกลุ่มในสังคม','แบ่งที่ดินทำกินให้ราษฎรทุกคนได้รับในจำนวนที่เท่าเทียมกัน','ใช้เป็นเกณฑ์จัดเก็บภาษีจากพ่อค้าต่างชาติที่เข้ามาค้าขาย','กำหนดเวลาเข้าออกงานของข้าราชการในแต่ละกรมกองให้ชัดเจน'],0,'ตัวเลขศักดินาเป็นเครื่องบอกสถานะและใช้อ้างอิงในการปรับไหมตามกฎหมาย'],
['h_kingdom',2,'ไพร่หลวงในสังคมอยุธยาหมายถึงใคร',['ไพร่ที่สังกัดพระมหากษัตริย์และต้องเข้าเวรรับราชการ','ไพร่ที่สังกัดมูลนายเป็นการส่วนตัวไม่ขึ้นกับหลวง','ไพร่ที่ส่งสิ่งของหรือเงินมาแทนการใช้แรงงาน','ทาสที่ไถ่ถอนตัวเองพ้นจากความเป็นทาสแล้ว'],0,'ไพร่หลวงขึ้นตรงต่อพระมหากษัตริย์และต้องเข้าเวรทำงานให้ราชการ'],
['h_kingdom',2,'ไพร่ส่วยหมายถึงไพร่ประเภทใด',['ไพร่ที่ส่งสิ่งของหรือเงินแทนการเข้าเวรใช้แรงงาน','ไพร่ที่หลบหนีออกจากสังกัดมูลนายของตนเอง','ไพร่ที่รับราชการเป็นทหารอาชีพประจำการ','ไพร่ที่ได้รับการยกเว้นไม่ต้องทำหน้าที่ใดเลย'],0,'ส่วยคือสิ่งของหรือเงินที่ส่งให้ราชการแทนการใช้แรงงาน'],
['h_kingdom',2,'หน่วยงานใดของอยุธยาทำหน้าที่ควบคุมและผูกขาดการค้ากับต่างประเทศ',['พระคลังสินค้า','กรมนา','กรมเวียง','กรมวัง'],0,'พระคลังสินค้าผูกขาดการซื้อขายสินค้าสำคัญกับพ่อค้าต่างชาติ'],
['h_kingdom',2,'รายได้ของรัฐสมัยอยุธยาที่เรียกว่า "จังกอบ" หมายถึงอะไร',['ภาษีที่เก็บจากสินค้าผ่านด่านหรือตามขนาดของเรือ','ภาษีที่เก็บจากผลผลิตทางการเกษตรของราษฎร','ค่าธรรมเนียมที่เก็บจากการฟ้องร้องคดีความ','สิ่งของที่หัวเมืองส่งมาแทนการเกณฑ์แรงงาน'],0,'จังกอบคือภาษีผ่านด่าน ส่วนอากรเก็บจากผลผลิต ฤชาคือค่าธรรมเนียม และส่วยคือสิ่งของแทนแรงงาน'],
['h_kingdom',2,'ชาติตะวันตกชาติแรกที่เข้ามาติดต่อกับกรุงศรีอยุธยาคือชาติใด และในรัชกาลใด',['โปรตุเกส ในรัชกาลสมเด็จพระรามาธิบดีที่ 2','ฮอลันดา ในรัชกาลสมเด็จพระนเรศวรมหาราช','อังกฤษ ในรัชกาลสมเด็จพระนารายณ์มหาราช','ฝรั่งเศส ในรัชกาลสมเด็จพระเพทราชา'],0,'โปรตุเกสเข้ามาเมื่อ พ.ศ. 2054 ตรงกับรัชกาลสมเด็จพระรามาธิบดีที่ 2'],
['h_kingdom',3,'เหตุใดของป่าจึงเป็นสินค้าออกสำคัญของอยุธยา',['เพราะรัฐเกณฑ์ให้หัวเมืองส่งของป่ามาเป็นส่วย และเป็นสินค้าที่ตลาดจีนกับตะวันตกต้องการ','เพราะพื้นที่ของอยุธยาไม่เหมาะแก่การปลูกข้าวจึงต้องหันไปหาของป่าแทน','เพราะของป่ามีน้ำหนักเบาและขนส่งทางเรือได้ง่ายกว่าสินค้าประเภทอื่นทุกชนิด','เพราะกฎหมายในสมัยนั้นห้ามมิให้ส่งออกสินค้าประเภทอื่นนอกจากของป่า'],0,'ระบบส่วยทำให้รัฐได้ของป่าจากหัวเมืองโดยไม่ต้องซื้อ แล้วนำไปขายผ่านพระคลังสินค้า'],
['h_kingdom',2,'อาณาจักรธนบุรีมีอายุประมาณกี่ปี',['5 ปี','15 ปี','25 ปี','40 ปี'],1,'ตั้งแต่ พ.ศ. 2310 ถึง 2325 รวมประมาณ 15 ปี'],
['h_kingdom',3,'ปัจจัยทางภูมิศาสตร์ใดที่ส่งเสริมความมั่นคงของกรุงศรีอยุธยามากที่สุด',['ตั้งอยู่บนเกาะที่มีแม่น้ำสามสายล้อมรอบ ใช้เป็นปราการธรรมชาติและเส้นทางออกสู่ทะเล','ตั้งอยู่บนที่ราบสูงเชิงเขาที่ข้าศึกยกกำลังพลเข้าถึงได้ยากลำบากในทุกฤดูกาล','ตั้งอยู่ใกล้ชายแดนจีนจึงได้รับความคุ้มครองทางการทหารจากจักรพรรดิจีน','ตั้งอยู่กลางที่ราบแห้งแล้งกันดารที่กองทัพข้าศึกไม่นิยมเดินทัพผ่านมา'],0,'น้ำล้อมรอบช่วยป้องกันข้าศึกในฤดูน้ำหลาก และแม่น้ำยังเป็นเส้นทางการค้าสู่ทะเล'],
['h_kingdom',3,'ปัจจัยใดทำให้อยุธยากลายเป็นศูนย์กลางการค้าที่มั่งคั่งของภูมิภาค',['ตั้งอยู่กึ่งกลางเส้นทางการค้าทางทะเลระหว่างจีน อินเดีย และตะวันตก ประกอบกับมีสินค้าเกษตรและของป่าอุดมสมบูรณ์','มีการค้นพบเหมืองแร่ทองคำขนาดใหญ่หลายแห่งในเขตราชธานีจนกลายเป็นแหล่งสะสมความมั่งคั่งที่สำคัญของรัฐ','เป็นแหล่งผลิตอาวุธปืนไฟที่มีคุณภาพสูงและส่งออกขายให้แก่ชาติต่างๆ ทั่วทั้งภูมิภาคเอเชียตะวันออกเฉียงใต้','ออกกฎหมายห้ามมิให้ชาติอื่นเข้ามาทำการค้าในภูมิภาคนี้จึงผูกขาดการค้าทั้งหมดไว้ได้เพียงชาติเดียว'],0,'ทำเลกึ่งกลางเส้นทางการค้าและทรัพยากรที่หลากหลายทำให้อยุธยาเป็นเมืองท่านานาชาติ'],
['h_kingdom',3,'ระบบการควบคุมกำลังคนแบบไพร่ส่งผลต่อความมั่นคงของอยุธยาอย่างไร',['ทำให้รัฐมีกำลังคนสำหรับการสงครามและงานโยธาโดยไม่ต้องจ่ายค่าจ้าง','ทำให้ราษฎรมีอิสระในการเลือกประกอบอาชีพตามความถนัดของตน','ทำให้เกิดระบบการเลือกตั้งผู้นำในระดับหมู่บ้านและหัวเมือง','ทำให้จำนวนประชากรในราชอาณาจักรลดลงอย่างรวดเร็วทุกปี'],0,'ระบบไพร่คือฐานกำลังคนของรัฐทั้งในยามศึกและยามสร้างบ้านแปงเมือง'],
['h_kingdom',3,'ข้อใดคือความแตกต่างสำคัญระหว่างการเสียกรุงครั้งที่ 1 กับครั้งที่ 2',['ครั้งที่ 1 อยุธยายังคงสภาพเมืองและมีกษัตริย์ปกครองต่อในฐานะประเทศราช ส่วนครั้งที่ 2 บ้านเมืองถูกทำลายจนต้องย้ายราชธานี','ครั้งที่ 1 อยุธยาเสียกรุงให้แก่กองทัพเขมรที่ยกมาจากทางตะวันออก ส่วนครั้งที่ 2 เสียให้แก่กองทัพพม่า','ครั้งที่ 1 ไม่ปรากฏการสู้รบเพราะยอมแพ้แต่โดยดี ส่วนครั้งที่ 2 มีการสู้รบยืดเยื้อนานหลายเดือน','ทั้งสองครั้งเกิดขึ้นในรัชกาลเดียวกันโดยห่างกันเพียงไม่กี่ปีในช่วงปลายสมัยอยุธยา'],0,'ครั้งที่ 1 อยุธยายังฟื้นตัวได้ในที่เดิม แต่ครั้งที่ 2 เมืองถูกเผาทำลายจนต้องตั้งราชธานีใหม่ที่ธนบุรี'],
['h_kingdom',3,'เหตุใดสมเด็จพระเจ้าตากสินมหาราชจึงทรงเลือกกรุงธนบุรีเป็นราชธานีแทนอยุธยา',['อยู่ใกล้ปากแม่น้ำสะดวกต่อการค้าและการถอยทัพ อีกทั้งมีขนาดเหมาะกับกำลังคนที่เหลืออยู่','ธนบุรีมีกำแพงเมืองและป้อมปราการที่แข็งแรงกว่ากรุงศรีอยุธยาอยู่มาก','ธนบุรีตั้งอยู่ห่างจากแม่น้ำสายใหญ่จึงปลอดภัยจากการรุกรานทางเรือ','กรุงศรีอยุธยาประสบปัญหาขาดแคลนแหล่งน้ำจืดสำหรับใช้อุปโภคบริโภค'],0,'อยุธยาเสียหายหนักและใหญ่เกินกว่าจะป้องกันด้วยกำลังคนที่เหลือ ธนบุรีจึงเหมาะสมกว่า'],
['h_kingdom',3,'ข้อใดไม่ใช่ชุมนุมสำคัญที่เกิดขึ้นหลังการเสียกรุงศรีอยุธยาครั้งที่ 2',['ชุมนุมเจ้าพระยาพิษณุโลก','ชุมนุมเจ้าพระฝาง','ชุมนุมเจ้านครศรีธรรมราช','ชุมนุมเจ้าเมืองเชียงใหม่'],3,'ชุมนุมสำคัญได้แก่ พิษณุโลก เจ้าพระฝาง เจ้าพิมาย และนครศรีธรรมราช'],
['h_kingdom',3,'พระราชกรณียกิจด้านเศรษฐกิจที่เร่งด่วนที่สุดของสมเด็จพระเจ้าตากสินมหาราชคือข้อใด',['การแก้ปัญหาข้าวยากหมากแพงโดยจัดหาข้าวแจกจ่ายราษฎรและส่งเสริมการทำนา','การเร่งก่อสร้างพระราชวังขนาดใหญ่เพื่อแสดงถึงความมั่นคงของราชธานี','การจัดส่งกองเรือสำเภาออกไปติดต่อค้าขายกับชาติต่างๆ ในทวีปยุโรป','การประกาศยกเลิกการจัดเก็บภาษีอากรทุกชนิดเพื่อบรรเทาความเดือดร้อน'],0,'หลังสงครามเกิดภาวะขาดแคลนอาหารรุนแรง จึงต้องแก้ปัญหาปากท้องก่อน'],
['h_kingdom',3,'ความสัมพันธ์ระหว่างกรุงธนบุรีกับจีนมีลักษณะอย่างไร',['ดำเนินการค้าและการทูตเพื่อฟื้นฟูเศรษฐกิจของบ้านเมือง','ทำสงครามขับเคี่ยวกันตลอดรัชกาลโดยไม่มีฝ่ายใดชนะ','ยอมอ่อนน้อมเข้าเป็นเมืองขึ้นของจีนอย่างเป็นทางการ','ไม่มีการติดต่อไปมาหาสู่กันเลยตลอดสมัยกรุงธนบุรี'],0,'การค้าสำเภากับจีนเป็นแหล่งรายได้สำคัญในการฟื้นฟูบ้านเมือง'],
['h_kingdom',3,'ข้อใดคือผลของสงครามระหว่างอยุธยากับพม่าที่มีต่อสังคมไทยในระยะยาว',['สูญเสียกำลังคนและทรัพยากร แต่ก็หล่อหลอมสำนึกร่วมในการปกป้องบ้านเมือง','ทำให้ราษฎรเลิกประกอบอาชีพเกษตรกรรมแล้วหันไปค้าขายแทน','ทำให้คนไทยเปลี่ยนไปนับถือศาสนาอื่นตามอย่างชาติที่เข้ามารุกราน','ทำให้ไทยยุติการติดต่อค้าขายกับต่างประเทศไปเป็นเวลานานหลายปี'],0,'สงครามทำลายทรัพยากรแต่ก็สร้างวีรกรรมและสำนึกร่วมที่ส่งต่อมาถึงยุคหลัง'],
['h_kingdom',4,'ข้อใดวิเคราะห์ปัจจัยความเจริญรุ่งเรืองของอยุธยาได้ครอบคลุมที่สุด',['เกิดจากทำเลที่ตั้งซึ่งเอื้อต่อการค้าทางทะเลเพียงปัจจัยเดียวโดยไม่เกี่ยวข้องกับปัจจัยด้านอื่นเลยแม้แต่น้อย','เกิดจากทำเลที่ตั้งที่เอื้อต่อการค้า ระบบการปกครองที่รวมศูนย์และปรับตัวได้ ระบบควบคุมกำลังคน และความอุดมสมบูรณ์ของทรัพยากร','เกิดจากการมีกองทัพขนาดใหญ่ที่สุดในโลกในเวลานั้นจนไม่มีชาติใดในภูมิภาคกล้ายกทัพเข้ามารุกราน','เกิดจากความช่วยเหลือทั้งด้านการเงินและกำลังทหารที่ได้รับจากชาติตะวันตกที่เข้ามาติดต่อค้าขาย'],1,'ความรุ่งเรืองมาจากปัจจัยหลายด้านประกอบกัน ทั้งภูมิศาสตร์ การปกครอง กำลังคน และทรัพยากร'],
['h_kingdom',4,'ข้อใดเปรียบเทียบการปกครองของอยุธยากับสุโขทัยได้ถูกต้อง',['อยุธยาปกครองแบบพ่อปกครองลูกอย่างใกล้ชิด ส่วนสุโขทัยปกครองตามคติเทวราชา','อยุธยารวมศูนย์อำนาจและรับคติเทวราชา ส่วนสุโขทัยใกล้ชิดราษฎรแบบพ่อปกครองลูก','ทั้งสองอาณาจักรใช้รูปแบบการปกครองที่เหมือนกันทุกประการไม่ต่างกันเลย','ทั้งสองอาณาจักรปกครองด้วยระบอบประชาธิปไตยที่ราษฎรเลือกผู้ปกครองเอง'],1,'สุโขทัยเน้นความใกล้ชิดกับราษฎร ส่วนอยุธยารับคติเทวราชาจากเขมรและรวมศูนย์อำนาจมากกว่า'],
['h_kingdom',4,'เหตุการณ์ใดแสดงว่าการรวมศูนย์อำนาจของอยุธยามีทั้งข้อดีและข้อเสีย',['เมื่อราชสำนักเข้มแข็งบ้านเมืองก็มั่นคง แต่เมื่อราชสำนักอ่อนแอและแตกแยก บ้านเมืองก็พังทลายอย่างรวดเร็ว','การรวมศูนย์อำนาจไว้ที่ราชสำนักส่งผลให้อยุธยาไม่เคยพ่ายแพ้สงครามเลยตลอดระยะเวลาสี่ร้อยปี','การรวมศูนย์อำนาจทำให้ราษฎรทุกกลุ่มในสังคมได้รับสิทธิและความเป็นธรรมอย่างเท่าเทียมกันทุกคน','การรวมศูนย์อำนาจเป็นเพียงรูปแบบที่ปรากฏในเอกสารทางราชการจึงไม่มีผลต่อความมั่นคงของบ้านเมือง'],0,'โครงสร้างที่ขึ้นกับศูนย์กลางมากทำให้เปราะบางเมื่อศูนย์กลางอ่อนแอ ดังที่ปรากฏก่อนเสียกรุงครั้งที่ 2'],

/* ---------- บุคคลสำคัญ · ส 4.3 (14 ข้อ) ---------- */
['h_person',3,'การประกาศอิสรภาพของสมเด็จพระนเรศวรมหาราชเมื่อ พ.ศ. 2127 ส่งผลสำคัญอย่างไร',['ทำให้อยุธยาพ้นจากฐานะประเทศราชของพม่าและกลับมาเป็นรัฐเอกราชอีกครั้ง','ทำให้อยุธยาได้ครอบครองดินแดนของพม่าทั้งหมดไว้เป็นเมืองขึ้น','ทำให้อยุธยายุติการติดต่อค้าขายกับต่างประเทศไปเป็นเวลานาน','ทำให้อยุธยาต้องย้ายราชธานีขึ้นไปตั้งที่เมืองพิษณุโลกแทน'],0,'หลังเสียกรุงครั้งที่ 1 อยุธยาตกเป็นประเทศราชของพม่า การประกาศอิสรภาพจึงคืนสถานะรัฐเอกราช'],
['h_person',1,'สงครามยุทธหัตถีระหว่างสมเด็จพระนเรศวรมหาราชกับพระมหาอุปราชาเกิดขึ้นที่ใด',['ตำบลหนองสาหร่าย จังหวัดสุพรรณบุรี','เมืองแครง ในเขตแดนของประเทศพม่า','ทุ่งลาดหญ้า จังหวัดกาญจนบุรี','ค่ายบางระจัน จังหวัดสิงห์บุรี'],0,'ยุทธหัตถีเกิดขึ้นที่หนองสาหร่าย เมืองสุพรรณบุรี'],
['h_person',2,'สมเด็จพระสุริโยทัยทรงเสียสละพระชนม์ชีพในรัชสมัยของพระมหากษัตริย์พระองค์ใด',['สมเด็จพระมหาจักรพรรดิ','สมเด็จพระนเรศวรมหาราช','สมเด็จพระเจ้าอู่ทอง','สมเด็จพระบรมไตรโลกนาถ'],0,'ทรงไสช้างเข้าขวางเพื่อปกป้องสมเด็จพระมหาจักรพรรดิเมื่อ พ.ศ. 2091'],
['h_person',2,'ราชทูตที่สมเด็จพระนารายณ์มหาราชทรงส่งไปเจริญสัมพันธไมตรีกับฝรั่งเศสคือผู้ใด',['ออกญาโกษาธิบดี (ปาน)','เจ้าพระยาพระคลัง (หน)','พระยาพิชัยดาบหัก','ขุนวรวงศาธิราช'],0,'โกษาปานเป็นหัวหน้าคณะราชทูตไปยังราชสำนักพระเจ้าหลุยส์ที่ 14'],
['h_person',3,'การที่คอนสแตนติน ฟอลคอน มีอำนาจมากในราชสำนักสมัยพระนารายณ์ส่งผลอย่างไร',['ทำให้ขุนนางไทยไม่พอใจ และนำไปสู่การเปลี่ยนแปลงอำนาจเมื่อสิ้นรัชกาล','ทำให้อยุธยาต้องยอมตกอยู่ในฐานะเมืองขึ้นของประเทศกรีกในเวลาต่อมา','ทำให้อยุธยายกเลิกการค้าสำเภากับจีนที่ดำเนินมายาวนานลงทั้งหมด','ทำให้ราษฎรอยุธยาทั้งประเทศเปลี่ยนไปนับถือศาสนาคริสต์ตามราชสำนัก'],0,'ความไม่พอใจต่ออิทธิพลของฟอลคอนและฝรั่งเศสเป็นปัจจัยหนึ่งของการผลัดแผ่นดินสู่ราชวงศ์บ้านพลูหลวง'],
['h_person',2,'สมเด็จพระเพทราชาทรงมีความสำคัญอย่างไรในประวัติศาสตร์อยุธยา',['ทรงตั้งราชวงศ์บ้านพลูหลวงและลดบทบาทของชาวตะวันตกในราชสำนัก','ทรงประกาศอิสรภาพจากพม่าที่เมืองแครงและกอบกู้เอกราชคืนมา','ทรงสถาปนากรุงศรีอยุธยาขึ้นเป็นราชธานีแห่งใหม่ของคนไทย','ทรงส่งคณะราชทูตเดินทางไปเจริญสัมพันธไมตรีกับฝรั่งเศส'],0,'หลังสิ้นรัชกาลพระนารายณ์ พระเพทราชาตั้งราชวงศ์ใหม่และลดอิทธิพลของฝรั่งเศส'],
['h_person',3,'การผลัดเปลี่ยนแผ่นดินระหว่างสมเด็จพระเจ้าอุทุมพรกับสมเด็จพระเจ้าเอกทัศสะท้อนปัญหาใดของอยุธยาตอนปลาย',['ความไม่มั่นคงในการสืบราชสมบัติและการแย่งชิงอำนาจภายในราชวงศ์','ปัญหาการขาดแคลนอาหารและภาวะข้าวยากหมากแพงในราชธานี','ปัญหาการค้ากับต่างประเทศที่ตกต่ำลงจนรายได้ของรัฐลดน้อยลง','ปัญหาโรคระบาดที่แพร่กระจายในราชสำนักจนต้องผลัดแผ่นดิน'],0,'การชิงราชสมบัติทำให้ราชสำนักอ่อนแอลงในช่วงที่พม่ากำลังเตรียมยกทัพมา'],
['h_person',3,'วีรกรรมชาวบ้านบางระจันสะท้อนเรื่องใดของสังคมอยุธยาตอนปลาย',['ราษฎรสามัญรวมตัวกันต่อสู้เองได้ แม้ราชสำนักส่วนกลางจะอ่อนแอและช่วยเหลือไม่ทัน','ราชสำนักอยุธยามีกองทัพที่เข้มแข็งที่สุดในภูมิภาคจนข้าศึกไม่กล้ารุกราน','ราษฎรสามัญไม่ให้ความสนใจในการปกป้องบ้านเมืองของตนเองแต่อย่างใด','กองทัพพม่าในเวลานั้นมีกำลังพลไม่เพียงพอที่จะยกมารุกรานอยุธยาได้'],0,'เหตุการณ์นี้แสดงทั้งความเข้มแข็งของชุมชนท้องถิ่นและความอ่อนแอของการป้องกันจากส่วนกลาง'],
['h_person',3,'เหตุใดสมเด็จพระเจ้าตากสินมหาราชจึงทรงนำกำลังตีฝ่าวงล้อมออกไปทางหัวเมืองชายทะเลตะวันออกก่อนเสียกรุง',['เพื่อรวบรวมกำลังคน เสบียง และอาวุธจากหัวเมืองที่ยังไม่ถูกทำลาย แล้วกลับมากู้เอกราช','เพื่อเดินทางออกไปตั้งถิ่นฐานใหม่ในต่างประเทศอย่างถาวรพร้อมไพร่พล','เพื่อไปขอความช่วยเหลือด้านกำลังทหารจากฝ่ายพม่าที่ยกทัพเข้ามา','เพื่อเดินทางไปแสวงบุญตามหัวเมืองต่างๆ ตามความเชื่อในเวลานั้น'],0,'หัวเมืองชายทะเลตะวันออกเช่นระยองและจันทบุรียังสมบูรณ์ จึงเป็นฐานสะสมกำลังก่อนยกกลับมาตีค่ายโพธิ์สามต้น'],
['h_person',3,'พระยาพิชัยดาบหักมีความสำคัญอย่างไร',['เป็นทหารเอกคู่พระทัยของสมเด็จพระเจ้าตากสินมหาราช','เป็นราชทูตที่เดินทางไปเจริญสัมพันธไมตรีกับฝรั่งเศส','เป็นผู้แต่งวรรณคดีเรื่องลิลิตยวนพ่ายในสมัยอยุธยา','เป็นปฐมกษัตริย์ผู้สถาปนาราชวงศ์บ้านพลูหลวงขึ้น'],0,'ท่านเป็นทหารเอกที่ร่วมรบเคียงข้างพระเจ้าตากสินมาตั้งแต่ต้น'],
['h_person',3,'ผลงานของสมเด็จพระบรมไตรโลกนาถข้อใดส่งอิทธิพลต่อการปกครองไทยยาวนานที่สุด',['การวางระบบบริหารราชการและระบบศักดินาที่ใช้สืบต่อมาถึงสมัยรัตนโกสินทร์','การกอบกู้เอกราชของอยุธยาคืนมาจากพม่าหลังจากที่ตกเป็นประเทศราชอยู่นาน','การเปิดความสัมพันธ์ทางการค้ากับชาติตะวันตกเป็นชาติแรกในภูมิภาคนี้','การย้ายราชธานีจากกรุงศรีอยุธยาไปตั้งที่กรุงธนบุรีในช่วงปลายรัชกาล'],0,'โครงสร้างการปกครองและศักดินาที่ทรงวางไว้ถูกใช้ต่อมาอีกหลายร้อยปี'],
['h_person',3,'ข้อใดคือบทบาทของสมเด็จพระเอกาทศรถ',['ทรงเป็นพระอนุชาที่ร่วมกอบกู้และรักษาเอกราชเคียงข้างสมเด็จพระนเรศวรมหาราช','ทรงเป็นผู้สถาปนากรุงศรีอยุธยาขึ้นเป็นราชธานีเมื่อ พ.ศ. 1893','ทรงเป็นผู้ส่งคณะราชทูตไปเจริญสัมพันธไมตรีกับพระเจ้าหลุยส์ที่ 14','ทรงเป็นปฐมกษัตริย์ผู้สถาปนาราชวงศ์ปราสาททองขึ้นปกครองอยุธยา'],0,'ทรงร่วมออกศึกกับสมเด็จพระนเรศวรมาโดยตลอดและครองราชย์ต่อจากพระเชษฐา'],
['h_person',3,'สมเด็จพระนารายณ์มหาราชทรงใช้เมืองใดเป็นราชธานีแห่งที่สอง',['ลพบุรี','สุพรรณบุรี','พิษณุโลก','นครศรีธรรมราช'],0,'ทรงโปรดประทับที่เมืองลพบุรีและสร้างพระนารายณ์ราชนิเวศน์ไว้'],
['h_person',4,'ข้อใดคือสิ่งที่ควรเรียนรู้จากบุคคลสำคัญสมัยอยุธยาและธนบุรีมากที่สุด',['ยศถาบรรดาศักดิ์และความมั่งคั่งที่แต่ละท่านได้รับตอบแทนจากราชสำนัก','ความเสียสละเพื่อส่วนรวม ความกล้าตัดสินใจในภาวะวิกฤต และการมองการณ์ไกล','จำนวนศึกสงครามที่แต่ละท่านได้รับชัยชนะตลอดช่วงชีวิตของตน','จำนวนวัดวาอารามที่แต่ละท่านสร้างขึ้นไว้เป็นอนุสรณ์แก่คนรุ่นหลัง'],1,'คุณค่าที่ยั่งยืนคือแบบอย่างของการเสียสละและการตัดสินใจอย่างมีวิสัยทัศน์'],

['h_method',2,'ข้อใดคือ "ชนวนเหตุ" ของสงครามโลกครั้งที่ 1',['การลอบปลงพระชนม์อาร์ชดยุกฟรันซ์ แฟร์ดีนันท์ที่เมืองซาราเยโว','การแข่งขันสะสมกำลังอาวุธระหว่างชาติมหาอำนาจในทวีปยุโรป','การเติบโตของลัทธิชาตินิยมที่รุนแรงขึ้นในหลายประเทศของยุโรป','การก่อตั้งระบบพันธมิตรทางทหารที่แบ่งยุโรปออกเป็นสองฝ่าย'],0,'อีกสามข้อเป็นสาเหตุระยะยาว ส่วนการลอบปลงพระชนม์เป็นชนวนที่จุดสงคราม'],
['h_method',3,'เหตุใดการศึกษาเหตุการณ์เดียวกันจากหลักฐานของทั้งสองฝ่ายจึงสำคัญ',['เพราะแต่ละฝ่ายเล่าเรื่องจากผลประโยชน์และมุมมองของตน การฟังทั้งสองด้านจึงใกล้ความจริงมากกว่า','เพราะการอ้างอิงหลักฐานจากหลายแหล่งทำให้รายงานมีความยาวและน่าเชื่อถือมากขึ้น','เพราะกฎหมายว่าด้วยการศึกษาวิจัยกำหนดให้ต้องอ้างอิงจากทั้งสองฝ่ายเสมอ','เพราะหลักฐานที่มาจากฝ่ายเดียวมักเขียนด้วยภาษาโบราณที่อ่านเข้าใจได้ยาก'],0,'การฟังเพียงฝ่ายเดียวทำให้ได้ภาพที่ลำเอียง'],
['h_method',3,'ข้อใดคือความหมายของ "บริบททางประวัติศาสตร์"',['สภาพสังคม เศรษฐกิจ การเมือง และความคิดของยุคสมัยที่เหตุการณ์นั้นเกิดขึ้น','ลำดับเวลาก่อนหลังของเหตุการณ์ต่างๆ ที่เกิดขึ้นในช่วงเวลานั้น','ประวัติและภูมิหลังของผู้เขียนหลักฐานที่นำมาใช้ในการศึกษา','สถานที่ที่ใช้เก็บรักษาหลักฐานทางประวัติศาสตร์ชิ้นนั้นไว้'],0,'การเข้าใจบริบทช่วยไม่ให้ตัดสินอดีตด้วยค่านิยมของปัจจุบันเพียงอย่างเดียว'],
['h_method',3,'การตัดสินการกระทำของคนในอดีตด้วยค่านิยมปัจจุบันเพียงอย่างเดียวมีข้อเสียอย่างไร',['ทำให้ไม่เข้าใจเงื่อนไขและข้อจำกัดที่คนยุคนั้นเผชิญ','ทำให้ได้ข้อสรุปที่ถูกต้องแม่นยำกว่าการใช้ค่านิยมของยุคนั้น','ทำให้ประหยัดเวลาในการศึกษาเพราะไม่ต้องค้นหาข้อมูลเพิ่ม','ทำให้หลักฐานที่นำมาใช้มีความน่าเชื่อถือมากขึ้นกว่าเดิม'],0,'คนในอดีตตัดสินใจภายใต้ความรู้และเงื่อนไขที่ต่างจากปัจจุบัน'],
['h_method',3,'ข้อใดเป็นการใช้หลักฐานอย่างลำเอียง',['เลือกอ้างเฉพาะข้อความที่สนับสนุนข้อสรุปของตน และละเว้นข้อความที่ขัดแย้ง','ระบุแหล่งที่มาของหลักฐานทุกชิ้นที่นำมาใช้อย่างครบถ้วนและตรวจสอบได้','นำหลักฐานหลายชิ้นจากหลายแหล่งมาเปรียบเทียบกันก่อนสรุปข้อค้นพบ','ระบุข้อจำกัดของข้อสรุปที่ได้ไว้อย่างชัดเจนเพื่อให้ผู้อ่านพิจารณา'],0,'การเลือกอ้างเฉพาะที่เข้าข้างตนเองทำให้ข้อสรุปบิดเบือน'],
['h_method',3,'ข้อมูลจากสื่อสังคมออนไลน์ควรใช้ในการศึกษาประวัติศาสตร์อย่างไร',['ตรวจสอบแหล่งที่มาและเทียบกับหลักฐานที่น่าเชื่อถืออื่นก่อนนำมาใช้','นำมาใช้ได้ทันทีเพราะเป็นข้อมูลที่เผยแพร่ในวงกว้างจนคนจำนวนมากรับรู้','ห้ามนำมาใช้อ้างอิงโดยเด็ดขาดทุกกรณีเพราะไม่ใช่หลักฐานทางวิชาการ','เลือกใช้เฉพาะโพสต์ที่มีผู้กดถูกใจและแบ่งปันต่อเป็นจำนวนมากที่สุด'],0,'สื่อออนไลน์ตรวจสอบที่มายาก จึงต้องเทียบกับหลักฐานที่เชื่อถือได้เสมอ'],
['h_method',3,'ภาพถ่ายเหตุการณ์ทางประวัติศาสตร์มีข้อจำกัดอย่างไร',['แสดงเพียงเสี้ยวเวลาและมุมที่ผู้ถ่ายเลือก อาจถูกจัดฉากหรือตัดต่อได้','ไม่สามารถนำมาใช้เป็นหลักฐานทางประวัติศาสตร์ได้เลยไม่ว่ากรณีใด','ไม่มีข้อจำกัดใดเพราะเป็นการบันทึกภาพเหตุการณ์ที่เกิดขึ้นจริง','ใช้อ้างอิงได้เฉพาะเหตุการณ์ที่เกิดขึ้นหลัง พ.ศ. 2500 เป็นต้นมา'],0,'ภาพถ่ายเป็นหลักฐานที่ดี แต่ผู้ถ่ายเลือกกรอบภาพและช่วงเวลาเสมอ'],
['h_method',3,'ข้อใดเป็นการตั้งประเด็นศึกษาที่เหมาะสมกับการทำโครงงานประวัติศาสตร์ท้องถิ่น',['ตลาดเก่าในอำเภอของเรามีความเป็นมาอย่างไร และเปลี่ยนแปลงไปเพราะเหตุใด','ประวัติศาสตร์ของโลกตั้งแต่ยุคโบราณจนถึงปัจจุบันมีพัฒนาการอย่างไร','บุคคลใดในประวัติศาสตร์ไทยที่มีความสามารถโดดเด่นเหนือผู้อื่นทั้งหมด','ประเทศไทยในอีกห้าสิบปีข้างหน้าจะมีสภาพเป็นอย่างไรเมื่อเทียบกับวันนี้'],0,'ประเด็นควรเฉพาะเจาะจง ตรวจสอบได้จากหลักฐานในพื้นที่ และตอบได้ในเวลาที่มี'],
['h_method',3,'ในการทำโครงงานประวัติศาสตร์ท้องถิ่น ข้อใดเป็นแหล่งข้อมูลชั้นต้น',['การสัมภาษณ์ผู้ที่อยู่ร่วมในเหตุการณ์และเอกสารราชการของช่วงเวลานั้น','บทความสรุปเรื่องราวของท้องถิ่นที่เผยแพร่อยู่ในเว็บไซต์ต่างๆ','หนังสือเรียนประวัติศาสตร์ที่เรียบเรียงขึ้นสำหรับนักเรียนในปัจจุบัน','สารคดีเกี่ยวกับท้องถิ่นที่ผลิตขึ้นใหม่โดยผู้ที่ไม่ได้อยู่ในเหตุการณ์'],0,'คำบอกเล่าของผู้ร่วมเหตุการณ์และเอกสารร่วมสมัยเป็นหลักฐานชั้นต้น'],
['h_method',4,'ข้อใดคือขั้นตอนที่มักถูกละเลยมากที่สุดและทำให้งานประวัติศาสตร์ผิดพลาด',['การประเมินคุณค่าและความน่าเชื่อถือของหลักฐานก่อนนำมาใช้','การกำหนดหัวข้อและขอบเขตของเรื่องที่จะศึกษาให้ชัดเจน','การจัดพิมพ์รายงานให้มีรูปแบบถูกต้องตามที่กำหนดไว้','การจัดทำปกและสารบัญของรายงานให้เรียบร้อยสวยงาม'],0,'หลายคนรวบรวมข้อมูลแล้วใช้ทันทีโดยไม่ตรวจสอบ ทำให้ข้อสรุปคลาดเคลื่อน'],
['h_method',4,'ข้อใดสะท้อนการวิเคราะห์เหตุการณ์อย่างมีเหตุผลมากที่สุด',['สรุปว่าเหตุการณ์ทั้งหมดเกิดขึ้นจากการตัดสินใจของบุคคลผู้มีอำนาจเพียงคนเดียวในเวลานั้น','อธิบายเหตุการณ์ด้วยปัจจัยหลายด้านทั้งเศรษฐกิจ สังคม การเมือง พร้อมระบุน้ำหนักของแต่ละปัจจัย','ยึดตามคำอธิบายที่ได้ยินบ่อยที่สุดเพราะเป็นที่ยอมรับกันโดยทั่วไปในสังคมมานาน','หลีกเลี่ยงการอธิบายสาเหตุทั้งหมดแล้วเล่าเฉพาะลำดับเหตุการณ์ที่เกิดขึ้นตามเวลา'],1,'เหตุการณ์ใหญ่มักมีหลายปัจจัยประกอบกัน การชี้สาเหตุเดียวมักเป็นการลดทอน'],
['h_method',4,'เหตุใดข้อสรุปทางประวัติศาสตร์จึงควรระบุข้อจำกัดของตนเองไว้ด้วย',['เพราะหลักฐานที่มีอยู่ไม่เคยครบถ้วน การระบุข้อจำกัดทำให้ผู้อ่านประเมินความน่าเชื่อถือได้','เพราะการเขียนข้อจำกัดเพิ่มเข้าไปช่วยให้รายงานมีความยาวและดูมีน้ำหนักขึ้น','เพราะเป็นธรรมเนียมปฏิบัติที่สืบทอดกันมาโดยไม่มีเหตุผลรองรับที่ชัดเจน','เพราะผู้สอนกำหนดให้ต้องเขียนไว้ทุกครั้งจึงจะได้คะแนนในส่วนนี้'],0,'ความซื่อตรงทางวิชาการคือการบอกว่าเรารู้เท่าที่หลักฐานให้รู้'],
