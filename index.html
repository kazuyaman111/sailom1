function questionsBy(subj, grade){
  let all = allQuestions();
  if (grade) all = all.filter(q => q.grade === grade);
  return subj === 'mix' ? all : all.filter(q => q.subj === subj);
}
/* วิชาที่มีคำถามพร้อมใช้ในระดับชั้นนั้น */
function subjectsReady(grade){
  return SUBJ_KEYS.filter(k => questionsBy(k, grade).length > 0);
}
function gradesReady(){
  return GRADE_KEYS.filter(g => questionsBy('mix', g).length > 0);
}
function qstate(id){
  S.qstate = S.qstate || {};
  if (!S.qstate[id]) S.qstate[id] = {box:1, seen:0, right:0, wrong:0, at:-999, lastDay:''};
  return S.qstate[id];
}

/* เลือกคำถามถัดไป: ข้อที่ถึงกำหนดทวนก่อน กล่องต่ำมาก่อน */
function pickQuestion(subj, grade, exclude){
  const pool = questionsBy(subj, grade).filter(q => !exclude.includes(q.id));
  if (!pool.length) return null;
  const now = S.qcount || 0;
  const scored = pool.map(q => {
    const st = qstate(q.id);
    const gap = LEITNER_GAP[Math.min(5, st.box)] || 0;
    const overdue = (now - st.at) - gap;        // > 0 คือถึงกำหนดแล้ว
    const fresh = st.seen === 0 ? 40 : 0;       // ข้อที่ยังไม่เคยเจอมาก่อน
    const weight = fresh + Math.max(0, overdue) * 2 + (6 - st.box) * 6 + Math.random() * 18;
    return {q, weight, ready: st.seen === 0 || overdue >= 0};
  });
  const ready = scored.filter(x => x.ready);
  const use = ready.length ? ready : scored;
  use.sort((a, b) => b.weight - a.weight);
  return use[0].q;
}

/* ===================== ให้คะแนนคำตอบ ===================== */
function scoreAnswer(q, correct, msLeft, msTotal, streak){
  const base = DIFF[q.diff].pt;
  if (!correct) return {pts:0, speed:0, mult:0, base};
  const speed = msTotal > 0 ? clamp(msLeft / msTotal, 0, 1) * SPEED_BONUS_MAX : 0;
  const mult = 1 + Math.min(STREAK_CAP, streak) * (1 / STREAK_CAP);   // 1.0 → 2.0
  const st = qstate(q.id);
  const repeat = (st.lastDay === todayKey() && st.seen > 0) ? REPEAT_PENALTY : 1;
  return {
    pts: Math.max(1, Math.round(base * (1 + speed) * mult * repeat)),
    speed, mult, base, repeat
  };
}

/* บันทึกผลสัมฤทธิ์แยกตามวิชา ระดับชั้น และหน่วยการเรียนรู้ */
function progKey(q){ return `${q.subj}|${q.grade}|${q.unit}`; }
function progOf(key){
  S.prog = S.prog || {};
  if (!S.prog[key]) S.prog[key] = {r:0, w:0, recent:[]};
  return S.prog[key];
}
function recordProgress(q, correct){
  const p = progOf(progKey(q));
  if (correct) p.r++; else p.w++;
  p.recent.push(correct ? 1 : 0);
  if (p.recent.length > 40) p.recent.shift();
}
/* แนวโน้ม: เทียบครึ่งหลังกับครึ่งแรกของผลล่าสุด */
function trendOf(p){
  const n = p.recent.length;
  if (n < 10) return null;
  const half = Math.floor(n/2);
  const a = p.recent.slice(0, half), b = p.recent.slice(half);
  const av = a.reduce((x,y)=>x+y,0)/a.length, bv = b.reduce((x,y)=>x+y,0)/b.length;
  return { diff: bv - av, before: av, after: bv };
}

/* บันทึกผลลงกล่องทวนซ้ำ */
function recordAnswer(q, correct){
  const st = qstate(q.id);
  st.seen++;
  st.at = S.qcount || 0;
  st.lastDay = todayKey();
  if (correct){ st.right++; st.box = Math.min(5, st.box + 1); }
  else { st.wrong++; st.box = 1; }
  S.qcount = (S.qcount || 0) + 1;
  recordProgress(q, correct);
}

/* ---- สุ่มผังธาตุประจำไข่แต่ละใบ ----
   หน่วยการเรียนรู้เดิมจะให้ธาตุไม่เหมือนกันในไข่คนละใบ
   ทำให้ฟาร์มหน่วยเดิมซ้ำๆ ไม่ได้สายพันธุ์เดิมเสมอไป */
function rollEggMap(){
  const units = Object.keys(UNITS);
  const pool = [];
  while (pool.length < units.length){
    pool.push(...EL_KEYS.slice().sort(() => Math.random() - .5));
  }
  const order = units.slice().sort(() => Math.random() - .5);
  const map = {};
  order.forEach((u, i) => { map[u] = pool[i]; });
  return map;
}
function eggMap(){
  if (!S.egg) return null;
  if (!S.egg.map) S.egg.map = rollEggMap();
  return S.egg.map;
}
function unitEl(u){
  const m = eggMap();
  return (m && m[u]) || (UNITS[u] ? UNITS[u].el : 'wood');
}

function startEgg(tier){
  const key = {1:'seed_r', 2:'seed_g', 3:'seed_m'}[tier];
  S.egg = { tier, pts:0, need: ITEMS[key].need, el:{}, unit:{}, map: rollEggMap() };
}
/* ไข่รับคะแนนพร้อมหน่วยการเรียนรู้ ธาตุของหน่วยเป็นตัวกำหนดสายพันธุ์ */
function eggAddPoints(pts, unitCounts){
  if (!S.egg) return false;
  pts = Math.round(pts * (1 + roomBonus().eggBoost));
  S.egg.pts += pts;
  S.egg.el = S.egg.el || {}; S.egg.unit = S.egg.unit || {};
  const m = eggMap();
  for (const u in unitCounts){
    if (!UNITS[u]) continue;
    const el = m[u] || UNITS[u].el;
    S.egg.unit[u] = (S.egg.unit[u] || 0) + unitCounts[u];
    S.egg.el[el] = (S.egg.el[el] || 0) + unitCounts[u];
  }
  return S.egg.pts >= S.egg.need;
}
/* สัดส่วนธาตุที่สะสมในไข่ */
function eggElShare(){
  const e = S.egg; if (!e || !e.el) return {};
  let tot = 0;
  for (const k in e.el) tot += e.el[k];
  const out = {};
  if (tot <= 0) return out;
  for (const k in e.el) out[k] = e.el[k] / tot;
  return out;
}
/* หน่วยการเรียนรู้ที่สะสมมากที่สุดในไข่ */
function eggTopUnit(){
  const e = S.egg; if (!e || !e.unit) return null;
  let best = null, bv = -1;
  for (const k in e.unit) if (e.unit[k] > bv){ bv = e.unit[k]; best = k; }
  return best;
}
/* น้ำหนักของแต่ละสายพันธุ์ตอนฟัก
   ขั้นที่ 1 สุ่มความหายากจากชั้นของไข่  ขั้นที่ 2 สุ่มสายพันธุ์ในระดับนั้น
   โดยถ่วงน้ำหนักด้วยสัดส่วนวิชาที่ตอบระหว่างฟัก */
const AFFINITY_K = 10;
const CHAOS_CHANCE = 0.15;   // โอกาสที่ไข่จะสุ่มธาตุเองโดยไม่สนหน่วยที่ตอบ

function hatchWeights(ignoreAffinity){
  const e = S.egg;
  const odds = SEED_ODDS[e ? e.tier : 1] || SEED_ODDS[1];
  const share = ignoreAffinity ? {} : eggElShare();
  const w = {}; for (const k of SP_KEYS) w[k] = 0;
  let tot = 0; for (const r in odds) tot += odds[r];
  for (const r in odds){
    const p = odds[r] / tot;
    if (p <= 0) continue;
    const pool = SP_BY_RARITY(+r);
    if (!pool.length) continue;
    const ws = {}; let sum = 0;
    for (const k of pool){
      const a = 1 + AFFINITY_K * (share[SPECIES[k].elk] || 0);
      ws[k] = a; sum += a;
    }
    for (const k of pool) w[k] += p * ws[k] / sum;
  }
  return w;   // รวมกันได้ 1
}
/* โอกาสเป็นเปอร์เซ็นต์ รวมตามธาตุ */
function hatchOddsByEl(ignoreAffinity){
  const w = hatchWeights(ignoreAffinity);
  const out = {};
  for (const k in w){
    const e = SPECIES[k].elk;
    out[e] = (out[e] || 0) + w[k];
  }
  return out;
}
function hatchRoll(ignoreAffinity){
  const w = hatchWeights(ignoreAffinity);
  let tot = 0; for (const k in w) tot += w[k];
  let r = Math.random() * tot;
  for (const k in w){ r -= w[k]; if (r <= 0) return k; }
  return SP_KEYS[0];
}


/* ===================== อาวุธและเครื่องแต่งกาย ===================== */
function equippedWeapon(){ return (S.equip && S.equip.w) ? WEAPONS[S.equip.w] : null; }
function equippedArmor(){ return (S.equip && S.equip.a) ? ARMORS[S.equip.a] : null; }

function buyGear(kind, key){
  const table = kind === 'w' ? WEAPONS : ARMORS;
  const it = table[key];
  if (!it) return {err:'ไม่พบไอเทมนี้'};
  S.owned = S.owned || { w:[], a:[] };
  if (S.owned[kind].includes(key)) return {err:'มีชิ้นนี้อยู่แล้ว'};
  if (S.coins < it.cost) return {err:'เหรียญไม่พอ'};
  S.coins -= it.cost;
  S.owned[kind].push(key);
  return {ok:true};
}
function equipGear(kind, key){
  S.owned = S.owned || { w:[], a:[] };
  S.equip = S.equip || { w:null, a:null };
  if (key && !S.owned[kind].includes(key)) return false;
  S.equip[kind] = key || null;
  return true;
}

/* โบนัสจากอาวุธ/เกราะที่ใส่อยู่ ผสมกับค่าสถานะพื้นฐานของวิญญาณ */
function gearAtkBonus(){ const w = equippedWeapon(); return w ? w.atkPct : 0; }
function gearDefBonus(){ const a = equippedArmor(); return a ? a.defPct : 0; }
function gearHpBonus(){ const a = equippedArmor(); return a ? a.hp : 0; }
function gearGuardBonus(){ const a = equippedArmor(); return a ? a.guard : 0; }
function gearStatBonus(key){
  let v = 0;
  const w = equippedWeapon();
  if (w && w.statKey === key) v += w.statUp;
  const a = equippedArmor();
  if (a && key === 'VIT') v += (a.statUp || 0);
  return v;
}
function gearDodgeBonus(){ const w = equippedWeapon(); return w && w.dodgePct ? w.dodgePct : 0; }
function gearCritBonus(){ const w = equippedWeapon(); return w && w.critPct ? w.critPct : 0; }

/* ===================== แคนวาส: กระถาง + รอยราน + วิญญาณ ===================== */
const CW = 420, CH = 340;
let canvas, ctx, rafId = null, t0 = performance.now();
let crackle = null, crackleSeed = 0;

function initCanvas(el){
  canvas = el; ctx = el.getContext && el.getContext('2d');
  if (!ctx) return;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = CW * dpr; canvas.height = CH * dpr;
  canvas.style.aspectRatio = `${CW}/${CH}`;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (!crackle) buildCrackle(hashStr(S.uid || 'pot'));
  if (rafId) cancelAnimationFrame(rafId);
  loop();
}

/* ---- สร้างเส้นรอยรานแบบสุ่มคงที่ ---- */
function buildCrackle(seed){
  crackleSeed = seed;
  const r = rngFrom(seed || 12345);
  const lines = [];
  for (let i=0;i<26;i++){
    const x = 90 + r()*240, y = 200 + r()*100;
    const pts = [[x,y]];
    let ang = r()*Math.PI*2;
    const n = 3 + Math.floor(r()*4);
    for (let j=0;j<n;j++){
      ang += (r()-.5)*1.5;
      const len = 8 + r()*22;
      const p = pts[pts.length-1];
      pts.push([p[0] + Math.cos(ang)*len, p[1] + Math.sin(ang)*len*.6]);
    }
    lines.push(pts);
  }
  crackle = lines;
}

/* ---- สถานะที่ใช้วาด ---- */
const View = { progress:0, focusing:false, drift:false, mood:70, bounce:0, duel:null };

function loop(){
  const t = (performance.now() - t0) / 1000;
  draw(t);
  rafId = requestAnimationFrame(loop);
}

function draw(t){
  if (!ctx || !S) return;
  if (!S.pet && !S.egg) return;
  ctx.clearRect(0,0,CW,CH);
  const p = S.pet, sp = p ? SPECIES[p.sp] : null;
  const night = isNight();
  const lit = roomBonus().light > 0;

  /* พื้นหลังวงกลมนุ่ม */
  const g = ctx.createRadialGradient(CW/2, 150, 20, CW/2, 160, 200);
  const warm = (!night || lit);
  g.addColorStop(0, warm ? 'rgba(124,174,155,.20)' : 'rgba(90,130,170,.16)');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0,0,CW,CH);

  /* วงแหวนโฟกัส */
  drawRing(t);

  /* วิญญาณ หรือไข่ */
  if (View.duel && p){
    drawSpirit(t, p, sp, {cx: CW*0.28, scale: 0.82});
    drawSpirit(t, View.duel.foe, View.duel.foeSp, {cx: CW*0.72, scale: 0.82, flip: true});
  } else {
    if (p) drawSpirit(t, p, sp);
    if (S.egg) drawEgg(t, !p);
  }

  /* กระถาง */
  drawPot(t);
}

/* ---- วงแหวนรอบกระถาง แสดงความคืบหน้าโฟกัส ---- */
function drawRing(t){
  const cx = CW/2, cy = 172, R = 128;
  ctx.save();
  ctx.lineWidth = 2;
  ctx.strokeStyle = 'rgba(190,222,210,.10)';
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI*2); ctx.stroke();
  if (View.focusing || View.progress > 0){
    ctx.lineWidth = 3.5;
    ctx.lineCap = 'round';
    ctx.strokeStyle = View.drift ? '#d8b04a' : '#a8d3c2';
    ctx.shadowColor = View.drift ? 'rgba(216,176,74,.6)' : 'rgba(168,211,194,.55)';
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.arc(cx, cy, R, -Math.PI/2, -Math.PI/2 + Math.PI*2*clamp(View.progress,0,1));
    ctx.stroke();
    ctx.shadowBlur = 0;
    // จุดหัวเส้น
    const a = -Math.PI/2 + Math.PI*2*clamp(View.progress,0,1);
    ctx.fillStyle = View.drift ? '#e8cf8a' : '#dff0e7';
    ctx.beginPath(); ctx.arc(cx + Math.cos(a)*R, cy + Math.sin(a)*R, 4.5, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

/* ---- กระถางสังคโลก ---- */
function drawPot(t){
  const cx = CW/2;
  const topY = 214, botY = 316, topR = 84, botR = 58;

  ctx.save();
  // เงา
  ctx.fillStyle = 'rgba(0,0,0,.28)';
  ctx.beginPath(); ctx.ellipse(cx, botY+6, botR+14, 10, 0, 0, Math.PI*2); ctx.fill();

  // ตัวกระถาง
  const body = new Path2D();
  body.moveTo(cx-topR, topY);
  body.bezierCurveTo(cx-topR-6, topY+42, cx-botR-8, botY-34, cx-botR, botY);
  body.lineTo(cx+botR, botY);
  body.bezierCurveTo(cx+botR+8, botY-34, cx+topR+6, topY+42, cx+topR, topY);
  body.closePath();

  const pg = ctx.createLinearGradient(cx-topR, topY, cx+topR, botY);
  pg.addColorStop(0, '#8fbba9');
  pg.addColorStop(.45, '#6d9d8b');
  pg.addColorStop(1, '#3f6455');
  ctx.fillStyle = pg; ctx.fill(body);

  // เคลือบสะท้อนแสง
  ctx.save(); ctx.clip(body);
  const sh = ctx.createLinearGradient(cx-70, topY, cx-10, botY);
  sh.addColorStop(0, 'rgba(255,255,255,.22)');
  sh.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = sh; ctx.fillRect(cx-topR, topY, topR, botY-topY);

  // รอยรานตามความคืบหน้า
  const prog = clamp(View.progress, 0, 1);
  const show = Math.floor(crackle.length * prog);
  ctx.lineWidth = 1;
  for (let i=0;i<crackle.length;i++){
    const full = i < show;
    const partial = (i === show) ? (crackle.length*prog - show) : 0;
    if (!full && partial <= 0) continue;
    const pts = crackle[i];
    const lim = full ? pts.length : Math.max(2, Math.ceil(pts.length * partial));
    ctx.strokeStyle = View.drift ? 'rgba(216,176,74,.5)' : 'rgba(233,247,240,.42)';
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let j=1;j<lim;j++) ctx.lineTo(pts[j][0], pts[j][1]);
    ctx.stroke();
  }
  ctx.restore();

  // ขอบปากกระถาง
  ctx.strokeStyle = 'rgba(220,240,232,.35)'; ctx.lineWidth = 1.5; ctx.stroke(body);
  ctx.fillStyle = '#a9cfbe';
  ctx.beginPath(); ctx.ellipse(cx, topY, topR, 15, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#2c4a3f';
  ctx.beginPath(); ctx.ellipse(cx, topY+3, topR-9, 11, 0, 0, Math.PI*2); ctx.fill();
  // ดิน
  ctx.fillStyle = '#3a3026';
  ctx.beginPath(); ctx.ellipse(cx, topY+4, topR-13, 9, 0, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

/* ---- ตัววิญญาณ ---- */
function bodyPath(shape, R){
  const P = new Path2D();
  if (shape === 'tall'){
    P.moveTo(0, -R*1.16);
    P.bezierCurveTo(R*0.80, -R*1.05, R*0.86, R*0.62, 0, R*0.98);
    P.bezierCurveTo(-R*0.86, R*0.62, -R*0.80, -R*1.05, 0, -R*1.16);
  } else if (shape === 'tear'){
    P.moveTo(0, -R*1.24);
    P.bezierCurveTo(R*0.62, -R*0.72, R*1.02, R*0.42, 0, R*0.96);
    P.bezierCurveTo(-R*1.02, R*0.42, -R*0.62, -R*0.72, 0, -R*1.24);
  } else if (shape === 'chunky'){
    P.moveTo(0, -R*0.88);
    P.bezierCurveTo(R*1.18, -R*0.86, R*1.24, R*0.58, 0, R*0.88);
    P.bezierCurveTo(-R*1.24, R*0.58, -R*1.18, -R*0.86, 0, -R*0.88);
  } else {
    P.moveTo(0, -R);
    P.bezierCurveTo(R*0.95, -R*0.95, R*1.05, R*0.6, 0, R*0.92);
    P.bezierCurveTo(-R*1.05, R*0.6, -R*0.95, -R*0.95, 0, -R);
  }
  P.closePath();
  return P;
}
const BODY_TOP = { round:1.0, tall:1.16, tear:1.24, chunky:0.88 };
const BODY_SIDE = { round:1.0, tall:0.84, tear:0.86, chunky:1.18 };

function drawTail(kind, R, sp, t){
  if (kind === 'none') return;
  ctx.save();
  ctx.strokeStyle = sp.a(.75); ctx.lineWidth = Math.max(2, R*0.10); ctx.lineCap = 'round';
  const sway = Math.sin(t*1.8)*R*0.16;
  if (kind === 'wisp'){
    ctx.beginPath();
    ctx.moveTo(R*0.5, R*0.5);
    ctx.quadraticCurveTo(R*1.3, R*0.7 + sway, R*1.5, R*0.05 + sway);
    ctx.stroke();
  } else if (kind === 'plume'){
    ctx.fillStyle = sp.a(.55);
    for (let i=0;i<3;i++){
      ctx.beginPath();
      ctx.moveTo(R*0.45, R*0.55);
      ctx.quadraticCurveTo(R*(1.1+i*0.12), R*(0.5-i*0.35) + sway, R*(1.35+i*0.1), R*(0.1-i*0.42) + sway);
      ctx.quadraticCurveTo(R*(0.95+i*0.1), R*(0.35-i*0.2) + sway, R*0.45, R*0.55);
      ctx.fill();
    }
  } else if (kind === 'curl'){
    ctx.beginPath();
    ctx.moveTo(R*0.5, R*0.45);
    ctx.bezierCurveTo(R*1.35, R*0.55 + sway, R*1.45, -R*0.35 + sway, R*0.85, -R*0.15 + sway);
    ctx.stroke();
  }
  ctx.restore();
}

function drawEars(kind, R, sp, t){
  if (kind === 'none') return;
  ctx.save();
  ctx.fillStyle = sp.c2;
  const wob = Math.sin(t*1.5)*0.08;
  for (const d of [-1, 1]){
    ctx.save(); ctx.translate(d*R*0.62, -R*0.62); ctx.rotate(d*(0.35 + wob));
    ctx.beginPath();
    if (kind === 'leaf'){
      ctx.moveTo(0,0); ctx.quadraticCurveTo(d*R*0.42, -R*0.30, d*R*0.12, -R*0.60);
      ctx.quadraticCurveTo(-d*R*0.06, -R*0.28, 0, 0);
    } else if (kind === 'long'){
      ctx.moveTo(0,0); ctx.quadraticCurveTo(d*R*0.24, -R*0.75, d*R*0.06, -R*1.05);
      ctx.quadraticCurveTo(-d*R*0.16, -R*0.62, 0, 0);
    } else { // fin
      ctx.moveTo(0,0); ctx.lineTo(d*R*0.52, -R*0.22); ctx.lineTo(d*R*0.30, -R*0.52);
      ctx.closePath();
    }
    ctx.fill(); ctx.restore();
  }
  ctx.restore();
}

function drawHorn(kind, R, sp, top){
  if (kind === 'none') return;
  ctx.save();
  ctx.fillStyle = sp.accent; ctx.strokeStyle = sp.accent;
  ctx.lineWidth = Math.max(2, R*0.09); ctx.lineCap = 'round';
  const y = -R*top;
  if (kind === 'single'){
    ctx.beginPath(); ctx.moveTo(-R*0.10, y+R*0.10); ctx.lineTo(0, y-R*0.45); ctx.lineTo(R*0.10, y+R*0.10); ctx.fill();
  } else if (kind === 'pair'){
    for (const d of [-1,1]){
      ctx.beginPath();
      ctx.moveTo(d*R*0.24, y+R*0.16); ctx.lineTo(d*R*0.36, y-R*0.34); ctx.lineTo(d*R*0.44, y+R*0.10);
      ctx.fill();
    }
  } else if (kind === 'curved'){
    for (const d of [-1,1]){
      ctx.beginPath();
      ctx.moveTo(d*R*0.28, y+R*0.16);
      ctx.quadraticCurveTo(d*R*0.72, y-R*0.30, d*R*0.34, y-R*0.52);
      ctx.stroke();
    }
  } else if (kind === 'antler'){
    for (const d of [-1,1]){
      ctx.beginPath();
      ctx.moveTo(d*R*0.22, y+R*0.14); ctx.lineTo(d*R*0.40, y-R*0.48);
      ctx.moveTo(d*R*0.32, y-R*0.18); ctx.lineTo(d*R*0.62, y-R*0.30);
      ctx.moveTo(d*R*0.37, y-R*0.34); ctx.lineTo(d*R*0.20, y-R*0.62);
      ctx.stroke();
    }
  }
  ctx.restore();
}

function drawMarks(kind, R, sp, seed){
  if (kind === 'none') return;
  const r = rngFrom(seed);
  ctx.save();
  if (kind === 'spots'){
    ctx.fillStyle = sp.a(.42);
    for (let i=0;i<6;i++){
      const a = r()*Math.PI*2, d = r()*R*0.8;
      ctx.beginPath(); ctx.arc(Math.cos(a)*d, Math.sin(a)*d*0.9, R*(0.07+r()*0.07), 0, Math.PI*2); ctx.fill();
    }
  } else if (kind === 'stripes'){
    ctx.strokeStyle = sp.a(.38); ctx.lineWidth = R*0.11; ctx.lineCap='round';
    for (let i=0;i<3;i++){
      const y = -R*0.35 + i*R*0.42;
      ctx.beginPath(); ctx.moveTo(-R*1.1, y); ctx.quadraticCurveTo(0, y+R*0.16, R*1.1, y); ctx.stroke();
    }
  } else if (kind === 'veins'){
    ctx.strokeStyle = sp.a(.5); ctx.lineWidth = R*0.05; ctx.lineCap='round';
    for (let i=0;i<5;i++){
      const a = -Math.PI/2 + (i-2)*0.42;
      ctx.beginPath(); ctx.moveTo(0, R*0.55);
      ctx.quadraticCurveTo(Math.cos(a)*R*0.4, R*0.05, Math.cos(a)*R*0.92, Math.sin(a)*R*0.9);
      ctx.stroke();
    }
  }
  ctx.restore();
}

function drawSpirit(t, p, sp, opt){
  const T = sp.traits;
  const cx = (opt && opt.cx) || CW/2;
  const scale = [0.55, 0.68, 0.82, 1.0, 1.16, 1.3][p.stage] * ((opt && opt.scale) || 1);
  const breathe = Math.sin(t*1.6) * 3;
  const happy = p.mood > 60 && p.hp > 40;
  const hop = happy ? Math.abs(Math.sin(t*2.2)) * 5 : 0;
  const cy = 168 - hop + breathe*0.4 + View.bounce;
  const R = 42 * scale;

  ctx.save();
  ctx.translate(cx, cy);
  if (opt && opt.flip) ctx.scale(-1, 1);

  // แสงเรืองตามความหายาก
  if (sp.rarity >= 3){ ctx.shadowColor = sp.a(.85); ctx.shadowBlur = sp.rarity === 4 ? 26 : 15; }

  // ออร่าร่างโบราณ / วงในตำนาน
  if (p.stage === 5 || T.halo){
    const n = p.stage === 5 ? 7 : 5;
    for (let i=0;i<n;i++){
      const a = t*0.6 + i*Math.PI*2/n;
      const rr = R*1.7 + Math.sin(t*2+i)*6;
      ctx.fillStyle = sp.a(.7);
      ctx.beginPath(); ctx.arc(Math.cos(a)*rr, Math.sin(a)*rr*.5, 3, 0, Math.PI*2); ctx.fill();
    }
  }

  if (p.stage === 0){ drawSeed(R, sp, t); ctx.restore(); return; }

  const top = BODY_TOP[T.body] || 1, side = BODY_SIDE[T.body] || 1;

  // หาง หู เขา อยู่หลังตัว
  drawTail(T.tail, R, sp, t);
  drawEars(T.ear, R, sp, t);
  drawHorn(T.horn, R, sp, top);

  // ปีก / ริ้ว สายระบำ
  if (p.stage >= 3 && p.branch === 'play'){
    ctx.save();
    ctx.strokeStyle = sp.a(.7); ctx.lineWidth = 3; ctx.lineCap = 'round';
    for (const dir of [-1, 1]){
      ctx.beginPath();
      ctx.moveTo(dir*R*0.7, 4);
      ctx.quadraticCurveTo(dir*R*1.8, -14 + Math.sin(t*3)*8, dir*R*2.1, 18 + Math.cos(t*2.4)*8);
      ctx.stroke();
    }
    ctx.restore();
  }
  // เกราะเปลือก สายกายา
  if (p.stage >= 3 && p.branch === 'body'){
    ctx.fillStyle = sp.c2;
    ctx.beginPath(); ctx.ellipse(0, R*0.15, R*side*1.05, R*0.85, 0, Math.PI*0.05, Math.PI*0.95); ctx.fill();
  }
  // วงแหวนฌาน
  if (p.stage >= 3 && p.branch === 'mind'){
    ctx.save();
    ctx.strokeStyle = sp.a(.85); ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.ellipse(0, -R*(top+0.18), R*0.72, R*0.20 + Math.sin(t*1.5)*2, 0, 0, Math.PI*2); ctx.stroke();
    ctx.restore();
  }

  // ตัว
  const P = bodyPath(T.body, R);
  const bg = ctx.createRadialGradient(-R*.3, -R*.35, R*.2, 0, 0, R*1.15);
  bg.addColorStop(0, sp.accent);
  bg.addColorStop(.55, sp.c1);
  bg.addColorStop(1, sp.c2);
  ctx.fillStyle = bg;
  ctx.fill(P);
  ctx.shadowBlur = 0;

  // ลายบนตัว
  ctx.save(); ctx.clip(P);
  drawMarks(T.mark, R, sp, hashStr('mk:' + sp.id));
  ctx.restore();

  // ใบบนหัวสำหรับสายไม้
  if (sp.elk === 'wood'){
    ctx.fillStyle = sp.c2;
    ctx.save(); ctx.translate(0, -R*(top-0.02)); ctx.rotate(Math.sin(t*1.2)*0.12);
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.quadraticCurveTo(R*0.42, -R*0.32, R*0.10, -R*0.72);
    ctx.quadraticCurveTo(-R*0.06, -R*0.36, 0, 0);
    ctx.fill();
    ctx.restore();
  }

  // แก้ม
  if (happy){
    ctx.fillStyle = 'rgba(220,120,120,.28)';
    ctx.beginPath(); ctx.ellipse(-R*side*0.48, R*0.16, R*0.15, R*0.10, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse( R*side*0.48, R*0.16, R*0.15, R*0.10, 0, 0, Math.PI*2); ctx.fill();
  }

  // ตา
  const blink = (Math.sin(t*0.9) > 0.985) ? 0.12 : 1;
  const sleepy = p.hp < 35 || p.mood < 20;
  ctx.fillStyle = '#15242c';
  for (const dx of [-R*0.27*side, R*0.27*side]){
    if (sleepy || View.focusing){
      ctx.strokeStyle = '#15242c'; ctx.lineWidth = 2.6; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(dx - R*0.11, -R*0.06); ctx.quadraticCurveTo(dx, R*0.04, dx + R*0.11, -R*0.06); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.ellipse(dx, -R*0.06, R*0.085, R*0.115*blink, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.85)';
      ctx.beginPath(); ctx.arc(dx + R*0.03, -R*0.11, R*0.03, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#15242c';
    }
  }

  // ปาก
  ctx.strokeStyle = '#15242c'; ctx.lineWidth = 2; ctx.lineCap = 'round';
  ctx.beginPath();
  if (p.mood > 55){ ctx.moveTo(-R*0.12, R*0.24); ctx.quadraticCurveTo(0, R*0.38, R*0.12, R*0.24); }
  else if (p.mood > 25){ ctx.moveTo(-R*0.10, R*0.28); ctx.lineTo(R*0.10, R*0.28); }
  else { ctx.moveTo(-R*0.12, R*0.32); ctx.quadraticCurveTo(0, R*0.18, R*0.12, R*0.32); }
  ctx.stroke();

  if (p.sick){
    ctx.font = '18px serif'; ctx.textAlign='center';
    ctx.fillText('\u{1FA79}', R*0.75, -R*0.75);
  }
  ctx.restore();
}

function drawSeed(R, sp, t){
  ctx.fillStyle = '#6b5540';
  ctx.beginPath(); ctx.ellipse(0, R*0.2, R*0.62, R*0.78, 0, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#48382a'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-R*0.2, -R*0.3); ctx.quadraticCurveTo(0, R*0.2, -R*0.1, R*0.7); ctx.stroke();
  ctx.fillStyle = sp.c1;
  ctx.save(); ctx.translate(0, -R*0.5); ctx.rotate(Math.sin(t*1.4)*0.15);
  ctx.beginPath();
  ctx.moveTo(0,0); ctx.quadraticCurveTo(R*0.5, -R*0.25, R*0.14, -R*0.62);
  ctx.quadraticCurveTo(0, -R*0.3, 0, 0); ctx.fill();
  ctx.restore();
}

/* ---- ไข่ ---- */
function eggTint(){
  const odds = hatchOddsByEl();
  let best = null, bv = -1;
  for (const k in odds) if (odds[k] > bv){ bv = odds[k]; best = k; }
  const E = ELEMENTS[best] || ELEMENTS.wood;
  // ยิ่งธาตุนำมาก สียิ่งชัด
  const lean = clamp((bv - 0.125) / 0.5, 0, 1);
  return { h: E.h, s: 10 + 42 * lean, l: 62 - 6 * lean, lean, el: best };
}

function drawEgg(t, big){
  const e = S.egg; if (!e) return;
  const prog = clamp(e.pts / e.need, 0, 1);
  const tint = eggTint();
  const R = big ? 52 : 22;
  const cx = big ? CW/2 : CW/2 + 96;
  const cy = big ? (168 + Math.sin(t*1.4)*3) : 214;

  ctx.save();
  ctx.translate(cx, cy);

  // ตัวไข่
  const g = ctx.createRadialGradient(-R*0.3, -R*0.45, R*0.2, 0, 0, R*1.3);
  g.addColorStop(0, _hsl(tint.h, tint.s, tint.l + 18));
  g.addColorStop(.6, _hsl(tint.h, tint.s, tint.l));
  g.addColorStop(1, _hsl(tint.h + 6, tint.s + 8, tint.l - 20));
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(0, -R*1.26);
  ctx.bezierCurveTo(R*0.86, -R*0.92, R*0.98, R*0.55, 0, R*1.02);
  ctx.bezierCurveTo(-R*0.98, R*0.55, -R*0.86, -R*0.92, 0, -R*1.26);
  ctx.closePath();
  ctx.fill();

  // ลายจุดตามธาตุ
  const rr = rngFrom(hashStr('egg' + tint.el));
  ctx.fillStyle = _hsla(tint.h, tint.s + 14, tint.l - 26, .45);
  for (let i=0;i<7;i++){
    const a = rr()*Math.PI*2, d = rr()*R*0.72;
    ctx.beginPath(); ctx.arc(Math.cos(a)*d, Math.sin(a)*d*1.05, R*(0.06+rr()*0.06), 0, Math.PI*2); ctx.fill();
  }

  // รอยร้าวตามความคืบหน้าการฟัก
  if (prog > 0.05){
    const n = Math.floor(prog * 7);
    ctx.strokeStyle = 'rgba(20,32,40,.55)'; ctx.lineWidth = Math.max(1, R*0.045);
    const cr = rngFrom(hashStr('crack' + e.tier));
    for (let i=0;i<n;i++){
      let x = (cr()-.5)*R*1.2, y = (cr()-.5)*R*1.6;
      ctx.beginPath(); ctx.moveTo(x, y);
      for (let j=0;j<3;j++){
        x += (cr()-.5)*R*0.5; y += (cr()-.5)*R*0.5;
        ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
  }
  // แสงตอนใกล้ฟัก
  if (prog > 0.85){
    ctx.shadowColor = _hsla(tint.h, 70, 70, .9);
    ctx.shadowBlur = 18 + Math.sin(t*4)*8;
    ctx.strokeStyle = _hsla(tint.h, 60, 78, .5); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(0, -R*0.1, R*0.9, R*1.12, 0, 0, Math.PI*2); ctx.stroke();
    ctx.shadowBlur = 0;
  }
  ctx.restore();
}

/* ---- ตราสัญลักษณ์การ์ด (พิกเซล 7x7) ---- */
function sigilSVG(seedStr, color, size=44){
  const r = rngFrom(hashStr(seedStr));
  const n = 7, cell = size/n;
  let rects = '';
  for (let y=0;y<n;y++){
    for (let x=0;x<Math.ceil(n/2);x++){
      if (r() > .48){
        const o = 0.5 + r()*0.5;
        rects += `<rect x="${x*cell}" y="${y*cell}" width="${cell}" height="${cell}" fill="${color}" opacity="${o.toFixed(2)}"/>`;
        const mx = n-1-x;
        if (mx !== x) rects += `<rect x="${mx*cell}" y="${y*cell}" width="${cell}" height="${cell}" fill="${color}" opacity="${o.toFixed(2)}"/>`;
      }
    }
  }
  return `<svg class="sigil" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${rects}</svg>`;
}

const $ = s => document.querySelector(s);

let TAB = 'pot';

function toast(msg, kind=''){
  const box = $('#toast');
  const el = document.createElement('div');
  el.className = 'tst ' + kind;
  el.textContent = msg;
  box.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .4s'; }, 2100);
  setTimeout(()=>el.remove(), 2600);
}
function sheet(html){
  $('#sheet').innerHTML = html;
  $('#veil').classList.add('show');
}
function closeSheet(){ $('#veil').classList.remove('show'); }
$('#veil').addEventListener('click', e => { if (e.target.id === 'veil') closeSheet(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ===================== แถบบน ===================== */
function paintTop(){
  $('#coins').textContent = Math.floor(S.coins).toLocaleString('th-TH');
  $('#crys').textContent  = Math.floor(S.crystals).toLocaleString('th-TH');
  const p = S.pet;

  document.body.classList.toggle('night', isNight() && !roomBonus().light);
  // จุดแจ้งเตือนสำรวจเสร็จ
  const eb = document.querySelector('#tabs button[data-tab="explore"]');
  const old = eb.querySelector('.dot'); if (old) old.remove();

}

/* ===================== แท็บ ===================== */
document.querySelectorAll('#tabs button').forEach(b => {
  b.addEventListener('click', () => {
    if (QUIZ.running && !QUIZ.locked) return;
    if (DUEL.running && !DUEL.locked) return;
    TAB = b.dataset.tab;
    document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x === b));
    render();
  });
});

function render(){
  tickOffline();
  paintTop();
  const v = view();
  if (TAB === 'pot')      v.innerHTML = viewPot();
  else if (TAB === 'quiz')    v.innerHTML = viewQuiz();
  else if (TAB === 'explore') v.innerHTML = viewExplore();
  else if (TAB === 'bag')     v.innerHTML = viewBag();
  else if (TAB === 'home')    v.innerHTML = viewHome();
  else if (TAB === 'book')    v.innerHTML = viewBook();
  else if (TAB === 'sum')     v.innerHTML = viewSummary();
  else if (TAB === 'duel')    v.innerHTML = viewDuel();

  const cv = document.getElementById('pot');
  if (cv) initCanvas(cv);
  save();
}

function metersBlock(){

/* ===================== หน้า: สรุปผลสัมฤทธิ์ ===================== */
function accColor(pct){
  if (pct >= 80) return '#7cae9b';
  if (pct >= 60) return '#a8c98a';
  if (pct >= 40) return '#d8b04a';
  return '#c26a6a';
}
function accBar(r, w){
  const t = r + w;
  const pct = t ? Math.round(r / t * 100) : 0;
  return {pct, t, html:`<div class="pbar"><i style="width:${pct}%;background:${accColor(pct)}"></i></div>`};
}
function trendTag(p){
  const tr = trendOf(p);
  if (!tr) return `<span class="trend flat">—</span>`;
  const d = Math.round(tr.diff * 100);
  if (d >= 8)  return `<span class="trend up">▲ ${d}%</span>`;
  if (d <= -8) return `<span class="trend down">▼ ${Math.abs(d)}%</span>`;
  return `<span class="trend flat">คงที่</span>`;
}

  </div>

    <div class="eyebrow">แยกตามวิชาและระดับชั้น</div>

    <div class="sub">ลูกศรเทียบผลครึ่งหลังกับครึ่งแรกของ 40 ข้อล่าสุดในหน่วยนั้น ต้องตอบอย่างน้อย 10 ข้อจึงเริ่มแสดง</div>
    <div class="gap" style="height:6px"></div>
    ${unitRows}

    <div class="sub">ตอบคำถามสักรอบแล้วกลับมาดูผลสัมฤทธิ์รายหน่วยได้ที่นี่</div></div>`}

    <div class="list">${weak.map(x => `<div class="item">

      <div class="grow"><b>${UNITS[x.unit].n}</b>

    <div class="tiny" style="margin-top:8px">ข้อที่ตอบผิดจะถูกนำกลับมาถามซ้ำเร็วขึ้นโดยอัตโนมัติ</div>

}

const QUIZ = {
  running:false, subj:'mix', grade:null, idx:0, used:[], cur:null, units:{},
  streak:0, pts:0, eggPts:0, correct:0, marks:[], len:ROUND_LEN,

};

    <div class="eyebrow">เลือกวิชา</div>
    <h2>จะตอบเรื่องอะไรดี</h2>
    <div class="sub">หน่วยการเรียนรู้ที่ตอบจะกำหนดธาตุของไข่ที่กำลังฟักอยู่</div>
    <div class="gap"></div>
    <div class="chips">${subjChips}</div>
    ${unitLine}
    <div class="gap"></div>
    <button class="btn pri block" data-act="startQuiz" ${avail?'':'disabled'}>
      ${avail ? `เริ่มรอบ ${Math.min(ROUND_LEN, avail)} ข้อ` : 'ยังไม่มีคำถามในชุดนี้'}</button>
    <div class="tiny" style="margin-top:8px">
      ตอบถูกได้คะแนนเต็มเสมอ ตอบเร็วได้โบนัสเพิ่มสูงสุด 50% และตอบถูกติดกันจะได้ตัวคูณสูงสุด ×2
    </div>

  <div class="card">
    <div class="eyebrow">คลังคำถาม</div>
    <div class="row spread">
      <div class="grow"><b>${allQuestions().length} ข้อทั้งหมด</b>
        <div class="sub">เพิ่มคำถามเอง หรือนำเข้าจาก Google Sheets ได้</div></div>
      <button class="btn" data-act="qbank">จัดการ</button>

function quizQuestionHtml(){
  const q = QUIZ.cur;
  const d = DIFF[q.diff];
  const dots = Array.from({length:QUIZ.len}, (_,i) => {
    const m = QUIZ.marks[i];
    return `<i class="${i===QUIZ.idx?'now':(m===1?'ok':(m===0?'no':''))}"></i>`;
  }).join('');

  const choices = q.ch.map((c, i) => {
    let cls = '';
    if (QUIZ.locked){
      if (i === q.ans) cls = 'right';
      else if (i === QUIZ.chosen) cls = 'wrong';
    }
    return `<button class="ch ${cls}" data-ans="${i}" ${QUIZ.locked?'disabled':''}>
      <span class="k">${'กขคง'[i]}</span><span>${esc(c)}</span></button>`;
  }).join('');

  let after = '';
  if (QUIZ.locked){
    const ok = QUIZ.chosen === q.ans;
    const g = QUIZ.gained;
    after = `<div class="expl" style="border-left-color:${ok?'var(--glaze)':'var(--bad)'}">
      <b>${ok ? `ถูกต้อง +${g.pts} คะแนน` : 'ยังไม่ใช่ คำตอบคือ ' + 'กขคง'[q.ans]}</b>
      ${ok && (g.speed > 0.02 || g.mult > 1) ? `<div class="tiny" style="margin-top:2px">ฐาน ${g.base} · เร็ว +${Math.round(g.speed*100)}% · ต่อเนื่อง ×${g.mult.toFixed(1)}${g.repeat<1?' · ข้อซ้ำวันนี้ ×'+g.repeat:''}</div>` : ''}
      ${q.exp ? `<div style="margin-top:6px">${esc(q.exp)}</div>` : ''}
      ${!ok ? `<div class="tiny" style="margin-top:6px;color:var(--glaze-lt)">อ่านคำอธิบายแล้วได้ประสบการณ์เล็กน้อย ข้อนี้จะกลับมาถามอีกเร็วๆ นี้</div>` : ''}
    </div>
    <div class="gap"></div>
    <button class="btn pri block" data-act="nextQ">${QUIZ.idx + 1 >= QUIZ.len ? 'จบรอบ' : 'ข้อถัดไป'}</button>`;
  }

  return `
  ${stageBlock()}
  <div class="card">
    <div class="qmeta">
      <span>ข้อ ${QUIZ.idx+1}/${QUIZ.len} · ${SUBJECTS[q.subj].g} ${GRADES[q.grade].n}
        · ${UNITS[q.unit].n} · <span style="color:${d.c}">${d.n}</span></span>
      <span>${S.settings.timed && !QUIZ.locked ? `<span id="qclock">${Math.ceil(Math.max(0,QUIZ.limitMs-(Date.now()-QUIZ.startAt))/1000)} วิ</span>` : ''}
        ${QUIZ.streak > 1 ? `<span class="combo">🔥 ${QUIZ.streak}</span>` : ''}</span>
    </div>
    <div class="dots" style="margin-bottom:10px">${dots}</div>
    <div class="qtext">${esc(q.q)}</div>
    <div class="choices">${choices}</div>
    ${after}
  </div>
  <div class="card">
    <div class="row spread">
      <span class="sub">คะแนนรอบนี้</span><b class="mono" style="font-size:calc(19px * var(--fs))">${QUIZ.pts}</b>
    </div>
    ${QUIZ.locked ? '' : '<div class="gap"></div><button class="btn sm danger block" data-act="quitQuiz">ออกจากรอบนี้</button>'}
  </div>`;
}

function startQuiz(){
  QUIZ.grade = QUIZ.grade || S.grade;
  const avail = questionsBy(QUIZ.subj, QUIZ.grade).length;
  if (!avail) return toast('วิชานี้ยังไม่มีคำถามในคลัง', 'bad');
  QUIZ.running = true; QUIZ.idx = 0; QUIZ.used = []; QUIZ.streak = 0;
  QUIZ.pts = 0; QUIZ.eggPts = 0; QUIZ.correct = 0; QUIZ.marks = []; QUIZ.units = {};
  QUIZ.len = Math.min(ROUND_LEN, avail);
  nextQuestion();
}

function nextQuestion(){
  const q = pickQuestion(QUIZ.subj, QUIZ.grade, QUIZ.used);
  if (!q){ return finishQuiz(); }
  QUIZ.used.push(q.id);
  // สลับตัวเลือกไม่ให้จำตำแหน่ง
  let cur = q;
  if (S.settings.shuffle){
    const order = q.ch.map((c,i) => i).sort(() => Math.random() - .5);
    cur = Object.assign({}, q, {
      ch: order.map(i => q.ch[i]),
      ans: order.indexOf(q.ans)
    });
  }
  QUIZ.cur = cur;
  QUIZ.locked = false; QUIZ.chosen = -1; QUIZ.gained = null;
  QUIZ.limitMs = S.settings.timed ? DIFF[cur.diff].sec * 1000 : 0;
  QUIZ.startAt = Date.now();
  View.focusing = true; View.progress = 0; View.drift = false;
  clearInterval(QUIZ.tickId);
  if (QUIZ.limitMs) QUIZ.tickId = setInterval(quizTick, 120);
  render();
}

function quizTick(){
  if (!QUIZ.running || QUIZ.locked || !QUIZ.limitMs) return;
  const left = QUIZ.limitMs - (Date.now() - QUIZ.startAt);
  View.progress = clamp(1 - left / QUIZ.limitMs, 0, 1);
  View.drift = left < QUIZ.limitMs * 0.25;
  const c = document.getElementById('qclock');
  if (c){
    c.textContent = Math.max(0, Math.ceil(left/1000)) + ' วิ';
    c.classList.toggle('low', left < QUIZ.limitMs * 0.25);
  }
  if (left <= 0) answerQuestion(-1);
}

function answerQuestion(i){
  if (QUIZ.locked) return;
  clearInterval(QUIZ.tickId);
  const q = QUIZ.cur;
  const correct = i === q.ans;
  const left = QUIZ.limitMs ? Math.max(0, QUIZ.limitMs - (Date.now() - QUIZ.startAt)) : 0;

  QUIZ.chosen = i;
  QUIZ.locked = true;
  QUIZ.gained = scoreAnswer(q, correct, left, QUIZ.limitMs, QUIZ.streak);
  QUIZ.marks[QUIZ.idx] = correct ? 1 : 0;

  if (correct){
    QUIZ.pts += QUIZ.gained.pts;
    QUIZ.eggPts += QUIZ.gained.base;      // ไข่โตจากคะแนนฐานอย่างเดียว
    QUIZ.units[q.unit] = (QUIZ.units[q.unit] || 0) + QUIZ.gained.base;
    QUIZ.correct++;
    QUIZ.streak++;
    S.stats.bestStreak = Math.max(S.stats.bestStreak, QUIZ.streak);
    if (S.pet){
      const p = S.pet;
      if (q.diff >= 3) p.care.mind += 2;
      else if (QUIZ.gained.speed > 0.3) p.care.play += 1;
      else p.care.mind += 1;
    }
  } else {
    QUIZ.streak = 0;
    if (S.pet) S.pet.mood = clamp(S.pet.mood - 2, 0, 100);
  }
  recordAnswer(q, correct);
  S.stats.answered++;
  if (correct) S.stats.correct++;
  View.drift = false;
  View.progress = correct ? 1 : View.progress;
  save(); render();
}

function advanceQuiz(){
  if (!QUIZ.locked) return;
  if (!QUIZ.marks[QUIZ.idx] && S.pet) gainXp(3);   // อ่านคำอธิบายหลังตอบผิด
  QUIZ.idx++;
  if (QUIZ.idx >= QUIZ.len) return finishQuiz();
  nextQuestion();
}

function finishQuiz(){
  clearInterval(QUIZ.tickId);
  QUIZ.running = false;
  View.focusing = false; View.drift = false; View.progress = 0;

  const b = roomBonus();
  const pts = QUIZ.pts;
  const answered = QUIZ.marks.length;
  const acc = answered ? QUIZ.correct / answered : 0;
  const perfect = answered > 0 && QUIZ.correct === answered && answered === QUIZ.len;

  const boosted = (S.boost || 0) > 0;
  const xp = Math.round(pts * 0.6 * (1 + b.focusXp) * (boosted ? 1.25 : 1));
  if (boosted) S.boost--;
  const coin = Math.round(pts * 0.35 * (1 + b.coin));
  const aff = Math.round(pts / 40 * (1 + b.aff));
  let lv = 0;

  if (S.pet){
    lv = gainXp(xp).levels;
    S.pet.aff = clamp(S.pet.aff + aff, 0, 100);
    S.pet.mood = clamp(S.pet.mood + (acc >= .7 ? 6 : 2), 0, 100);
    S.pet.hunger = clamp(S.pet.hunger - 2, 0, 100);
  }
  S.coins += coin;
  S.stats.points += pts;
  S.stats.rounds++;
  S.stats.best = Math.max(S.stats.best, pts);

  // ต่อเนื่องรายวัน
  const t = todayKey();
  if (S.stats.lastDay !== t){
    const y = new Date(Date.now() - 86400000);
    const yk = `${y.getFullYear()}-${y.getMonth()+1}-${y.getDate()}`;
    S.stats.streak = (S.stats.lastDay === yk) ? S.stats.streak + 1 : 1;
    S.stats.lastDay = t;
  }

  // ผลึกสมาธิ
  let cr = Math.floor(QUIZ.correct / 4) + (perfect ? 2 : 0);
  if (cr > 0 && Math.random() < b.crystal) cr += 1;
  if (cr > 0) S.crystals += cr;

  // ของติดมือ
  const got = [];
  const pool = ['leaf','leaf','berry','clay','bamboo','ricecake','shard'];
  for (let i=0;i<QUIZ.correct;i++){
    if (Math.random() < .30 + b.exploreLuck){ const k = pick(pool); addItem(k); got.push(ITEMS[k].n); }
  }
  if (perfect && Math.random() < .25 + b.exploreLuck){
    const k = pick(['stone_b','stone_m','stone_p']); addItem(k); got.push(ITEMS[k].n);
  }

  // ป้อนคะแนนให้ไข่
  let hatchReady = false;
  if (S.egg && QUIZ.eggPts > 0) hatchReady = eggAddPoints(QUIZ.eggPts, QUIZ.units);

  save(); render();
  sheet(quizResultSheet(pts, acc, perfect, xp, coin, aff, cr, got, lv, hatchReady, boosted));
  cloudAutoSync();
}

function quizResultSheet(pts, acc, perfect, xp, coin, aff, cr, got, lv, hatchReady, boosted){
  const line = (g, t, s2) => `<div class="item"><div class="ic">${g}</div><div class="grow"><b>${t}</b>${s2?`<div class="sub">${s2}</div>`:''}</div></div>`;
  return `<div class="eyebrow">จบรอบ</div>
  <h2>${perfect ? 'ถูกหมดทั้งรอบ' : `ตอบถูก ${QUIZ.correct} จาก ${QUIZ.marks.length} ข้อ`}</h2>
  <div class="sub">ความแม่นยำ ${Math.round(acc*100)}% · คะแนนรวม ${pts}${pts > S.stats.best - pts ? '' : ''}</div>
  <div class="gap"></div>
  <div class="list">
    ${S.pet ? line('⭐', `ประสบการณ์ +${xp}`, [lv ? `เลื่อนขึ้น ${lv} เลเวล เป็น Lv.${S.pet.lv}` : '', boosted ? `ช็อกโกแลตช่วยเพิ่ม 25% · เหลืออีก ${S.boost} รอบ` : ''].filter(Boolean).join(' · ')) : ''}
    ${line('🪙', `เหรียญ +${coin}`)}
    ${cr ? line('💠', `ผลึกสมาธิ +${cr}`, perfect ? 'โบนัสตอบถูกหมดทั้งรอบ' : '') : ''}
    ${S.pet ? line('💞', `ความสนิท +${aff}`) : ''}
    ${got.length ? line('🎁', 'ได้รับ', got.join(' · ')) : ''}
    ${S.egg ? line('🥚', `ไข่ได้รับ +${QUIZ.eggPts} คะแนนฐาน`, `${Math.min(S.egg.pts,S.egg.need)}/${S.egg.need}`) : ''}
    ${S.stats.streak > 1 ? line('🔥', `ตอบต่อเนื่อง ${S.stats.streak} วัน`) : ''}
  </div>
  <div class="gap"></div>
  ${hatchReady ? `<button class="btn gold block" data-act="hatch">ไข่พร้อมฟักแล้ว</button><div class="gap"></div>` : ''}
  <button class="btn pri block" data-act="closeSheet">ปิด</button>`;
}

/* ===================== ไข่ ===================== */
function openEgg(key){
  if (S.egg) return toast('มีไข่ที่กำลังฟักอยู่แล้ว ต้องฟักใบนี้ให้เสร็จก่อน', 'bad');
  if (!(S.bag[key] > 0)) return toast('ไม่มีไข่ใบนี้', 'bad');
  S.bag[key]--; if (!S.bag[key]) delete S.bag[key];
  startEgg(ITEMS[key].tier);
  save(); render();
  toast(`เริ่มฟัก${ITEMS[key].n}แล้ว ตอบคำถามเพื่อสะสมคะแนน`, 'gold');
}

function doHatch(){
  if (!S.egg || S.egg.pts < S.egg.need) return toast('คะแนนยังไม่ถึง', 'bad');
  if (S.pet && gardenCount() + 1 >= GARDEN_MAX)
    return toast(`สวนเต็ม ${GARDEN_MAX} ตัวแล้ว ปล่อยตัวใดตัวหนึ่งก่อน`, 'bad');

  const chaos = Math.random() < CHAOS_CHANCE;
  const sp = hatchRoll(chaos);
  const topUnit = eggTopUnit();
  S.egg = null;
  const first = !S.pet;
  if (!first) stashActive();
  S.pet = newPet(sp);
  unlockForm();
  save(); render();

  const R = RARITY[SPECIES[sp].rarity];
  sheet(`<div class="eyebrow">ไข่ฟักแล้ว</div>
    <h2 style="color:${SPECIES[sp].accent}">${SPECIES[sp].name} ${R.star}</h2>
    <div class="sub">${SPECIES[sp].desc}</div>

/* ---- CSV ---- */
function csvEscape(v){
  v = String(v == null ? '' : v);
  return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
}
function parseCSV(text){
  const rows = []; let row = [], cell = '', q = false;
  for (let i=0;i<text.length;i++){
    const c = text[i];
    if (q){
      if (c === '"'){ if (text[i+1] === '"'){ cell += '"'; i++; } else q = false; }
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === ',' || c === '\t'){ row.push(cell); cell = ''; }
    else if (c === '\n'){ row.push(cell); cell = ''; if (row.some(x => x.trim() !== '')) rows.push(row); row = []; }
    else if (c !== '\r') cell += c;
  }
  row.push(cell);
  if (row.some(x => x.trim() !== '')) rows.push(row);
  return rows;
}
const SUBJ_BY_NAME = {};
for (const k of SUBJ_KEYS){

const GRADE_BY_NAME = {};
for (const g of GRADE_KEYS){ GRADE_BY_NAME[GRADES[g].n] = g; GRADE_BY_NAME[g] = g; GRADE_BY_NAME[GRADES[g].n.replace('.','')] = g; }

function qdoimport(){
  const txt = document.getElementById('csvIn').value;
  if (!txt.trim()) return toast('ยังไม่ได้วางข้อมูล', 'bad');
  const rows = parseCSV(txt);
  let added = 0, skipped = 0;
  S.qcustom = S.qcustom || [];
  for (const r of rows){
    if (r.length < 10){ skipped++; continue; }
    const subj = SUBJ_BY_NAME[(r[0]||'').trim()];
    const grade = GRADE_BY_NAME[(r[1]||'').trim()];
    let unit = UNIT_BY_NAME[(r[2]||'').trim()];
    const diff = DIFF_BY_NAME[(r[3]||'').trim()];
    const q = (r[4]||'').trim();
    const ch = [r[5],r[6],r[7],r[8]].map(x => (x||'').trim());
    const ans = parseInt((r[9]||'').trim(), 10) - 1;
    if (!subj || !grade || !diff || !q || ch.some(c => !c) || !(ans >= 0 && ans <= 3)){ skipped++; continue; }
    if (!unit || UNITS[unit].subj !== subj) unit = unitsOf(subj)[0];
    if (!SUBJECTS[subj].code[grade]){ skipped++; continue; }
    S.qcustom.push({ id:'c' + Date.now().toString(36) + added, subj, grade, unit, diff, q, ch, ans, exp:(r[10]||'').trim() });
    added++;
  }
  save();
  if (!added) return toast(`นำเข้าไม่สำเร็จ ตรวจลำดับคอลัมน์อีกครั้ง (ข้าม ${skipped} แถว)`, 'bad');
  render();
  toast(`นำเข้า ${added} ข้อ${skipped?` · ข้าม ${skipped} แถว`:''}`, 'gold');
  qbankSheet();
}

function qexport(){

  for (const q of allQuestions()){
    lines.push([SUBJECTS[q.subj].n, GRADES[q.grade].n, UNITS[q.unit].n, DIFF[q.diff].n,
      q.q, q.ch[0], q.ch[1], q.ch[2], q.ch[3], q.ans+1, q.exp].map(csvEscape).join(','));
  }
  const blob = new Blob(['\ufeff' + lines.join('\n')], {type:'text/csv;charset=utf-8'});

  const a = document.createElement('a');
  a.href = url; a.download = `คลังคำถาม-${allQuestions().length}ข้อ.csv`; a.click();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);

}

function collectExplore(half){
  const z = ZONES.find(x => x.id === S.explore.zone);
  const p = S.pet, b = roomBonus();
  S.explore = null;
  const luck = 1 + b.exploreLuck + p.stats.LUK / 120;
  const got = [];
  for (const [key, chance] of z.loot){
    if (Math.random() < chance * luck * (half ? .5 : 1)){
      const n = 1 + (Math.random() < .18 ? 1 : 0);
      addItem(key, n); got.push(`${ITEMS[key].n}${n>1?' ×'+n:''}`);
    }
  }
  const xp = Math.round(z.min * 2.2 * (half ? .5 : 1));
  const lv = gainXp(xp).levels;
  S.coins += Math.round(z.min * (half ? .6 : 1.2));
  p.hunger = clamp(p.hunger - z.min / 10, 0, 100);
  p.care.body += 1;

  let hurt = 0;
  const dodge = (p.stats.AGI + p.stats.VIT) / 200 + gearGuardBonus();
  let guarded = false;
  if (!half && Math.random() < Math.max(.02, z.risk - dodge)){
    if (S.guard > 0){ S.guard--; guarded = true; }
    else {
      hurt = Math.round(12 + Math.random() * 22);
      p.hp = clamp(p.hp - hurt, 1, 100);
      if (p.hp < 30) p.sick = true;
    }
  }
  save(); render();
  sheet(`<div class="eyebrow">กลับจาก${z.n}</div>
    <h2>${got.length ? 'เก็บของมาได้' : 'ไม่เจออะไรเลย'}</h2>
    <div class="sub">${got.length ? got.join(' · ') : 'บางวันก็เป็นแบบนี้ ลองใหม่คราวหน้า'}</div>
    <div class="gap"></div>
    <div class="list">
      <div class="item"><div class="ic">⭐</div><div class="grow"><b>ประสบการณ์ +${xp}</b>${lv?`<div class="sub">เลื่อนเป็น Lv.${p.lv}</div>`:''}</div></div>
      ${hurt?`<div class="item"><div class="ic">🩹</div><div class="grow"><b>บาดเจ็บ −${hurt} สุขภาพ</b><div class="sub">ใช้ยาหม่องหรือพาพักก่อนออกไปอีก</div></div></div>`:''}
      ${guarded?`<div class="item"><div class="ic">🍵</div><div class="grow"><b>ยาต้มบำรุงกำลังช่วยไว้</b><div class="sub">รอดจากการบาดเจ็บครั้งนี้ · เหลืออีก ${S.guard} ครั้ง</div></div></div>`:''}
    </div>
    <div class="gap"></div>
    <button class="btn pri block" data-act="closeSheet">ปิด</button>`);
}

    </div>

function doRps(k){
  const mine = RPS.find(r => r.k === k), theirs = pick(RPS);
  const beats = {rock:'sci', paper:'rock', sci:'paper'};
  const p = S.pet;
  let res, coin = 0;
  if (mine.k === theirs.k) res = 'เสมอ';
  else if (beats[mine.k] === theirs.k) res = 'คุณชนะ';
  else res = `${p.name}ชนะ`;
  p.care.play += 1;
  if (S.daily.plays < 8){
    S.daily.plays++;
    coin = res === 'เสมอ' ? 8 : (res === 'คุณชนะ' ? 18 : 12);
    S.coins += coin;
    p.mood = clamp(p.mood + 6, 0, 100);
    p.aff = clamp(p.aff + 1 * (1 + roomBonus().aff), 0, 100);
    gainXp(8);
  } else p.mood = clamp(p.mood + 2, 0, 100);
  const out = document.getElementById('rpsout');
  if (out) out.innerHTML = `<div class="item"><div class="ic">${theirs.g}</div>
    <div class="grow"><b>${res}</b><div class="sub">${p.name}ออก${theirs.n}${coin?` · เหรียญ +${coin} · อารมณ์ +6`:''}</div></div></div>`;
  save(); paintTop();
}

function bindView(){
  view().querySelectorAll('[data-subj]').forEach(b => b.onclick = () => { QUIZ.subj = b.dataset.subj; render(); });
  view().querySelectorAll('[data-grade]').forEach(b => b.onclick = () => {
    QUIZ.grade = b.dataset.grade; S.grade = b.dataset.grade;
    const ok = subjectsReady(S.grade);
    if (QUIZ.subj !== 'mix' && !ok.includes(QUIZ.subj)) QUIZ.subj = 'mix';
    save(); render();
  });
  view().querySelectorAll('[data-ans]').forEach(b => b.onclick = () => answerQuestion(+b.dataset.ans));
  view().querySelectorAll('[data-dans]').forEach(b => b.onclick = () => duelAnswer(+b.dataset.dans));
  view().querySelectorAll('[data-go]').forEach(b => b.onclick = () => startExplore(b.dataset.go));
  view().querySelectorAll('[data-bookel]').forEach(b => b.onclick = () => { BOOKEL = b.dataset.bookel; render(); });
  view().querySelectorAll('[data-card]').forEach(b => b.onclick = () => sheet(cardSheet(b.dataset.card)));
  view().querySelectorAll('[data-use]').forEach(b => b.onclick = () => {
    const r = useItem(b.dataset.use);
    if (!r) return;
    if (r.err) return toast(r.err, 'bad');
    if (r.egg) return openEgg(b.dataset.use);
    toast(r.msg); save(); render();
  });
  view().querySelectorAll('[data-sell]').forEach(b => b.onclick = () => {
    const k = b.dataset.sell, it = ITEMS[k];
    if (!(S.bag[k] > 0)) return;
    S.bag[k]--; if (!S.bag[k]) delete S.bag[k];
    S.coins += it.sell;
    toast(`ขาย${it.n} ได้ ${it.sell} เหรียญ`); save(); render();
  });
  view().querySelectorAll('[data-buy]').forEach(b => b.onclick = () => {
    const k = b.dataset.buy, price = +b.dataset.price;
    if (S.coins < price) return toast('เหรียญไม่พอ', 'bad');
    S.coins -= price; addItem(k);
    toast(`ซื้อ${ITEMS[k].n}แล้ว`); save(); render();
  });
  view().querySelectorAll('[data-buyf]').forEach(b => b.onclick = () => {
    const k = b.dataset.buyf, f = FURN[k];
    if (S.coins < f.cost) return toast('เหรียญไม่พอ', 'bad');
    const slot = S.room.indexOf(null);
    if (slot < 0) return toast('ห้องเต็มแล้ว เก็บของบางชิ้นออกก่อน', 'bad');
    S.coins -= f.cost; S.room[slot] = k;
    toast(`วาง${f.n}ไว้ในห้องแล้ว`); save(); render();
  });
  view().querySelectorAll('[data-slot]').forEach(b => b.onclick = () => {
    const i = +b.dataset.slot;
    if (S.room[i]){
      const f = FURN[S.room[i]];
      S.room[i] = null;
      S.coins += Math.round(f.cost * .5);
      toast(`เก็บ${f.n} คืนมา ${Math.round(f.cost*.5)} เหรียญ`); save(); render();
    } else toast('ซื้อของจากร้านด้านล่างเพื่อวางลงช่องนี้');
  });
  view().querySelectorAll('[data-act]').forEach(b => b.onclick = () => act(b.dataset.act));
}

document.getElementById('fsbtn').addEventListener('click', fsSheet);

document.getElementById('sheet').addEventListener('click', e => {
  const b = e.target.closest('[data-qlint2],[data-buyg],[data-equip],[data-dgrade],[data-dsubj],[data-fs],[data-act],[data-rps],[data-feed],[data-swap],[data-free],[data-freeyes],[data-cbuy],[data-qlist],[data-qdel],[data-pick]');
  if (!b) return;
  if (b.dataset.fs) return setFS(+b.dataset.fs);
  if (b.dataset.buyg){
    const [kind, key] = b.dataset.buyg.split(':');
    const r = buyGear(kind, key);
    if (r.err) return toast(r.err, 'bad');
    save(); paintTop();
    toast(`ซื้อ${(kind==='w'?WEAPONS:ARMORS)[key].n}แล้ว`, 'gold');
    return gearSheet();
  }
  if (b.dataset.equip){
    const [kind, key] = b.dataset.equip.split(':');
    equipGear(kind, key);
    save(); render();
    toast(`สวมใส่${(kind==='w'?WEAPONS:ARMORS)[key].n}แล้ว`);
    return gearSheet();
  }
  if (b.dataset.dgrade){ QUIZ.grade = b.dataset.dgrade; S.grade = b.dataset.dgrade; save(); return duelPasteSheet(); }
  if (b.dataset.dsubj){ DUEL.subj = b.dataset.dsubj; return duelPasteSheet(); }
  if (b.dataset.rps) return doRps(b.dataset.rps);
  if (b.dataset.pick !== undefined && b.dataset.pick !== ''){ QADD_ANS = +b.dataset.pick; return markPick(); }
  if (b.dataset.qlist) return qlistSheet(b.dataset.qlist);
  if (b.dataset.qlint2) return qlintSheet(b.dataset.qlint2);
  if (b.dataset.qdel){
    const id = b.dataset.qdel;
    if (id.startsWith('c')){ S.qcustom = (S.qcustom||[]).filter(q => q.id !== id); toast('ลบคำถามแล้ว'); }
    else { S.qoff = S.qoff || {}; S.qoff[id] = 1; toast('ปิดคำถามนี้แล้ว'); }
    save(); render();
    const q = QBANK_BUILTIN.concat(S.qcustom||[]).find(x => x.id === id);
    return qlistSheet(q ? q.subj : SUBJ_KEYS[0]);
  }
  if (b.dataset.cbuy){
    const row = CRYSTAL_SHOP.find(x => x.k === b.dataset.cbuy);
    if (S.crystals < row.cost) return toast('ผลึกสมาธิไม่พอ', 'bad');
    S.crystals -= row.cost; addItem(row.k);
    save(); paintTop(); toast(`แลก${ITEMS[row.k].n}แล้ว`, 'gold');
    return crystalSheet();
  }
  if (b.dataset.feed){
    const r = useItem(b.dataset.feed);
    if (r && r.err) return toast(r.err, 'bad');
    if (r) toast(r.msg);
    closeSheet(); save(); render(); return;
  }
  if (b.dataset.swap !== undefined && b.dataset.swap !== ''){
    swapWith(+b.dataset.swap); save(); closeSheet(); render();
    return toast(`สลับมาเลี้ยง${S.pet.name}แล้ว`);
  }
  if (b.dataset.free !== undefined && b.dataset.free !== ''){
    const i = +b.dataset.free, nm = S.garden[i] && S.garden[i].name;
    return sheet(`<h2>ปล่อย${esc(nm)}</h2>
      <div class="sub">ตัวนี้จะกลับสู่ป่าถาวร เลเวลและค่าสถานะจะหายไป แต่ร่างที่เคยพบยังอยู่ในสมุดสะสม</div>
      <div class="gap"></div>
      <button class="btn danger block" data-freeyes="${i}">ปล่อยไป</button>
      <div class="gap"></div>
      <button class="btn pri block" data-act="garden">ไม่ปล่อย</button>`);
  }
  if (b.dataset.freeyes !== undefined && b.dataset.freeyes !== ''){
    const pet = releasePet(+b.dataset.freeyes);
    S.coins += 60 + pet.lv * 8;
    save(); toast(`ปล่อย${pet.name}กลับป่า ได้ ${60 + pet.lv*8} เหรียญ`);
    return gardenSheet();
  }
  act(b.dataset.act);
});

function act(a){
  const p = S.pet;
  if (a === 'closeSheet'){
    closeSheet();
    if (TAB === 'duel' && !DUEL.running){
      TAB = 'pot';
      document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x.dataset.tab === 'pot'));
      render();
    }
    return;
  }
  if (a === 'goQuiz'){
    TAB = 'quiz';
    document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x.dataset.tab === 'quiz'));
    return render();
  }
  if (a === 'goQuizStart'){ closeSheet(); act('goQuiz'); return; }
  if (a === 'startQuiz') return startQuiz();
  if (a === 'nextQ') return advanceQuiz();
  if (a === 'quitQuiz'){
    return sheet(`<h2>ออกจากรอบนี้</h2>
      <div class="sub">คะแนนที่ทำได้ ${QUIZ.pts} จะถูกเก็บตามปกติ แต่จะไม่ได้โบนัสตอบถูกทั้งรอบ</div>
      <div class="gap"></div>
      <button class="btn danger block" data-act="quitYes">ออก</button>
      <div class="gap"></div>
      <button class="btn pri block" data-act="closeSheet">ตอบต่อ</button>`);
  }
  if (a === 'quitYes'){ closeSheet(); return finishQuiz(); }
  if (a === 'hatch'){ closeSheet(); return doHatch(); }
  if (a === 'qbank') return qbankSheet();
  if (a === 'qadd') return qaddSheet();
  if (a === 'qsave') return qsave();
  if (a === 'qlint') return qlintSheet('all');
  if (a === 'qimport') return qimportSheet();
  if (a === 'qdoimport') return qdoimport();
  if (a === 'qexport') return qexport();
  if (a === 'fontsize') return fsSheet();
  if (a === 'cloud'){ closeSheet(); return cloudSheet(); }
  if (a === 'cloudSaveSet') return cloudSaveSettings();
  if (a === 'cloudUp'){
    return saveGameToCloud().then(r => {
      if (r.err) return toast(r.err, 'bad');
      toast('ส่งขึ้นคลาวด์เรียบร้อย', 'gold');
      cloudSheet();
    });
  }
  if (a === 'cloudDown') return cloudDownloadFlow();

/* ตรวจว่าเฉลยยาวกว่าตัวลวงจนเดาได้โดยไม่ต้องอ่าน */
function lintQuestion(q){
  const flags = [];
  const ans = q.ch[q.ans];
  const others = q.ch.filter((c,i) => i !== q.ans);
  const maxOther = Math.max(...others.map(c => c.length));
  const ratio = maxOther > 0 ? ans.length / maxOther : 99;
  const diff = ans.length - maxOther;

  if (ratio > 1.6 && diff >= 12) flags.push({lv:2, t:`เฉลยยาวกว่าตัวลวงที่ยาวที่สุด ${diff} ตัวอักษร (${ratio.toFixed(1)} เท่า)`});
  else if (ratio > 1.3 && diff >= 8) flags.push({lv:1, t:`เฉลยยาวกว่าตัวลวงเล็กน้อย ${diff} ตัวอักษร`});

  // ตัวลวงที่สั้นผิดปกติเมื่อเทียบกับเพื่อน
  const avgOther = others.reduce((a,c)=>a+c.length,0) / others.length;
  if (ans.length > avgOther * 2 && ans.length - avgOther >= 15)
    flags.push({lv:2, t:'เฉลยยาวกว่าค่าเฉลี่ยของตัวลวงเกินสองเท่า'});

  // คำที่มักโผล่เฉพาะในตัวลวง
  const giveaway = ['ไม่มีผลใดๆ','ไม่เกี่ยวข้องกันเลย','ครูสั่ง','ไม่มีประโยชน์ใดๆ','ทุกประการ'];
  const inAns = giveaway.filter(w => ans.includes(w));
  const inOther = giveaway.filter(w => others.some(c => c.includes(w)));
  if (inOther.length && !inAns.length)
    flags.push({lv:1, t:`ตัวลวงใช้คำที่ส่อว่าผิดชัดเจน เช่น "${inOther[0]}"`});

  return {flags, ratio, diff, worst: flags.reduce((m,f)=>Math.max(m,f.lv),0)};
}

function lintReport(list){
  let longest = 0, lv2 = 0, lv1 = 0;
  const bad = [];
  for (const q of list){
    const r = lintQuestion(q);
    const mx = Math.max(...q.ch.map(c=>c.length));
    const uniqueMax = q.ch.filter(c => c.length === mx).length === 1;
    if (uniqueMax && q.ch[q.ans].length === mx) longest++;
    if (r.worst === 2) lv2++;
    else if (r.worst === 1) lv1++;
    if (r.worst > 0) bad.push({q, r});
  }
  bad.sort((a,b) => (b.r.worst - a.r.worst) || (b.r.ratio - a.r.ratio));
  return {total:list.length, longest, lv2, lv1, bad};
}

function qlintSheet(tag){

    </div>
  </div>`).join('');

  sheet(`<div class="eyebrow">ตรวจคุณภาพข้อสอบ · ${title}</div>
    <h2>เฉลยเดาได้จากความยาวหรือไม่</h2>

      <div><b style="color:${col}">${pct}%</b><span>เฉลยยาวที่สุด</span></div>

    <div class="gap"></div>
    <div class="tiny">วิธีแก้ที่ดีที่สุดคือ<b>เขียนตัวลวงให้ยาวและดูน่าเชื่อพอกับเฉลย</b> ไม่ใช่ตัดเฉลยให้สั้นลง เพราะจะเสียความถูกต้องของเนื้อหา</div>
    <div class="gap"></div>
    ${rows ? `<div class="eyebrow">ข้อที่ควรแก้ ${R.bad.length > 40 ? '(แสดง 40 ข้อแรกจาก ' + R.bad.length + ' ข้อ)' : ''}</div>
      <div class="list">${rows}</div>` : '<div class="sub">ไม่พบข้อที่มีปัญหา</div>'}
    <div class="gap"></div>
    <button class="btn block" data-act="qbank">ย้อนกลับ</button>`);

   ดวลปริศนา — ระบบท้าดวลด้วยรหัส (ไม่ต้องใช้เซิร์ฟเวอร์)
   ผู้เล่นสร้างรหัสจากวิญญาณของตน ส่งให้เพื่อน เพื่อนวางรหัสแล้วดวลกับ "เงา" ของตัวนั้น
   ตอบถูกเท่านั้นจึงจะโจมตีได้ ความแรงมาจากค่าสถานะและความเร็วในการตอบ
   =========================================================== */

const DUEL_VER = 1;
const DUEL_ROUNDS = 10;          // จำนวนข้อสูงสุดต่อการดวลหนึ่งครั้ง
const DUEL_WIN_CAP = 5;          // จำนวนครั้งต่อวันที่ยังได้รางวัลเต็ม
const DIFF_POWER = [0, 1.0, 1.25, 1.6, 2.1];   // ตัวคูณความแรงตามความยากของข้อ

/* ---------- เข้ารหัส / ถอดรหัส ---------- */
function b64e(str){
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for (const b of bytes) bin += String.fromCharCode(b);
  return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function b64d(s){
  s = s.replace(/-/g,'+').replace(/_/g,'/');
  while (s.length % 4) s += '=';
  const bin = atob(s);
  const arr = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(arr);
}
function shortSum(str){
  const c = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let h = hashStr(str), out = '';
  for (let i=0;i<4;i++){ out += c[h % c.length]; h = Math.floor(h / c.length) + 7919; }
  return out;
}

/* สร้างรหัสท้าดวลจากวิญญาณที่กำลังเลี้ยงอยู่ */
function makeDuelCode(){
  const p = S.pet;
  if (!p) return null;
  const acc = S.stats.answered ? Math.round(S.stats.correct / S.stats.answered * 100) : 60;
  const payload = JSON.stringify([
    DUEL_VER, p.sp, p.stage, p.branch || '', p.lv,
    p.stats.STR, p.stats.VIT, p.stats.AGI, p.stats.INT, p.stats.LUK,
    clamp(acc, 30, 98), String(p.name).slice(0, 12), S.uid
  ]);
  const body = b64e(payload);
  return 'KJ' + DUEL_VER + '-' + body + '-' + shortSum(body);
}

/* ถอดรหัสท้าดวล คืนค่า {ok, foe} หรือ {ok:false, err} */
function readDuelCode(raw){
  const code = String(raw || '').trim().replace(/\s+/g, '');
  const m = code.match(/^KJ(\d+)-([A-Za-z0-9\-_]+)-([A-Z2-9]{4})$/);
  if (!m) return {ok:false, err:'รูปแบบรหัสไม่ถูกต้อง ลองคัดลอกใหม่ทั้งบรรทัด'};
  if (+m[1] !== DUEL_VER) return {ok:false, err:'รหัสนี้มาจากเกมคนละรุ่น ให้เพื่อนอัปเดตเกมก่อน'};
  if (shortSum(m[2]) !== m[3]) return {ok:false, err:'รหัสไม่สมบูรณ์หรือถูกแก้ไข ลองขอรหัสใหม่'};
  let a;
  try { a = JSON.parse(b64d(m[2])); } catch(e){ return {ok:false, err:'อ่านรหัสไม่ได้'}; }
  if (!Array.isArray(a) || a.length < 13) return {ok:false, err:'ข้อมูลในรหัสไม่ครบ'};
  const sp = a[1];
  if (!SPECIES[sp]) return {ok:false, err:'ไม่รู้จักสายพันธุ์ในรหัสนี้'};
  const stage = clamp(+a[2] || 0, 0, 5);
  const foe = {
    sp, stage,
    branch: a[3] || null,
    lv: clamp(+a[4] || 1, 1, 99),
    stats: {
      STR: clamp(+a[5]||5, 1, 999), VIT: clamp(+a[6]||5, 1, 999),
      AGI: clamp(+a[7]||5, 1, 999), INT: clamp(+a[8]||5, 1, 999),
      LUK: clamp(+a[9]||5, 1, 999)
    },
    acc: clamp(+a[10] || 60, 30, 98),
    name: String(a[11] || 'คู่ต่อสู้').slice(0, 12),
    uid: String(a[12] || '????'),
    mood: 80, hp: 100, sick: false, care:{body:0,mind:0,play:0}
  };
  if (foe.uid === S.uid) return {ok:false, err:'นี่คือรหัสของตัวเอง ต้องใช้รหัสของเพื่อน'};
  return {ok:true, foe};
}

/* ---------- สูตรการต่อสู้ ---------- */
/* ค่าสถานะที่ใช้จริงในการดวล รวมโบนัสจากอาวุธของฝ่ายเรา */
function dStat(p, key, mine){ return p.stats[key] + (mine ? gearStatBonus(key) : 0); }

function duelMaxHp(p, mine){
  const base = 60 + dStat(p,'VIT',mine) * 3 + p.lv * 1.5;
  return Math.round(base + (mine ? gearHpBonus() : 0));
}
function duelAtk(p, mine){
  const base = 6 + dStat(p,'STR',mine) * 0.55 + dStat(p,'INT',mine) * 0.25;
  return mine ? base * (1 + roomBonus().duelAtk + gearAtkBonus()) : base;
}
function duelDef(p, mine){
  const base = dStat(p,'VIT',mine) * 0.22;
  return mine ? base * (1 + roomBonus().duelDef + gearDefBonus()) : base;
}

/* คำนวณความเสียหาย: ต้องตอบถูกเท่านั้นจึงจะเข้า */
function duelDodge(p, mine){ return clamp(dStat(p,'AGI',mine) / 400 + (mine ? gearDodgeBonus() : 0), 0, 0.30); }

function duelDamage(attacker, defender, diff, speed, mineAtk){
  // ฝ่ายรับมีโอกาสหลบตาม AGI
  if (Math.random() < duelDodge(defender, !mineAtk)) return { dmg:0, crit:false, dodged:true };
  const base = Math.max(3, duelAtk(attacker, mineAtk) - duelDef(defender, !mineAtk));
  const critRate = clamp(dStat(attacker,'LUK',mineAtk) / 320 + (mineAtk ? gearCritBonus() : 0), 0, 0.40);
  const crit = Math.random() < critRate;
  const dmg = base * DIFF_POWER[diff] * (1 + 0.5 * clamp(speed, 0, 1)) * (crit ? 1.8 : 1);
  return { dmg: Math.max(1, Math.round(dmg)), crit, dodged:false };
}

/* เงาของคู่ต่อสู้ตอบถูกหรือไม่ อิงจากความแม่นยำจริงของเจ้าของรหัส */
function foeAnswers(foe, diff){
  const mod = [0, 1.06, 1.0, 0.88, 0.76][diff];
  return Math.random() < clamp(foe.acc / 100 * mod, 0.1, 0.97);
}
function foeSpeed(foe){
  return clamp(foe.stats.AGI / (foe.stats.AGI + 45), 0, 1) * (0.6 + Math.random() * 0.4);
}

/* ---------- สถานะการดวล ---------- */
const DUEL = {
  running:false, foe:null, subj:'mix', grade:null,
  hp:0, foeHp:0, maxHp:0, foeMax:0,
  round:0, used:[], cur:null, locked:false, chosen:-1, units:{}, eggPts:0,
  limitMs:0, startAt:0, tickId:null, log:[], result:null
};

function duelStart(foe, subj, grade){
  const p = S.pet;
  DUEL.running = true; DUEL.foe = foe;
  DUEL.subj = subj; DUEL.grade = grade;
  DUEL.maxHp = duelMaxHp(p, true); DUEL.foeMax = duelMaxHp(foe, false);
  DUEL.hp = DUEL.maxHp; DUEL.foeHp = DUEL.foeMax;
  DUEL.round = 0; DUEL.used = []; DUEL.log = []; DUEL.result = null;
  DUEL.units = {}; DUEL.eggPts = 0;
  View.duel = { foe, foeSp: SPECIES[foe.sp] };
  duelNext();
}

function duelNext(){
  const q = pickQuestion(DUEL.subj, DUEL.grade, DUEL.used);
  if (!q || DUEL.round >= DUEL_ROUNDS) return duelFinish();
  DUEL.used.push(q.id);
  let cur = q;
  if (S.settings.shuffle){
    const order = q.ch.map((c,i)=>i).sort(() => Math.random() - .5);
    cur = Object.assign({}, q, { ch: order.map(i => q.ch[i]), ans: order.indexOf(q.ans) });
  }
  DUEL.cur = cur;
  DUEL.locked = false; DUEL.chosen = -1;
  DUEL.limitMs = S.settings.timed ? DIFF[cur.diff].sec * 1000 : 0;
  DUEL.startAt = Date.now();
  View.focusing = true; View.progress = 0; View.drift = false;
  clearInterval(DUEL.tickId);
  if (DUEL.limitMs) DUEL.tickId = setInterval(duelTick, 120);
  render();
}

function duelTick(){
  if (!DUEL.running || DUEL.locked || !DUEL.limitMs) return;
  const left = DUEL.limitMs - (Date.now() - DUEL.startAt);
  View.progress = clamp(1 - left / DUEL.limitMs, 0, 1);
  View.drift = left < DUEL.limitMs * 0.25;
  const c = document.getElementById('qclock');
  if (c){
    c.textContent = Math.max(0, Math.ceil(left/1000)) + ' วิ';
    c.classList.toggle('low', left < DUEL.limitMs * 0.25);
  }
  if (left <= 0) duelAnswer(-1);
}

function duelAnswer(i){
  if (DUEL.locked) return;
  clearInterval(DUEL.tickId);
  const q = DUEL.cur, p = S.pet, foe = DUEL.foe;
  const correct = i === q.ans;
  const left = DUEL.limitMs ? Math.max(0, DUEL.limitMs - (Date.now() - DUEL.startAt)) : 0;
  const speed = DUEL.limitMs ? left / DUEL.limitMs : 0.5;

  DUEL.chosen = i; DUEL.locked = true; DUEL.round++;
  const turn = { correct, my:null, foe:null };

  if (correct){
    const r = duelDamage(p, foe, q.diff, speed, true);
    DUEL.foeHp = Math.max(0, DUEL.foeHp - r.dmg);
    turn.my = r;
    recordAnswer(q, true);
    S.stats.answered++; S.stats.correct++;
    DUEL.eggPts += DIFF[q.diff].pt;
    DUEL.units[q.unit] = (DUEL.units[q.unit] || 0) + DIFF[q.diff].pt;
  } else {
    recordAnswer(q, false);
    S.stats.answered++;
  }

  // ตาของเงาคู่ต่อสู้
  if (DUEL.foeHp > 0){
    if (foeAnswers(foe, q.diff)){
      const r = duelDamage(foe, p, q.diff, foeSpeed(foe), false);
      DUEL.hp = Math.max(0, DUEL.hp - r.dmg);
      turn.foe = r;
    }
  }
  DUEL.log.push(turn);
  View.drift = false;
  save(); render();
  if (DUEL.foeHp <= 0 || DUEL.hp <= 0) setTimeout(duelFinish, 500);
}

function duelAdvance(){
  if (!DUEL.locked) return;
  if (DUEL.foeHp <= 0 || DUEL.hp <= 0 || DUEL.round >= DUEL_ROUNDS) return duelFinish();
  duelNext();
}

function duelFinish(){
  clearInterval(DUEL.tickId);
  if (!DUEL.running) return;
  DUEL.running = false;
  View.focusing = false; View.drift = false; View.progress = 0; View.duel = null;

  const myPct = DUEL.hp / DUEL.maxHp, foePct = DUEL.foeHp / DUEL.foeMax;
  const win = DUEL.foeHp <= 0 ? true : (DUEL.hp <= 0 ? false : myPct > foePct);
  const draw = DUEL.hp > 0 && DUEL.foeHp > 0 && Math.abs(myPct - foePct) < 0.02;

  S.duel = S.duel || { win:0, lose:0, draw:0, day:'', today:0 };
  const t = todayKey();
  if (S.duel.day !== t){ S.duel.day = t; S.duel.today = 0; }
  const full = S.duel.today < DUEL_WIN_CAP;
  S.duel.today++;

  const hit = DUEL.log.filter(x => x.correct).length;
  let coin = 0, crys = 0, xp = 0;
  if (draw){ S.duel.draw++; coin = 40; }
  else if (win){ S.duel.win++; coin = 80 + S.pet.lv * 3; crys = full ? 2 : 0; }
  else { S.duel.lose++; coin = 25; }
  if (!full) coin = Math.round(coin * 0.3);
  xp = Math.round(hit * 12 * (win ? 1.3 : 1));

  S.coins += coin; S.crystals += crys;
  const lv = gainXp(xp).levels;
  S.pet.mood = clamp(S.pet.mood + (win ? 8 : 3), 0, 100);
  if (S.egg && DUEL.eggPts > 0) eggAddPoints(DUEL.eggPts, DUEL.units);
  DUEL.result = { win, draw, coin, crys, xp, lv, hit, full };
  save(); render();
  sheet(duelResultSheet());
  cloudAutoSync();
}

    <div class="qmeta">
      <span>ยกที่ ${DUEL.round + (DUEL.locked?0:1)}/${DUEL_ROUNDS} · ${UNITS[q.unit].n} · <span style="color:${d.c}">${d.n}</span></span>
      <span>${S.settings.timed && !DUEL.locked ? `<span id="qclock">${Math.ceil(Math.max(0,DUEL.limitMs-(Date.now()-DUEL.startAt))/1000)} วิ</span>` : ''}</span>
    </div>
    <div class="qtext">${esc(q.q)}</div>
    <div class="choices">${choices}</div>
    ${after}
  </div>
  ${DUEL.locked ? '' : '<div class="card"><button class="btn sm danger block" data-act="duelQuit">ยอมแพ้</button></div>'}`;
}

function duelResultSheet(){
  const r = DUEL.result, foe = DUEL.foe;
  const title = r.draw ? 'เสมอกัน' : (r.win ? 'ชนะการดวล' : 'แพ้การดวล');
  const line = (g, t, s2) => `<div class="item"><div class="ic">${g}</div><div class="grow"><b>${t}</b>${s2?`<div class="sub">${s2}</div>`:''}</div></div>`;
  return `<div class="eyebrow">ผลการดวล</div>
    <h2 style="color:${r.draw?'var(--gold)':(r.win?'var(--ok)':'var(--bad)')}">${title}</h2>
    <div class="sub">${esc(S.pet.name)} ${DUEL.hp}/${DUEL.maxHp} · ${esc(foe.name)} ${DUEL.foeHp}/${DUEL.foeMax} · ตอบถูก ${r.hit} ข้อ</div>
    <div class="gap"></div>
    <div class="list">
      ${line('🪙', `เหรียญ +${r.coin}`, r.full ? '' : 'เกินโควตารางวัลของวันนี้แล้ว ได้ 30%')}
      ${r.crys ? line('💠', `ผลึกสมาธิ +${r.crys}`) : ''}
      ${line('⭐', `ประสบการณ์ +${r.xp}`, r.lv ? `เลื่อนขึ้น ${r.lv} เลเวล` : '')}
      ${S.egg ? line('🥚', `ไข่ได้รับ +${DUEL.eggPts} คะแนนฐาน`) : ''}
    </div>
    <div class="gap"></div>
    <div class="tiny">${r.win ? 'ยิ่งตอบเร็วและตอบข้อยากได้ ยิ่งโจมตีแรง' : 'ลองตอบข้อที่ยากขึ้นและตอบให้เร็วขึ้น จะโจมตีได้แรงกว่านี้'}</div>
    <div class="gap"></div>
    <button class="btn pri block" data-act="closeSheet">ปิด</button>`;
}

/* ===========================================================
   เซฟข้ามเครื่องผ่าน Google Sheets (Apps Script)
   ครูวาง URL ของเว็บแอปที่ CLOUD_API_URL ด้านล่าง หรือให้กรอกในหน้าตั้งค่าก็ได้
   =========================================================== */

/* ครูชัชวาง URL ที่ได้จาก Apps Script ตรงนี้ แล้วนักเรียนไม่ต้องกรอกเอง */
const CLOUD_API_URL = 'https://script.google.com/macros/s/AKfycbx8sqQRJZEE__dRN3pZYqX8lZfywtXhwA-eZo8IIFkjAYcWANGlwjd1kvAAdVHSUV9u/exec';

function cloudUrl(){ return (S.cloud && S.cloud.url) || CLOUD_API_URL || ''; }
function cloudReady(){ return !!(cloudUrl() && S.cloud && S.cloud.sid); }

/* รหัสนักเรียน: ตัวอักษร ตัวเลข ขีด ยาว 3-20 ตัว */
function normStudentId(v){
  return String(v || '').trim().replace(/\s+/g, '').slice(0, 20);
}
function validStudentId(v){ return /^[A-Za-z0-9ก-๙_-]{3,20}$/.test(v); }

/* ---------- ส่งขึ้นคลาวด์ ---------- */
async function saveGameToCloud(opt){
  const quiet = opt && opt.quiet;
  if (!cloudReady()) return {err:'ยังไม่ได้ตั้งค่ารหัสนักเรียนหรือที่อยู่เซิร์ฟเวอร์'};

  S.savedAt = Date.now();
  const acc = S.stats.answered ? Math.round(S.stats.correct / S.stats.answered * 100) : 0;
  const payload = {
    studentId: S.cloud.sid,
    spiritName: S.pet ? S.pet.name : 'ยังไม่ฟัก',
    level: S.pet ? S.pet.lv : 0,
    coins: Math.floor(S.coins || 0),
    stats: {
      answered: S.stats.answered || 0,
      correct: S.stats.correct || 0,
      accuracy: acc,
      rounds: S.stats.rounds || 0,
      duelWin: (S.duel && S.duel.win) || 0
    },
    savedAt: S.savedAt,
    saveRaw: S            // ก้อนเซฟเต็ม ส่งเป็นอ็อบเจกต์ ฝั่งสคริปต์จะแปลงเป็นข้อความเอง
  };

  try {
    if (!quiet) toast('กำลังส่งข้อมูลขึ้นคลาวด์…');
    const res = await fetch(cloudUrl(), {
      method: 'POST',
      /* ใช้ text/plain เพื่อเลี่ยง CORS preflight ที่ Apps Script ไม่รองรับ */
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
    const out = await res.json();
    if (out.status !== 'success') return {err: out.message || 'เซิร์ฟเวอร์ปฏิเสธข้อมูล'};
    S.cloud.lastUp = Date.now();
    save();
    return {ok:true};
  } catch (e){
    return {err:'เชื่อมต่อไม่ได้ ตรวจสอบอินเทอร์เน็ตหรือที่อยู่เซิร์ฟเวอร์'};
  }
}

/* ---------- ดึงจากคลาวด์ ---------- */
async function loadGameFromCloud(){
  if (!cloudReady()) return {err:'ยังไม่ได้ตั้งค่ารหัสนักเรียนหรือที่อยู่เซิร์ฟเวอร์'};
  try {
    toast('กำลังดึงข้อมูลจากคลาวด์…');
    const res = await fetch(cloudUrl() + '?studentId=' + encodeURIComponent(S.cloud.sid));
    const out = await res.json();
    if (out.status !== 'success' || !out.data || !out.data.saveRaw)
      return {err:'ไม่พบข้อมูลของรหัสนี้บนคลาวด์'};

    let inc = out.data.saveRaw;
    if (typeof inc === 'string'){ try { inc = JSON.parse(inc); } catch(e){ return {err:'ข้อมูลบนคลาวด์เสียหาย'}; } }
    if (!inc || typeof inc !== 'object' || !inc.uid) return {err:'ข้อมูลบนคลาวด์ไม่ใช่ไฟล์เซฟของเกมนี้'};
    return {ok:true, incoming:inc, meta:out.data};
  } catch (e){
    return {err:'เชื่อมต่อไม่ได้ ตรวจสอบอินเทอร์เน็ตหรือที่อยู่เซิร์ฟเวอร์'};
  }
}

/* นำเซฟจากคลาวด์มาใช้แทนของในเครื่อง */
async function applyCloudSave(inc){
  const keepCloud = S.cloud || {};
  S = Object.assign(freshSave(), inc);
  /* คงที่อยู่เซิร์ฟเวอร์และรหัสของเครื่องนี้ไว้ ไม่เอาของเจ้าของเซฟมาทับ */
  S.cloud = Object.assign({}, inc.cloud || {}, {
    url: keepCloud.url || '',
    sid: keepCloud.sid || '',
    auto: !!keepCloud.auto,
    lastDown: Date.now()
  });
  migrateSave();
  buildCrackle(hashStr(S.uid));
  tickOffline();
  /* เขียนลงที่เก็บทันที ไม่รอตัวหน่วงของ save() */
  S.savedAt = Date.now();
  await Store.set(SAVEKEY, JSON.stringify(S));
  render();
}

/* ส่งขึ้นอัตโนมัติเมื่อจบรอบตอบคำถามหรือจบการดวล (ถ้าเปิดไว้) */
let cloudAutoTimer = null;
function cloudAutoSync(){
  if (!S.cloud || !S.cloud.auto || !cloudReady()) return;
  clearTimeout(cloudAutoTimer);
  cloudAutoTimer = setTimeout(async () => {
    const r = await saveGameToCloud({quiet:true});
    if (r && r.ok) toast('บันทึกขึ้นคลาวด์แล้ว');
  }, 1500);
}

/* ===================== หน้าจอเซฟข้ามเครื่อง ===================== */

  S.cloud = S.cloud || {url:'', sid:'', auto:false, lastUp:0, lastDown:0};
  const hasUrl = !!cloudUrl();
  const fmt = t => t ? fmtDate(t) : 'ยังไม่เคย';

  sheet(`<div class="eyebrow">เซฟข้ามเครื่อง</div>
    <h2>เก็บวิญญาณไว้บนคลาวด์</h2>
    <div class="sub">บันทึกความคืบหน้าไว้ที่ Google Sheets ของครู เปลี่ยนเครื่องหรือล้างเบราว์เซอร์แล้วก็ดึงกลับมาเล่นต่อได้</div>
    <div class="gap"></div>

    <div class="eyebrow">รหัสนักเรียน</div>
    <input id="cloudSid" class="fld" maxlength="20" placeholder="เช่น p5-12 หรือเลขที่ในห้อง" value="${esc(S.cloud.sid || '')}">
    <div class="tiny" style="margin-top:-4px">ใช้รหัสที่ครูกำหนดให้ ห้ามใส่ชื่อจริง เลขบัตรประชาชน หรือเบอร์โทรศัพท์</div>
    <div class="gap"></div>

    ${hasUrl ? '' : `<div class="eyebrow">ที่อยู่เซิร์ฟเวอร์ของครู</div>
      <input id="cloudUrl" class="fld" placeholder="วาง URL ที่ครูให้มา ขึ้นต้นด้วย https://script.google.com/" value="${esc((S.cloud && S.cloud.url) || '')}">
      <div class="gap"></div>`}

    <button class="btn pri block" data-act="cloudSaveSet">บันทึกการตั้งค่า</button>
    <div class="gap"></div>

    <div class="list">
      <div class="item"><div class="ic">☁️</div>
        <div class="grow"><b>ส่งขึ้นคลาวด์</b><div class="sub">ครั้งล่าสุด ${fmt(S.cloud.lastUp)}</div></div>
        <button class="btn sm ${cloudReady()?'pri':''}" data-act="cloudUp" ${cloudReady()?'':'disabled'}>ส่ง</button></div>
      <div class="item"><div class="ic">📥</div>
        <div class="grow"><b>ดึงจากคลาวด์</b><div class="sub">ครั้งล่าสุด ${fmt(S.cloud.lastDown)}</div></div>
        <button class="btn sm ${cloudReady()?'gold':''}" data-act="cloudDown" ${cloudReady()?'':'disabled'}>ดึง</button></div>
      <div class="item"><div class="ic">🔁</div>
        <div class="grow"><b>ส่งอัตโนมัติ</b><div class="sub">ส่งขึ้นคลาวด์ให้เองทุกครั้งที่จบรอบตอบคำถามหรือจบการดวล</div></div>
        <button class="btn sm ${S.cloud.auto?'on':''}" data-act="cloudAuto">${S.cloud.auto?'เปิด':'ปิด'}</button></div>
    </div>
    <div class="gap"></div>
    <div class="tiny">การดึงจากคลาวด์จะเขียนทับข้อมูลในเครื่องนี้ทั้งหมด ระบบจะเทียบเวลาให้ก่อนและถามยืนยันหากข้อมูลในเครื่องใหม่กว่า</div>
    <div class="gap"></div>
    <button class="btn block" data-act="closeSheet">ปิด</button>`);
}

function cloudSaveSettings(){
  const sidEl = document.getElementById('cloudSid');
  const urlEl = document.getElementById('cloudUrl');
  const sid = normStudentId(sidEl ? sidEl.value : '');
  S.cloud = S.cloud || {url:'', sid:'', auto:false, lastUp:0, lastDown:0};

  if (sid && !validStudentId(sid))
    return toast('รหัสนักเรียนใช้ได้เฉพาะตัวอักษร ตัวเลข ขีด ยาว 3-20 ตัว', 'bad');
  if (urlEl){
    const u = String(urlEl.value || '').trim();
    if (u && !/^https:\/\/script\.google\.com\//.test(u))
      return toast('ที่อยู่เซิร์ฟเวอร์ต้องขึ้นต้นด้วย https://script.google.com/', 'bad');
    S.cloud.url = u;
  }
  S.cloud.sid = sid;
  save();
  toast('บันทึกการตั้งค่าแล้ว');
  cloudSheet();
}

async function cloudDownloadFlow(){
  const r = await loadGameFromCloud();
  if (r.err) return toast(r.err, 'bad');
  const inc = r.incoming;
  const mine = S.savedAt || 0, theirs = inc.savedAt || 0;
  const sp = inc.pet ? `${inc.pet.name} Lv.${inc.pet.lv}` : 'ยังไม่ฟักไข่';
  const warn = mine > theirs + 60000;

  sheet(`<div class="eyebrow">พบข้อมูลบนคลาวด์</div>
    <h2>${esc(sp)}</h2>
    <div class="sub">รหัส ${esc(S.cloud.sid)} · ตอบไปแล้ว ${(inc.stats && inc.stats.answered) || 0} ข้อ · เหรียญ ${Math.floor(inc.coins || 0).toLocaleString('th-TH')}</div>
    <div class="gap"></div>
    <div class="list">
      <div class="item"><div class="ic">📥</div><div class="grow"><b>ข้อมูลบนคลาวด์</b>
        <div class="sub">บันทึกเมื่อ ${theirs ? fmtDate(theirs) : 'ไม่ทราบเวลา'}</div></div></div>
      <div class="item"><div class="ic">📱</div><div class="grow"><b>ข้อมูลในเครื่องนี้</b>
        <div class="sub">${S.pet ? esc(S.pet.name) + ' Lv.' + S.pet.lv : 'ยังไม่ฟักไข่'} · บันทึกเมื่อ ${mine ? fmtDate(mine) : 'ไม่ทราบเวลา'}</div></div></div>
    </div>
    ${warn ? `<div class="gap"></div><div class="expl" style="border-left-color:var(--bad)">
      <b style="color:var(--bad)">ข้อมูลในเครื่องนี้ใหม่กว่าบนคลาวด์</b>
      <div class="tiny" style="margin-top:4px">ถ้ากดดึง ความคืบหน้าที่เล่นไว้ล่าสุดในเครื่องนี้จะหายไป หากไม่แน่ใจให้กดส่งขึ้นคลาวด์แทน</div></div>` : ''}
    <div class="gap"></div>
    <button class="btn ${warn?'danger':'pri'} block" data-act="cloudApply">ดึงมาใช้และเขียนทับเครื่องนี้</button>
    <div class="gap"></div>
    <button class="btn block" data-act="cloud">ยกเลิก</button>`);
  CLOUD_PENDING = inc;
}
let CLOUD_PENDING = null;

</script>
